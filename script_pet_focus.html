  constructor(config, id) {
    this.config = config; // config from PET_CONFIG or custom
    this.id = id || Math.random().toString(36).substr(2, 9);
    this.customName = getCleanLocalStorage(`pet_name_${this.id}`) || config.name || "Pet";

    this.direction = 1;

    this.isJumping = false;
    this.jumpStartTime = 0;
    this.jumpY = 0;
    this.isGoingToGames = false;
    this.isAwaitingGameTrigger = false;
    this.gameWaitTimer = null;
    this.lastSayTime = 0;
    this.isDragging = false;
    this.mouseX = this.posX;
    this.mouseY = this.posY;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;

    this.bubble.id = `pet-bubble-${this.id}`;
    // Optimized: removed transition for properties updated frequently if any, but opacity is fine.

    // Add pet name label
    this.nameLabel = document.createElement("div");
    // Optimized: removed backdrop-filter blur as it causes lag during scroll
    this.nameLabel.style.cssText = `position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%); background: rgba(30, 41, 59, 0.85); color: white; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; white-space: nowrap; transition: opacity 0.3s; pointer-events: none; opacity: 0.8; border: 1px solid rgba(255,255,255,0.1);`;

    this.sprite = document.createElement("div");
    this.sprite.id = `pet-sprite-${this.id}`;
    // Optimized: removed transition: transform as it conflicts with JS animation loop
    this.sprite.style.cssText = `font-size: 60px; cursor: grab; pointer-events: auto; user-select: none; transition: filter 0.2s; display: flex; align-items: center; justify-content: center; width: 70px; height: 70px; will-change: transform; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); position: relative;`;

    this.sprite.onmouseenter = () => this.sprite.style.filter = "drop-shadow(0 15px 20px rgba(0,0,0,0.25)) brightness(1.1)";
    this.sprite.onmouseleave = () => this.sprite.style.filter = "drop-shadow(0 10px 15px rgba(0,0,0,0.15)) brightness(1)";
    
    if (this.config.isCustom) {
      this.sprite.innerHTML = `<img src="${this.config.url}" style="width:65px;height:65px;object-fit:cover;border-radius:12px;display:block;">`;
      this.sprite.dataset.texts = JSON.stringify(['Yêu bồ nhất!', 'Học tốt nha!', 'Gọi tớ hả?', 'Bạn đỉnh nhất!', 'Cố lên nà!']);
    } else {
      this.sprite.innerHTML = this.config.icon;
      this.sprite.dataset.texts = JSON.stringify(this.config.texts || []);
    }
    
    // Create accessory element inside sprite so it animates & flips with the pet
    this.accessoryEl = document.createElement("div");
    this.accessoryEl.style.cssText = `position: absolute; pointer-events: none; z-index: 15; transition: all 0.2s;`;

    this.container.appendChild(this.sprite);
    document.body.appendChild(this.container);
    
    // Add heart effect element
    this.effectLayer = document.createElement("div");
    this.effectLayer.style.cssText = `position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;`;
    this.container.appendChild(this.effectLayer);

    this.lastSocialTime = performance.now(); 
    this.isSleeping = false;
    this.focusSession = null; 
    this.setupDragging();

  updateAccessory() {
    // Check if there is an accessory equipped for this specific pet ID or pet type ID
    const equippedAccId = getCleanLocalStorage(`pet_accessory_${this.id}`) || getCleanLocalStorage(`pet_accessory_${this.config.id}`);
    if (equippedAccId) {
      const acc = PET_ACCESSORIES.find(a => a.id === equippedAccId);
      if (acc) {
        this.accessoryEl.innerHTML = acc.icon;
        
        let top = "";
        let left = "";
        const offsets = ACCESSORY_OFFSETS[equippedAccId];
        if (offsets) {
          const petType = this.config.id || "";
          const petOffsets = offsets[petType] || offsets['pet_chick'];
          if (petOffsets) {
            top = petOffsets.top;
            left = petOffsets.left;
          }
        }
        
        let fontSize = "24px";
        const fontSizeMatch = acc.style ? acc.style.match(/font-size:\s*(\d+px)/) : null;
        if (fontSizeMatch) {
          fontSize = fontSizeMatch[1];
        } else if (equippedAccId === 'acc_strawhat') {
          fontSize = '32px';
        } else if (equippedAccId === 'acc_wizard') {
          fontSize = '28px';
        } else if (equippedAccId === 'acc_headphones') {
          fontSize = '30px';
        }
        
        if (top && left) {
          this.accessoryEl.style.cssText = `position: absolute; pointer-events: none; z-index: 15; transition: all 0.2s; top: ${top}; left: ${left}; font-size: ${fontSize};`;
        } else {
          this.accessoryEl.style.cssText = `position: absolute; pointer-events: none; z-index: 15; transition: all 0.2s; ${acc.style || 'top: -10px; left: 16px; font-size: 24px;'}`;
        }
        this.accessoryEl.style.display = "block";
        return;
      }
    }
    this.accessoryEl.innerHTML = "";
    this.accessoryEl.style.display = "none";
  }

  getTimeBasedGreeting() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 11) return ["Sáng an lành nha! ☀️", "Cà phê sáng hông? ☕", "Dậy sớm là tốt nhất! 💪", "Ngày mới vui vẻ nhé! ☀️"];
    if (hour >= 11 && hour < 14) return ["Ăn trưa thôi nà! 🍱", "Nhớ ăn đủ bữa nha! 🍎", "Chợp mắt tí cho khỏe! 😴", "Ngon miệng nhé! ✨"];
    if (hour >= 14 && hour < 18) return ["Chiều mát mẻ nà! ✨", "Vươn vai cho đỡ mỏi! 🤸", "Luôn bên cạnh bạn! 💕", "Sắp xong rồi, cố lên! 🚀"];
    if (hour >= 18 && hour < 23) return ["Tối học tốt nha! 🌙", "Mệt chưa? Thương nè! 💕", "Cố nốt hôm nay nà! 🚀", "Học hăng say quá! ✨"];
    return ["Ngủ sớm đi bạn ơi! 💤", "Muộn rồi, ngủ thôi nà! 🛌", "Tớ cũng buồn ngủ rồi... 😴", "Ngủ ngon nha! 🌙"];
  }

  setupDragging() {
    let dragStartX = 0, dragStartY = 0;
    let isActuallyDragging = false;

    const startDrag = (e) => {
      this.isDragging = true;
      isActuallyDragging = false;
      this.walking = false;
      this.isGoingToGames = false;
      this.idleTimer = 999999;
      
      const rect = this.container.getBoundingClientRect();
      this.dragOffsetX = e.clientX - rect.left;
      this.dragOffsetY = e.clientY - rect.top;
      
      // Update current mouse position targets to prevent snapping to old positions
      this.mouseX = rect.left;
      this.mouseY = rect.top;
      
      dragStartX = e.clientX;
      dragStartY = e.clientY;

      if (e.pointerId !== undefined) {
        this.sprite.setPointerCapture(e.pointerId);
      }
    };

    const onDrag = (e) => {
      if (!this.isDragging) return;
      
      const movementX = e.clientX - dragStartX; 
      const movementY = e.clientY - dragStartY; 
      
      if (!isActuallyDragging && (Math.abs(movementX) > 5 || Math.abs(movementY) > 5)) {
        isActuallyDragging = true;
        if (Math.random() < 0.3) {
          this.say("Bế đi đâu đó? 🐾", 2000);
        } else if (Math.random() < 0.5) {
          this.say("Vèo vèo 🚀", 2000);
        }
      }
      
      this.mouseX = e.clientX - this.dragOffsetX;
      this.mouseY = e.clientY - this.dragOffsetY;
      
      if (movementX > 2) this.direction = -1;
      else if (movementX < -2) this.direction = 1;
    };

    const stopDrag = (e) => {
      if (this.isDragging) {
        this.isDragging = false;
        this.idleTimer = 1000;
        if (e.pointerId !== undefined) {
          try { this.sprite.releasePointerCapture(e.pointerId); } catch(err){}
        }
        if (!isActuallyDragging) {
          this.interact();
        }
      }
    };

    this.sprite.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      startDrag(e);
    });
    this.sprite.addEventListener("pointermove", onDrag);
    this.sprite.addEventListener("pointerup", stopDrag);
    this.sprite.addEventListener("pointercancel", stopDrag);
  }

  rename(newName) {
    if (!newName) return;
    this.customName = newName;
    this.nameLabel.innerText = newName;
    localStorage.setItem(`pet_name_${this.id}`, newName);
  }

  // --- FOCUS MODE (POMODORO) ---
  startFocusMode(minutes, isSilent = false) {
    if (this.focusSession) return;
    
    this.focusSession = {
      startTime: Date.now(),
      duration: minutes,
      totalSeconds: minutes * 60,
      remainingSeconds: minutes * 60
    };
    
    this.walking = false;
    if (!isSilent) {
      localStorage.setItem("pet_stay_still", "true");
      updatePetStayUI();
      this.say(`🔥 Bắt đầu tập trung trong ${minutes} phút nhé!`, 3000);
    }
    
    this.container.classList.add("pet-focus-mode");
    this.emitHearts();
  }

  cancelFocusMode() {
    if (!this.focusSession) return;
    this.focusSession = null;
    this.container.classList.remove("pet-focus-mode");
    this.say("Đã dừng học! 🍃", 3000);
    this.emitHearts();
  }

  completeFocusMode(isMaster = false) {
    if (!this.focusSession) return;
    const duration = this.focusSession.duration;
    this.focusSession = null;
    this.container.classList.remove("pet-focus-mode");
    
    this.say("🎉 Giỏi quá! Đã xong rồi!", 5000);
    this.emitHearts();
    
    if (isMaster) {
      localStorage.setItem("pet_stay_still", "false");
      updatePetStayUI();
      if (typeof resetFocusUI === "function") resetFocusUI();

      google.script.run.withSuccessHandler((response) => {
        if (response && response.success) {
          showToast(`✨ Tuyệt vời! Bạn nhận được ${response.reward} 🪙 thưởng tập trung!`, "success");
          if (typeof refreshUserPoints === "function") refreshUserPoints();
          if (typeof shootConfetti === "function") shootConfetti();
        }
      }).completeFocusSession(duration);
    }
  }

  updateFocusTimer() {
    if (!this.focusSession) return;
    
    const nowMs = Date.now();
    // Tối ưu: Chỉ cập nhật giao diện mỗi giây một lần thay vì mỗi frame
    if (this.lastTimerUpdate && nowMs - this.lastTimerUpdate < 1000) return;
    this.lastTimerUpdate = nowMs;

    const elapsed = Math.floor((nowMs - this.focusSession.startTime) / 1000);
    this.focusSession.remainingSeconds = this.focusSession.totalSeconds - elapsed;
    
    if (this.focusSession.remainingSeconds <= 0) {
      const isMaster = (activePets[0] === this);
      this.completeFocusMode(isMaster);
      
      if (isMaster) {
        activePets.forEach(p => {
           if (p !== this && p.focusSession) p.completeFocusMode(false);
        });
      }
      return;
    }
    
    const m = Math.floor(this.focusSession.remainingSeconds / 60);
    const s = this.focusSession.remainingSeconds % 60;
    const timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;
    
    // Sync with Interaction Popup if open
    const interactTimer = document.getElementById("interactTimerDisplay");
    if (interactTimer && document.getElementById("petInteractionPopup").style.display !== "none") {
      interactTimer.innerText = timeStr;
    }

    // Hiển thị thời gian trực tiếp lên bubble
    if (this.bubble) {
      // Chỉ thay đổi textNode để tránh layout reflow nặng
      if (this.bubble.firstChild && this.bubble.firstChild.nodeType === 3) {
        this.bubble.firstChild.textContent = `⏱️ ${timeStr}`;
      } else {
        this.bubble.innerText = `⏱️ ${timeStr}`;
      }
      this.bubble.style.opacity = "1";
      this.bubble.style.transform = "translateX(-50%) translateY(0px)";
      this.nameLabel.style.opacity = "0";
      
      // Re-add arrow
      let tip = this.bubble.querySelector(".bubble-tip");
      if (!tip) {
        tip = document.createElement('div');
        tip.className = "bubble-tip";
        tip.style.cssText = `position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 6px; border-style: solid; border-color: #f1f5f9 transparent transparent transparent;`;
        this.bubble.appendChild(tip);
      }
    }
  }

  say(text, duration = 4000) {
    if (!this.bubble) return;
    
    // Anti-spam: limit message frequency per pet
    const now = performance.now();
    if (this.lastSayTime && (now - this.lastSayTime < 2000)) return;
    this.lastSayTime = now;

    this.bubble.innerText = text;
    
    // Re-add arrow
    let tip = document.createElement('div');
    tip.style.cssText = `position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 6px; border-style: solid; border-color: #f1f5f9 transparent transparent transparent;`;
    this.bubble.appendChild(tip);
    
    this.bubble.style.opacity = "1";
    this.bubble.style.transform = "translateX(-50%) translateY(0px)";
    this.nameLabel.style.opacity = "0"; // Hide name label when talking for clarity
    
    clearTimeout(this.bubbleTimer);
    this.bubbleTimer = setTimeout(() => {
      this.bubble.style.opacity = "0";
      this.bubble.style.transform = "translateX(-50%) translateY(5px)";
      this.nameLabel.style.opacity = "0.8";
    }, duration);
  }

  interact(showUI = true) {
    if (this.isAwaitingGameTrigger) {
      this.isAwaitingGameTrigger = false;
      if (typeof toggleGameBox === 'function') toggleGameBox();
      this.say("Zô thôi chủ nhân ơi! 🚀");
      return;
    }

    const popup = document.getElementById("petInteractionPopup");
    if (popup && showUI) {
      document.getElementById("interactPetName").innerText = this.customName;
      document.getElementById("interactPetIcon").innerText = this.config.icon || "🐾";
      
      const phrases = [
        "Hôm nay bồ học hành thế nào rồi?",
        "Tớ luôn ở đây cổ vũ bồ nè! ✨",
        "Mệt chưa? Nghỉ tay tí hông? ❤️",
        "Bồ là người chăm chỉ nhất tớ từng thấy!",
        "Dậy sớm học bài cùng tớ hông? ☀️",
        "Có tớ ở đây, mọi bài tập đều dễ ẹc! 💪"
      ];
      document.getElementById("interactPetQuote").innerText = `"${phrases[Math.floor(Math.random() * phrases.length)]}"`;
      
      // Update toggle buttons for movement
      const isStaying = getCleanLocalStorage("pet_stay_still") === "true";
      updatePetControlButtons(isStaying);
      
      // Update frequency
      const freq = getCleanLocalStorage("pet_chatter_freq") || "1";
      document.getElementById("petChatterFreq").value = freq;
      
      // Update auto game suggest checkbox
      const autoGames = getCleanLocalStorage("pet_auto_game_suggest") === "true";
      const autoGamesCheckbox = document.getElementById("petAutoGameSuggest");
      if (autoGamesCheckbox) autoGamesCheckbox.checked = autoGames;
      
      // Update Focus UI
      const focusIdle = document.getElementById("focusUI_idle");
      const focusActive = document.getElementById("focusUI_active");
      if (this.focusSession) {
        focusIdle.style.display = "none";
        focusActive.style.display = "block";
      } else {
        focusIdle.style.display = "block";
        focusActive.style.display = "none";
      }

      popup.style.display = "flex";
    }

    // Still play an animation
    const animType = Math.random();
    if (animType < 0.6) {
      this.isJumping = true;
      this.jumpStartTime = performance.now();
      this.jumpPower = 15 + Math.random() * 10;
    } else {
      this.emitHearts();
    }
  }

  startSpin() {
    this.isSpinning = true;
    this.spinStartTime = performance.now();
    setTimeout(() => { this.isSpinning = false; }, 600);
  }

  emitHearts() {
    for (let i = 0; i < 5; i++) {
      const heart = document.createElement("div");
      heart.innerText = ["❤️", "💖", "✨", "⭐", "🌈"][Math.floor(Math.random() * 5)];
      heart.style.cssText = `position: absolute; left: 50%; bottom: 40px; font-size: 20px; transition: all 1s ease-out; opacity: 1; transform: translate(-50%, 0);`;
      this.effectLayer.appendChild(heart);
      
      const angle = (Math.random() - 0.5) * 100;
      const distance = 50 + Math.random() * 50;
      
      requestAnimationFrame(() => {
        heart.style.transform = `translate(calc(-50% + ${angle}px), -${distance}px)`;
        heart.style.opacity = "0";
      });
      
      setTimeout(() => heart.remove(), 1000);
    }
  }

  updateTarget() {
    const margin = 100;
    this.targetX = margin + Math.random() * (window.innerWidth - margin * 2);
    this.targetY = window.innerHeight - 80 - Math.random() * 50;
    this.walking = true;
  }

  update(now, dt) {
    if (!this.lastStayCheck || now - this.lastStayCheck > 1000) {
      this.lastStayCheck = now;
      this.cachedIsStaying = getCleanLocalStorage("pet_stay_still") === "true";
    }
    const isStaying = this.cachedIsStaying;

    // Update focus timer if active
    if (this.focusSession) {
      this.updateFocusTimer();
    }

    // Tối ưu: Nếu đang đứng yên và không có game/focus thì không cần tính toán di chuyển phức tạp
    if (isStaying && !this.focusSession && !this.isJumping && !this.isDragging) {
       this.container.style.transform = `translate3d(${this.posX}px, ${this.posY}px, 0)`;
       return;
    }

    // Optimized: Remove Collision Avoidance & Social Check O(N^2) for many pets lag reduction
    // Only keep screen boundary clamping
    const margin = 60;
    this.posX = Math.max(margin, Math.min(window.innerWidth - margin, this.posX));
    this.posY = Math.max(margin, Math.min(window.innerHeight - margin, this.posY));

    if (this.isJumping) {
      const elapsed = now - this.jumpStartTime;
      const power = this.jumpPower || 15;
      if (elapsed < 300) {
        this.jumpY = Math.sin((elapsed / 300) * Math.PI) * power;
      } else {
        this.jumpY = 0;
        this.isJumping = false;
        this.jumpPower = 15;
      }
    }

    let extraTransform = "";
    if (this.isSpinning) {
      const spinTime = now - this.spinStartTime;
      const rotation = (spinTime / 600) * 360;
      extraTransform = ` rotate(${rotation}deg)`;
    }

    // Night time sleepiness
    if (this.walking && !isStaying) {
      const hour = new Date().getHours();
      if ((hour >= 23 || hour < 5) && !this.isSleeping) {
        if (Math.random() < 0.005) {
           this.isSleeping = true;
           this.walking = false;
           this.say("Tớ đi ngủ đây... 💤", 10000);
           this.idleTimer = 30000;
        }
      }

      // Periodic chatter while walking
      if (Math.random() < 0.0004) {
        const chatter = [
          "Học tốt nha bạn hiền! 📚",
          "Trời đẹp, cố lên nà! 🌤️",
          "Tớ canh cho bạn học nè! ✨",
          "Đói chưa? Ăn gì đi nhé! 🍎",
          "Cố lên, tớ tin bạn! 💪"
        ];
        this.say(chatter[Math.floor(Math.random() * chatter.length)]);
      }

      if (Math.random() < 0.002) { 
        this.walking = false; 
        this.idleTimer = Math.random() * 3000 + 2000; 
        if (Math.random() < 0.05) this.interact(false);
      }
      
      let dx = this.targetX - this.posX;
      let dy = this.targetY - this.posY;
      let dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 5) {
        this.walking = false;
        if (this.isGoingToGames) {
          this.isGoingToGames = false;
          this.idleTimer = 5000;
          if (typeof toggleGameBox === 'function') {
            const gb = document.getElementById("floatingGame");
            if (!gb || gb.style.display === "none") toggleGameBox();
          }
          this.say("Xả stress chút nha! 🎮");
        } else {
          this.idleTimer = Math.random() * 4000 + 2000;
        }
      } else {
        let speed = this.isGoingToGames ? 3.5 : 0.8;
        let adjustedSpeed = speed * (dt / 16);
        this.posX += (dx / dist) * adjustedSpeed;
        this.posY += (dy / dist) * adjustedSpeed;
      }
      
      this.direction = dx > 0 ? -1 : 1;
      let hopSpeed = this.isGoingToGames ? 80 : 150;
      let hopHeight = this.isGoingToGames ? 12 : 8;
      let hop = Math.abs(Math.sin(now / hopSpeed)) * hopHeight; 
      let wobble = Math.sin(now / hopSpeed) * 8; // Lắc lư nhẹ khi đi
      
      this.sprite.style.transform = `translate3d(0, -${hop + this.jumpY}px, 0) scaleX(${this.direction}) rotate(${wobble}deg) ${extraTransform}`;
      
    } else if (this.isDragging) {
      // Instant response for dragging
      this.posX = this.mouseX;
      this.posY = this.mouseY;
      let dragWobble = (this.mouseX - this.posX) * 0.5; // Tilt based on drag
      this.sprite.style.transform = `translate3d(0, -${this.jumpY}px, 0) scaleX(${this.direction}) rotate(${dragWobble}deg) ${extraTransform}`;
    } else {
      // Periodic chatter even if staying still
      if (Math.random() < 0.0004) {
        const hour = new Date().getHours();
        const hourGreetings = this.getTimeBasedGreeting();
        this.say(hourGreetings[Math.floor(Math.random() * hourGreetings.length)]);
      }

      this.idleTimer -= dt;
      let breath = Math.abs(Math.sin(now / 800)) * (this.isSleeping ? 0.02 : 0.06);
      let breathX = Math.abs(Math.sin(now / 800)) * (this.isSleeping ? 0.01 : 0.03);
      this.sprite.style.transform = `translate3d(0, -${this.jumpY}px, 0) scaleX(${this.direction > 0 ? (1 + breathX) : -(1 + breathX)}) scaleY(${1 - breath}) ${extraTransform}`;
      
      if (!isStaying && this.idleTimer <= 0 && this.bubble.style.opacity == "0") {
        this.isSleeping = false;
        this.walking = true;
        this.updateTarget();
      }
    }

    // Boundary Clamping
    this.posX = Math.max(10, Math.min(window.innerWidth - 80, this.posX));
    this.posY = Math.max(80, Math.min(window.innerHeight - 80, this.posY));

    // Optimized Style Updates: Use translate3d for GPU acceleration
    this.container.style.transform = `translate3d(${this.posX}px, ${this.posY}px, 0)`;
    
    // Only update z-index if floor of posY changes to reduce layout triggers
    const newZIndex = Math.floor(this.posY) + 100000;
    if (this.currentZIndex !== newZIndex) {
      this.container.style.zIndex = newZIndex;
      this.currentZIndex = newZIndex;
    }
  }

  destroy() {
    if (this.container && this.container.parentNode) {
      this.container.parentNode.removeChild(this.container);
    }
  }
}

let lastPetFrameTime = performance.now();

function animatePet() {
  requestAnimationFrame(animatePet);
  const now = performance.now();
  const dt = now - lastPetFrameTime;
  if (dt < 16) return;
  lastPetFrameTime = now;
  
  activePets.forEach(pet => pet.update(now, dt));
}

function applyCustomPetImage() {
  if (isBuyingPet) {
    showToast('Đang xử lý giao dịch, vui lòng chờ!', 'info');
    return;
  }

  const urlInput = document.getElementById("customPetUrl").value.trim();
  const fileInput = document.getElementById("customPetFile");
  const cost = 5000;

  if (currentUserPoints < cost) {
    showToast('Bạn không đủ 5.000 🪙 để tạo thú cưng tuỳ chỉnh.', 'error');
    triggerStudentReliefIfEligible();
    return;
  }

  const processAndSave = (imgUrl) => {
    askUseCoin(`Bạn có muốn dùng ${cost} 🪙 để tạo thú cưng tuỳ chỉnh này không?`, () => {
      isBuyingPet = true;
      showGlobalSpinner("Đang lưu hình thú cưng...");

      let originalPointsBuyCustom = currentUserPoints;
      let optimisticallyDeductedBuyCustom = false;
      if (typeof currentUserPoints !== 'undefined' && typeof updatePointDisplay === 'function') {
          updatePointDisplay(Math.max(0, currentUserPoints - cost));
          optimisticallyDeductedBuyCustom = true;
      }

      google.script.run.withSuccessHandler(newTotal => {
        isBuyingPet = false;
        hideGlobalSpinner();
        if (newTotal === false) {
          if (optimisticallyDeductedBuyCustom) updatePointDisplay(originalPointsBuyCustom); // Revert
          showToast('Bạn không đủ điểm hoặc có lỗi xảy ra', 'error');
          return;
        }
        
        updatePointDisplay(newTotal);
        
        try {
          let ownedCustomPets = []; try { ownedCustomPets = JSON.parse(getCleanLocalStorage("owned_custom_pets") || "[]"); } catch(e) {}
          const newId = "custom_" + Date.now();
          ownedCustomPets.push({ id: newId, url: imgUrl });
          localStorage.setItem("owned_custom_pets", JSON.stringify(ownedCustomPets));
          
          let spawnedIds = (() => { try { return JSON.parse(getCleanLocalStorage("spawned_pet_ids") || "[]"); } catch(e) { return []; } })();
          spawnedIds.push(newId);
          localStorage.setItem("spawned_pet_ids", JSON.stringify(spawnedIds));
          localStorage.setItem('pet_turned_off', 'false');
          
          toggleCustomPetPopup();
          renderPetGrid();
          initPet();
          showToast('Tạo thú cưng thành công!', 'success');
        } catch(err) {
          showToast('Lỗi lưu trữ! Ảnh quá lớn.', 'error');
        }
      }).withFailureHandler(err => {
        if (optimisticallyDeductedBuyCustom) updatePointDisplay(originalPointsBuyCustom); // Revert
        isBuyingPet = false;
        hideGlobalSpinner();
        showToast("Lỗi kết nối", "error");
      }).deductUserPoints(cost, "Tạo thú cưng tự tạo");
    });
  };

  if (fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;
        const max_dim = 200; // Small size for pets
        
        if (width > height) {
          if (width > max_dim) {
            height *= max_dim / width;
            width = max_dim;
          }
        } else {
          if (height > max_dim) {
            width *= max_dim / height;
            height = max_dim;
          }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        
        // Use image/png to preserve transparency
        const dataUrl = canvas.toDataURL("image/png");
        processAndSave(dataUrl);
      }
      img.src = e.target.result;
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else if (urlInput !== "") {
    processAndSave(urlInput);
  } else {
    showToast('Vui lòng chọn ảnh hoặc nhập URL', 'error');
  }
}

function switchPetTab(tab) {
  const adoptBtn = document.getElementById("petTabBtn_adopt");
  const extraBtn = document.getElementById("petTabBtn_extra");
  const adoptContent = document.getElementById("petTabContent_adopt");
  const extraContent = document.getElementById("petTabContent_extra");
  
  if (tab === 'adopt') {
    if (adoptBtn) {
      adoptBtn.classList.add("active");
      adoptBtn.style.color = "";
      adoptBtn.style.borderBottomColor = "";
    }
    if (extraBtn) {
      extraBtn.classList.remove("active");
      extraBtn.style.color = "";
      extraBtn.style.borderBottomColor = "";
    }
    if (adoptContent) adoptContent.style.display = "block";
    if (extraContent) extraContent.style.display = "none";
    renderPetGrid();
  } else {
    if (adoptBtn) {
      adoptBtn.classList.remove("active");
      adoptBtn.style.color = "";
      adoptBtn.style.borderBottomColor = "";
    }
    if (extraBtn) {
      extraBtn.classList.add("active");
      extraBtn.style.color = "";
      extraBtn.style.borderBottomColor = "";
    }
    if (adoptContent) adoptContent.style.display = "none";
    if (extraContent) extraContent.style.display = "block";
    populateTargetPetSelect();
    renderAccessoryGrid();
  }
}

function populateTargetPetSelect() {
  const select = document.getElementById("accTargetPetSelect");
  if (!select) return;
  
  select.innerHTML = "";
  let ownedPets = [];
  try {
    ownedPets = JSON.parse(getCleanLocalStorage("owned_pets") || '["pet_chick"]');
  } catch(e) {
    ownedPets = ["pet_chick"];
  }
  if (!Array.isArray(ownedPets) || ownedPets.length === 0) {
    ownedPets = ["pet_chick"];
  }
  if (!ownedPets.includes("pet_chick")) {
    ownedPets.unshift("pet_chick");
  }
  let ownedCustomPets = []; try { ownedCustomPets = JSON.parse(getCleanLocalStorage("owned_custom_pets") || "[]"); } catch(e) {}
  
  let hasPets = false;
  
  // Default pets
  PET_CONFIG.forEach(pet => {
    if (ownedPets.includes(pet.id)) {
      const customName = getCleanLocalStorage(`pet_name_${pet.id}`) || pet.name;
      const opt = document.createElement("option");
      opt.value = pet.id;
      opt.textContent = `🐾 ${customName}`;
      select.appendChild(opt);
      hasPets = true;
    }
  });
  
  // Custom pets
  ownedCustomPets.forEach(pet => {
    const customName = getCleanLocalStorage(`pet_name_${pet.id}`) || "Thú Cưng Riêng";
    const opt = document.createElement("option");
    opt.value = pet.id;
    opt.textContent = `✨ ${customName}`;
    select.appendChild(opt);
    hasPets = true;
  });
  
  if (!hasPets) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "Bạn chưa nuôi Pet nào 😢";
    select.appendChild(opt);
  }
}

function renderAccessoryGrid() {
  const grid = document.getElementById("petAccessoryGrid");
  const select = document.getElementById("accTargetPetSelect");
  if (!grid || !select) return;
  
  grid.innerHTML = "";
  const petId = select.value;
  if (!petId) {
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:24px; color:#64748b; font-weight:600; font-size:0.9rem;">Vui lòng nhận nuôi ít nhất một Thú Cưng để sắm phụ kiện!</div>`;
    return;
  }
  
  const ownedAccessories = (() => { try { return JSON.parse(getCleanLocalStorage("owned_accessories") || "[]"); } catch(e) { return []; } })();
  const equippedAccId = getCleanLocalStorage(`pet_accessory_${petId}`);
  
  PET_ACCESSORIES.forEach(acc => {
    const card = document.createElement("div");
    card.className = "pet-card-item";
    
    const isOwned = ownedAccessories.includes(acc.id);
    const isEquipped = (equippedAccId === acc.id);
    
    let btnHtml = "";
    if (!isOwned) {
      btnHtml = `<button onclick="buyAccessory('${acc.id}', ${acc.cost})" class="pet-card-btn-buy">Mua (${acc.cost} 🪙)</button>`;
    } else {
      if (isEquipped) {
        card.classList.add("equipped");
        btnHtml = `<button onclick="unequipAccessory('${acc.id}', '${petId}')" class="pet-card-btn-unequip">Tháo ra</button>`;
      } else {
        btnHtml = `<button onclick="equipAccessory('${acc.id}', '${petId}')" class="pet-card-btn-action">Trang bị</button>`;
      }
    }
    
    card.innerHTML = `
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div class="pet-avatar-wrapper">${acc.icon}</div>
        <div class="pet-card-name">${acc.name}</div>
        <div class="pet-card-desc">${acc.desc}</div>
      </div>
      <div style="margin-top: 12px; width: 100%;">
        ${btnHtml}
      </div>
    `;
    grid.appendChild(card);
  });
}

let isBuyingAccessory = false;

function buyAccessory(accId, cost) {
  if (isBuyingAccessory) return;
  
  if (currentUserPoints < cost) {
    showToast('Bạn không đủ điểm để mua phụ kiện này.', 'error');
    return;
  }
  
  const acc = PET_ACCESSORIES.find(a => a.id === accId);
  askUseCoin(`Bạn có muốn dùng ${cost} 🪙 để mua phụ kiện ${acc.name} không?`, () => {
    isBuyingAccessory = true;
    showGlobalSpinner("Đang xử lý mua phụ kiện...");

    let originalPointsBuyAcc = currentUserPoints;
    let optimisticallyDeductedBuyAcc = false;
    if (typeof currentUserPoints !== 'undefined' && typeof updatePointDisplay === 'function') {
        updatePointDisplay(Math.max(0, currentUserPoints - cost));
        optimisticallyDeductedBuyAcc = true;
    }

    google.script.run.withSuccessHandler(newTotal => {
      isBuyingAccessory = false;
      hideGlobalSpinner();
      if (newTotal === false) {
        if (optimisticallyDeductedBuyAcc) updatePointDisplay(originalPointsBuyAcc);
        showToast('Bạn không đủ điểm hoặc có lỗi xảy ra', 'error');
        return;
      }
      
      updatePointDisplay(newTotal);
      
      let owned = (() => { try { return JSON.parse(getCleanLocalStorage("owned_accessories") || "[]"); } catch(e) { return []; } })();
      if (!owned.includes(accId)) owned.push(accId);
      localStorage.setItem("owned_accessories", JSON.stringify(owned));
      
      showToast('Mua phụ kiện thành công!', 'success');
      renderAccessoryGrid();
      
    }).withFailureHandler(() => {
      if (optimisticallyDeductedBuyAcc) updatePointDisplay(originalPointsBuyAcc);
      isBuyingAccessory = false;
      hideGlobalSpinner();
      showToast('Lỗi kết nối máy chủ!', 'error');
    }).deductUserPoints(cost, `Mua phụ kiện ${acc.name}`);
  });
}

function togglePetSpawn(petId) {
    let spawnedIds = (() => { try { return JSON.parse(getCleanLocalStorage("spawned_pet_ids") || "[]"); } catch(e) { return []; } })();
    if (spawnedIds.includes(petId)) {
        spawnedIds = spawnedIds.filter(id => id !== petId);
        // Find and destroy the pet instance
        const idx = activePets.findIndex(p => p.id === petId);
        if (idx !== -1) {
            activePets[idx].destroy();
            activePets.splice(idx, 1);
        }
    } else {
        spawnedIds.push(petId);
        localStorage.setItem("spawned_pet_ids", JSON.stringify(spawnedIds));
        localStorage.setItem("pet_turned_off", "false");
        
        // Spawn the new pet
        let ownedCustomPets = []; try { ownedCustomPets = JSON.parse(getCleanLocalStorage("owned_custom_pets") || "[]"); } catch(e) {}
        let petConfig;
        if (petId.startsWith("custom_")) {
          const customPet = ownedCustomPets.find(p => p.id === petId);
          if (customPet) petConfig = { ...customPet, isCustom: true };
        } else {
          petConfig = PET_CONFIG.find(p => p.id === petId);
        }
        
        if (petConfig) {
          const newPet = new ActivePet(petConfig, petId);
          
          // Đồng bộ nếu đang trong phiên tập trung
          const existingSession = activePets.find(p => p.focusSession)?.focusSession;
          if (existingSession) {
            newPet.focusSession = { ...existingSession };
            newPet.container.classList.add("pet-focus-mode");
          }

          activePets.push(newPet);
          if (!existingSession) newPet.say("Tui tới rồi đây! ✨");
        }
    }
    localStorage.setItem("spawned_pet_ids", JSON.stringify(spawnedIds));
    renderPetGrid();
    showToast("Đã cập nhật trạng thái thú cưng", "success");
}

let isBuyingPet = false;

function buyPet(petId, cost) {
  if (isBuyingPet) {
    showToast('Đang xử lý giao dịch, vui lòng chờ!', 'info');
    return;
  }

  if (cost === 0) {
    let owned = JSON.parse(getCleanLocalStorage("owned_pets") || '["pet_chick"]');
    if(!owned.includes(petId)) owned.push(petId);
    localStorage.setItem("owned_pets", JSON.stringify(owned));
    togglePetSpawn(petId);
    return;
  }
  
  if (currentUserPoints < cost) {
    showToast('Bạn không đủ điểm để mua thú cưng này.', 'error');
    triggerStudentReliefIfEligible();
    return;
  }
  
  askUseCoin(`Bạn có muốn dùng ${cost} 🪙 để mua bé ${PET_CONFIG.find(p=>p.id===petId).name} không?`, () => {
    isBuyingPet = true;
    showGlobalSpinner("Đang mua thú cưng...");

    let originalPointsBuyPet = currentUserPoints;
    let optimisticallyDeductedBuyPet = false;
    if (typeof currentUserPoints !== 'undefined' && typeof updatePointDisplay === 'function') {
        updatePointDisplay(Math.max(0, currentUserPoints - cost));
        optimisticallyDeductedBuyPet = true;
    }

    google.script.run.withSuccessHandler(newTotal => {
      isBuyingPet = false;
      hideGlobalSpinner();
      if (newTotal === false) {
        if (optimisticallyDeductedBuyPet) updatePointDisplay(originalPointsBuyPet); // Revert
        showToast('Bạn không đủ điểm hoặc có lỗi xảy ra', 'error');
        return;
      }
      
      updatePointDisplay(newTotal);
      
      let owned = JSON.parse(getCleanLocalStorage("owned_pets") || '["pet_chick"]');
      if(!owned.includes(petId)) owned.push(petId);
      localStorage.setItem("owned_pets", JSON.stringify(owned));
      localStorage.setItem('pet_turned_off', 'false');
      
      togglePetSpawn(petId);
      showToast('Mua thú cưng thành công!', 'success');
      
    }).withFailureHandler(err => {
      if (optimisticallyDeductedBuyPet) updatePointDisplay(originalPointsBuyPet); // Revert
      isBuyingPet = false;
      hideGlobalSpinner();
      showToast("Lỗi kết nối", "error");
    }).deductUserPoints(cost, "Mua thú cưng Store");
  });
}

// --- GLOBAL FOCUS MODE WRAPPERS ---
function triggerPetFocus(durationOverride) {
  if (activePets.length === 0) {
    showToast("⚠️ Bạn cần có thú cưng để bắt đầu tập trung!", "warning");
    return;
  }
  
  const duration = durationOverride || parseInt(document.getElementById("focusDurationSelect").value);
  if (isNaN(duration)) return;

  activePets.forEach((pet, index) => {
    pet.startFocusMode(duration, index > 0);
  });
  
  // Cập nhật UI ở cửa sổ chính
  const startBtn = document.getElementById("startFocusBtn");
  const stopBtn = document.getElementById("stopFocusBtn");
  const select = document.getElementById("focusDurationSelect");
  
  if (startBtn) startBtn.style.display = "none";
  if (stopBtn) stopBtn.style.display = "block";
  if (select) {
    select.value = duration;
    select.disabled = true;
  }
  
  // Đóng các popup liên quan
  const interactPopup = document.getElementById("petInteractionPopup");
  if (interactPopup) interactPopup.style.display = "none";
  
  // Không gọi togglePetPopup() ở đây để tránh làm phiền người dùng
}

function cancelPetFocus() {
  activePets.forEach((pet) => {
    pet.cancelFocusMode();
  });
  localStorage.setItem("pet_stay_still", "false");
  updatePetStayUI();
  resetFocusUI();
}

function resetFocusUI() {
  const startBtn = document.getElementById("startFocusBtn");
  const stopBtn = document.getElementById("stopFocusBtn");
  const select = document.getElementById("focusDurationSelect");
  if (startBtn) startBtn.style.display = "block";
  if (stopBtn) stopBtn.style.display = "none";
  if (select) select.disabled = false;

  // Đóng popup interaction
  const interactPopup = document.getElementById("petInteractionPopup");
  if (interactPopup) interactPopup.style.display = "none";

  // Sync interaction popup UI
  const focusIdle = document.getElementById("focusUI_idle");
  const focusActive = document.getElementById("focusUI_active");
  if (focusIdle) focusIdle.style.display = "block";
  if (focusActive) focusActive.style.display = "none";
}

function setPetMovement(shouldMove) {
  // Nếu đang trong chế độ tập trung, không cho phép di chuyển
  const isAnyInFocus = activePets.some(p => p.focusSession);
  if (isAnyInFocus && shouldMove) {
    showToast("⚠️ Đang trong chế độ tập trung, thú cưng phải đứng yên!", "warning");
    return;
  }

  localStorage.setItem("pet_stay_still", (!shouldMove).toString());
  updatePetControlButtons(!shouldMove);
  updatePetStayUI();
}

function updatePetControlButtons(isStaying) {
  const moveBtn = document.getElementById("petMoveBtn");
  const stayBtn = document.getElementById("petStayBtn");
  if (!moveBtn || !stayBtn) return;

  const isDark = document.body.classList.contains("dark-mode");
  const inactiveBg = isDark ? "#1e293b" : "white";
  const inactiveColor = isDark ? "#cbd5e1" : "#475569";
  const inactiveBorder = isDark ? "#334155" : "#e2e8f0";

  if (isStaying) {
    stayBtn.style.background = "#3b82f6";
    stayBtn.style.color = "white";
    stayBtn.style.borderColor = "#3b82f6";
    moveBtn.style.background = inactiveBg;
    moveBtn.style.color = inactiveColor;
    moveBtn.style.borderColor = inactiveBorder;
  } else {
    moveBtn.style.background = "#3b82f6";
    moveBtn.style.color = "white";
    moveBtn.style.borderColor = "#3b82f6";
    stayBtn.style.background = inactiveBg;
    stayBtn.style.color = inactiveColor;
    stayBtn.style.borderColor = inactiveBorder;
  }
}

function initPet() {
  if (!window.isLoggedIn) {
    activePets.forEach(p => p.destroy());
    activePets = [];
    return;
  }
  const isTurnedOff = getCleanLocalStorage("pet_turned_off") === "true";
  if (isTurnedOff) {
    activePets.forEach(p => p.destroy());
    activePets = [];
    return;
  }

  // Clear existing ones first
  activePets.forEach(p => p.destroy());
  activePets = [];

  let spawnedIds = (() => { try { return JSON.parse(getCleanLocalStorage("spawned_pet_ids") || "[]"); } catch(e) { return []; } })();
  
  // If nothing spawned yet but not turned off, spawn the default or previously selected one
  if (spawnedIds.length === 0) {
    const selectedPet = getCleanLocalStorage("selected_pet") || "pet_chick";
    spawnedIds = [selectedPet];
    localStorage.setItem("spawned_pet_ids", JSON.stringify(spawnedIds));
  }

  let ownedCustomPets = []; try { ownedCustomPets = JSON.parse(getCleanLocalStorage("owned_custom_pets") || "[]"); } catch(e) {}

  spawnedIds.forEach(id => {
    let petConfig;
    if (id.startsWith("custom_")) {
      const customPet = ownedCustomPets.find(p => p.id === id);
      if (customPet) {
        petConfig = { ...customPet, isCustom: true };
      }
    } else {
      petConfig = PET_CONFIG.find(p => p.id === id);
    }

    if (petConfig) {
      const newPet = new ActivePet(petConfig, id);
      activePets.push(newPet);
      
      // Initial greeting for each pet
      setTimeout(() => {
        const timeGreetings = newPet.getTimeBasedGreeting();
        newPet.say(timeGreetings[Math.floor(Math.random() * timeGreetings.length)]);
      }, 1000 + Math.random() * 1000);
    }
  });
}

let isFirstReminder = true;
function scheduleRestReminder() {
  const minTime = 15 * 60 * 1000;
  const maxTime = 30 * 60 * 1000;
  let nextReminder = minTime + Math.random() * (maxTime - minTime);
  
  if (isFirstReminder) {
    nextReminder = 5 * 60000; // 5 mins for first one
    isFirstReminder = false;
  }
  
  setTimeout(() => {
    const isTurnedOff = getCleanLocalStorage("pet_turned_off") === "true";
    if (!isTurnedOff && activePets.length > 0) {
      // Frequency check
      const freq = getCleanLocalStorage("pet_chatter_freq") || "1";
      let chance = 0.3; // Default
      if (freq === "0") chance = 0.05;
      if (freq === "2") chance = 0.6;

      if (Math.random() < chance) {
        const randomPet = activePets[Math.floor(Math.random() * activePets.length)];
        const suggestGame = getCleanLocalStorage("pet_auto_game_suggest") === "true";
        if (suggestGame) {
          randomPet.say("Chủ nhân mỏi mắt chưa? Chơi game 1 lát hông? (Bấm vào tôi để chơi!) ❤️", 15000);
          randomPet.isAwaitingGameTrigger = true;
          setTimeout(() => { randomPet.isAwaitingGameTrigger = false; }, 30000);
        } else {
          const normalSayings = [
            "Chủ nhân ơi, mình nhắm mắt nghỉ ngơi 30 giây nha! 👀",
            "Uống tý nước đi chủ nhân yêu dấu! 💧",
            "Vươn vai chút xíu nhé, bồ ngồi lâu lắm rồi á! 🤸",
            "Học chăm quá, tớ rất tự hào về bồ! 🥰"
          ];
          randomPet.say(normalSayings[Math.floor(Math.random() * normalSayings.length)], 12000);
        }
      }
    }
    scheduleRestReminder();
  }, nextReminder);
}

// Start pet system
document.addEventListener("DOMContentLoaded", () => {
  initPet();

  requestAnimationFrame(animatePet);

});

// Render danh sách themes theo category
function renderThemeGallery() {
  const grid = document.getElementById("themeGalleryGrid");
  if (!grid) return;

  const filtered = currentCategoryFilter === "all" 
    ? BACKGROUND_THEMES 
    : BACKGROUND_THEMES.filter(t => t.category === currentCategoryFilter);

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 30px; color: #94a3b8;">Không tìm thấy chủ đề phù hợp</div>`;
    return;
  }

  grid.innerHTML = filtered.map(t => {
    const isActive = currentThemeState.themeId === t.id;
    return `
      <div class="theme-preset-card ${isActive ? 'active-theme' : ''}" id="themeCard_${t.id}" onclick="applyThemeById('${t.id}')">
        <div class="theme-card-thumb-wrap">
          <img src="${t.url}" alt="${t.name}" class="theme-card-thumb-img" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1522383225653-ed111181a951?auto=format&fit=crop&w=600&q=80'">
          ${isActive ? `<div class="theme-card-active-badge">✓ Đang dùng</div>` : ''}
          <div class="theme-card-fx-badge">${t.fxName}</div>
        </div>
        <div class="theme-card-meta">
          <div class="theme-card-title">${t.icon} ${t.name}</div>
          <div class="theme-card-desc">${t.desc}</div>
        </div>
      </div>
    `;
  }).join('');
}

// Lọc danh mục Theme
function filterThemesByCategory(cat) {
  currentCategoryFilter = cat;

  // Update tabs visual state
  const tabs = [
    { id: 'themeTabAll', cat: 'all' },
    { id: 'themeTabJapan', cat: 'japan' },
    { id: 'themeTabFestival', cat: 'festival' },
    { id: 'themeTabStudy', cat: 'study' },
    { id: 'themeTabCustom', cat: 'custom' }
  ];

  tabs.forEach(t => {
    const el = document.getElementById(t.id);
    if (el) {
      if (t.cat === cat) el.classList.add('active');
      else el.classList.remove('active');
    }
  });

  const customSection = document.getElementById("themeCustomSection");
  const galleryGrid = document.getElementById("themeGalleryGrid");

  if (cat === "custom") {
    if (customSection) customSection.style.display = "block";
    if (galleryGrid) galleryGrid.style.display = "none";
  } else {
    if (customSection) customSection.style.display = "none";
    if (galleryGrid) {
      galleryGrid.style.display = "grid";
      renderThemeGallery();
    }
  }
}

// Áp dụng Theme theo ID
function applyThemeById(themeId) {
  const theme = BACKGROUND_THEMES.find(t => t.id === themeId);
  if (!theme) return;

  currentThemeState.themeId = theme.id;
  currentThemeState.customBgUrl = theme.url;
  currentThemeState.activeFx = theme.fx;
  if (typeof theme.dim === "number") currentThemeState.dim = theme.dim;
  if (typeof theme.blur === "number") currentThemeState.blur = theme.blur;

  // Áp dụng data-theme lên body và html để kích hoạt toàn bộ hệ thống CSS Theme
  document.body.setAttribute("data-theme", theme.id);
  document.documentElement.setAttribute("data-theme", theme.id);

  // Cập nhật background
  setBackground(theme.url);

  // Cập nhật Dim & Blur
  updateOverlayDim(currentThemeState.dim);
  updateOverlayBlur(currentThemeState.blur);

  // Cập nhật Live Particles
  setLiveEffect(theme.fx, false);

  // Cập nhật UI controls
  syncThemeUiControls();
  renderThemeGallery();

  showToast(`Đã áp dụng giao diện: ${theme.name}`, "success");
}

// Cập nhật Live Particles Engine
function setLiveEffect(fxType, showNotification = true) {
  currentThemeState.activeFx = fxType;

  // Cập nhật chip active
  const chips = document.querySelectorAll("#themeFxSelector .theme-fx-chip");
  chips.forEach(chip => {
    if (chip.getAttribute("data-fx") === fxType) {
      chip.classList.add("active");
    } else {
      chip.classList.remove("active");
    }
  });

  // Cập nhật badge
  const badge = document.getElementById("currentFxNameBadge");
  if (badge) {
    badge.textContent = THEME_FX_LABELS[fxType] || "Hiệu ứng tùy chỉnh";
  }

  // Khởi chạy hiệu ứng
  renderParticleEngine(fxType);

  if (showNotification) {
    showToast(`Đã áp dụng hiệu ứng: ${THEME_FX_LABELS[fxType] || fxType}`, "info");
  }
}

// Cập nhật mật độ hạt & không khí (Particle Density)
function updateParticleDensity(val) {
  const num = parseInt(val, 10) || 2;
  currentThemeState.particleDensity = num;

  const label = document.getElementById("themeDensityLabel");
  if (label) {
    label.textContent = THEME_DENSITY_LABELS[num] || "✨ Vừa phải (Chuẩn)";
  }

  const slider = document.getElementById("themeDensitySlider");
  if (slider && slider.value != num) {
    slider.value = num;
  }

  if (currentThemeState.activeFx && currentThemeState.activeFx !== "none") {
    renderParticleEngine(currentThemeState.activeFx);
  }
}

      const particleCount = Math.max(5, Math.round(18 * densityMultiplier));
      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement("div");
        p.className = "theme-particle-item";
        const inner = document.createElement("div");
        inner.className = "css-particle-bubble";
        p.appendChild(inner);

        const left = Math.random() * 94 + 3;
        const delay = Math.random() * 8;
        const duration = 7 + Math.random() * 5;
        const size = 16 + Math.random() * 22;
        const sway = (Math.random() - 0.5) * 90;

        p.style.left = `${left}%`;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.setProperty("--particle-sway", `${sway}px`);
        p.style.animation = `bubbleRiseFloat ${duration}s ease-in-out infinite ${delay}s`;

        container.appendChild(p);
      }
      break;
    }

    default:
      break;
  }
}

// Cập nhật độ tối của lớp phủ (Dim Overlay)
function updateOverlayDim(val) {
  const num = parseInt(val, 10) || 0;
  currentThemeState.dim = num;

  const overlay = document.getElementById("globalThemeBackdropOverlay");
  if (overlay) {
    overlay.style.setProperty("--theme-dim", (num / 100).toFixed(2));
  }

  const label = document.getElementById("themeDimLabel");
  if (label) label.textContent = `${num}%`;

  const slider = document.getElementById("themeDimSlider");
  if (slider && slider.value != num) slider.value = num;
}

// Cập nhật độ mờ của lớp phủ (Backdrop Blur)
function updateOverlayBlur(val) {
  const num = parseInt(val, 10) || 0;
  currentThemeState.blur = num;

  const overlay = document.getElementById("globalThemeBackdropOverlay");
  if (overlay) {
    overlay.style.setProperty("--theme-blur", `${num}px`);
  }

  const label = document.getElementById("themeBlurLabel");
  if (label) label.textContent = `${num}px`;

  const slider = document.getElementById("themeBlurSlider");
  if (slider && slider.value != num) slider.value = num;
}

// Đồng bộ các controls UI theo currentThemeState
function syncThemeUiControls() {
  updateOverlayDim(currentThemeState.dim);
  updateOverlayBlur(currentThemeState.blur);

  // Sync Density
  const density = parseInt(currentThemeState.particleDensity, 10) || 2;
  const densityLabel = document.getElementById("themeDensityLabel");
  if (densityLabel) {
    densityLabel.textContent = THEME_DENSITY_LABELS[density] || "✨ Vừa phải (Chuẩn)";
  }
  const densitySlider = document.getElementById("themeDensitySlider");
  if (densitySlider && densitySlider.value != density) {
    densitySlider.value = density;
  }

  // Sync FX Chips
  const chips = document.querySelectorAll("#themeFxSelector .theme-fx-chip");
  chips.forEach(chip => {
    if (chip.getAttribute("data-fx") === currentThemeState.activeFx) {
      chip.classList.add("active");
    } else {
      chip.classList.remove("active");
    }
  });

  const badge = document.getElementById("currentFxNameBadge");
  if (badge) {
    badge.textContent = THEME_FX_LABELS[currentThemeState.activeFx] || "Tự chọn";
  }
}

// Tải ảnh tùy chỉnh từ máy tính
function handleCustomBgFileUpload(input) {
  if (!input.files || !input.files[0]) return;

  const file = input.files[0];
  const span = document.getElementById("bgSelectedFileName");
  if (span) span.textContent = file.name;

  showGlobalSpinner("Đang tối ưu hóa hình nền...");
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      let width = img.width;
      let height = img.height;
      const max_dim = 1920;

      if (width > height) {
        if (width > max_dim) {
          height *= max_dim / width;
          width = max_dim;
        }
      } else {
        if (height > max_dim) {
          width *= max_dim / height;
          height = max_dim;
        }
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      hideGlobalSpinner();

      currentThemeState.themeId = "custom";
      currentThemeState.customBgUrl = dataUrl;
      setBackground(dataUrl);
      renderThemeGallery();
      showToast("Đã tải ảnh lên thành công!", "success");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

    themeId: "default",
    customBgUrl: "",
    activeFx: "none",
    particleDensity: 2,
    dim: 0,
    blur: 0
  };

  localStorage.removeItem("tds_theme_config");

  document.body.removeAttribute("data-theme");
  document.documentElement.removeAttribute("data-theme");
  document.body.style.backgroundImage = "";
  updateOverlayDim(0);
  updateOverlayBlur(0);

  showToast("Đã khôi phục không gian nền mặc định.", "success");

}

// Đặt background CSS
function setBackground(url) {
  if (!url) {
    document.body.style.backgroundImage = "";
    return;
  }
  document.body.style.backgroundImage = `url('${url}')`;
  document.body.style.backgroundSize = "cover";
  document.body.style.backgroundPosition = "center";
  document.body.style.backgroundRepeat = "no-repeat";
  document.body.style.backgroundAttachment = "fixed";
}

// Khởi tạo Theme khi tải trang
(function initThemeStudio() {
  try {
    const savedConfig = getCleanLocalStorage("tds_theme_config");
    if (savedConfig) {
      const parsed = JSON.parse(savedConfig);
      currentThemeState = Object.assign(currentThemeState, parsed);
    } else {
      const legacyBg = getCleanLocalStorage("custom_bg");
      if (legacyBg) {
        currentThemeState.themeId = "custom";
        currentThemeState.customBgUrl = legacyBg;
      }
    }

    if (currentThemeState.themeId && currentThemeState.themeId !== "default" && currentThemeState.themeId !== "custom") {
      document.body.setAttribute("data-theme", currentThemeState.themeId);
      document.documentElement.setAttribute("data-theme", currentThemeState.themeId);
    }

    if (currentThemeState.customBgUrl) {
      setBackground(currentThemeState.customBgUrl);
    }

    updateOverlayDim(currentThemeState.dim || 0);
    updateOverlayBlur(currentThemeState.blur || 0);

    if (currentThemeState.activeFx && currentThemeState.activeFx !== "none") {
      renderParticleEngine(currentThemeState.activeFx);
    }
  } catch (e) {
    console.error("Init theme failed:", e);
  }
})();

                + "&auto_play=false";

    setTimeout(() => {
      player.src = "https://w.soundcloud.com/player/?url=" 
                    + encodeURIComponent(url) 
                    + "&auto_play=true";
    }, 300);
  }
}

let currentUserId = null; // ID user hiện tại
let cachedUserInfo = null;
let cachedAvailableUsers = null;
let cachedIncomingRequests = null;
let cachedMatchedPartner = null;
let isPreloadingPairData = false;

function preloadPairingData() {
  const userEmail = getUserEmail();
  if (!userEmail || currentUserId || isPreloadingPairData) return;
  
  isPreloadingPairData = true;
  google.script.run.withSuccessHandler(id => {
    currentUserId = id;
    if (id) {
      google.script.run.withSuccessHandler(user => {
        cachedUserInfo = user;
        silentFetchPairingLists();
      }).getUserInfo(id);
    } else {
      isPreloadingPairData = false;
    }
  }).getUserIdByEmail(userEmail);
}

function silentFetchPairingLists() {
  if (!currentUserId) return;
  
  let fetchCount = 0;
  const checkDone = () => {
    fetchCount++;
    if(fetchCount >= 3) {
      isPreloadingPairData = false;
    }
  };

  google.script.run.withSuccessHandler(users => {
    cachedAvailableUsers = users;
    checkDone();
    if (document.getElementById('pairingModal').style.display !== 'none') renderAvailableUsers();
  }).getAvailableUsers(currentUserId);
  
  google.script.run.withSuccessHandler(requests => {
    cachedIncomingRequests = requests;
    checkDone();
    if (document.getElementById('pairingModal').style.display !== 'none') renderIncomingRequests();
  }).getIncomingRequests(currentUserId);
  
  google.script.run.withSuccessHandler(partner => {
    cachedMatchedPartner = partner;
    checkDone();
    if (document.getElementById('pairingModal').style.display !== 'none') renderMatchedPartner();
  }).getMatchedInfo(currentUserId);
}

  const closeBtn = document.getElementById('closeNotification');
  const okBtn = document.getElementById('okNotificationBtn');
  
  if(overlay) {
    overlay.style.display = 'flex';
  } else if (popup) {
    popup.style.display = 'block';
  }

  if (msg) msg.textContent = message;
  if (spinner) spinner.style.display = showSpinner ? 'block' : 'none';
  if (closeBtn) closeBtn.style.display = allowClose ? 'flex' : 'none';
  if (okBtn) okBtn.style.display = allowClose ? 'block' : 'none';
}

function getUserEmail() {
  return getCleanSessionStorage("userEmail") || document.body.getAttribute("data-user-email") || "";
}

function togglePairingPopup() {
  const modal = document.getElementById('pairingModal');
  const userEmail = getUserEmail();

  if (!userEmail) {
    showNotification("Không tìm thấy email người dùng. Vui lòng tải lại trang.", false, true);
    return;
  }

  if (modal.style.display === 'block' || modal.style.display === 'flex') {
    modal.style.display = 'none';
    document.body.style.overflow = '';
  } else {
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    if (!currentUserId) {
      showNotification('Đang tải thông tin...', true, false);
      google.script.run.withSuccessHandler(id => {
        currentUserId = id;
        hideNotification();
        checkUserInfoOrShowForm();
      }).getUserIdByEmail(userEmail);
    } else {
      checkUserInfoOrShowForm();
    }
  }
}

function checkUserInfoOrShowForm() {
  if (!currentUserId) {
    document.getElementById('pairForm').style.display = 'block';
    document.getElementById('pairMainButtons').style.display = 'none';
    return;
  }

  // 🔥 Nếu đã có cache → không gọi server nữa
  if (cachedUserInfo) {
    applyUserInfoToUI(cachedUserInfo);
    return;
  }

  showNotification('Đang tải thông tin người dùng...', true, false);
  google.script.run.withSuccessHandler(user => {
    hideNotification();
    cachedUserInfo = user;   // ⭐ lưu cache
    applyUserInfoToUI(user);
  }).getUserInfo(currentUserId);
}

function applyUserInfoToUI(user) {
  const form = document.getElementById('pairForm');
  // ❗ Xóa mainBtns vì UI mới không dùng mainBtns mà dùng Tabs
  const profileTab = document.getElementById('profileTabBtn');

  if (!user || !user.name || !user.school || !user.grade || !user.time || !user.goal) {
    form.style.display = 'block';
    form.classList.add('active');
    // Ẩn các section khác
    document.querySelectorAll('#pairingModal .section').forEach(s => {
      s.style.display = 'none';
      s.classList.remove('active');
    });
    // Active Profile Tab
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    if (profileTab) profileTab.classList.add('active');
  } else {
    // Nếu đã hoàn thiện profile -> Mặc định vào tab Available Users
    form.style.display = 'none';
    toggleSection('availableUsers');

    document.getElementById('pairName').value = user.name || '';
    document.getElementById('pairSchool').value = user.school || '';
    document.getElementById('pairGrade').value = user.grade || '';
    document.getElementById('pairPhone').value = user.phone || '';
    document.getElementById('pairFacebook').value = user.facebook || '';
    document.getElementById('pairGoal').value = user.goal || '';

    // 🔥 set lại checkbox thời gian
    setCheckedTimes(user.time);
  }

  loadAvailableUsers();
  loadIncomingRequests(user.pairStatus === 'matched');
  loadMatchedPartner();

  if (user.pairStatus === 'matched') {
    toggleSection('matchedPartner');
  }
}

  document.querySelectorAll('#pairTime input').forEach(cb => {
    cb.checked = times.includes(cb.value);
  });
}

function getSelectedTimes() {
  const checked = document.querySelectorAll('#pairTime input:checked');
  return Array.from(checked).map(cb => cb.value).join(', ');
}

function submitPairForm() {
  const userEmail = getUserEmail();

function getGradientForName(name) {
  const gradients = [
    ['#ec4899', '#f43f5e'],
    ['#8b5cf6', '#d946ef'],
    ['#3b82f6', '#60a5fa'],
    ['#10b981', '#34d399'],
    ['#f59e0b', '#fbbf24'],
    ['#06b6d4', '#2dd4bf']
  ];
  let h = 0;
  for(let i=0; i<(name||'').length; i++) h += name.charCodeAt(i);
  const colors = gradients[h % gradients.length];
  return `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
}

function requestPair(partnerId) {
  if (!currentUserId) return;

  showNotification('Đang kiểm tra trạng thái...', true, false);
  google.script.run.withSuccessHandler(user => {
    if (user.pairStatus === 'matched') {
      hideNotification();
      showNotification('Bạn đã ghép đôi, không thể gửi yêu cầu cho người khác.', false, true);
      return;
    }

    google.script.run.withSuccessHandler(currentCoin => {
      if (currentCoin < 1000) {
        hideNotification();
        showNotification('Bạn không đủ 1000 🪙 để gửi yêu cầu.', false, true);
        triggerStudentReliefIfEligible();
        return;
      }

      askUseCoin('Bạn có muốn sử dụng 1000 🪙 để gửi yêu cầu ghép đôi không?', () => {
        google.script.run.withSuccessHandler(newTotal => {
          if (newTotal === false) {
            hideNotification();
            showNotification('Lỗi khi trừ coin.', false, true);
            return;
          }

          updatePointDisplay(newTotal);

          showNotification('Đang gửi yêu cầu...', true, false);
          google.script.run.withSuccessHandler(success => {
            hideNotification();
            if (success) {
              showNotification('Yêu cầu đã gửi, chờ đối phương xác nhận.', false, true);
              cachedAvailableUsers = null;
              cachedIncomingRequests = null;
              loadAvailableUsers();
              loadIncomingRequests();
            } else {
              showNotification('Lỗi khi gửi yêu cầu.', false, true);
            }
          }).sendPairRequest(currentUserId, partnerId);
        }).deductUserPoints(1000, "Phí yêu cầu ghép đôi");
      }, hideNotification);
    }).getUserPoints();
  }).getUserInfo(currentUserId);
}

  // always hide form

    form.classList.remove('active');

  sections.forEach(sec => {

    sec.classList.remove('active');
  });
  
  if (selected) {
    selected.style.display = 'block';
    selected.classList.add('active');

document.addEventListener("DOMContentLoaded", function() {
  const DEFAULT_TARGET_DATE = "2026-12-26T00:00:00";
  const DEFAULT_TARGET_NAME = "🎯 HSG Quốc Gia 2026";
  
  let targetDateStr = getCleanLocalStorage("customCountdownDate") || DEFAULT_TARGET_DATE;

  const cdTitleEl = document.getElementById("cd-title-text");
  if (cdTitleEl) cdTitleEl.textContent = targetNameStr;

  let countdownInterval;

  function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    
    // Khôi phục lại HTML nếu đã hiện thông báo
    const countdownEl = document.getElementById("countdown");
    if (countdownEl && (countdownEl.innerHTML.includes("Tới ngày") || countdownEl.innerHTML.includes("ngày thi"))) {
        countdownEl.innerHTML = `
            <div class="cd-unit-box"><span class="cd-num" id="cd-days">0</span><span class="cd-unit-label">ngày</span></div>

            <span class="cd-colon">:</span>
            <div class="cd-unit-box"><span class="cd-num" id="cd-minutes">00</span><span class="cd-unit-label">phút</span></div>
            <span class="cd-colon">:</span>
            <div class="cd-unit-box"><span class="cd-num" id="cd-seconds">00</span><span class="cd-unit-label">giây</span></div>
        `;
    }

    countdownInterval = setInterval(function () {
      const cdEl = document.getElementById("countdown");
      if (!cdEl) return;

      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff < 0) {
        clearInterval(countdownInterval);
        cdEl.innerHTML = "<div style='display:flex;align-items:center;gap:8px;background:rgba(245,158,11,0.12);padding:8px 18px;border-radius:12px;color:#db6e42;font-weight:750;font-size:0.92rem;border:1px solid rgba(245,158,11,0.25);'><span style='font-size:1.2rem;'>🎉</span> <span>Đã tới ngày mục tiêu! Tự tin tỏa sáng nhé!</span></div>";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      const dEl = document.getElementById("cd-days");
      const hEl = document.getElementById("cd-hours");
      const mEl = document.getElementById("cd-minutes");
      const sEl = document.getElementById("cd-seconds");

      if (dEl) dEl.textContent = days;
      if (hEl) hEl.textContent = hours.toString().padStart(2, '0');
      if (mEl) mEl.textContent = minutes.toString().padStart(2, '0');
      if (sEl) sEl.textContent = seconds.toString().padStart(2, '0');
    }, 1000);
  }

  startCountdown();

  // Xử lý nút Tùy chỉnh đếm ngược
  const btnEditCd = document.getElementById("btn-edit-cd");
  const modalCdSettings = document.getElementById("cdSettingsModal");
  const btnCloseCdModal = document.getElementById("btn-close-cd-modal");
  const btnSaveCd = document.getElementById("btnSaveCd");
  const btnResetCd = document.getElementById("btnResetCd");

  const luckBox = document.getElementById("luckBox");
  const luckText = document.getElementById("luckText");
  const luckClose = document.getElementById("luckClose");
  const luckCloseIcon = document.getElementById("luckCloseIcon");
  const luckTitle = document.getElementById("luckTitle");
  const luckSubtitle = document.getElementById("luckSubtitle");
  const luckRefreshBtn = document.getElementById("luckRefreshBtn");
  const luckModalBackdrop = document.getElementById("luckModalBackdrop");

  let lastQuoteIndex = -1;

  function showLuckQuote() {
    let randIndex;
    do {
      randIndex = Math.floor(Math.random() * quotes.length);
    } while (quotes.length > 1 && randIndex === lastQuoteIndex);
    lastQuoteIndex = randIndex;

    const quoteStr = quotes[randIndex];
    if (luckTitle) luckTitle.textContent = "Thông Điệp Dành Cho Bạn";
    if (luckSubtitle) luckSubtitle.textContent = "Tiếp thêm năng lượng bình an & vững tin";
    
    if (luckBox) {
      const iconEl = luckBox.querySelector('.luck-modal-icon');
      if (iconEl) iconEl.textContent = "✨";
    }

    if (luckText) {
      luckText.innerHTML = `<p style="margin: 0; font-size: 1.02rem; line-height: 1.65; color: inherit; font-weight: 500;">${quoteStr}</p>`;
    }

    if (luckRefreshBtn) luckRefreshBtn.style.display = "inline-flex";
    if (luckClose) {
      const btnSpan = luckClose.querySelector('span') || luckClose;
      btnSpan.textContent = "Trân trọng & Cố gắng ✨";
    }

    if (luckBox) luckBox.style.display = "flex";
  }

  function showLuckFortune(fortuneObj) {

    if (luckClose) {

      btnSpan.textContent = "Đón nhận điều lành 🍀";
    }

    if (luckBox) luckBox.style.display = "flex";

  function showLuck(text, title = "Thông Điệp Dành Cho Bạn", icon = "✨", subtitle = "Tiếp thêm năng lượng bình an & vững tin") {
    if (luckText && luckBox) {
      luckText.innerHTML = text;
      if (luckTitle) luckTitle.textContent = title;
      if (luckSubtitle) luckSubtitle.textContent = subtitle;
      const iconEl = luckBox.querySelector('.luck-modal-icon');
      if (iconEl) iconEl.textContent = icon;
      if (luckRefreshBtn) luckRefreshBtn.style.display = "none";
      if (luckClose) {
        const btnSpan = luckClose.querySelector('span') || luckClose;
        btnSpan.textContent = "Đã hiểu ✨";
      }
      luckBox.style.display = "flex";
    }
  }

    btnQuote.onclick = () => {

    luckRefreshBtn.onclick = () => {

// Đếm ngược - rút quẻ - lời chúc



// Ẩn Thanh Header
const header = document.querySelector("header");

function toggleCompact() {
  document.body.classList.toggle("compact-header");
}

/* 👉 nút 📖 */
const focusToggleEl = document.querySelector(".focus-toggle");
if (focusToggleEl) {
  focusToggleEl.addEventListener("click", function(e) {
    e.stopPropagation();
    toggleCompact();
  });
}

/* 👉 click header để bung */
const headerContainerEl = document.querySelector("header");
if (headerContainerEl) {
  headerContainerEl.addEventListener("mousedown", function(e) {
    if (e.target.closest(".focus-toggle")) return;

    if (document.body.classList.contains("compact-header")) {
      e.preventDefault();

      setTimeout(() => {
        toggleCompact();
      }, 0); // 👈 đợi click hoàn tất
    }
  });
}
