function handleSStudentEvidenceUpload() {
  const fileInput = document.getElementById("sstudentEvidenceFile");
  const file = fileInput.files[0];
  if (!file) {
    showToast("❌ Vui lòng chọn file minh chứng!", "error");
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64Data = e.target.result.split(',')[1];
    const fileName = file.name;
    const contentType = file.type;
    
    // Disable button, show loading
    const submitBtn = document.getElementById("sstudentEvidenceSubmitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ Đang tải...";
    
    google.script.run
      .withSuccessHandler(function(res) {
        submitBtn.disabled = false;
        submitBtn.innerText = "Gửi Minh Chứng";
        if (res.success) {
          showToast("✅ " + res.message, "success");
          fileInput.value = "";
        } else {
          showToast("❌ " + res.message, "error");
        }
      })
      .withFailureHandler(function(err) {
        submitBtn.disabled = false;
        submitBtn.innerText = "Gửi Minh Chứng";
        showToast("❌ Lỗi: " + err, "error");
      })
      .uploadSStudentEvidence(base64Data, fileName, contentType);
  };
  reader.readAsDataURL(file);
}

function handleReasonChange() {
  const reason = document.getElementById("approvalReason").value;

  // Ẩn tất cả ô phụ trong VIP Form
  if (document.getElementById("fbLinkBox")) document.getElementById("fbLinkBox").style.display = "none";
  if (document.getElementById("supportEmailBox")) document.getElementById("supportEmailBox").style.display = "none";
  if (document.getElementById("otherReasonBox")) document.getElementById("otherReasonBox").style.display = "none";

  if (reason === "fan") {
    if (document.getElementById("fbLinkBox")) document.getElementById("fbLinkBox").style.display = "block";
    if (document.getElementById("otherReasonBox")) {
      document.getElementById("otherReasonBox").style.display = "block";
      document.getElementById("otherReason").placeholder = "📝 Ghi chú hoặc lý do khác...";
    }
  } else if (reason === "support") {
    if (document.getElementById("supportEmailBox")) document.getElementById("supportEmailBox").style.display = "block";
  } else if (reason === "other") {
    if (document.getElementById("otherReasonBox")) {
      document.getElementById("otherReasonBox").style.display = "block";
      document.getElementById("otherReason").placeholder = "📝 Mô tả lý do khác của bạn...";
    }
  }
}

function showErrorModal(message) {
  const modal = document.getElementById("errorModal");
  const msgBox = document.getElementById("errorModalMessage");
  msgBox.textContent = message || "Có lỗi xảy ra.";
  modal.style.display = "flex";
}

function closeErrorModal() {
  const modal = document.getElementById("errorModal");
  modal.style.display = "none";
}

function showPopup(title, message, buttonText, link) {
  // Nếu popup đã tồn tại thì xóa
  const oldPopup = document.getElementById("customPopup");
  if (oldPopup) oldPopup.remove();

  const popup = document.createElement("div");
  popup.id = "customPopup";
  popup.style.cssText = `
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 9999;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Poppins', sans-serif;
  `;

  popup.innerHTML = `
    <div style="
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 420px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      animation: fadeIn 0.3s ease;
      position: relative;
    ">
      <button onclick="document.getElementById('customPopup').remove()" class="modern-modal-close-btn" style="z-index: 10;">✕</button>
      <div style="font-size: 20px; font-weight: bold; margin-bottom: 12px;">${title}</div>
      <div style="margin-bottom: 20px; font-size: 16px;">${message}</div>
      <a href="${link}" target="_blank" style="
        background: #4caf50;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
      ">${buttonText}</a>
    </div>
  `;

  document.body.appendChild(popup);
}

let ads = [];

let currentAdIndex = 0;
let canClose = false;

function showAd(index) {
  if (typeof ads === 'undefined' || !ads || ads.length === 0) {
    const adPopup = document.getElementById("adPopup");
    if (adPopup) adPopup.style.display = "none";
    return;
  }
  if (index >= ads.length || index < 0) {
    currentAdIndex = 0;
    const adPopup = document.getElementById("adPopup");
    if (adPopup) adPopup.style.display = "none";
    return;
  }
  const ad = ads[index];
  if (!ad) {
    const adPopup = document.getElementById("adPopup");
    if (adPopup) adPopup.style.display = "none";
    return;
  }

  const adImage = document.getElementById("adImage");
  const ctaBtn = document.getElementById("ctaButton");
  const titleEl = document.getElementById("adTitle");
  const closeBtn = document.getElementById("closeAdBtn");
  const adPopup = document.getElementById("adPopup");
  const counterBadge = document.getElementById("adCounterBadge");
  const navDotsContainer = document.getElementById("adNavDots");

  if (adPopup) adPopup.style.display = "flex";

  if (counterBadge) {
    counterBadge.style.display = "none";
  }

  if (navDotsContainer) {
    if (ads.length > 1) {
      navDotsContainer.style.display = "flex";
      navDotsContainer.innerHTML = ads.map((_, i) => 
        `<span class="ad-dot ${i === index ? 'active' : ''}" onclick="goToAdIndex(${i})"></span>`
      ).join("");
    } else {
      navDotsContainer.style.display = "none";
      navDotsContainer.innerHTML = "";
    }
  }

  canClose = false;
  
  // 🛡️ Safety fallback: Nếu ảnh load quá lâu (> 3s), vẫn cho tắt
  setTimeout(() => {
    if (!canClose) {
      canClose = true;
      if (closeBtn) closeBtn.style.display = "flex";
    }
  }, 3000);

  if (adImage) {
    adImage.style.display = "block";
    adImage.style.opacity = 0;
  }
  if (closeBtn) closeBtn.style.display = "none"; // ẩn nút tắt trước khi ảnh load

  if (adImage) {
    adImage.onload = () => {
      adImage.style.opacity = 1;
      canClose = true;
      if (closeBtn) closeBtn.style.display = "flex"; // hiện nút tắt sau khi ảnh load
    };
    
    adImage.onerror = () => {
      adImage.style.display = "none";
      canClose = true;
      if (closeBtn) closeBtn.style.display = "flex";
    };

    adImage.src = ad.img;
  }

  if (ctaBtn) {
    ctaBtn.href = ad.link || "#";
    const btnTextSpan = ctaBtn.querySelector("span");
    if (btnTextSpan) {
      btnTextSpan.innerText = ad.buttonText || "Tìm hiểu ngay";
    } else {
      ctaBtn.innerText = ad.buttonText || "Tìm hiểu ngay";
    }
  }

  if (titleEl) {
    titleEl.innerText = ad.title || "";
  }
}

function goToAdIndex(index) {
  if (index >= 0 && index < ads.length) {
    currentAdIndex = index;
    showAd(currentAdIndex);
  }
}

function closePopup() {
  if (!canClose) return; // ❌ Không cho tắt nếu ảnh chưa load xong

  currentAdIndex++;
  if (currentAdIndex < ads.length) {
    showAd(currentAdIndex);
    document.getElementById("adPopup").style.display = "flex";
  } else {
    document.getElementById("adPopup").style.display = "none";
  }
}

</script>
