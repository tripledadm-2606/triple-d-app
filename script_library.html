<script>
// ========================
// 0. Purchased Files Logic
// ========================
function getPurchasedFiles() {
  const email = sessionStorage.getItem("userEmail") || "";
  if (!email) return [];
  const key = `tds_purchased_files_${email.toLowerCase().trim()}`;
  const migrationKey = `tds_migrated_5days_${email.toLowerCase().trim()}`;
  let purchased = (() => { try { return JSON.parse(getCleanLocalStorage(key) || "[]"); } catch(e) { return []; } })();
  
  const now = Date.now();
  let needsSave = false;

  // Cập nhật gia hạn 5 ngày cho các tài liệu đã mua trước bản cập nhật này
  if (!getCleanLocalStorage(migrationKey)) {
    purchased = purchased.map(f => {
      f.timestamp = now;
      return f;
    });
    localStorage.setItem(migrationKey, "true");
    needsSave = true;
  }
  
  const validPurchased = purchased.filter(f => {
    const time = f.timestamp || now; 
    return (now - time) <= 5 * 24 * 60 * 60 * 1000;
  });

  // Update local storage if expired items were removed or if we just migrated
  if (validPurchased.length !== purchased.length || needsSave) {
    localStorage.setItem(key, JSON.stringify(validPurchased));
  }
  return validPurchased;
}

function addPurchasedFile(fileId, title, type, folderName) {
  const email = sessionStorage.getItem("userEmail") || "";
  if (!email) return;
  const key = `tds_purchased_files_${email.toLowerCase().trim()}`;
  let purchased = (() => { try { return JSON.parse(getCleanLocalStorage(key) || "[]"); } catch(e) { return []; } })();
  if (!purchased.some(f => f.fileId === fileId)) {
    purchased.push({
      fileId: fileId,
      title: title,
      type: type, // "book" or "exam"
      folder: folderName,
      timestamp: Date.now()
    });
    localStorage.setItem(key, JSON.stringify(purchased));
  }
}

function checkStudentDailyLimitClient(email, fileId, folderName) {
  const role = (currentUserRole || "").toUpperCase().trim();
  if (role !== "STUDENT") {
    return { allowed: true };
  }

  const folderLower = (folderName || "").toLowerCase();
  const isStudentTagged = folderLower.includes("student");
  if (!isStudentTagged) {
    return { allowed: true };
  }

  if (isFilePurchased(fileId)) {
    return { allowed: true };
  }

  const todayStr = new Date().toLocaleDateString('en-CA');
  const key = `student_daily_purchases_${email.toLowerCase().trim()}`;
  let purchaseData = null;
  try {
    purchaseData = JSON.parse(getCleanLocalStorage(key) || "null");
  } catch (e) {}

  if (!purchaseData || purchaseData.date !== todayStr) {
    purchaseData = {
      date: todayStr,
      fileIds: []
    };
  }

  if (purchaseData.fileIds.includes(fileId)) {
    return { allowed: true };
  }

  const MAX_STUDENT_PURCHASES_PER_DAY = 36;
  if (purchaseData.fileIds.length >= MAX_STUDENT_PURCHASES_PER_DAY) {
    return {
      allowed: false,
      message: `⚠️ Giới hạn tài khoản STUDENT:\nMỗi ngày bạn chỉ được phép mở/mua tối đa ${MAX_STUDENT_PURCHASES_PER_DAY} tài liệu/sách có tag STUDENT.\nHôm nay bạn đã mở/mua đủ ${purchaseData.fileIds.length} tài liệu rồi. Vui lòng quay lại vào ngày mai!`
    };
  }

  return { allowed: true };
}

function logStudentDailyPurchaseClient(email, fileId, folderName) {
  const role = (currentUserRole || "").toUpperCase().trim();
  if (role !== "STUDENT") return;

  const folderLower = (folderName || "").toLowerCase();
  const isStudentTagged = folderLower.includes("student");
  if (!isStudentTagged) return;

  const todayStr = new Date().toLocaleDateString('en-CA');
  const key = `student_daily_purchases_${email.toLowerCase().trim()}`;
  let purchaseData = null;
  try {
    purchaseData = JSON.parse(getCleanLocalStorage(key) || "null");
  } catch (e) {}

  if (!purchaseData || purchaseData.date !== todayStr) {
    purchaseData = {
      date: todayStr,
      fileIds: []
    };
  }

  if (!purchaseData.fileIds.includes(fileId)) {
    purchaseData.fileIds.push(fileId);
    localStorage.setItem(key, JSON.stringify(purchaseData));
  }
}

function isFilePurchased(fileId) {
  // Đề thi thử không bao giờ thuộc hệ thống coin/mua đứt tự do
  if (typeof isMockExamFile === 'function' && isMockExamFile(fileId)) {
    return false;
  }
  const email = sessionStorage.getItem("userEmail") || "";
  if (!email) return false;
  const key = `tds_purchased_files_${email.toLowerCase().trim()}`;
  const purchased = (() => { try { return JSON.parse(getCleanLocalStorage(key) || "[]"); } catch(e) { return []; } })();
  return purchased.some(f => f.fileId === fileId);
}

let currentPurchasedCategory = "all"; // "all", "book", "exam"

function filterPurchasedByChip(category) {
  currentPurchasedCategory = category;
  
  document.querySelectorAll('.purchased-chip').forEach(chip => {
    chip.classList.remove('active');
  });
  const activeChip = document.getElementById(`chip-${category}`);
  if (activeChip) activeChip.classList.add('active');
  
  filterPurchased();
}

function filterPurchased() {
  const query = (document.getElementById("searchPurchasedInput")?.value || "").toLowerCase().trim();
  
  const filtered = allPurchased.filter(file => {
    if (currentPurchasedCategory !== "all" && file.type !== currentPurchasedCategory) {
      return false;
    }
    if (query) {
      return (file.title || "").toLowerCase().includes(query);
    }
    return true;
  });
  
  renderPurchasedListItems(filtered);
}

function getRentalTimeInfo(timestamp) {
  const now = Date.now();
  const time = timestamp || now;
  const elapsed = now - time;
  const total = 5 * 24 * 60 * 60 * 1000;
  const remainingMs = Math.max(0, total - elapsed);
  
  const totalHours = Math.ceil(remainingMs / (1000 * 60 * 60));
  const days = Math.floor(totalHours / 24);
  const hours = totalHours % 24;
  
  let label = "";
  if (remainingMs <= 0) {
    label = "Đã hết hạn";
  } else if (days > 0) {
    label = `Còn ${days}d ${hours > 0 ? hours + 'h' : ''}`;
  } else {
    label = `Còn ${hours}h`;
  }
  
  const percent = Math.min(100, Math.max(0, Math.round((remainingMs / total) * 100)));
  const isUrgent = totalHours <= 24;
  
  return { label, percent, isUrgent };
}

function getBookCoverTheme(file) {
  if (file.type === 'exam') {
    return {
      bg: 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)',
      badgeBg: 'rgba(234, 88, 12, 0.22)',
      badgeColor: '#fb923c',
      ribbonColor: '#f97316',
      border: 'rgba(234, 88, 12, 0.35)',
      icon: '📑',
      typeName: 'TÀI LIỆU'
    };
  }
  
  const palettes = [
    { bg: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)', badgeBg: 'rgba(56, 189, 248, 0.2)', badgeColor: '#38bdf8', ribbonColor: '#0284c7', border: 'rgba(56, 189, 248, 0.3)', icon: '📖', typeName: 'SÁCH' },
    { bg: 'linear-gradient(135deg, #064e3b 0%, #047857 100%)', badgeBg: 'rgba(52, 211, 153, 0.2)', badgeColor: '#34d399', ribbonColor: '#10b981', border: 'rgba(52, 211, 153, 0.3)', icon: '📚', typeName: 'SÁCH' },
    { bg: 'linear-gradient(135deg, #312e81 0%, #4338ca 100%)', badgeBg: 'rgba(165, 180, 252, 0.2)', badgeColor: '#a5b4fc', ribbonColor: '#6366f1', border: 'rgba(165, 180, 252, 0.3)', icon: '📕', typeName: 'SÁCH' },
    { bg: 'linear-gradient(135deg, #701a75 0%, #86198f 100%)', badgeBg: 'rgba(240, 171, 252, 0.2)', badgeColor: '#f0abfc', ribbonColor: '#c026d3', border: 'rgba(240, 171, 252, 0.3)', icon: '📙', typeName: 'SÁCH' },
    { bg: 'linear-gradient(135deg, #881337 0%, #9f1239 100%)', badgeBg: 'rgba(253, 164, 175, 0.2)', badgeColor: '#fda4af', ribbonColor: '#e11d48', border: 'rgba(253, 164, 175, 0.3)', icon: '📘', typeName: 'SÁCH' }
  ];
  
  let hash = 0;
  const str = file.title || file.fileId || "";
  for (let i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  const index = Math.abs(hash) % palettes.length;
  return palettes[index];
}

function loadPurchased() {
  allPurchased = getPurchasedFiles();
  return renderPurchasedList(allPurchased);
}

function renderPurchasedList(items) {
  setTimeout(() => {
    renderPurchasedListItems(items);
  }, 0);

  return `
    <div class="purchased-filter-chips">
      <div id="chip-all" class="purchased-chip active" onclick="filterPurchasedByChip('all')">🏷️ Tất cả</div>
      <div id="chip-book" class="purchased-chip" onclick="filterPurchasedByChip('book')">📚 Sách</div>
      <div id="chip-exam" class="purchased-chip" onclick="filterPurchasedByChip('exam')">📑 Tài liệu</div>
    </div>
    <div id="purchasedListItems" style="padding: 10px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: calc(100vh - 180px);">
    </div>
  `;
}

          <div class="tds-state-title" style="font-weight: 600; font-size: 1rem; margin-bottom: 4px;">Tủ sách trống</div>

            <div class="book-spine-crease"></div>
            <div class="book-ribbon" style="background: ${theme.ribbonColor};"></div>
            
            <div class="book-cover-inner">
              <div>
                <div class="book-type-badge" style="background: ${theme.badgeBg}; color: ${theme.badgeColor};">
                  <span>${theme.icon}</span> ${theme.typeName}
                </div>
                ${file.folder ? `<div class="book-folder-tag" title="${file.folder}">${file.folder}</div>` : ''}
              </div>

function openPurchasedItemDirectly(email, fileId, title, type = "book", folderName = "", btn) {
  showToast("🔍 Đang tìm vị trí gốc của tài liệu...");

  // Determinine Target View
  let targetView = type === 'exam' ? 'exams' : 'books';
  const folderLower = (folderName || "").toLowerCase();
  
  if (typeof isMockExamFile === 'function' && isMockExamFile(fileId, title, folderName, type)) {
    targetView = 'mockExams';
  } else if (folderLower.includes('khóa học') || type === 'video') {
    targetView = 'courses';
  }

  // Mở trực tiếp tài liệu như khi bấm xem bình thường
  openLibraryItemAcrossAll(targetView, fileId, false, btn);
}

function getRecentFilesStorageKey() {
  const email = (currentEmail || sessionStorage.getItem("userEmail") || getCleanLocalStorage("userEmail") || "").toLowerCase().trim();
  return email ? `tds_recent_files_${email}` : 'tds_recent_files';
}

function getFavoriteFilesStorageKey() {
  const email = (currentEmail || sessionStorage.getItem("userEmail") || getCleanLocalStorage("userEmail") || "").toLowerCase().trim();
  return email ? `tds_favorite_files_${email}` : 'tds_favorite_files';
}

function getRecentFilesData() {
  const key = getRecentFilesStorageKey();
  let data = getCleanLocalStorage(key);
  if (!data && key !== 'tds_recent_files') {
    const oldData = getCleanLocalStorage('tds_recent_files');
    if (oldData) {
      localStorage.setItem(key, oldData);
      data = oldData;
    }
  }
  try {
    return JSON.parse(data || '[]');
  } catch(e) {
    return [];
  }
}

function saveRecentFilesData(recent) {
  const key = getRecentFilesStorageKey();
  localStorage.setItem(key, JSON.stringify(recent));
}

function getFavoriteFilesData() {
  const key = getFavoriteFilesStorageKey();
  let data = getCleanLocalStorage(key);
  if (!data && key !== 'tds_favorite_files') {
    const oldData = getCleanLocalStorage('tds_favorite_files');
    if (oldData) {
      localStorage.setItem(key, oldData);
      data = oldData;
    }
  }
  try {
    return JSON.parse(data || '[]');
  } catch(e) {
    return [];
  }
}

function saveFavoriteFilesData(faves) {
  const key = getFavoriteFilesStorageKey();
  localStorage.setItem(key, JSON.stringify(faves));
}

// ========================
// 0. Recent Files Logic
// ========================
function addRecentFile(file) {
  let recent = getRecentFilesData();
  
  // Loại bỏ nếu đã tồn tại để đưa lên đầu
  recent = recent.filter(f => f.fileId !== file.fileId);
  
  // Thêm vào đầu mảng
  recent.unshift(file);
  
  // Chỉ giữ tối đa 10 tệp
  if (recent.length > 10) recent = recent.slice(0, 10);
  
  saveRecentFilesData(recent);
}

function renderRecentFiles() {
  const container = document.getElementById('recentFilesContainer');
  if (!container) return;
  
  const recent = getRecentFilesData();
  
  if (recent.length === 0) {
    container.innerHTML = `
      <div class="recent-empty-state">
        <div class="icon-wrapper">📁</div>
        <p>Bạn chưa mở tài liệu nào gần đây.</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = '';
  recent.forEach(file => {
    const item = document.createElement('div');
    item.className = 'recent-file-item';
    
    // Icon dựa trên type
    const category = file.category || (file.type === 'exam' ? 'exam' : 'book');
    const isMock = typeof isMockExamFile === 'function' && isMockExamFile(file.fileId, file.title, file.folder, category);
    const icon = category === 'course' ? '🎓' : (isMock ? '📝' : (category === 'exam' ? '📑' : '📚'));
    const categoryClass = category === 'course' ? 'course' : (isMock ? 'mock' : (category === 'exam' ? 'exam' : 'book'));
    
    // Định dạng thời gian
    const dateStr = new Date(file.timestamp).toLocaleString('vi-VN', { 
      hour: '2-digit', 
      minute: '2-digit',
      day: '2-digit',
      month: '2-digit'
    });

    item.onclick = () => {
      window.activeResourceFileId = file.fileId;
      if (isMock) {
        const p = switchView('mockExams');
        if (p) p.then((success) => {
          if (success !== false && currentView === 'mockExams') {
            viewMockExam({ fileId: file.fileId, title: file.title, type: file.type });
          }
        });
      } else if (category === 'course') {
        const p = switchView('courses');
        if (p) p.then((success) => {
          if (success !== false && currentView === 'courses') {
            readCourse(file.fileId, file.title, file.type, file.folder);
          }
        });
      } else {
        const p = switchView(category === 'exam' ? 'exams' : 'books');
        if (p) p.then((success) => {
          if (success !== false && (currentView === 'exams' || currentView === 'books')) {
            requestOpenBook(file.fileId, file.title, true, file.type, file.folder);
          }
        });
      }
    };

    item.innerHTML = `
      <div class="item-icon ${categoryClass}">${icon}</div>
      <div class="item-info">
        <div class="item-title" title="${file.title}">${file.title}</div>
        <div class="item-meta"><span>⏱️</span> ${dateStr}</div>
      </div>
    `;
    container.appendChild(item);
  });
}

let confirmActionCallback = null;
let confirmCancelCallback = null;

function showConfirmModal(titleOrOptions, msg, callback, icon = '🗑️', confirmText = 'Xác nhận', cancelText = 'Hủy bỏ', confirmType = '') {
  let title = "Xác nhận?";
  let message = "Bạn có chắc chắn muốn thực hiện hành động này không?";
  let onConfirm = null;
  let onCancel = null;
  let iconBadge = "❓";
  let btnConfirmText = "Xác nhận";
  let btnCancelText = "Hủy bỏ";
  let btnType = "";

  if (typeof titleOrOptions === "object" && titleOrOptions !== null) {
    title = titleOrOptions.title || title;
    message = titleOrOptions.message || titleOrOptions.msg || message;
    onConfirm = titleOrOptions.onConfirm || titleOrOptions.callback || null;
    onCancel = titleOrOptions.onCancel || null;
    iconBadge = titleOrOptions.icon || (titleOrOptions.type === 'primary' ? '✨' : (titleOrOptions.type === 'success' ? '✅' : '❓'));
    btnConfirmText = titleOrOptions.confirmText || btnConfirmText;
    btnCancelText = titleOrOptions.cancelText || btnCancelText;
    btnType = titleOrOptions.type || titleOrOptions.confirmType || "";
  } else if (typeof titleOrOptions === "function") {
    onConfirm = titleOrOptions;
    title = "Xác nhận hành động";
    message = "Bạn có muốn tiếp tục thực hiện không?";
    iconBadge = "✨";
    btnConfirmText = "Đồng ý";
    btnType = "primary";
  } else {
    title = titleOrOptions || title;
    message = msg || message;
    onConfirm = callback || null;
    iconBadge = icon || "🗑️";
    btnConfirmText = confirmText || "Xác nhận";
    btnCancelText = cancelText || "Hủy bỏ";
    btnType = confirmType || "";
  }

  // Auto-detect button theme/color if not explicitly set
  if (!btnType) {
    const titleLower = String(title).toLowerCase();
    const confirmLower = String(btnConfirmText).toLowerCase();
    if (iconBadge === '🗑️' || iconBadge === '💔' || titleLower.includes('xóa') || titleLower.includes('hủy') || titleLower.includes('từ chối') || titleLower.includes('reset') || titleLower.includes('thu hồi') || confirmLower.includes('xóa') || confirmLower.includes('hủy') || confirmLower.includes('từ chối')) {
      btnType = 'danger';
    } else if (iconBadge === '👑' || iconBadge === '✅' || iconBadge === '🎁' || titleLower.includes('phê duyệt') || titleLower.includes('nhận ngay') || confirmLower.includes('phê duyệt') || confirmLower.includes('nhận')) {
      btnType = 'success';
    } else if (iconBadge === '⚠️' || iconBadge === '🔥' || iconBadge === '⚡' || titleLower.includes('cảnh báo')) {
      btnType = 'warning';
    } else {
      btnType = 'primary';
    }
  }

  const modal = document.getElementById('confirmClearModal');
  if (!modal) return;

  const titleElem = document.getElementById('confirmModalTitle');
  const descElem = document.getElementById('confirmModalDesc');
  const iconElem = document.getElementById('confirmModalIcon');
  const confirmBtn = document.getElementById('confirmModalConfirmBtn') || modal.querySelector('.btn-confirm, .btn-confirm-danger, .btn-confirm-primary, .btn-confirm-success, .btn-confirm-warning, .btn-confirm-info');
  const cancelBtn = document.getElementById('confirmModalCancelBtn') || modal.querySelector('.btn-cancel');

  if (titleElem) titleElem.textContent = title;
  if (descElem) descElem.innerHTML = message.replace(/\n/g, '<br>');
  if (iconElem) iconElem.textContent = iconBadge;

  if (confirmBtn) {
    confirmBtn.textContent = btnConfirmText;
    if (btnType === 'danger') {
      confirmBtn.className = "btn-confirm-danger";
    } else if (btnType === 'success') {
      confirmBtn.className = "btn-confirm-success";
    } else if (btnType === 'warning') {
      confirmBtn.className = "btn-confirm-warning";
    } else if (btnType === 'info') {
      confirmBtn.className = "btn-confirm-info";
    } else {
      confirmBtn.className = "btn-confirm-primary";
    }
  }

  if (cancelBtn) {
    cancelBtn.textContent = btnCancelText;
  }

  confirmActionCallback = onConfirm;
  confirmCancelCallback = onCancel;
  modal.style.display = 'flex';
  document.body.classList.add('modal-open');

  setTimeout(() => {
    if (confirmBtn) confirmBtn.focus();
  }, 50);
}

// ========================
// Mock Exam File Verification Helper
// ========================
function isMockExamFile(fileId, title, folderName, category) {
  const c = String(category || "").toLowerCase().trim();
  
  // 1. Kiểm tra chính xác qua danh sách toàn cục trước để tránh nhầm lẫn
  // Nếu thuộc khóa học (video), sách, đề thi thường thì không phải thi thử
  if (typeof allCourses !== 'undefined' && Array.isArray(allCourses)) {
    if (allCourses.some(x => String(x.fileId).trim() === String(fileId).trim())) return false;
  }
  if (typeof allBooks !== 'undefined' && Array.isArray(allBooks)) {
    if (allBooks.some(x => String(x.fileId).trim() === String(fileId).trim())) return false;
  }
  if (typeof allExams !== 'undefined' && Array.isArray(allExams)) {
    if (allExams.some(x => String(x.fileId).trim() === String(fileId).trim())) return false;
  }

  // Nếu thuộc danh sách thi thử thì chắc chắn là thi thử
  if (typeof allMockExams !== 'undefined' && Array.isArray(allMockExams)) {
    if (allMockExams.some(x => String(x.fileId).trim() === String(fileId).trim())) return true;
  }

  // 2. Nếu không tìm thấy trong danh sách, kiểm tra qua category
  if (c === "course" || c === "video" || c === "book" || c === "exam") return false;
  if (c === "mockexam") return true;

  // 3. Fallback: Kiểm tra folder và tiêu đề
  const f = String(folderName || "").toLowerCase().trim();
  const t = String(title || "").toLowerCase().trim();
  
  if (f === "đề thi thử" || f.includes("thi thử") || f.includes("khảo thí")) return true;
  if (t.includes("đề thi thử") || t.includes("dethi_thu") || t.includes("dethithu") || t.includes("khảo thí")) return true;
  
  return false;
}

          if (success !== false && currentView === 'mockExams') {
            viewMockExam({ fileId: file.fileId, title: file.title, type: file.type });

        });
      } else if (category === 'course') {

            readCourse(file.fileId, file.title, file.type, file.folder);

      } else {

          if (success !== false && (currentView === 'exams' || currentView === 'books')) {

/* ================= COIN FORMATTING ================= */
let currentUserPoints = 0;

function formatCoin(num) {
  if (num === null || num === undefined) return "0";
  const n = Number(num);
  if (isNaN(n)) return "0";

  if (n < 1000) return n.toString();
  
  if (n < 1000000) {
    const k = n / 1000;
    if (n % 1000 === 0) return Math.floor(k) + "K";
    // For values like 1500 -> 1K5
    const integerPart = Math.floor(k);
    const remainder = Math.floor((n % 1000) / 100);
    return remainder > 0 ? integerPart + "K" + remainder : integerPart + "K";
  }
  
  const m = n / 1000000;
  if (n % 1000000 === 0) return Math.floor(m) + "M";
  const integerPart = Math.floor(m);
  const remainder = Math.floor((n % 1000000) / 100000);
  return remainder > 0 ? integerPart + "M" + remainder : integerPart + "M";
}

function getNextSeasonResetInfo() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const q = Math.floor(month / 3) + 1; // 1, 2, 3, 4
  
  let nextQ = q + 1;
  let nextYear = year;
  if (nextQ > 4) {
    nextQ = 1;
    nextYear++;
  }
  
  let nextMonth = (nextQ - 1) * 3;
  const nextResetDate = new Date(nextYear, nextMonth, 1);
  const diffMs = nextResetDate - now;
  const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
  
  return {
    date: nextResetDate,
    daysLeft: days,
    text: `Mùa mới khởi tranh sau: ${days} ngày (1/${nextMonth + 1}/${nextYear})`
  };
}

function updatePointDisplay(newPoint) {
  const endVal = Number(newPoint);
  const startVal = Number(currentUserPoints) || endVal;
  currentUserPoints = endVal;

  const pointDisplay = document.getElementById("userPoint");
  if (pointDisplay) {
    if (startVal !== endVal) {
      const duration = 800;
      const startTime = performance.now();
      const isAdding = endVal > startVal;
      
      pointDisplay.classList.remove('coin-add-anim', 'coin-sub-anim');
      void pointDisplay.offsetWidth; // trigger reflow
      pointDisplay.classList.add(isAdding ? 'coin-add-anim' : 'coin-sub-anim');
      
      const updateCounter = (currentTime) => {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = Math.sin(progress * Math.PI / 2); // easeOutSine
        const currentVal = Math.round(startVal + (endVal - startVal) * easeProgress);
        
        pointDisplay.innerHTML = `<span class="coin-emoji">🪙</span><span class="coin-value">${formatCoin(currentVal)}</span>`;
        
        if (progress < 1) {
          requestAnimationFrame(updateCounter);
        } else {
          pointDisplay.innerHTML = `<span class="coin-emoji">🪙</span><span class="coin-value">${formatCoin(endVal)}</span>`;
        }
      };
      requestAnimationFrame(updateCounter);
    } else {
      pointDisplay.innerHTML = `<span class="coin-emoji">🪙</span><span class="coin-value">${formatCoin(endVal)}</span>`;
    }
    
    // Thêm tooltip reset theo mùa
    const info = getNextSeasonResetInfo();
    pointDisplay.title = `${info.text} - Bấm để xem Bảng Xếp Hạng`;
  }
  
  const seasonText = document.getElementById("seasonText");
  if (seasonText) {
    seasonText.textContent = getNextSeasonResetInfo().text;
  }
  
  const overviewCoin = document.getElementById("overviewCoin");
  if (overviewCoin) overviewCoin.innerText = endVal.toLocaleString();
  
  const modalCoin = document.getElementById("modalCoinBalance");
  if (modalCoin) modalCoin.textContent = Number(newPoint).toLocaleString();

  const taixiuPoints = document.getElementById("userPoints");
  if (taixiuPoints) {
    taixiuPoints.textContent = `🪙 Coin của bạn: ${Number(newPoint).toLocaleString()}`;
  }
}

// Helper to format ms to hh:mm:ss
function formatTimeHMS(ms) {
  if (isNaN(ms) || ms < 0) return '00:00:00';
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  
  const pad = (num) => String(num).padStart(2, '0');
  return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
}

  if (studyInterval) {
    updateStudyTime(); // Lưu thời gian tích lũy trước khi reset
    clearInterval(studyInterval);
  }
  studyStartTime = Date.now();
  studyInterval = setInterval(() => {
    updateStudyTime();
  }, 10000); // Kiểm tra mỗi 10 giây để đảm bảo độ chính xác
  
  updateLiveStudyTimerUI();
}

function updateStudyTime() {
  if (!studyStartTime) return;
  const now = Date.now();
  const elapsedMs = now - studyStartTime;
  studyStartTime = now; // Reset mốc bắt đầu ngay lập tức
  
  pendingStudyMs += elapsedMs;
  localStorage.setItem('tds_pending_study_ms', pendingStudyMs); // Cập nhật liên tục

  // Nếu tích lũy đủ 60.000ms (1 phút)
  if (pendingStudyMs >= 60000) {
    const minutesToIncrement = Math.floor(pendingStudyMs / 60000);
    pendingStudyMs = pendingStudyMs % 60000; // Giữ lại phần dư

    const tracker = getLearningData();
    const today = new Date().toLocaleDateString('en-CA');
    
    if (!tracker.timeHistory) tracker.timeHistory = {};
    if (!tracker.timeHistory[today]) tracker.timeHistory[today] = 0;
    
    tracker.timeHistory[today] += minutesToIncrement;
    tracker.totalTime = (tracker.totalTime || 0) + minutesToIncrement;
    
    localStorage.setItem('tds_learning_tracking', JSON.stringify(tracker));
    
    if (currentView === 'overview') {
      updateLearningDashboardUI();
    }
  }
}

function stopStudyTimer() {
  updateStudyTime();
  if (studyInterval) {
    clearInterval(studyInterval);
    studyInterval = null;
  }
  studyStartTime = null;
  // pendingStudyMs vẫn giữ nguyên để cộng dồn vào lần học tiếp theo nếu chưa đủ 1 phút
  
  updateLiveStudyTimerUI();
}

function getLearningData() {
  const now = new Date();
  const raw = getCleanLocalStorage('tds_learning_tracking');
  let data = raw ? JSON.parse(raw) : {};

  // Khởi tạo các mảng/object nếu chưa có
  if (!data.history) data.history = {};
  if (!data.readFiles) data.readFiles = [];
  if (!data.timeHistory) data.timeHistory = {};
  if (!data.subjects) {
    data.subjects = {
      'Tế Bào': 0,
      'Vi Sinh vật': 0,
      'Sinh Lý Thực Vật': 0,
      'Sinh Lý Động Vật': 0,
      'Di Truyền Học': 0,
      'Tiến Hóa - HTH - Tập Tính': 0,
      'Sinh Thái Học': 0
    };
  }

  // 📅 LOGIC RESET THEO TUẦN (Mốc xóa: Thứ 2 đầu tuần)
  // Tính số tuần ISO (hoặc đơn giản là dùng mốc thời gian)
  // Ở đây dùng mốc ngày dựa trên "Monday of the week"
  function getMonday(d) {
    d = new Date(d);
    var day = d.getDay(),
        diff = d.getDate() - day + (day == 0 ? -6 : 1); // Adjust when day is sunday
    const monday = new Date(d.setDate(diff));
    monday.setHours(0, 0, 0, 0);
    return monday.getTime();
  }

  const currentMonday = getMonday(now);
  const lastResetMonday = Number(getCleanLocalStorage('tds_last_weekly_reset') || 0);

  if (currentMonday > lastResetMonday) {
    // Chỉ cập nhật mốc reset mới, không xóa XP
    localStorage.setItem('tds_last_weekly_reset', currentMonday);
  }

  return data;
}

function trackLearning(folderName, fileId = null) {
  const today = new Date().toLocaleDateString('en-CA');
  const trackingData = getLearningData();
  
  if (!trackingData.history[today]) {
    trackingData.history[today] = 0;
  }
  trackingData.history[today] += 1;
  
  if (fileId && !trackingData.readFiles.includes(fileId)) {
    trackingData.readFiles.push(fileId);
  }
  
  const docsElem = document.getElementById("overviewDocs");
  if (docsElem) {
     docsElem.innerText = trackingData.readFiles.length;
  }
  
  const folder = (folderName || '').toLowerCase();
  let subjectUpdated = false;
  
  if (folder.includes('tế bào') || folder.includes('te bao')) {
    trackingData.subjects['Tế Bào'] = (trackingData.subjects['Tế Bào'] || 0) + 15;
    subjectUpdated = true;
  }
  if (folder.includes('vi sinh')) {
    trackingData.subjects['Vi Sinh vật'] = (trackingData.subjects['Vi Sinh vật'] || 0) + 15;
    subjectUpdated = true;
  }
  if (folder.includes('thực vật') || folder.includes('thuc vat')) {
    trackingData.subjects['Sinh Lý Thực Vật'] = (trackingData.subjects['Sinh Lý Thực Vật'] || 0) + 15;
    subjectUpdated = true;
  }
  if (folder.includes('động vật') || folder.includes('dong vat')) {
    trackingData.subjects['Sinh Lý Động Vật'] = (trackingData.subjects['Sinh Lý Động Vật'] || 0) + 15;
    subjectUpdated = true;
  }
  if (folder.includes('di truyền') || folder.includes('di truyen')) {
    trackingData.subjects['Di Truyền Học'] = (trackingData.subjects['Di Truyền Học'] || 0) + 15;
    subjectUpdated = true;
  } 
  if (folder.includes('tiến hóa') || folder.includes('hệ thống') || folder.includes('tập tính')) {
    trackingData.subjects['Tiến Hóa - HTH - Tập Tính'] = (trackingData.subjects['Tiến Hóa - HTH - Tập Tính'] || 0) + 15;
    subjectUpdated = true;
  } 
  if (folder.includes('sinh thái') || folder.includes('sinh thai')) {
    trackingData.subjects['Sinh Thái Học'] = (trackingData.subjects['Sinh Thái Học'] || 0) + 15;
    subjectUpdated = true;
  }
  
  if (!subjectUpdated) {
    const subjects = ['Tế Bào', 'Vi Sinh vật', 'Sinh Lý Thực Vật', 'Sinh Lý Động Vật', 'Di Truyền Học', 'Tiến Hóa - HTH - Tập Tính', 'Sinh Thái Học'];
    const randomSubj = subjects[Math.floor(Math.random() * subjects.length)];
    trackingData.subjects[randomSubj] = (trackingData.subjects[randomSubj] || 0) + 5;
  }
  
  localStorage.setItem('tds_learning_tracking', JSON.stringify(trackingData));
  
  if (currentView === 'overview') {
    updateLearningDashboardUI();
  }
}

      'Vi Sinh vật': '🦠',
      'Sinh Lý Thực Vật': '🌿',

    const totalSubjectKeys = Object.keys(subjects).length;
    if (subjectCountBadge && totalSubjectKeys > 0) {
      subjectCountBadge.textContent = `${totalSubjectKeys} Chuyên đề`;
    }
    
    let maxProgress = 100;
    for (const score of Object.values(subjects)) {
      if (score > maxProgress) maxProgress = score;
    }
    
    for (const [subj, progress] of Object.entries(subjects)) {
      const widthPercent = Math.min(100, Math.round((progress / maxProgress) * 100));
      const color = subjectColors[subj] || '#10b981';
      const icon = subjectIcons[subj] || '📚';
      const html = `

            </div>
          </div>
        </div>
      `;
      subjectContainer.insertAdjacentHTML('beforeend', html);
    }
  }
  
  // 2. Cập nhật Biểu đồ 7 ngày và Mục tiêu
  const chartContainer = document.querySelector('.bar-chart');
  const timeHistory = trackingData.timeHistory || {};
  
  if (chartContainer) {
    chartContainer.innerHTML = '';
    const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
    
    // Tạo mảng 7 ngày qua
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toLocaleDateString('en-CA');
      const minsToday = timeHistory[dateStr] || 0;
      
      let dayName = dayNames[d.getDay()];
      const isToday = (i === 0);
      if (isToday) dayName = 'HN';
      
      // Format tooltip
      let formattedTime = minsToday + ' phút';
      if (minsToday >= 60) {
        const h = Math.floor(minsToday / 60);
        const m = minsToday % 60;
        formattedTime = m > 0 ? `${h}h${m}p` : `${h}h`;
      }
      
      // Chiều cao tương ứng với mục tiêu 6h (360p)
      const heightPercent = Math.min(100, Math.max(minsToday > 0 ? 8 : 2, (minsToday / 360) * 100));
      const isActive = minsToday > 0 ? 'active' : '';
      const todayClass = isToday ? 'is-today' : '';
      
      const html = `
        <div class="bar-col ${todayClass}" data-tooltip="${dayName}: ${formattedTime}">
          <div class="bar-wrapper">
            <div class="bar ${isActive}" style="height: ${heightPercent}%;"></div>
          </div>
          <span class="bar-label">${dayName}</span>

      chartContainer.insertAdjacentHTML('beforeend', html);

  const goalCircle = document.querySelector('.circle-progress');

  const goalSubtitle = document.querySelector('.dashboard-subtitle');
  
  if (goalCircle && goalText && goalSubtitle) {

    const todayMins = timeHistory[today] || 0;
    
    const percent = Math.min(100, Math.round((todayMins / dailyGoalMins) * 100));
    
    let todayTimeText = todayMins + 'p';

      const hours = Math.floor(todayMins / 60);

  const overviewStreakElem = document.getElementById('overviewStreak');

    try {
      localStorage.setItem('tds_sidebar_collapsed', isCollapsed ? 'true' : 'false');
    } catch(e) {}

    setTimeout(() => {

    }, 360);
  }

// Khôi phục trạng thái thu gọn sidebar từ localStorage khi khởi động
(function restoreSidebarState() {
  try {
    const saved = getCleanLocalStorage('tds_sidebar_collapsed');
    if (saved === 'true') {
      const initCheck = setInterval(() => {
        const sidebar = document.getElementById('mainSidebar');
        if (sidebar) {
          sidebar.classList.add('sidebar-collapsed');
          clearInterval(initCheck);
        }
      }, 50);

    }
  } catch(e) {}

function toggleStudyMenu() {
  const submenu = document.getElementById('studySubmenu');
  const group = document.getElementById('studyGroup');
  if (!submenu || !group) return;
  
  const isOpen = group.classList.contains('open');
  if (isOpen) {
    submenu.style.maxHeight = '0px';
    group.classList.remove('open');
  } else {
    submenu.style.maxHeight = '500px';
    group.classList.add('open');
  }
}

function updateNavActiveState(mode) {
  // Bỏ active tất cả nav-item và nav-subitem
  document.querySelectorAll('.sidebar-nav .nav-item, .sidebar-nav .nav-subitem').forEach(el => {
    el.classList.remove('active');
  });

  // Tìm và kích hoạt mục tương ứng
  const targetSub = document.querySelector(`.sidebar-nav .nav-subitem[data-view="${mode}"]`);
  if (targetSub) {
    targetSub.classList.add('active');
    // Mở rộng submenu cha
    const submenu = document.getElementById('studySubmenu');
    const group = document.getElementById('studyGroup');
    if (submenu && group && !group.classList.contains('open')) {
      submenu.style.maxHeight = '500px';
      group.classList.add('open');
    }
  } else {
    const targetItem = document.querySelector(`.sidebar-nav .nav-item[data-view="${mode}"]`);
    if (targetItem) {
      targetItem.classList.add('active');
    }
  }
}

function switchView(mode) {
  if (typeof window.resetGlobalDocumentLoading === 'function') {
    window.resetGlobalDocumentLoading();
  }
  if (typeof dismissVideoFullscreenPrompt === 'function') {
    dismissVideoFullscreenPrompt();
  }
  window.switchView = switchView;
  window.lastKnownView = mode;
  document.body.classList.remove("static-watermarks");
  document.body.classList.remove("video-active");
  if (typeof removeVideoQrOverlay === 'function') removeVideoQrOverlay();
  // Kiểm tra quyền truy cập vào phần khóa học / khảo thí (chỉ STUDENT, S-STUDENT, O-STUDENT, ADMIN)
  if (mode === "courses" || mode === "mockExams") {
    const role = (currentUserRole || "").toUpperCase().trim();
    if (role !== "STUDENT" && role !== "S-STUDENT" && role !== "O-STUDENT" && role !== "ADMIN") {
      guiYeuCauXetDuyet();
      showToast("Vui lòng đăng ký khóa học để truy cập tính năng này.", "warning");

        updateNavActiveState(currentView);

      return Promise.resolve(false);

        "warning"
      );
      showToast("⚠️ Khảo Thí chỉ hỗ trợ trên máy tính (PC / Laptop).", "error");
      if (currentView && currentView !== "mockExams") {
        updateNavActiveState(currentView);

/**
 * Làm cho một element có thể kéo thả mượt mà trên màn hình (Pointer events)
 * @param {HTMLElement} el - Element nhận sự kiện kéo
 * @param {Function} onEnd - Callback khi nhả chuột, trả về moved
 * @param {HTMLElement} moveEl - Element thực tế sẽ di chuyển (mặc định là el)
 */
function makeElementDraggable(el, onEnd, moveEl) {
    let isDragging = false;
    let startX, startY;
    let startLeft, startTop;
    let moved = false;
    let rafId = null;
    const target = moveEl || el;

    const handleStart = (e) => {
        isDragging = true;
        moved = false;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        startX = clientX;
        startY = clientY;
        
        const rect = target.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        
        target.style.transition = 'none';
        el.style.cursor = 'grabbing';
        
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleTouchMove, { passive: false });
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);
    };

    const handleTouchMove = (e) => {
        if (isDragging) {
            if (e.cancelable) e.preventDefault();
            handleMove(e);
        }
    };

    const handleMove = (e) => {
        if (!isDragging) return;
        
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const dx = clientX - startX;
        const dy = clientY - startY;
        
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            moved = true;
        }

        if (moved) {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
                let newLeft = startLeft + dx;
                let newTop = startTop + dy;
                
                const maxLeft = window.innerWidth - target.offsetWidth;
                const maxTop = window.innerHeight - target.offsetHeight;
                
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                
                target.style.left = newLeft + 'px';
                target.style.top = newTop + 'px';
                target.style.right = 'auto';
                target.style.bottom = 'auto';
                target.style.transform = 'none';
                
                // Đồng bộ panel đi kèm nếu là toolbox
                if (el.id === "toolboxToggle") {
                    const panel = document.getElementById("toolboxPanel");
                    if (panel) {
                        panel.style.right = (window.innerWidth - newLeft - target.offsetWidth) + 'px';
                        panel.style.bottom = (window.innerHeight - newTop + 10) + 'px';
                        panel.style.left = 'auto';
                    }
                }
            });
        }
    };

    const handleEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        el.style.cursor = '';
        if (rafId) cancelAnimationFrame(rafId);
        
        window.removeEventListener('mousemove', handleMove);
        window.removeEventListener('touchmove', handleTouchMove);
        window.removeEventListener('mouseup', handleEnd);
        window.removeEventListener('touchend', handleEnd);
        
        if (onEnd) onEnd(moved);
    };

    el.addEventListener('mousedown', handleStart);
    el.addEventListener('touchstart', handleStart, { passive: true });
}

function startPeriodicShareMonitor() {
  if (window.screenShareNotRequired) return;

      clearInterval(shareMonitorInterval);

      renderShareErrorUI("closed");
      clearInterval(shareMonitorInterval);
      shareMonitorInterval = null;
