<script>
// =========================================================================
// QUẢN LÝ BANNER AD QUẢNG CÁO ADMIN (SHEETS BANNERS)
// =========================================================================
let adminBannersCache = [];
let adminBannerSheetUrl = "";

function loadAdminBannersList() {
  const container = document.getElementById("adminBannersGrid");
  if (container) {
    container.innerHTML = `
      <div style="grid-column: 1 / -1; background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 48px 20px; text-align: center; color: #94a3b8;">
        <div class="admin-spinner" style="width: 32px; height: 32px; border: 3px solid rgba(148, 163, 184, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;"></div>
        <div style="font-weight: 600; font-size: 0.9rem;">Đang tải danh sách Banner...</div>
      </div>
    `;
  }

  if (!window.google || !google.script || !google.script.run) return;

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        if (container) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 16px; padding: 24px; text-align: center; color: #f87171; font-weight: 700;">
              ❌ Lỗi: ${res ? res.message : "Không tải được danh sách banner"}
            </div>
          `;
        }
        return;
      }
      adminBannersCache = res.banners || [];
      adminBannerSheetUrl = res.sheetUrl || "";
      renderAdminBannersList(adminBannersCache);
    })
    .withFailureHandler(function(err) {
      if (container) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 16px; padding: 24px; text-align: center; color: #f87171; font-weight: 700;">
            ❌ Lỗi máy chủ: ${err.message || err}
          </div>
        `;
      }
    })
    .getAllBannersAdmin();
}

function renderAdminBannersList(banners) {
  const container = document.getElementById("adminBannersGrid");
  const totalCountEl = document.getElementById("adminBannerTotalCount");
  const activeCountEl = document.getElementById("adminBannerActiveCount");
  const inactiveCountEl = document.getElementById("adminBannerInactiveCount");

  if (!container) return;

  if (!banners || banners.length === 0) {
    if (totalCountEl) totalCountEl.innerText = "0";
    if (activeCountEl) activeCountEl.innerText = "0";
    if (inactiveCountEl) inactiveCountEl.innerText = "0";

    container.innerHTML = `
      <div style="grid-column: 1 / -1; background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%); border: 1px solid rgba(6, 182, 212, 0.25); border-radius: 20px; padding: 48px 20px; text-align: center; color: #f8fafc; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
        <div style="font-size: 2.8rem; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(6,182,212,0.4));">📢</div>
        <h4 style="margin: 0 0 8px 0; color: #f8fafc; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.2px;">Chưa có Banner Quảng Cáo nào</h4>
        <p style="margin: 0 0 22px 0; color: #94a3b8; font-size: 0.88rem;">Nhấn nút bên dưới để khởi tạo banner popup đầu tiên cho ứng dụng.</p>
        <button onclick="openAdminBannerFormModal()" style="padding: 11px 24px; background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.88rem; box-shadow: 0 4px 16px rgba(37,99,235,0.4), 0 0 12px rgba(6,182,212,0.25);">➕ Thêm Banner Mới</button>
      </div>
    `;
    return;
  }

  let activeCount = 0;
  let inactiveCount = 0;

  banners.forEach(b => {
    const isHide = b.status === 'INACTIVE' || b.status === 'ẨN' || b.status === 'OFF';
    if (isHide) inactiveCount++; else activeCount++;
  });

  if (totalCountEl) totalCountEl.innerText = banners.length;
  if (activeCountEl) activeCountEl.innerText = activeCount;
  if (inactiveCountEl) inactiveCountEl.innerText = inactiveCount;

  let html = "";
  banners.forEach((b, idx) => {
    const isHide = b.status === 'INACTIVE' || b.status === 'ẨN' || b.status === 'OFF';
    const safeTitle = (b.title || "Banner Quảng Cáo").replace(/"/g, '&quot;');
    const safeLink = (b.link || "#").replace(/"/g, '&quot;');
    const safeBtn = (b.buttonText || "Tìm hiểu ngay").replace(/"/g, '&quot;');
    const bannerImg = b.img || 'https://via.placeholder.com/400x220?text=No+Image';

    html += `
      <div style="background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%); border: 1px solid rgba(6, 182, 212, 0.25); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #f8fafc;" class="admin-banner-card">
        
        <!-- Image Preview Box -->
        <div style="position: relative; width: 100%; height: 180px; background: #050811; overflow: hidden; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <img src="${bannerImg}" alt="Banner Preview" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onerror="this.src='https://via.placeholder.com/400x220?text=L%E1%BB%97i+T%E1%BA%A3i+%E1%BA%A2nh'">
          
          <!-- Order Badge -->
          <div style="position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #38bdf8; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.5px; border: 1px solid rgba(56, 189, 248, 0.35); font-family: monospace;">
            #${b.order || (idx + 1)}
          </div>

          <!-- Status Badge -->
          <div style="position: absolute; top: 12px; right: 12px;">
            ${isHide 
              ? `<span style="background: rgba(30, 41, 59, 0.9); color: #cbd5e1; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 0.72rem; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px);">⚪ TẠM ẨN</span>`
              : `<span style="background: rgba(20, 83, 45, 0.9); color: #4ade80; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 0.72rem; border: 1px solid rgba(74, 222, 128, 0.4); backdrop-filter: blur(8px); box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);">🟢 HOẠT ĐỘNG</span>`
            }
          </div>
        </div>

        <!-- Card Content Body -->
        <div style="padding: 18px; flex: 1; display: flex; flex-direction: column; gap: 12px;">
          <!-- Title -->
          <h4 style="margin: 0; color: #f8fafc; font-size: 0.95rem; font-weight: 800; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" title="${safeTitle}">
            ${safeTitle}
          </h4>

          <!-- Target Link -->
          <div style="background: rgba(9, 13, 22, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 6px; overflow: hidden; width: 100%;">
              <span style="font-size: 0.85rem; flex-shrink: 0;">🔗</span>
              <a href="${safeLink}" target="_blank" style="color: #38bdf8; font-size: 0.8rem; font-weight: 600; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${safeLink}">
                ${safeLink}
              </a>
            </div>
          </div>

          <!-- Button Text Badge -->
          <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: #94a3b8; margin-top: auto; padding-top: 4px;">
            <span style="font-weight: 700;">Nút bấm CTA:</span>
            <span style="background: rgba(2, 132, 199, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: 0.75rem;">
              ${safeBtn} ➔
            </span>
          </div>
        </div>

        <!-- Card Footer Actions -->
        <div style="padding: 12px 18px; background: rgba(15, 23, 42, 0.6); border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <div style="display: flex; gap: 8px;">
            <button onclick="previewSingleAd('${b.id}')" style="padding: 7px 14px; background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.4); border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;" title="Xem thử hiển thị Popup">
              <span>👁️ Xem thử</span>
            </button>
            <button onclick="openAdminBannerFormModal('${b.id}')" style="padding: 7px 14px; background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.4); border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;">
              <span>✏️ Sửa</span>
            </button>
          </div>
          <button onclick="deleteAdminBanner('${b.id}')" style="padding: 7px 12px; background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;">
            <span>🗑️ Xóa</span>
          </button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function previewSingleAd(bannerId) {
  if (!bannerId) return;
  const b = adminBannersCache.find(x => x.id === bannerId);
  if (!b) return;

  const idx = ads.findIndex(x => x.id === bannerId);
  if (idx >= 0) {
    currentAdIndex = idx;
    showAd(currentAdIndex);
  } else {
    ads.push(b);
    currentAdIndex = ads.length - 1;
    showAd(currentAdIndex);
  }
}

function openAdminBannerSheet() {
  if (adminBannerSheetUrl) {
    window.open(adminBannerSheetUrl, "_blank");
  } else {
    if (typeof showToast === 'function') {
      showToast("⚠️ Chưa có URL Google Sheet!", "warning");
    } else if (typeof showNotification === 'function') {
      showNotification("⚠️ Chưa có URL Google Sheet!", "warning");
    }
  }
}

function openAdminBannerFormModal(bannerId = null) {
  const modal = document.getElementById("adminBannerModal");
  if (!modal) return;

  const formId = document.getElementById("banner_form_id");
  const formTitle = document.getElementById("banner_form_title");
  const formImg = document.getElementById("banner_form_img");
  const formLink = document.getElementById("banner_form_link");
  const formBtn = document.getElementById("banner_form_btn");
  const formOrder = document.getElementById("banner_form_order");
  const formStatus = document.getElementById("banner_form_status");
  const modalTitle = document.getElementById("adminBannerModalTitle");

  if (bannerId) {
    const b = adminBannersCache.find(x => x.id === bannerId);
    if (b) {
      if (modalTitle) modalTitle.innerHTML = `<span>✏️</span> <span>Chỉnh Sửa Banner Quảng Cáo</span>`;
      if (formId) formId.value = b.id;
      if (formTitle) formTitle.value = b.title || "";
      if (formImg) formImg.value = b.img || "";
      if (formLink) formLink.value = b.link || "";
      if (formBtn) formBtn.value = b.buttonText || "Tìm hiểu ngay";
      if (formOrder) formOrder.value = b.order || 1;
      if (formStatus) formStatus.value = (b.status === 'INACTIVE' || b.status === 'ẨN') ? 'INACTIVE' : 'ACTIVE';
    }
  } else {
    if (modalTitle) modalTitle.innerHTML = `<span>📢</span> <span>Thêm Banner Quảng Cáo Mới</span>`;
    if (formId) formId.value = "";
    if (formTitle) formTitle.value = "";
    if (formImg) formImg.value = "";
    if (formLink) formLink.value = "";
    if (formBtn) formBtn.value = "Đăng Ký Ngay";
    if (formOrder) formOrder.value = (adminBannersCache.length + 1);
    if (formStatus) formStatus.value = "ACTIVE";
  }

  modal.style.display = "flex";
}

function closeAdminBannerFormModal() {
  const modal = document.getElementById("adminBannerModal");
  if (modal) modal.style.display = "none";
}

function saveAdminBannerForm(e) {
  if (e) e.preventDefault();
  const submitBtn = document.getElementById("saveBannerSubmitBtn");
  const originalText = submitBtn ? submitBtn.innerText : "💾 Lưu Banner";

  const bannerObj = {
    id: document.getElementById("banner_form_id").value,
    title: document.getElementById("banner_form_title").value,
    img: document.getElementById("banner_form_img").value,
    link: document.getElementById("banner_form_link").value,
    buttonText: document.getElementById("banner_form_btn").value || "Tìm hiểu ngay",
    order: document.getElementById("banner_form_order").value || 1,
    status: document.getElementById("banner_form_status").value || "ACTIVE"
  };

  if (!bannerObj.title || !bannerObj.img || !bannerObj.link) {
    if (typeof showToast === 'function') {
      showToast("⚠️ Vui lòng nhập đầy đủ Tiêu đề, Link ảnh và Liên kết đích!", "warning");
    } else if (typeof showNotification === 'function') {
      showNotification("⚠️ Vui lòng nhập đầy đủ Tiêu đề, Link ảnh và Liên kết đích!", "warning");
    }
    return;
  }

  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ Đang lưu...";
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
      if (res && res.success) {
        if (typeof showToast === 'function') {
          showToast("✨ " + res.message, "success");
        } else if (typeof showNotification === 'function') {
          showNotification("✅ " + res.message, "success");
        }
        closeAdminBannerFormModal();
        loadAdminBannersList();
        if (typeof preloadBatchData === 'function') preloadBatchData(true);
      } else {
        const msg = res ? res.message : "Lưu thất bại";
        if (typeof showToast === 'function') {
          showToast("❌ " + msg, "error");
        } else if (typeof showNotification === 'function') {
          showNotification("❌ " + msg, "error");
        }
      }
    })
    .withFailureHandler(function(err) {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
      const errMs = err.message || err;
      if (typeof showToast === 'function') {
        showToast("❌ Lỗi: " + errMs, "error");
      } else if (typeof showNotification === 'function') {
        showNotification("❌ Lỗi: " + errMs, "error");
      }
    })
    .saveBannerAdmin(bannerObj);
}

function deleteAdminBanner(bannerId) {
  if (!bannerId) return;
  const b = adminBannersCache.find(x => x.id === bannerId);
  const titleText = b ? (b.title || "Banner") : "Banner này";

  showConfirmModal(
    "Xóa Banner Quảng Cáo?",
    `Bạn có chắc chắn muốn xóa "${titleText}" khỏi hệ thống không? Thao tác này không thể hoàn tác.`,
    function() {
      if (typeof showToast === 'function') {
        showToast("⏳ Đang xử lý xóa banner...", "info", 2000);
      }
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            if (typeof showToast === 'function') {
              showToast("🎉 " + res.message, "success");
            } else if (typeof showNotification === 'function') {
              showNotification("✅ " + res.message, "success");
            }
            adminBannersCache = adminBannersCache.filter(x => x.id !== bannerId);
            if (typeof ads !== 'undefined' && Array.isArray(ads)) {
              ads = ads.filter(x => x.id !== bannerId);
            }
            if (typeof ads !== 'undefined' && ads.length === 0) {
              const adPopup = document.getElementById("adPopup");
              if (adPopup) adPopup.style.display = "none";
            }
            renderAdminBannersList(adminBannersCache);
            if (typeof preloadBatchData === 'function') preloadBatchData(true);
          } else {
            const errMs = res ? res.message : "Xóa thất bại";
            if (typeof showToast === 'function') {
              showToast("❌ " + errMs, "error");
            } else if (typeof showNotification === 'function') {
              showNotification("❌ " + errMs, "error");
            }
          }
        })
        .withFailureHandler(function(err) {
          const errMs = err.message || err;
          if (typeof showToast === 'function') {
            showToast("❌ Lỗi xóa banner: " + errMs, "error");
          } else if (typeof showNotification === 'function') {
            showNotification("❌ Lỗi xóa banner: " + errMs, "error");
          }
        })
        .deleteBannerAdmin(bannerId);
    },
    '🗑️',
    'Xóa Ngay'
  );
}

let isTransferring = false;
function sendGiftPoints() {
  if (isTransferring) return;
  const email = document.getElementById("receiverEmail").value.trim();
  const amount = parseInt(document.getElementById("giftAmount").value.trim());
  const statusEl = document.getElementById("giftStatus");

  if (!email || isNaN(amount) || amount <= 0) {
    statusEl.innerHTML = "<span style='color: #ef4444;'>❌ Vui lòng nhập email và số Triple D Coin hợp lệ.</span>";
    return;
  }

  isTransferring = true;
  statusEl.innerHTML = "<span style='color: #3b82f6;'>⏳ Đang xử lý...</span>";

  const fee = Math.ceil(amount * 0.2);
  const totalCost = amount + fee;

  let originalTransferPoints = currentUserPoints;
  let optimisticallyDeductedTransfer = false;
  if (typeof currentUserPoints !== 'undefined' && typeof updatePointDisplay === 'function') {
      updatePointDisplay(Math.max(0, currentUserPoints - totalCost));
      optimisticallyDeductedTransfer = true;
  }

  google.script.run.withSuccessHandler(function (res) {
    isTransferring = false;
    statusEl.innerHTML = res.success
      ? "<span style='color: #10b981;'>✅ " + res.message + "</span>"
      : "<span style='color: #ef4444;'>❌ " + res.message + "</span>";

    if (!res.success) {
      if (optimisticallyDeductedTransfer) updatePointDisplay(originalTransferPoints); // Revert
      triggerStudentReliefIfEligible();
    }

    if (res.success) {
      // Xóa input + phí
      document.getElementById("giftAmount").value = "";
      document.getElementById("receiverEmail").value = "";
      document.getElementById("feeInfo").innerHTML = "";

      const userEmail = sessionStorage.getItem("userEmail");
      if (userEmail) {
        google.script.run.withSuccessHandler(function (point) {
          updatePointDisplay(point);
        }).getUserPoints(userEmail);
      }
    }
  }).withFailureHandler(function(error) {
    if (optimisticallyDeductedTransfer) updatePointDisplay(originalTransferPoints); // Revert
    isTransferring = false;
    statusEl.innerHTML = "<span style='color: #ef4444;'>❌ Lỗi kết nối: " + error + "</span>";
  }).transferPoints(email, amount);
}

let snakeGameRunning = false;
let gameOver = false;

function stopAllGameIntervals() {
  // Stop Snake game
  if (typeof interval !== "undefined") {
    clearTimeout(interval);
  }
  if (typeof snakeRafId !== "undefined" && snakeRafId) {
    cancelAnimationFrame(snakeRafId);
  }
  snakeGameRunning = false;

let dx = 20, dy = 0;

function startSnakeGame() {
  let pendingPoints = 0;

  const enemies = [];
  let popups = []; // popup điểm

  let snake = [{
    x: Math.floor(Math.random() * canvas.width / box) * box,
    y: Math.floor(Math.random() * canvas.height / box) * box
  }];
  let bacteria = randomItem();
  let score = 0;
  let speed = 300;
  let obstacles = generateObstacles(3);
  dx = box; dy = 0; nextDirection = null;
  let magnetActive = false;
  let magnetTimer = 0;
  let hazard = randomHazard();
  let rainItems = [];
  let gameTick = 0;
  interval = null;

  // Level hệ thống
  let nextLevelScore = 10;
  const levelIncrement = 10;

  if (snakeRafId) cancelAnimationFrame(snakeRafId);
  snakeGameRunning = true;

  const headImg = new Image(); headImg.src = "https://cdn-icons-png.flaticon.com/128/2469/2469829.png";
  const bodyImg = new Image(); bodyImg.src = "https://cdn-icons-png.flaticon.com/128/14025/14025020.png";
  const germImg = new Image(); germImg.src = "https://cdn-icons-png.flaticon.com/128/2134/2134322.png";
  const specialImg = new Image(); specialImg.src = "https://cdn-icons-png.flaticon.com/128/6691/6691323.png";
  const magnetImg = new Image(); magnetImg.src = "https://cdn-icons-png.flaticon.com/128/3989/3989601.png";
  const crownImg = new Image(); crownImg.src = "https://cdn-icons-png.flaticon.com/128/4880/4880410.png";
  const bulletImg = new Image(); bulletImg.src = "https://cdn-icons-png.flaticon.com/128/595/595582.png";
  const enemyImg = new Image(); enemyImg.src = "https://cdn-icons-png.flaticon.com/128/2828/2828492.png";

  document.getElementById("restartBtn").style.display = "none";
  let overlay = document.getElementById("snakeGameOverOverlay");
  if (overlay) overlay.style.display = "none";
  
  document.getElementById("restartBtn").onclick = () => {
    clearTimeout(interval);
    pendingPoints = 0; 
    startSnakeGame();
  };

  const oldAmmoDisplay = document.getElementById("ammoDisplay");
  if (oldAmmoDisplay) oldAmmoDisplay.remove();

  function updateAmmoDisplay(){ }
  updateAmmoDisplay();

  function randomItem() {
    const rand = Math.random();
    return {
      x: Math.floor(Math.random() * canvas.width / box) * box,
      y: Math.floor(Math.random() * canvas.height / box) * box,
      special: rand < 0.1,
      magnet: rand >= 0.1 && rand < 0.2,
      crown: false 
    };
  }

  function generateObstacles(count) {
    const obs = [];
    for(let i=0;i<count;i++){
      obs.push({
        x: Math.floor(Math.random() * canvas.width / box) * box,
        y: Math.floor(Math.random() * canvas.height / box) * box
      });
    }
    return obs;
  }

  function randomHazard() {
    return {
      x: Math.floor(Math.random() * (canvas.width - box * 3) / box) * box,
      y: Math.floor(Math.random() * (canvas.height - box * 3) / box) * box,
      width: box*3, height: box*3
    };
  }

  function spawnEnemy() {
    enemies.push({
      x: hazard.x + Math.floor(Math.random()*3)*box,
      y: hazard.y + Math.floor(Math.random()*3)*box
    });
  }

  function drawHazard() {
    ctx.fillStyle = "rgba(255,0,0,0.2)";
    ctx.fillRect(hazard.x, hazard.y, hazard.width, hazard.height);
  }

  function drawEnemies() {
    enemies.forEach(e => ctx.drawImage(enemyImg, e.x, e.y, box, box));
  }

  function moveEnemiesran() {
    const enemySpeed = box / 4;
    enemies.forEach(e => {
      let closest = snake.reduce((prev, curr) => {
        const dPrev = Math.hypot(e.x - prev.x, e.y - prev.y);
        const dCurr = Math.hypot(e.x - curr.x, e.y - curr.y);
        return dCurr < dPrev ? curr : prev;
      }, snake[0]);

      if(e.x < closest.x) e.x += enemySpeed;
      else if(e.x > closest.x) e.x -= enemySpeed;
      if(e.y < closest.y) e.y += enemySpeed;
      else if(e.y > closest.y) e.y -= enemySpeed;
    });
  }

  function checkLevelUp() {
    if(score >= nextLevelScore){
      speed = Math.max(80, speed - 10);
      obstacles.push(...generateObstacles(1));
      spawnEnemy();
      nextLevelScore += levelIncrement;
    }
  }

const bulletSize = box; // Kích thước viên đạn

function drawBullets() {
  bullets.forEach(b => {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.5)"; // Đổ bóng nổi bật
    ctx.shadowBlur = 4;
    ctx.drawImage(bulletImg, b.x, b.y, bulletSize, bulletSize);
    ctx.restore();
  });
}

function updateBullets() {
  bullets.forEach((b,index)=>{
    const steps = Math.ceil(Math.max(Math.abs(b.dx), Math.abs(b.dy)) / box); // chia nhỏ bước
    for(let s=0;s<steps;s++){
      b.x += b.dx/steps;
      b.y += b.dy/steps;

      // Va chạm obstacles
      obstacles.forEach((obs,oIndex)=>{
        if(b.x < obs.x + box && b.x + bulletSize > obs.x &&
           b.y < obs.y + box && b.y + bulletSize > obs.y){
          createExplosion(obs.x, obs.y, "#fb923c"); // cam
          obstacles.splice(oIndex,1);
          bullets.splice(index,1);
        }
      });

      // Va chạm enemies
      for(let i=enemies.length-1;i>=0;i--){
        const e = enemies[i];
        if(b.x < e.x + box && b.x + bulletSize > e.x &&
           b.y < e.y + box && b.y + bulletSize > e.y){
          createExplosion(e.x, e.y, "#f87171"); // đỏ
          enemies.splice(i,1);
          bullets.splice(index,1);

          const gain=5;
          score+=gain; pendingPoints+=gain;
          popups.push({x:e.x,y:e.y,text:`+${gain}`,alpha:1,dy:-1});
          break;
        }
      }

      if(!bullets[index]) break; // nổ xong thoát
    }

    // Ra ngoài màn hình
    if(b && (b.x < 0 || b.x >= canvas.width || b.y < 0 || b.y >= canvas.height)){
      bullets.splice(index,1);
    }
  });
}

  function createExplosion(x, y, color) {
    for (let i = 0; i < 12; i++) {
      explosions.push({
        x: x + box / 2,
        y: y + box / 2,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 1,
        color: color,
        size: Math.random() * 3 + 2
      });
    }
  }

  function drawExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
      let p = explosions[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
      if (p.life <= 0) {
        explosions.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function spawnRainItem() {
    rainItems.push({
      x: Math.random() * (canvas.width - box),
      y: -box,
      img: bulletImg,
      speed: box/4 + Math.random()*box/4,  
      rotation: Math.random() * Math.PI*2,
      rotationSpeed: (Math.random()-0.5)*0.1,
      alpha: 1
    });
  }

  function drawRainItems() {
    rainItems.forEach(item => {
      ctx.save();
      ctx.translate(item.x + box/2, item.y + box/2);
      ctx.rotate(item.rotation);
      ctx.globalAlpha = item.alpha;
      ctx.drawImage(item.img, -box/2, -box/2, box, box);
      ctx.restore();
      item.rotation += item.rotationSpeed;
    });
  }

  function moveRainItems() {
    rainItems.forEach(item => { item.y += item.speed; });
    rainItems = rainItems.filter(item => item.y < canvas.height);
  }

  function drawPopups() {
    popups.forEach((p,i)=>{
      ctx.save();
      ctx.font = `${box}px Poppins`;
      ctx.fillStyle = `rgba(255,215,0,${p.alpha})`;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
      p.y += p.dy;
      p.alpha -= 0.03;
      if(p.alpha <= 0) popups.splice(i,1);
    });
  }

function drawGameSmooth(time) {
  let alpha = (performance.now() - lastGameTickTime) / speed;
  if (alpha > 1) alpha = 1;
  if (alpha < 0) alpha = 0;

  // Modern clean background with subtle animated color shifting based on time and score
  const timeSec = performance.now() / 2000;
  const intensity = Math.min(score / 150, 1); // 0 to 1 scaling factor
  
  const r1 = Math.floor(248 - 30 * intensity + 5 * Math.sin(timeSec));
  const g1 = Math.floor(250 - 45 * intensity + 5 * Math.sin(timeSec * 1.3));
  const b1 = Math.floor(252 - 60 * intensity + 5 * Math.sin(timeSec * 1.7));
  
  const r2 = Math.floor(226 - 40 * intensity + 10 * Math.sin(timeSec + 1));
  const g2 = Math.floor(232 - 50 * intensity + 10 * Math.sin(timeSec * 1.3 + 1));
  const b2 = Math.floor(240 - 70 * intensity + 10 * Math.sin(timeSec * 1.7 + 1));

  const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  bgGrad.addColorStop(0, `rgb(${r1}, ${g1}, ${b1})`);
  bgGrad.addColorStop(1, `rgb(${r2}, ${g2}, ${b2})`);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle clean Grid
  ctx.strokeStyle = "rgba(0, 0, 0, 0.03)";
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.width; i += box) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  }
  for (let j = 0; j < canvas.height; j += box) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
  }

  // Hazard
  if (hazard) {
    ctx.fillStyle = "rgba(239, 68, 68, 0.1)"; // red-500
    ctx.beginPath(); 
    ctx.roundRect(hazard.x, hazard.y, hazard.width, hazard.height, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(239, 68, 68, 0.3)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Draw obstacles
  obstacles.forEach(obs => {
    ctx.shadowBlur = 8;
    ctx.shadowColor = "rgba(100, 116, 139, 0.4)"; // slate-500
    // soft gradient for obstacle
    const obsGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + box);
    obsGrad.addColorStop(0, "#94a3b8");
    obsGrad.addColorStop(1, "#64748b");
    ctx.fillStyle = obsGrad;
    ctx.beginPath();
    ctx.roundRect(obs.x + 2, obs.y + 2, box - 4, box - 4, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Food
  ctx.shadowBlur = 12;
  ctx.shadowColor = bacteria.crown ? "rgba(234, 179, 8, 0.5)" : (bacteria.magnet ? "rgba(14, 165, 233, 0.5)" : "rgba(34, 197, 94, 0.5)");
  const foodGrad = ctx.createLinearGradient(bacteria.x, bacteria.y, bacteria.x, bacteria.y + box);
  if (bacteria.crown) {
    foodGrad.addColorStop(0, "#fef08a"); foodGrad.addColorStop(1, "#eab308");
  } else if (bacteria.magnet) {
    foodGrad.addColorStop(0, "#7dd3fc"); foodGrad.addColorStop(1, "#0ea5e9");
  } else {
    foodGrad.addColorStop(0, "#86efac"); foodGrad.addColorStop(1, "#22c55e");
  }
  ctx.fillStyle = foodGrad;
  let scale = 1 + 0.1 * Math.sin(time / 200 || performance.now() / 200);
  let sBox = box * scale;
  let offset = (box - sBox) / 2;
  ctx.beginPath();
  ctx.roundRect(bacteria.x + offset, bacteria.y + offset, sBox, sBox, sBox/2); // circle shape for food
  ctx.fill();
  ctx.shadowBlur = 0;

  drawRainItems();

  // Draw snake segments continuously
  for (let i = snake.length - 1; i >= 0; i--) {
    let part = snake[i];
    let oldPart = lastSnake[i] || lastSnake[lastSnake.length - 1]; // Use last valid part
    if (!oldPart) oldPart = part;
    
    let baseIx = oldPart.x + (part.x - oldPart.x) * alpha;
    let baseIy = oldPart.y + (part.y - oldPart.y) * alpha;

    // smooth snake wrapping
    if (Math.abs(part.x - oldPart.x) > box) baseIx = part.x; 
    if (Math.abs(part.y - oldPart.y) > box) baseIy = part.y; 

    let isHead = (i === 0);
    ctx.shadowBlur = isHead ? 15 : 8;
    ctx.shadowColor = isHead ? "rgba(99, 102, 241, 0.4)" : "rgba(129, 140, 248, 0.3)";
    
    const sGrad = ctx.createLinearGradient(baseIx, baseIy, baseIx+box, baseIy+box);
    if (isHead) {
      sGrad.addColorStop(0, "#818cf8"); sGrad.addColorStop(1, "#4f46e5");
    } else {
      sGrad.addColorStop(0, "#a5b4fc"); sGrad.addColorStop(1, "#6366f1");
    }
    ctx.fillStyle = sGrad;
    
    let pScale = isHead ? 0.95 : 0.85;
    let pBox = box * pScale;
    let pOff = (box - pBox) / 2;

    ctx.beginPath();
    ctx.roundRect(baseIx + pOff, baseIy + pOff, pBox, pBox, pBox/2.5);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Draw enemies, bullets, popups
  drawEnemies();
  drawBullets();
  drawExplosions();
  drawPopups();
}

  function gameLoop(){
    if(!snakeGameRunning) return;
    lastGameTickTime = performance.now();
    lastSnake = JSON.parse(JSON.stringify(snake));
    gameTick++;
    if(gameTick % 30===0) obstacles.push(...generateObstacles(1));
    if(gameTick % 15===0) spawnRainItem();
    if(gameTick % 60===0) spawnEnemy();

    moveRainItems(); updateBullets(); moveEnemiesran();

    // Apply queued direction
    if (nextDirection) {
      if (nextDirection === "up") { dx = 0; dy = -box; }
      else if (nextDirection === "down") { dx = 0; dy = box; }
      else if (nextDirection === "left") { dx = -box; dy = 0; }
      else if (nextDirection === "right") { dx = box; dy = 0; }
      nextDirection = null;
    }

    const head = {x:snake[0].x+dx, y:snake[0].y+dy};
    let ate=false;

    for(let i = enemies.length-1; i >= 0; i--){
      const e = enemies[i];
      const hitIndex = snake.findIndex(s => s.x === e.x && s.y === e.y);
      if(hitIndex >= 0){
        const lostPoints = 3;
        score = Math.max(0, score - lostPoints);
        pendingPoints = Math.max(0, pendingPoints - lostPoints);
        bulletsCount = Math.max(0, bulletsCount - 1);
        updateAmmoDisplay();

        createExplosion(snake[hitIndex].x, snake[hitIndex].y, "#0ea5e9");

        if(snake.length === 1){
          snakeGameOver(score, pendingPoints);
          return;
        } else {
          snake.splice(hitIndex, 1);
        }
      }
    }

    if(head.x<0 || head.x>=canvas.width || head.y<0 || head.y>=canvas.height ||
      snake.some((s,i)=>i>0 && s.x===head.x && s.y===head.y) ||
      obstacles.some(obs=>obs.x===head.x && obs.y===head.y)){
        snakeGameOver(score, pendingPoints);
        return;
    }

    snake.unshift(head);

    if(magnetActive){
      const dist=Math.hypot(snake[0].x-bacteria.x, snake[0].y-bacteria.y);
      if(dist<=box){ bacteria.x=snake[0].x; bacteria.y=snake[0].y;}
      else{
        if(snake[0].x<bacteria.x) bacteria.x-=box; else if(snake[0].x>bacteria.x) bacteria.x+=box;
        if(snake[0].y<bacteria.y) bacteria.y-=box; else if(snake[0].y>bacteria.y) bacteria.y+=box;
      }
      magnetTimer--;
      if(magnetTimer<=0) magnetActive=false;
    }

    if(head.x === bacteria.x && head.y === bacteria.y){
      let gain = bacteria.special ? 5 : 3;
      if(bacteria.crown) gain = 10000;
      if(bacteria.magnet){ magnetActive = true; magnetTimer = 50; }

      score += gain; pendingPoints += gain;
      bacteria = randomItem();
      ate = true;

      // popup điểm
      popups.push({x: head.x, y: head.y, text: `+${gain}`, alpha:1, dy:-1});

      checkLevelUp();
    }

    for(let i = rainItems.length-1;i>=0;i--){
      const item = rainItems[i];
      if(snake[0].x < item.x + box && snake[0].x + box > item.x &&
         snake[0].y < item.y + box && snake[0].y + box > item.y){
        bulletsCount += 2;
        updateAmmoDisplay();
        rainItems.splice(i,1);
      }
    }

    if(!ate) snake.pop();

  // Score UI update reference
  const snakeScoreEl = document.getElementById("snakeScore");
  if (snakeScoreEl) {
     snakeScoreEl.innerHTML = `
      <span style="
        background: rgba(255, 255, 255, 0.85);

      ">
        <span>🪙 ${score}</span>
        ${magnetActive ? '<span>🧲</span>' : ''}
        <span>💣 ${bulletsCount}</span>
        <span>🐍 ${snake.length}</span>
      </span>
    `;
  }


    lastDx=dx; lastDy=dy; directionChanged=false;
    if(snakeGameRunning) interval=setTimeout(gameLoop,speed);
  }

  lastSnake = JSON.parse(JSON.stringify(snake));
  lastGameTickTime = performance.now();
  
  function renderLoop(time) {
    if(!snakeGameRunning) return;
    snakeRafId = requestAnimationFrame(renderLoop);
    drawGameSmooth(time);
  }
  
  snakeRafId = requestAnimationFrame(renderLoop);
  gameLoop();

const bulletSpeed = 50 + Math.floor(score / 20);

document.onkeydown = function(e){
  const tag = document.activeElement.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if(directionChanged) return;

  // Di chuyển rắn
  if(e.key === "ArrowUp" && lastDy === 0){ dx = 0; dy = -box; directionChanged = true; }
  else if(e.key === "ArrowDown" && lastDy === 0){ dx = 0; dy = box; directionChanged = true; }
  else if(e.key === "ArrowLeft" && lastDx === 0){ dx = -box; dy = 0; directionChanged = true; }
  else if(e.key === "ArrowRight" && lastDx === 0){ dx = box; dy = 0; directionChanged = true; }

  // Bắn đạn
  else if(e.key === " " && bulletsCount > 0){
    // Xuất phát từ mồm rắn
    let bulletX = snake[0].x + box/2 - box/2; // căn giữa đầu rắn
    let bulletY = snake[0].y + box/2 - box/2;
    let bulletDx = dx === 0 ? 0 : (dx / Math.abs(dx)) * bulletSpeed;
    let bulletDy = dy === 0 ? 0 : (dy / Math.abs(dy)) * bulletSpeed;
    bullets.push({ x: bulletX, y: bulletY, dx: bulletDx, dy: bulletDy });
    bulletsCount--;
    updateAmmoDisplay();
  }
};

  if(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) document.getElementById("mobileControls").style.display="block";
  else document.getElementById("mobileControls").style.display="none";
}

function setDirection(dir) {
  if (typeof dx === "undefined" || typeof dy === "undefined") return;

  // Prevent 180-degree turn
  if (dir === "up" && dy === box) return;
  if (dir === "down" && dy === -box) return;
  if (dir === "left" && dx === box) return;
  if (dir === "right" && dx === -box) return;

  nextDirection = dir;
}

  if (typeof stopAviatorGame === "function") stopAviatorGame();

  // Tắt Snake Game nếu đang chạy
  if (typeof interval !== "undefined") clearTimeout(interval);
  if (snakeRafId) cancelAnimationFrame(snakeRafId);

else if (selected === "cow") {

let dinoInterval;
let dinoRunning = false;
let dinoGameOver = false;
let dinoCooldown = false;
let dinoKeyHandler;
let dinoKeyUpHandler;
let dinoThen = 0;


function startDinoGame() {
  dinoThen = 0;
  // DỌN LISTENER CŨ TRƯỚC
    if (dinoKeyHandler) {
      document.removeEventListener("keydown", dinoKeyHandler);
      document.removeEventListener("keyup", dinoKeyUpHandler);
    }
  // 🔥 reset UI trước khi start
  const overlay = document.getElementById("dinoOverlay");
  const restartBtn = document.getElementById("dinoRestartBtn");

  // ✅ CHẶN CHUỘT QUA COOLDOWN
  restartBtn.onclick = () => {
    if (dinoCooldown) return;
    if (dinoGameOver) startDinoGame();
  };

  overlay.classList.remove("show");
  restartBtn.disabled = true;
  restartBtn.innerText = "Chơi lại (3)";

  let pendingPoints = 0;

  dinoGameOver = false;
  cancelAnimationFrame(dinoInterval);
  dinoRunning = true;

  const canvas = document.getElementById("dinoCanvas");
  canvas.classList.remove("dino-shake");
  const ctx = canvas.getContext("2d");

  // Thiết lập hệ số kích thước logic ổn định và tự động điều chỉnh độ phân giải thực tế cho màn hình HiDPI/Retina sắc nét
  const GAME_WIDTH = 300;
  const GAME_HEIGHT = 150;

  // Sử dụng độ phân giải siêu nét cố định (900x450, tỷ lệ 3:1 so với logic 300x150) bảo đảm độ sắc nét tối đa trên mọi màn hình và tránh bị 0px khi container ẩn lúc khởi chạy
  canvas.width = 900;
  canvas.height = 450;

  // Tối ưu hóa: Tạo sẵn màu nền gradient để không phải tạo lại mỗi frame
  const bgDay = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgDay.addColorStop(0, "#e3f2fd");
  bgDay.addColorStop(1, "#ffffff");

  const bgNight = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgNight.addColorStop(0, "#0f2027");
  bgNight.addColorStop(1, "#203a43");

  // Khởi tạo đám mây (Parallax)
  const clouds = Array.from({length: 4}, () => ({
      x: Math.random() * GAME_WIDTH,
      y: 10 + Math.random() * 40,
      size: 15 + Math.random() * 15,
      speed: 0.1 + Math.random() * 0.2
  }));

  // Khởi tạo các tòa nhà cho background thành phố (Parallax)
  const buildings = [];
  let buildX = 0;
  while(buildX < GAME_WIDTH * 2) {
    let w = 25 + Math.random() * 40;
    let h = 30 + Math.random() * 60;
    buildings.push({x: buildX, w: w, h: h});
    buildX += w + 5 + Math.random() * 15;
  }

  const GROUND_Y = 120;
  const DINO_X = 30;

  const DINO_WIDTH = 34;
  const DINO_HEIGHT_STAND = 40;
  const DINO_HEIGHT_DUCK = 24;

  const BIRD_WIDTH = 28;
  const BIRD_HEIGHT = 22;

  const gravity = 0.38;
  const jumpForce = -7.4;

  let dinoY = GROUND_Y;
  let velocity = 0;
  let isJumping = false;
  let isDucking = false;

  let obstacleType = "cactus";
  let obstacleX = GAME_WIDTH;

  let birdY = 0;
  let score = 0;
  let speed = 2.0;
  let isNight = false;

  let dinoFrameCount = 0;
  let dinoParticles = [];
  let screenShake = 0;

  document.getElementById("dinoRestartBtn").disabled = true;
  document.getElementById("dinoScore").innerText = "0";
  document.getElementById("dinoCoin").innerText = "0";

  const fontCache = {};

  function setCachedFont(size) {
    if (!fontCache[size]) {
      fontCache[size] = `${size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Android Emoji", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
    }
    if (ctx.font !== fontCache[size]) {
      ctx.font = fontCache[size];
    }
  }

  function drawIcon(icon, x, y, size) {
    const scaleX = canvas.width / GAME_WIDTH;
    const scaleY = canvas.height / GAME_HEIGHT;
    
    ctx.save();
    // Bỏ qua chế độ scale ảo của context, vẽ trực tiếp ở độ phân giải gốc của thiết bị
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    
    const actualX = x * scaleX;
    const actualY = y * scaleY;
    const actualSize = Math.round(size * scaleX);
    
    ctx.fillStyle = "#000"; // Bảo đảm độ đậm gốc 100% của Emoji, không bị thừa hưởng thuộc tính alpha mờ
    setCachedFont(actualSize);
    ctx.textBaseline = "alphabetic";
    ctx.fillText(icon, actualX, actualY);
    ctx.restore();
  }

  function drawFlippedIcon(icon, x, y, size) {
    const scaleX = canvas.width / GAME_WIDTH;
    const scaleY = canvas.height / GAME_HEIGHT;
    
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    
    const actualX = x * scaleX;
    const actualY = y * scaleY;
    const actualSize = Math.round(size * scaleX);
    
    ctx.translate(actualX + actualSize, 0);
    ctx.scale(-1, 1);
    
    ctx.fillStyle = "#000"; // Bảo đảm độ đậm gốc 100% của Emoji, không bị thừa hưởng thuộc tính alpha mờ
    setCachedFont(actualSize);
    ctx.textBaseline = "alphabetic";
    ctx.fillText(icon, 0, actualY);
    ctx.restore();
  }

  function jump() {
    if (!isJumping && !isDucking) {
      velocity = jumpForce;
      isJumping = true;
    }
  }

  function duck(down) {
    if (!isJumping) isDucking = down;
  }

dinoKeyHandler = function(e){
  if (e.code === "Space" || e.code === "ArrowUp") {
    if (dinoCooldown) return;

    if (dinoGameOver) {
      startDinoGame();
      return;
    }

    if (dinoRunning) jump();
  }

  if (e.code === "ArrowDown" && dinoRunning) {
    duck(true);
  }
};

dinoKeyUpHandler = function(e){
  if (e.code === "ArrowDown") {
    duck(false);
  }
};

document.addEventListener("keydown", dinoKeyHandler);
document.addEventListener("keyup", dinoKeyUpHandler);


canvas.onclick = () => {
  if (dinoCooldown) return;

  if (dinoGameOver) {
    startDinoGame();
    return;
  }

  if (dinoRunning) jump();
};


  function spawnObstacle() {
    obstacleX = GAME_WIDTH;
    obstacleType = Math.random() < 0.6 ? "cactus" : "bird";

    if (obstacleType === "bird") {
      const birds = [
        { y: GROUND_Y - 20 },
        { y: GROUND_Y - 50 },
        { y: GROUND_Y - 80 }
      ];
      birdY = birds[Math.floor(Math.random() * birds.length)].y;
    }
  }

  function isCollide(a, b) {
    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }

  // Tối ưu hóa bộ nhớ: Tạo trước object để không sinh rác GC mỗi frame
  const dinoRect = { x: 0, y: 0, w: 0, h: 0 };
  const obstacleRect = { x: 0, y: 0, w: 0, h: 0 };

  function loop(timestamp) {
    if (!dinoRunning) return;

    if (!timestamp) timestamp = performance.now();
    if (!dinoThen) dinoThen = timestamp;

    const elapsed = timestamp - dinoThen;
    if (elapsed < 16.6) {
      dinoInterval = requestAnimationFrame(loop);
      return;
    }
    dinoThen = timestamp - (elapsed % 16.6);

    dinoFrameCount++;
    isNight = Math.floor(score / 20) % 2 === 1;

    ctx.save();
    // Áp dụng tỉ lệ màn hình logic 300x150 sắc nét trên canvas độ phân giải cao thực tế
    ctx.scale(canvas.width / GAME_WIDTH, canvas.height / GAME_HEIGHT);

    ctx.fillStyle = isNight ? bgNight : bgDay;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    // Vẽ và di chuyển đám mây
    ctx.fillStyle = isNight ? "rgba(255, 255, 255, 0.05)" : "rgba(255, 255, 255, 0.4)";
    for (let i = 0; i < clouds.length; i++) {
        let c = clouds[i];
        c.x -= c.speed;
        if (c.x + c.size * 3 < 0) {
            c.x = GAME_WIDTH + c.size;
            c.y = 10 + Math.random() * 40;
        }
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.3, c.size * 0.8, 0, Math.PI * 2);
        ctx.arc(c.x + c.size * 1.6, c.y, c.size * 0.9, 0, Math.PI * 2);
        ctx.fill();
    }

    // Vẽ và di chuyển các tòa nhà thành phố (sử dụng màu bán trong suốt để làm nổi bật nhân vật chính và chướng ngại vật cực nét)
    ctx.fillStyle = isNight ? "rgba(38, 50, 56, 0.5)" : "rgba(207, 216, 220, 0.4)";
    for(let i=0; i<buildings.length; i++) {
        let b = buildings[i];
        b.x -= speed * 0.15; // Parallax chậm hơn tốc độ game
        if (b.x + b.w < 0) {
            let maxX = 0;
            for(let j=0; j<buildings.length; j++){
                if(buildings[j].x > maxX) maxX = buildings[j].x + buildings[j].w;
            }
            b.x = maxX + 5 + Math.random() * 15;
            b.h = 30 + Math.random() * 60;
            b.w = 25 + Math.random() * 40;
        }
        ctx.fillRect(b.x, GROUND_Y + 5 - b.h, b.w, b.h);
    }
    
    // Thêm một số cửa sổ sáng rải rác trên các tòa nhà nếu trời tối
    if (isNight) {
        ctx.fillStyle = "#ffeb3b";
        for(let i=0; i<buildings.length; i++) {
            let b = buildings[i];
            if (b.w > 30 && b.h > 40) { // Chỉ tòa nhà đủ to
                // Vẽ 1-2 cửa sổ nhỏ bé xíu
                ctx.fillRect(b.x + 10, GROUND_Y + 5 - b.h + 10, 4, 6);
            }
            if (b.w > 45 && b.h > 60) {
                ctx.fillRect(b.x + 25, GROUND_Y + 5 - b.h + 25, 4, 6);
            }
        }
    }

    ctx.fillStyle = isNight ? "#eceff1" : "#a1887f";
    ctx.fillRect(0, GROUND_Y + 5, GAME_WIDTH, 4);

    // Bụi khi chạy
    ctx.fillStyle = isNight ? "rgba(255, 255, 255, 0.4)" : "rgba(100, 70, 50, 0.3)";
    for (let i = 0; i < dinoParticles.length; i++) {
        let p = dinoParticles[i];
        p.x -= speed * 0.8 + p.vx;
        p.y += p.vy;
        p.size *= 0.95;
        p.life--;
        if (p.life > 0) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    dinoParticles = dinoParticles.filter(p => p.life > 0);

    if (!isJumping && !dinoGameOver && dinoFrameCount % 4 === 0) {
        dinoParticles.push({
            x: DINO_X - 10,
            y: GROUND_Y + 5,
            vx: Math.random(),
            vy: -Math.random() * 1.5,
            size: 3 + Math.random() * 3,
            life: 20
        });
    }

    velocity += gravity;
    dinoY += velocity;

    if (dinoY >= GROUND_Y) {
      dinoY = GROUND_Y;
      velocity = 0;
      isJumping = false;
    }

    const dinoHeight = isDucking ? DINO_HEIGHT_DUCK : DINO_HEIGHT_STAND;
    const dinoTopY = dinoY - dinoHeight;

    if (dinoGameOver) drawFlippedIcon("💥", DINO_X, dinoY, 36);
    else if (isJumping) drawFlippedIcon("🤸", DINO_X, dinoY, 34);
    else if (isDucking) drawFlippedIcon("🐕", DINO_X, dinoY, 30);
    else if (dinoFrameCount % 10 < 5) drawFlippedIcon("🏃", DINO_X, dinoY, 36);
    else drawFlippedIcon("🚶", DINO_X, dinoY, 36);

    speed = 2.0 + score * 0.02;
    obstacleX -= speed;

    if (obstacleX < -60) {
      spawnObstacle();
      score++;
      pendingPoints++; // ✅ farm coin
      document.getElementById("dinoScore").innerText = score;
      document.getElementById("dinoCoin").innerText = pendingPoints;
    }

    if (obstacleType === "cactus") {
      drawIcon("⛰️", obstacleX, GROUND_Y, 24);
    } else {
      drawIcon("🖥️", obstacleX, birdY + 24, 26);
    }

    dinoRect.x = DINO_X + 11;
    dinoRect.y = dinoTopY + 8;
    dinoRect.w = DINO_WIDTH - 20;
    dinoRect.h = dinoHeight - 12;

    if (obstacleType === "cactus") {
      obstacleRect.x = obstacleX + 10;
      obstacleRect.y = GROUND_Y - 24;
      obstacleRect.w = 12;
      obstacleRect.h = 20;
    } else {
      obstacleRect.x = obstacleX + 8;
      obstacleRect.y = birdY + 8;
      obstacleRect.w = BIRD_WIDTH - 16;
      obstacleRect.h = BIRD_HEIGHT - 14;
    }

    if (isCollide(dinoRect, obstacleRect)) {
      dinoRunning = false;
      dinoGameOver = true;
      dinoCooldown = true;
      canvas.classList.add("dino-shake");

      // Vẽ vụ nổ sắc nét trực tiếp tại điểm va chạm
      drawFlippedIcon("💥", DINO_X, dinoY - 5, 46);
      ctx.restore();

      const overlay = document.getElementById("dinoOverlay");
      const restartBtn = document.getElementById("dinoRestartBtn");
      const earnedCoinsEl = document.getElementById("dinoEarnedCoins");

      if (earnedCoinsEl) {
        earnedCoinsEl.innerText = pendingPoints;
      }

      // Khóa nút tạm thời để tránh click nhầm trong giây đầu tiên
      restartBtn.disabled = true;
      restartBtn.innerText = "Chơi lại (3)";

      // Đợi đúng 1 giây (1000ms) để người chơi chứng kiến vụ nổ/xe giật mượt mà trên Canvas, sau đó hiện bảng Game Over cực chất
      setTimeout(() => {
        overlay.classList.add("show");

        let count = 3;
        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            restartBtn.innerText = `Chơi lại (${count})`;
          } else {
            clearInterval(timer);
            restartBtn.innerText = "Chơi lại";
            restartBtn.disabled = false;
            dinoCooldown = false;
          }
        }, 1000);
      }, 1000);

      if (pendingPoints > 0) {
        google.script.run
          .withSuccessHandler((res) => {
             if (res && res.success) {
               refreshUserPoints?.();
               refreshEventCoin?.();
             }
          })
          .submitArcadePointsSecure('dino', pendingPoints);

        pendingPoints = 0;
      } else {
        refreshUserPoints?.();
        refreshEventCoin?.();
      }
      return;
    }
    ctx.restore();
    dinoInterval = requestAnimationFrame(loop);
  }
  spawnObstacle();
  loop();
}

  }

  }

function drawGuide(ctx){
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0,0,canvasSize,canvasSize);

  const panelW = canvasSize * 0.8;
  const panelH = canvasSize * 0.5;
  const px = (canvasSize - panelW)/2;
  const py = (canvasSize - panelH)/2 - 40;

  // ===== PANEL BO GÓC =====
  const radius = 10;
  ctx.beginPath();
  ctx.roundRect(px, py, panelW, panelH, radius);

  ctx.fillStyle = "#c9ad7b";
  ctx.fill();

  ctx.lineWidth = 6;
  ctx.strokeStyle = "#8b6a3f";
  ctx.stroke();


  // ===== TITLE =====
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const centerX = px + panelW / 2;
  const titleY = py + panelH * 0.25;

  ctx.fillStyle = "#3b2b18";
  ctx.font = '22px "Bevan"';
  ctx.shadowColor = "rgba(0,0,0,0.25)";
  ctx.shadowBlur = 4;

  ctx.fillText("HƯỚNG DẪN", centerX, titleY);


  // ===== LINE =====
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#8b6a3f";
  ctx.lineWidth = 3;

  const lineY = titleY + 15;
  ctx.beginPath();
  ctx.moveTo(px + 60, lineY);
  ctx.lineTo(px + panelW - 60, lineY);
  ctx.stroke();


  // ===== GUIDE TEXT (CĂN TRÁI NHƯNG NẰM GIỮA PANEL) =====
  ctx.font = '800 16px "Nunito"';
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#2b1d0e";
  ctx.textAlign = "left";

  const lines = [
    "🚜 Đi đến đích 3️⃣6️⃣",
    "🚧 SPACE: Phá đường tàu",
    "🌯 F: Ném nem chua"
  ];

  // 🔥 đo dòng dài nhất
  let maxWidth = 0;
  lines.forEach(line=>{
    const w = ctx.measureText(line).width;
    if (w > maxWidth) maxWidth = w;
  });

  // 👉 trái của khối text = giữa panel - nửa khối
  const textBlockLeftX = centerX - maxWidth / 2;

  const lineHeight = 26;
  const totalTextHeight = lines.length * lineHeight;

  const guideTopGap = 23;
  let y = lineY + guideTopGap;

  lines.forEach(line=>{
    ctx.fillText(line, textBlockLeftX, y);
    y += lineHeight;
  });

  ctx.restore();
}



function key(x,y){return x+","+y}
function inBound(x,y){return x>=0 && y>=0 && x<grid && y<grid;}
function dist(x1,y1,x2,y2){return Math.abs(x1-x2)+Math.abs(y1-y2);}


function spawnNem(){

  if (tick % rate !== 0) return;
  if (nems.length > 10) return;

  let tries = 0;

// ====== PATH ======
function generatePath(startX, startY) {
  let bestPath = [];
  
  // Chạy random walk 30 lần, lấy đường dài nhất để tránh lag (DFS gây treo máy)
  for (let i = 0; i < 30; i++) {
    let stack = [{x:startX,y:startY}];
    let visited = new Set([key(startX,startY)]);
    let path = [];

    while (stack.length) {
      let cur = stack.pop();
      path.push(cur);

      let dirs = [
        {x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}
      ].sort(()=>Math.random()-0.5);

      for (let d of dirs) {
        let nx = cur.x + d.x;
        let ny = cur.y + d.y;
        if (inBound(nx,ny) && !visited.has(key(nx,ny))) {
          // Lookahead: chỉ đi nếu không bị dính vào ô đã đi (ngoại trừ ô trước đó)
          let ncount = 0;
          for (let d2 of [{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}]) {
            let nnx = nx + d2.x; let nny = ny + d2.y;
            if (inBound(nnx,nny) && visited.has(key(nnx,nny))) ncount++;
          }
          if (ncount <= 1) {
            visited.add(key(nx,ny));
            stack.push({x:nx,y:ny});
            break; // random walk: đi 1 hướng rồi đi tiếp
          }
        }
      }
    }
    
    if (path.length > bestPath.length) {
      bestPath = path;
    }
  }

  return bestPath;
}

function randomEmptyCell(excludeSet){
  while(true){
    let x = Math.floor(Math.random()*grid);
    let y = Math.floor(Math.random()*grid);

    if(!excludeSet.has(key(x,y)) && !isRail(x,y)){
      return {x,y};
    }
  }
}

function spawnRau(){
  const rate = Math.max(5, 18 - difficulty()*3);
  if (tick % rate !== 0) return;
  if (raus.length > 8) return; // tránh quá nhiều

  let tries = 0;
  while(tries < 20){
    let x = Math.floor(Math.random()*grid);
    let y = Math.floor(Math.random()*grid);

    // không trùng player, enemy, goal, rail, rau cũ
    if(
      !isRail(x,y) &&
      !raus.some(r=>r.x===x&&r.y===y) &&
      !(x===player.x&&y===player.y) &&
      !enemies.some(e=>e.x===x && e.y===y) &&
      !(x===goal.x&&y===goal.y)
    ){
      raus.push({x,y});
      break;
    }
    tries++;
  }
}

function generateRailSegments(pathSet){
  const railSet = new Set();

  const dirs = [
    {x:1,y:0},
    {x:-1,y:0},
    {x:0,y:1},
    {x:0,y:-1}
  ];

for(let i=0;i<30;i++){   // nhiều rail hơn rõ rệt
    let x = Math.floor(Math.random()*grid);
    let y = Math.floor(Math.random()*grid);

    if(pathSet.has(key(x,y))) continue;

    const d = dirs[Math.floor(Math.random()*dirs.length)];
    const length = 2 + Math.floor(Math.random()*5); // 2 → 5 ô

    let segment = [];

    for(let j=0;j<length;j++){
      let nx = x + d.x*j;
      let ny = y + d.y*j;

      if(!inBound(nx,ny)) break;
      if(pathSet.has(key(nx,ny))) break;

      segment.push({x:nx,y:ny});
    }

    // nếu đoạn hợp lệ (ít nhất 2 ô) thì thêm
    if(segment.length >= 2){
      segment.forEach(p=> railSet.add(key(p.x,p.y)));
    }
  }

  return Array.from(railSet).map(s=>{
    const [x,y] = s.split(',').map(Number);
    return {x,y};
  });
}


// ====== BUILD MAP ======
function buildMap() {
  rails = [];
  raus = [];

  // 1️⃣ chọn start random
  const start = {
    x: Math.floor(Math.random()*grid),
    y: Math.floor(Math.random()*grid)
  };

  const path = generatePath(start.x, start.y);
  const pathSet = new Set(path.map(p=>key(p.x,p.y)));

  player = {x:start.x, y:start.y, dirX:1, dirY:0, stuck:false, slowDuration: 0};

  // 2️⃣ goal là ô cuối path (xa nhất)
  goal = findFarthestCellFrom(player);

  // 3️⃣ sinh rail không đè path
  rails = generateRailSegments(pathSet);

  // 4️⃣ rau dọc path
  for (let i=3;i<path.length-3;i+=3){
    const p = path[i];
    raus.push({x:p.x,y:p.y});
  }

  // 5️⃣ spawn enemy tại ô thật sự đi được + có đường tới player
enemies = [];

// 🔥 ổ địch ở gần goal (khoảng cách 1-2 ô để đảm bảo không bị khóa quanh goal)
let validNests = [];
for (let dx = -2; dx <= 2; dx++) {
  for (let dy = -2; dy <= 2; dy++) {
    let x = goal.x + dx;
    let y = goal.y + dy;
    if (inBound(x, y) && !isRail(x,y) && !(x === goal.x && y === goal.y) && !(x === start.x && y === start.y)) {
      validNests.push({x, y});
    }
  }
}

if (validNests.length > 0) {
  // Chọn 1 vị trí ngẫu nhiên trong các vị trí hợp lệ
  enemyNest = validNests[Math.floor(Math.random() * validNests.length)];
} else {
  // Fallback: Nếu vì lý do nào đó không tìm được, lấy đại một ô trên đường đi (path)
  let fallbackIndex = Math.max(0, path.length - 2);
  enemyNest = { x: path[fallbackIndex].x, y: path[fallbackIndex].y };
}

// sinh bụi cỏ ngẫu nhiên
bushes = [];
for (let i = 0; i < grid; i++) {
  for (let j = 0; j < grid; j++) {
    // tỉ lệ 5% ô có bụi cỏ, tránh đè lên start, goal, rail và ổ địch
    if (Math.random() < 0.05 && 
        !(i === start.x && j === start.y) && 
        !(i === goal.x && j === goal.y) && 
        !(i === enemyNest.x && j === enemyNest.y) && 
        !isRail(i, j)) {
      bushes.push({x: i, y: j});
    }
  }
}

enemies.push({
  x: enemyNest.x,
  y: enemyNest.y,
  type: "normal",
  hp: 1
});

}

function isRail(x,y){
  return rails.some(r=>r.x===x&&r.y===y);
}

function difficulty(){
  return Math.min(6, Math.floor(score / 15)); 
  // mỗi 15 điểm tăng 1 level, max level 6
}

function isPlayerInBush() {
  return bushes.some(b => b.x === player.x && b.y === player.y);
}

const LOOP_DELAY = 150;     // tốc độ game (giảm từ 180 cho game mượt và nhanh hơn xíu)
const PLAYER_SPEED = 2;     // càng lớn càng chậm
const ENEMY_SPEED = 3;      // càng nhỏ càng nhanh (giảm từ 4 xuống 3 để quái nhanh hơn)

function throwNem(){
  if(nemAmmo <= 0) return;

  nemAmmo--;

  // tạo hiệu ứng viên đạn bay
  const BULLET_SPEED = 40;

  bullets.push({
    px: player.x*cell + cell/2,
    py: player.y*cell + cell/2,
    dx: nextDir.x,
    dy: nextDir.y,
    speed: BULLET_SPEED,
    life: Math.ceil(canvasSize / BULLET_SPEED) + 2
  });
}

function moveEnemies(){
  enemies.forEach(e=>{

    const baseSpeed = Math.max(2, 5 - Math.floor(difficulty() * 0.8)); // bắt đầu từ 5, giảm về tới 2
    const speed = (e.type === "tank") ? baseSpeed*2 : baseSpeed;
    if(tick % speed !== 0) return;

    // Ranged Enemy Logic
    if (e.type === "ranged") {
      // nếu thẳng hàng ngang hoặc dọc và player không trốn trong cỏ
      if (!isPlayerInBush() && (e.x === player.x || e.y === player.y) && Math.random() < 0.3) {
        // bắn đạn
        const dx = e.x === player.x ? 0 : (player.x > e.x ? 1 : -1);
        const dy = e.y === player.y ? 0 : (player.y > e.y ? 1 : -1);
        enemyBullets.push({
          px: e.x * cell + cell/2,
          py: e.y * cell + cell/2,
          dx: dx,
          dy: dy,
          type: "normal"
        });
        // Không move nếu bắn? Cứ cho move cũng được
      }
    }

    // Tank Enemy Logic (bắn đạn phá đường ray)
    if (e.type === "tank" && Math.random() < 0.2) {
      // Bắn 1 viên đạn hướng ngẫu nhiên để phá rail
      const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      const d = dirs[Math.floor(Math.random() * dirs.length)];
      enemyBullets.push({
        px: e.x * cell + cell/2,
        py: e.y * cell + cell/2,
        dx: d.x,
        dy: d.y,
        type: "tank" // đạn tank phá rào
      });
    }

    // Nếu người chơi ở trong bụi rậm, quái không tìm thấy => tuần tra quanh đích đến
    let target = {x: player.x, y: player.y};
    if (isPlayerInBush()) {
      target = {x: goal.x, y: goal.y};
    }

    const path = findPathBFS(
      {x:e.x, y:e.y},
      target,
      e.type === "tank"   // 🔥 tank có thể coi rail là đường đi
    );

    if(path && path.length){
      const next = path[0];

      // 🔥 nếu là tank và bước vào rail → phá rail
      if(e.type === "tank" && isRail(next.x, next.y)){
        rails = rails.filter(r=>!(r.x===next.x && r.y===next.y));
      }

      e.x = next.x;
      e.y = next.y;
    }
  });
}

function moveBullets(){
  bullets = bullets.filter(b=>{
    // cập nhật vị trí đạn mượt mà
    b.px += b.dx * 8;
    b.py += b.dy * 8;

    // ra khỏi map thì xoá
    if(
      b.px < 0 || 
      b.py < 0 || 
      b.px > canvasSize || 
      b.py > canvasSize
    ) return false;

    // kiểm tra va chạm với enemy (hitbox ô vuông)
    for(let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];

      const left   = e.x * cell;
      const right  = left + cell;
      const top    = e.y * cell;
      const bottom = top + cell;

      if(
        b.px >= left &&
        b.px <= right &&
        b.py >= top &&
        b.py <= bottom
      ){
        const ex = e.x * cell + cell/2;
        const ey = e.y * cell + cell/2;

        e.hp--;
        e.hitFlash = 4;

        spawnHitEffect(ex, ey);

        if(e.hp <= 0){
          spawnDeathEffect(ex, ey);
          enemies.splice(i, 1);
          addScore(e.type === "tank" ? 10 : 3);
        }

        return false; // xoá viên đạn
      }
    }

    return true; // giữ viên đạn
  });

  // ========== ĐẠN CỦA QUÁI ============
  enemyBullets = enemyBullets.filter(b => {
    b.px += b.dx * 6; // Đạn quái bay chậm hơn đạn người chơi chút
    b.py += b.dy * 6;

    // ra khỏi map thì xoá
    if(b.px < 0 || b.py < 0 || b.px > canvasSize || b.py > canvasSize) return false;

    const gridX = Math.floor(b.px / cell);
    const gridY = Math.floor(b.py / cell);

    // Đạn tank huỷ rail
    if (b.type === "tank" && isRail(gridX, gridY)) {
      rails = rails.filter(r => !(r.x === gridX && r.y === gridY));
      spawnHitEffect(b.px, b.py);
      return false; // xoá đạn
    }

    // Đạn thường hoặc tank chạm player
    if (!isPlayerInBush()) {
      const left   = player.x * cell;
      const right  = left + cell;
      const top    = player.y * cell;
      const bottom = top + cell;

      if(b.px >= left && b.px <= right && b.py >= top && b.py <= bottom){
         spawnHitEffect(player.x * cell + cell/2, player.y * cell + cell/2);
         player.slowDuration = 20; // Làm chậm người chơi trong 20 tick (3s)
         return false;
      }
    }

    return true;
  });
}


function spawnHitEffect(x,y){
  for(let i=0;i<6;i++){
    effects.push({
      x,y,
      dx:(Math.random()-0.5)*4,
      dy:(Math.random()-0.5)*4,
      life:10,
      color:"orange"
    });
  }
}

function spawnDeathEffect(x,y){
  for(let i=0;i<18;i++){
    effects.push({
      x,y,
      dx:(Math.random()-0.5)*8,
      dy:(Math.random()-0.5)*8,
      life:22,
      color: i%2?"red":"yellow"
    });
  }
}



// ====== CONTROL ======
function cowControl(e){

  // ❌ Nếu không ở trạng thái playing → bỏ qua toàn bộ phím
  if(cowGameState !== "playing") return;

  // ===== SPACE: chỉ phá rail khi đang chơi =====
  if(e.code === "Space"){
    breakRail();
    return;
  }

  if((e.key && e.key.toLowerCase() === "f") || e.code === "KeyF"){
    throwNem();
  }


  // ===== điều hướng =====
  if(e.key==="ArrowUp"||e.key==="w")   nextDir = {x:0,y:-1};
  if(e.key==="ArrowDown"||e.key==="s") nextDir = {x:0,y:1};
  if(e.key==="ArrowLeft"||e.key==="a") nextDir = {x:-1,y:0};
  if(e.key==="ArrowRight"||e.key==="d")nextDir = {x:1,y:0};
}

// ====== MOVE PLAYER ======
function movePlayer(){

  // ✅ LUÔN cập nhật hướng NGAY
  player.dirX = nextDir.x;
  player.dirY = nextDir.y;

  // Giảm thời gian slow
  if (player.slowDuration > 0) {
    player.slowDuration--;
  }

  // ❗ Chỉ giới hạn bước đi, không giới hạn đổi hướng
  const currentSpeed = player.slowDuration > 0 ? 4 : PLAYER_SPEED; // Chậm gấp 2 lần bình thường (2->4)
  if(tick % currentSpeed !== 0) return;

  let nx = player.x + player.dirX;
  let ny = player.y + player.dirY;

  if(inBound(nx,ny) && !isRail(nx,ny)){
    player.x = nx;
    player.y = ny;
    player.stuck = false;
  }else{
    player.stuck = true;
  }
}


// ====== PHÁ RAIL ======
function breakRail(){
  if(cowPower <= 0) return;

  // ô ngay trước mặt theo hướng đang đi
  const targetX = player.x + player.dirX;
  const targetY = player.y + player.dirY;

  if(!inBound(targetX, targetY)) return;

  let broke = false;

  rails = rails.filter(r=>{
    if(r.x === targetX && r.y === targetY){
      broke = true;
      return false; // xóa đúng 1 ô này
    }
    return true;
  });

  if(broke){
    cowPower--;
    addScore(1);   // ✅
    document.getElementById("cowPower").innerText = cowPower;
  }
}

function findPathBFS(start, target, canBreakRail=false){
  const queue = [start];
  const visited = new Set([key(start.x,start.y)]);
  const parent = {};

  const dirs = [
    {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
  ];

  while(queue.length){
    const cur = queue.shift();

    if(cur.x === target.x && cur.y === target.y){
      let path = [];
      let k = key(cur.x,cur.y);

      while(parent[k]){
        const [px,py] = k.split(',').map(Number);
        path.push({x:px,y:py});
        k = parent[k];
      }

      path.reverse();
      return path;
    }

    for(let d of dirs){
      let nx = cur.x + d.x;
      let ny = cur.y + d.y;
      let k2 = key(nx,ny);

      // 🔥 tank được đi xuyên rail
      if(
        inBound(nx,ny) &&
        (canBreakRail || !isRail(nx,ny)) &&
        !visited.has(k2)
      ){
        visited.add(k2);
        parent[k2] = key(cur.x,cur.y);
        queue.push({x:nx,y:ny});
      }
    }
  }

  return null;
}


function railMap(){
  const map = new Set(rails.map(r=>key(r.x,r.y)));
  return map;
}

function railType(x,y,map){
  const up = map.has(key(x,y-1));
  const down = map.has(key(x,y+1));
  const left = map.has(key(x-1,y));
  const right = map.has(key(x+1,y));

  return {up,down,left,right};
}

function findFarthestCellFrom(start){
  const queue = [start];
  const visited = new Set([key(start.x,start.y)]);
  let farthest = start;

  const dirs = [
    {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
  ];

  while(queue.length){
    const cur = queue.shift();
    farthest = cur;

    for(let d of dirs){
      let nx = cur.x + d.x;
      let ny = cur.y + d.y;
      let k2 = key(nx,ny);

      if(inBound(nx,ny) && !isRail(nx,ny) && !visited.has(k2)){
        visited.add(k2);
        queue.push({x:nx,y:ny});
      }
    }
  }

  return farthest;
}

  }

}

function initTaiXiuHistory() {
  // Sinh sẵn 11 kết quả ban đầu nếu rỗng (Khởi tạo sinh động)
  if (diceHistory.length === 0) {
    for (let i = 0; i < 11; i++) {
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      const d3 = Math.floor(Math.random() * 6) + 1;
      const tot = d1 + d2 + d3;
      const res = tot >= 11 ? "tai" : "xiu";
      diceHistory.push({ dice: [d1, d2, d3], total: tot, result: res });
    }
  }

  // Vẽ danh sách lịch sử ban đầu
  const historyContainer = document.getElementById("taixiuHistoryList");
  if (historyContainer) {
    historyContainer.innerHTML = [...diceHistory].reverse().map(h => `
      <div class="taixiu-history-bubble bubble-${h.result}"
        title="🎲 ${getDiceEmoji(h.dice[0])} ${getDiceEmoji(h.dice[1])} ${getDiceEmoji(h.dice[2])} = ${h.total}">
      </div>
    `).join('');
  }
}

function enableDiceCoverDrag(dice1, dice2, dice3, total, result) {
  const cover = document.getElementById("diceCover");
  const container = document.getElementById("resultContainer");
  const msgPanel = document.getElementById("taixiuMessage");

  let isDragging = false;
  let startX = 0, startY = 0;

  function handleStart(x, y) {
    isDragging = true;
    startX = x;
    startY = y;
    cover.style.cursor = "grabbing";
    cover.style.transition = "none";
  }

  function handleMove(x, y) {
    if (!isDragging) return;
    const dx = x - startX;
    const dy = y - startY;
    cover.style.transform = `translate(${dx}px, ${dy}px)`;

    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance > 60) {
      cover.style.opacity = "0";
      setTimeout(() => cover.remove(), 200);

      // Cập nhật lịch sử
      diceHistory.unshift({ dice: [dice1, dice2, dice3], total, result });
      if (diceHistory.length > 14) diceHistory.pop();

      const historyContainer = document.getElementById("taixiuHistoryList");
      if (historyContainer) {
        historyContainer.innerHTML = [...diceHistory].reverse().map(h => `
          <div class="taixiu-history-bubble bubble-${h.result}"
            title="🎲 ${getDiceEmoji(h.dice[0])} ${getDiceEmoji(h.dice[1])} ${getDiceEmoji(h.dice[2])} = ${h.total}">
          </div>
        `).join('');
      }

      // Hiện message kết quả
      if (msgPanel) {
         msgPanel.innerHTML = msgPanel.dataset.msg;
         msgPanel.style.color = msgPanel.dataset.color;
      }
      
      if (container && container.dataset.result) {
        container.classList.add(container.dataset.result);
      }
      
      // Ngắt kéo
      isDragging = false;
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);
      document.ontouchmove = document.ontouchend = null;
    }
  }


  function handleEnd() {
    isDragging = false;
    cover.style.cursor = "grab";
  }

  // 🖱 Cho máy tính
  cover.onmousedown = e => {
    handleStart(e.clientX, e.clientY);
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
  };
  
  function handleMouseMove(e) {
    handleMove(e.clientX, e.clientY);
  }
  
  function handleMouseUp() {
    handleEnd();
    document.removeEventListener('mousemove', handleMouseMove);
    document.removeEventListener('mouseup', handleMouseUp);
  }

  // 🤳 Cho điện thoại
  cover.addEventListener('touchstart', function(e) {
    const touch = e.touches[0];
    handleStart(touch.clientX, touch.clientY);
  }, { passive: true });

  cover.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    const touch = e.touches[0];
    handleMove(touch.clientX, touch.clientY);
    e.preventDefault(); // Ngăn cuộn trang
  }, { passive: false });

  cover.addEventListener('touchend', function(e) {
    handleEnd();
  });
}

function animateClouds() {
  if (!aviatorRunning) {
    window.cloudRafId = null;
    return;
  }
  if (!window._cloudLayersCached) {
    window._cloudLayersCached = [document.getElementById('cloudLayer1'), document.getElementById('cloudLayer2'), document.getElementById('cloudLayer3')];
  }
  window._cloudLayersCached.forEach(layer => {
    if (!layer) return;
    Array.from(layer.children).forEach(cloud => {
      let left = parseFloat(cloud.style.left);
      const speed = parseFloat(cloud.dataset.speed);
      left -= speed;
      if (left < -20) left = 120; // nếu bay ra khỏi màn hình thì loop lại bên phải
      cloud.style.left = left + '%';
    });
  });
  window.cloudRafId = requestAnimationFrame(animateClouds);
}

function generateCrashPoint(bet) {
  const random = Math.random();

  // --- BET RẤT LỚN (≥1000) ---
  if (bet >= 1000) {
    if (random < 0.80) {
      // 80%: crash trong khoảng 1.00–1.02
      return 1 + Math.random() * 0.02;
    }
    if (random < 1.00) {
      // 20% còn lại: crash trong khoảng 1.02–1.05
      return 1.02 + Math.random() * 0.02;
    }
  }

  // --- BET LỚN (≥500) ---
  if (bet >= 500) {
    if (random < 0.60) return 1 + Math.random() * 0.05;
    if (random < 0.85) return 1.05 + Math.random() * 0.10;
    if (random < 0.95) return 1.15 + Math.random() * 0.20;
    return 1.35 + Math.random() * 0.50;
  }

  // --- BET VỪA (≥50) ---
  if (bet >= 50) {
    if (random < 0.12) return 1 + Math.random() * 0.05;
    if (random < 0.25) return 1.05 + Math.random() * 0.15;
    if (random < 0.55) return 1.2 + Math.random() * 0.3;
    if (random < 0.75) return 1.5 + Math.random() * 0.5;
    if (random < 0.90) return 2 + Math.random();
    if (random < 0.97) return 3 + Math.random();
    return 5 + Math.random() * 2;
  }

  // --- BET NHỎ ---
  if (random < 0.15) return 1 + Math.random() * 0.05;
  if (random < 0.30) return 1.05 + Math.random() * 0.15;
  if (random < 0.60) return 1.2 + Math.random() * 0.3;
  if (random < 0.80) return 1.5 + Math.random() * 0.5;
  if (random < 0.90) return 2 + Math.random();
  if (random < 0.97) return 3 + Math.random() * 2;
  return 5 + Math.random() * 5;
}


let aviatorChartData = [];

function drawAviatorChart() {
  const canvas = document.getElementById("aviatorChartCanvas");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const containerWidth = canvas.parentElement.clientWidth;
  
  canvas.width = containerWidth;
  canvas.height = 100; // Tăng nhẹ chiều cao
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Background (Gradient nhẹ, hiện đại)
  const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGradient.addColorStop(0, "#fefce8"); // vàng nhạt nhẹ
  bgGradient.addColorStop(1, "#fff");
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 2. Grid lines (Sắc nét)
  ctx.strokeStyle = "#e5e7eb";
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  // Ngang
  for (let i = 0; i <= 5; i++) {
    let y = (canvas.height / 5) * i;
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
  }
  // Dọc
  for (let i = 0; i <= 10; i++) {
    let x = (canvas.width / 10) * i;
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
  }
  ctx.stroke();

  if (aviatorChartData.length < 2) return;

  // Xóa đi hàm limit aviatorChartData length ở game thực nếu có, ở đây drawAviatorChart tự xử lý.
  const maxVal = Math.max(...aviatorChartData, 1.01);
  const minVal = 1.0;
  
  function getY(multiplier) {
    if (maxVal <= minVal) return canvas.height;
    // Map dốc cong (quadratic)
    const progress = (multiplier - minVal) / (maxVal - minVal);
    // return = height - (height * sqrt(progress)) hoặc linear.
    // Vì log multiplier là đường thẳng nếu tăng mũ, nên để cong mềm thì linear progress là OK.
    return canvas.height - (canvas.height * progress * 0.9); // Để lại chút đỉnh
  }

  // 3. Đường đồ thị (Smoothed Path - Bezier)
  ctx.beginPath();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#f59e0b"; // Cam hiện đại
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // Chiều rộng động theo dữ liệu nếu dữ liệu tăng dài
  const stepX = canvas.width / Math.max(aviatorChartData.length - 1, 1);
  
  // Bắt đầu
  ctx.moveTo(0, getY(aviatorChartData[0]));

  // Vẽ Bezier curve
  for (let i = 1; i < aviatorChartData.length - 1; i++) {
    const x = i * stepX;
    const y = getY(aviatorChartData[i]);
    const nextX = (i + 1) * stepX;
    const nextY = getY(aviatorChartData[i + 1]);
    
    // Control points
    const cpX1 = x + (nextX - x) / 2;
    const cpY1 = y;
    const cpX2 = x + (nextX - x) / 2;
    const cpY2 = nextY;
    
    ctx.bezierCurveTo(cpX1, cpY1, cpX2, cpY2, nextX, nextY);
  }
  ctx.stroke();

  // 4. Gradient Fill (Vùng dưới đồ thị)
  const lastX = (aviatorChartData.length - 1) * stepX;
  ctx.lineTo(lastX, canvas.height);
  ctx.lineTo(0, canvas.height);
  const fillGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  fillGradient.addColorStop(0, "rgba(245, 158, 11, 0.2)");
  fillGradient.addColorStop(1, "rgba(245, 158, 11, 0)");
  ctx.fillStyle = fillGradient;
  ctx.fill();

      // 5. HIỆN THÔNG BÁO KẾT QUẢ/TRẠNG THÁI TRÊN CANVAS
      // Giữ thông báo nổ/thắng cho đến khi bắt đầu lượt mới
      if (aviatorFinished && (aviatorCrashed || aviatorCashedOut)) {
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 20px sans-serif";
          ctx.textAlign = "center";
          
          if (aviatorCrashed) {
              ctx.fillStyle = "#ef4444";
              ctx.fillText(`💥 Nổ: x${aviatorCrashPoint.toFixed(2)}`, canvas.width / 2, canvas.height / 2);
          } else if (aviatorCashedOut) {
              ctx.fillStyle = "#22c55e";
              ctx.fillText(`✅ Nhận: x${aviatorMultiplier.toFixed(2)}!`, canvas.width / 2, canvas.height / 2);
          }
      }

  // 6. Điểm cuối có hiệu ứng radar
  const latestX = lastX;
  const latestY = getY(aviatorChartData[aviatorChartData.length - 1]);
  const pulseRadius = 4 + Math.sin(Date.now() / 150) * 2;

  ctx.beginPath();
  ctx.arc(latestX, latestY, pulseRadius, 0, 2 * Math.PI);
  ctx.fillStyle = "#ff5722";
  ctx.shadowBlur = 15;
  ctx.shadowColor = "rgba(255, 87, 34, 0.8)";
  ctx.fill();
}

function fireMissile(isHit = false) {
  const container = document.getElementById("missileContainer");
  const flightArea = document.getElementById("aviatorFlightArea");
  if (!container || !flightArea) return;

  const flightWidth = flightArea.clientWidth;

  const missile = document.createElement("div");
  missile.classList.add("missile");
  missile.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/128/4260/4260614.png" style="width: 25px; transform: rotate(-10deg);">`;

  const startTop = 10 + Math.random() * 60;
  missile.style.top = `${startTop}px`;
  missile.style.left = `${flightWidth + 20}px`;
  missile.style.position = "absolute";
  container.appendChild(missile);

  setTimeout(() => {
    if (isHit && plane) {
      const planeRect = plane.getBoundingClientRect();
      const missileRect = missile.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();

      const targetX = planeRect.left + planeRect.width / 2 - containerRect.left;
      const targetY = planeRect.top + planeRect.height / 2 - containerRect.top;

      const missileX = missileRect.left + missileRect.width / 2 - containerRect.left;
      const missileY = missileRect.top + missileRect.height / 2 - containerRect.top;

      const deltaX = missileX - targetX;
      const deltaY = missileY - targetY;

      missile.style.transition = "transform 1.2s linear";
      missile.style.transform = `translate(${-deltaX}px, ${-deltaY}px)`;

      // Khi gần đến nơi -> tạo hiệu ứng nổ + sóng xung kích
      setTimeout(() => {
        createExplosion(targetX, targetY);
        plane.style.transition = "transform 0.3s ease-in-out";
        plane.style.transform += " scale(1.5) rotate(720deg)";
        plane.innerHTML = "💥";
      }, 1100);

    } else {
      missile.style.transition = "transform 1.2s linear";
      missile.style.transform = `translateX(-${flightWidth + 100}px)`;
    }
  }, 10);

  setTimeout(() => {
    missile.remove();
  }, 1500);

  // Hàm tạo vụ nổ + nhiều sóng xung kích rõ ràng
  function createExplosion(x, y) {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => createShockwave(x, y, i), i * 100);
    }
  }

  function createShockwave(x, y, index) {
    const shockwave = document.createElement("div");
    shockwave.style.position = "absolute";
    shockwave.style.left = `${x - 40}px`;
    shockwave.style.top = `${y - 40}px`;
    shockwave.style.width = "80px";
    shockwave.style.height = "80px";
    shockwave.style.borderRadius = "50%";
    shockwave.style.border = "3px solid rgba(255,255,255,0.9)";
    shockwave.style.boxShadow = "0 0 20px rgba(255,0,0,0.8), inset 0 0 15px rgba(255,0,0,0.7)";
    shockwave.style.transform = "scale(0)";
    shockwave.style.opacity = "1";
    shockwave.style.transition = "transform 0.6s ease-out, opacity 0.6s ease-out";
    shockwave.style.zIndex = "999";
    container.appendChild(shockwave);

    setTimeout(() => {
      shockwave.style.transform = "scale(5)";
      shockwave.style.opacity = "0";
    }, 10);

    setTimeout(() => {
      shockwave.remove();
    }, 700);
  }
}
