let idlePlaneInterval = null;

function startIdlePlaneAnimation() {
  clearInterval(idlePlaneInterval);

  const plane = document.getElementById("aviatorPlane");
  const flightArea = document.getElementById("aviatorFlightArea");
  if (!plane || !flightArea) return;

  let x = 0;
  let direction = 1;
  idlePlaneInterval = setInterval(() => {
    const time = Date.now();

    // Bay qua trái/phải rồi quay lại
    const speed = 1.2; // tốc độ bay
    x += direction * speed;
    const maxX = flightArea.clientWidth - 40;
    if (x > maxX || x < 0) direction *= -1;

    // Hiệu ứng nhào lộn mạnh tay hơn
    const offsetY = Math.sin(time / 350) * 20;
    const roll = Math.sin(time / 200) * 15; // nghiêng máy bay như nhào lộn
    const scale = 1 + Math.sin(time / 800) * 0.05;

    plane.style.transform = `translate(${x}px, ${offsetY}px) rotate(${roll}deg) scale(${scale})`;
  }, 50);
}

let idleChartInterval = null;

function startIdleChartAnimation() {
  clearInterval(idleChartInterval);
  aviatorChartData = [1.0];
  let idleTime = 0;
  idleChartInterval = setInterval(() => {
    idleTime += 0.12;
    const fakeMultiplier = 1.0 + Math.abs(Math.sin(idleTime) * 0.5);
    aviatorChartData.push(fakeMultiplier);
    if (aviatorChartData.length > 100) aviatorChartData.shift();
    drawAviatorChart();
  }, 120); // tốc độ giả vừa đủ mượt
}

    if (iconWrapper) iconWrapper.innerHTML = `<div class="spinner" style="width: 24px; height: 24px; border-width: 3px; display: inline-block;"></div>`;

      popup.classList.remove("show"); 
      yesBtn.disabled = false;
      yesBtn.innerHTML = "Xác nhận";
      if (iconWrapper) iconWrapper.innerHTML = `🛒`; // Reset icon

      if (res.success) {
        shootConfetti(); // Hiệu ứng tung hoa
        showToastNotification("✅ Đổi quà thành công!");
        refreshUserPoints();
        
        // Kiểm tra và nâng cấp VIP nhanh nếu có
        if (itemName.toLowerCase().includes("vip")) {
          const email = sessionStorage.getItem("userEmail");
          if (email) {
            google.script.run.withSuccessHandler(role => {
              const userRole = (role || "").toUpperCase();
              if (userRole !== currentUserRole) {
                currentUserRole = userRole;
                localStorage.setItem("cached_userRole", userRole);
                updateVipBadgeUI(userRole);
              }
            }).getUserRole(email);
          }
        }
      }
      
      // Hiện popup kết quả sau 1 chút delay để thấy confetti
      setTimeout(() => {
        showStoreMessage(res.message);
      }, res.success ? 800 : 0);
      
    }).purchaseItem(itemName);
  };
}

function shootConfetti() {
  if (typeof confetti === 'function') {
    var count = 200;
    var defaults = {
      origin: { y: 0.7 },
      zIndex: 10000
    };

    function fire(particleRatio, opts) {
      confetti(Object.assign({}, defaults, opts, {
        particleCount: Math.floor(count * particleRatio)
      }));
    }

    fire(0.25, { spread: 26, startVelocity: 55 });
    fire(0.2, { spread: 60 });
    fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
    fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
    fire(0.1, { spread: 120, startVelocity: 45 });
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const giftBox = document.getElementById('giftBox');
  const giftMessage = document.getElementById('giftMessage');
  let ready = false;
  let countdownInterval;
  const waitTime = 900000; // test: 3s (thật: 900000 = 15 phút)

  function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes}:${seconds.toString().padStart(2, '0')}`;
  }

  function startCountdown(duration) {
    let timeLeft = duration;
    giftMessage.style.display = 'block';
    updateCountdown();

    countdownInterval = setInterval(() => {
      timeLeft -= 1000;
      if (timeLeft <= 0) {
        clearInterval(countdownInterval);
        enableGift();
      } else {
        updateCountdown();
      }
    }, 1000);

    function updateCountdown() {
      giftMessage.textContent = `🎁 Nhận sau: ${formatTime(timeLeft)}`;
    }
  }

  function enableGift() {
    ready = true;
    giftBox.classList.add('ready');
    giftBox.title = "Nhấn để nhận quà!";
    giftMessage.textContent = 'Nhấn để nhận quà!';
    giftBox.style.cursor = 'pointer';
  }

  function disableGift() {
    ready = false;
    giftBox.classList.remove('ready');
    giftBox.title = "Chưa đủ thời gian nhận quà";
    giftMessage.style.display = 'none';
    giftMessage.textContent = '';
    giftBox.style.cursor = 'not-allowed';
  }

  // Loading
  function showLoading() {
    giftMessage.textContent = '⏳ Đang nhận quà...';
    giftBox.style.filter = 'grayscale(80%)';
    giftBox.style.cursor = 'wait';
  }

  // Hiển thị kết quả
  function showReceived(points) {
    giftMessage.style.display = 'block';
    if (points >= 0) {
      giftMessage.textContent = `🎉 Bạn nhận được +${points} 🪙!`;
    } else {
      giftMessage.textContent = `😢 Bạn bị mất ${Math.abs(points)} 🪙!`;
    }
    giftBox.style.filter = 'none';
    giftBox.style.cursor = 'default';
  }

  // Reset sau khi hiện kết quả 3 giây
  function resetGiftAfterReward() {
    setTimeout(() => {
      disableGift();
      startCountdown(waitTime);
    }, 3000);
  }

  // Khởi đầu
  disableGift();
  startCountdown(waitTime);

  // Kéo thả & Click mượt mà
  makeElementDraggable(giftBox, (moved) => {
    if (!moved) {
      if (!ready) return;
      ready = false; // 🚨 khóa ngay khi click
      showLoading();

      const email = sessionStorage.getItem("userEmail");

    // Rewards logic pushed to server

    google.script.run.withSuccessHandler((res) => {
        clearInterval(countdownInterval);
        if (!res || !res.success) {
           giftMessage.textContent = res.message || "Không thể nhận quà lúc này.";
           giftBox.style.filter = 'none';
           giftBox.style.cursor = 'default';
           resetGiftAfterReward();
           return;
        }

        showReceived(res.diff);
        if (typeof updatePointDisplay === "function") {
           updatePointDisplay(res.newTotal);
        } else if (typeof refreshUserPoints === "function") {
           refreshUserPoints();
        }
        resetGiftAfterReward();
    }).claimGiftBoxSecure();
    }
  });
});
