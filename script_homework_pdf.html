<script>
// ==========================================
// HOMEWORK PERSISTENCE & GRADING SYSTEM
// ==========================================
let currentHomeworkFileId = "";
let currentHomeworkFileTitle = "";
let allAdminHomeworkSubmissions = [];

// 1. Sidebar Panel Toggling
window.toggleHomeworkPanel = function(fileId, fileTitle) {
  const panel = document.getElementById("homeworkPanel");
  if (!panel) return;
  
  const isActive = panel.classList.toggle("active");
  if (isActive) {
    // Close QA panel to prevent overlapping
    const qaPanel = document.getElementById("qaPanel");
    if (qaPanel) qaPanel.classList.remove("active");
    
    if (fileId) {
      currentHomeworkFileId = fileId;
      currentHomeworkFileTitle = fileTitle || "";
      loadHomeworkData(fileId, fileTitle);
    }
  }
};

// 2. Load Student Homework Content
window.loadHomeworkData = function(fileId, fileTitle, silent) {
  const contentDiv = document.getElementById("homeworkContent");
  if (!contentDiv) return;
  
  if (!silent) {
    contentDiv.innerHTML = `<div style="text-align: center; padding: 30px;"><div class="spinner" style="margin: 0 auto;"></div><div style="margin-top: 10px; color: #64748b; font-size: 0.85rem;">Đang tải thông tin BTVN...</div></div>`;
  }
  
  // Guard against missing google.script.run functions due to older browser cached sessions or delayed deploys
  if (!window.google || !window.google.script || !window.google.script.run || typeof window.google.script.run.getHomeworkData !== "function") {
    contentDiv.innerHTML = `
      <div style="padding: 16px; text-align: left; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 12px; color: #9f1239; margin-top: 10px;">
        <h4 style="font-weight: bold; margin-bottom: 6px; font-size: 0.9rem;">⚠️ Chưa cập nhật Apps Script</h4>
        <p style="font-size: 0.8rem; line-height: 1.4; margin-bottom: 10px; color: #475569;">
          Hệ thống Apps Script của bạn chưa đồng bộ xong hàm BTVN mới hoặc phiên trình duyệt hiện tại đang chạy code cũ.
        </p>
        <div style="font-size: 0.75rem; color: #be123c; background: rgba(254, 226, 226, 0.5); padding: 10px; border-radius: 8px; border: 1px dashed rgba(239, 68, 68, 0.3);">
          <strong>👉 Hướng dẫn Khắc phục nhanh:</strong>
          <ol style="margin-left: 18px; margin-top: 6px; padding-left: 0; display: flex; flex-direction: column; gap: 4px; list-style-type: decimal;">
            <li><strong>Tải lại trang (F5)</strong> trình duyệt để cập nhật giao diện mới.</li>
            <li>Nếu chạy Web App thật, hãy mở Apps Script bấm <strong>"Triển khai" -> "Quản lý lượt triển khai" -> Edit -> chọn phiên bản "Mới nhất"</strong> hoặc bấm <strong>"Triển khai mới" (New Deployment)</strong> để kích hoạt.</li>
          </ol>
        </div>
      </div>
    `;
    return;
  }

  const showAll = (document.getElementById("adminHomeworkShowAllCheckbox") && document.getElementById("adminHomeworkShowAllCheckbox").checked);

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) {
        renderHomeworkPanel(fileId, fileTitle, res.note, res.submission, res.allSubmissionsOfFile, res.deadline, res.answerKey, res.numQuestions, res.pointsPerQuestion);
      } else {
        contentDiv.innerHTML = `<div class="qa-error" style="color:#ef4444; padding:10px; font-weight:bold;">❌ Lỗi: ${res.message}</div>`;
      }
    })
    .withFailureHandler(function(err) {
      contentDiv.innerHTML = `<div class="qa-error" style="color:#ef4444; padding:10px; font-weight:bold;">❌ Lỗi kết nối: ${err.message}</div>`;
    })
    .getHomeworkData(fileId, showAll);
};

// 3. Render Homework Panel (Dynamic Student vs Teacher layouts)
window.renderHomeworkPanel = function(fileId, fileTitle, note, submission, allSubmissionsOfFile, deadline, answerKey, numQuestions, pointsPerQuestion) {
  const contentDiv = document.getElementById("homeworkContent");
  if (!contentDiv) return;
  
  window.lastHomeworkRenderArgs = [fileId, fileTitle, note, submission, allSubmissionsOfFile, deadline, answerKey, numQuestions, pointsPerQuestion];
  window.currentHomeworkPanelSubmissions = allSubmissionsOfFile || [];
  window.currentHomeworkAnswerKeyHtml = answerKey || "";
  window.currentHomeworkOriginalFileId = fileId || "";
  window.currentHomeworkSubmissionUrl = (submission && submission.fileUrl) ? submission.fileUrl : "";
  
  const isDark = document.body.classList.contains("dark-mode");
  
  // Adaptive Style Variables for Dark Mode
  const bgCard = isDark ? "#1e293b" : "#f8fafc";
  const bgCardSub = isDark ? "#0f172a" : "white";
  const borderCard = isDark ? "#334155" : "#e2e8f0";
  const textTitle = isDark ? "#f8fafc" : "#1e293b";
  const textDesc = isDark ? "#cbd5e1" : "#475569";
  const textMuted = isDark ? "#94a3b8" : "#64748b";
  const bgGreen = isDark ? "rgba(16, 185, 129, 0.15)" : "#ecfdf5";
  const borderGreen = isDark ? "rgba(16, 185, 129, 0.3)" : "#a7f3d0";
  const textGreen = isDark ? "#34d399" : "#047857";
  const textGreenSub = isDark ? "#a7f3d0" : "#065f46";
  const inputBg = isDark ? "#0f172a" : "white";
  const inputBorder = isDark ? "#334155" : "#cbd5e1";
  const inputText = isDark ? "#f8fafc" : "#1e293b";

  const isAdmin = (window.currentUserRole === "ADMIN" || (typeof currentUserRole !== 'undefined' && currentUserRole === "ADMIN"));
  let html = "";
  
  if (isAdmin) {
    // --- ADMIN / TEACHER VIEW ---
    html += `
      <div style="background: ${bgCard}; border: 1px solid ${borderCard}; border-radius: 16px; padding: 20px; text-align: left; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        
        <!-- Header -->
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid ${borderCard}; padding-bottom: 12px;">
          <span style="font-size: 1.2rem;">📋</span>
          <div>
            <h4 style="margin: 0; font-size: 0.9rem; font-weight: 800; color: ${textTitle}; text-transform: uppercase; letter-spacing: 0.5px;">Giao Bài Tập & Báo Bài</h4>
            <p style="margin: 2px 0 0 0; font-size: 0.7rem; color: ${textMuted}; font-weight: 500;">Thiết lập yêu cầu, số câu hỏi và thời hạn nộp bài</p>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <!-- Group 1: Note -->
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 0.72rem; font-weight: 800; color: ${textDesc}; text-transform: uppercase; letter-spacing: 0.5px;">📝 Nội dung yêu cầu BTVN</label>
            <textarea id="adminHomeworkNoteInput" placeholder="Nhập yêu cầu BTVN (VD: Làm bài 1,2,3 trang 15-18 sách giáo khoa)..." style="width: 100%; height: 90px; padding: 10px 12px; border: 1px solid ${inputBorder}; border-radius: 10px; font-size: 0.85rem; line-height: 1.4; resize: vertical; box-sizing: border-box; outline:none; background: ${inputBg}; color: ${inputText}; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10b981';" onblur="this.style.borderColor='${inputBorder}';">${note || ""}</textarea>
          </div>
          
          <!-- Group 2: Questions Count -->
          <div style="display: grid; grid-template-columns: 1fr; gap: 16px;">
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <label style="font-size: 0.72rem; font-weight: 800; color: ${textDesc}; text-transform: uppercase; letter-spacing: 0.5px;">🔢 Số câu hỏi BTVN</label>
              <input type="number" id="adminHomeworkNumQuestionsInput" min="0" value="${numQuestions || 0}" oninput="window.onAdminHomeworkNumQuestionsChange()" style="width: 100%; padding: 10px 12px; border: 1px solid ${inputBorder}; border-radius: 10px; font-size: 0.85rem; font-weight: 600; box-sizing: border-box; outline:none; background: ${inputBg}; color: ${inputText}; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10b981';" onblur="this.style.borderColor='${inputBorder}';" />
            </div>
          </div>

          <!-- Dynamic Homework Question Max Points Configuration Card -->
          <div id="adminHomeworkPointsConfigWrapper" style="display: none; border: 1px solid ${borderCard}; border-radius: 12px; padding: 12px; background: ${bgCardSub}; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; gap: 8px;">
              <label style="font-size: 0.72rem; font-weight: 800; color: ${textDesc}; text-transform: uppercase; letter-spacing: 0.5px; margin: 0;">🔧 Điểm từng câu</label>
              <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                <span style="font-size: 0.68rem; color: ${textMuted}; font-weight: 600; white-space: nowrap;">Gán nhanh:</span>
                <input type="number" id="adminHomeworkQuickSetPoints" step="any" min="0" placeholder="1" style="width: 40px; height: 22px; padding: 1px 3px; border: 1px solid ${inputBorder}; border-radius: 5px; font-size: 0.75rem; text-align: center; font-weight: bold; background: ${inputBg}; color: ${inputText}; outline: none;" oninput="window.quickSetAdminHomeworkPoints()" />
                <span style="font-size: 0.68rem; color: ${textMuted}; font-weight: bold; white-space: nowrap;">đ/câu</span>
              </div>
            </div>
            <div id="adminHomeworkPointsConfigContainer" style="max-height: 140px; overflow-y: auto; border: 1px solid ${inputBorder}; border-radius: 8px; padding: 8px; background: ${isDark ? '#0f172a' : '#f8fafc'}; display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);">
              <!-- Rendered dynamically -->
            </div>
          </div>

          <!-- Group 3: Deadline -->
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 0.72rem; font-weight: 800; color: ${textDesc}; text-transform: uppercase; letter-spacing: 0.5px;">⏰ Hạn Nộp Bài (Nếu có)</label>
            <input type="datetime-local" id="adminHomeworkDeadlineInput" value="${deadline || ""}" style="width: 100%; padding: 10px 12px; border: 1px solid ${inputBorder}; border-radius: 10px; font-size: 0.85rem; font-weight: 600; font-family: inherit; box-sizing: border-box; outline:none; background: ${inputBg}; color: ${inputText}; transition: border-color 0.2s;" onfocus="this.style.borderColor='#10b981';" onblur="this.style.borderColor='${inputBorder}';" />
          </div>
          
          <!-- Save Button -->
          <button id="adminSaveHomeworkBtn" onclick="saveHomeworkNote('${fileId}', '${fileTitle.replace(/'/g, "\\'")}')" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color:white; border:none; padding:12px; border-radius: 10px; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: all 0.2s; width:100%; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2); display: flex; align-items: center; justify-content: center; gap: 6px;" onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 6px 8px -1px rgba(16, 185, 129, 0.3)';" onmouseout="this.style.transform='none'; this.style.boxShadow='0 4px 6px -1px rgba(16, 185, 129, 0.2)';">
            <span>💾 Lưu Báo Bài & Hạn Nộp</span>
          </button>
        </div>
      </div>

      <!-- Part B: Students Submissions List of this Lecture -->
      <div style="display:flex; flex-direction:column; gap:10px; text-align:left;">
        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid ${borderCard}; padding-bottom: 8px; margin-bottom: 4px;">
          <div style="font-size:0.75rem; font-weight:800; color:${textDesc}; text-transform:uppercase; letter-spacing:0.5px;">📂 Học sinh nộp bài</div>
          <span style="font-size:0.7rem; font-weight:700; background: ${isDark ? '#334155' : '#f1f5f9'}; color: ${textDesc}; padding: 2px 8px; border-radius: 12px;">${allSubmissionsOfFile ? allSubmissionsOfFile.length : 0} bài</span>
        </div>
    `;

    if (!allSubmissionsOfFile || allSubmissionsOfFile.length === 0) {
      html += `<div style="text-align: center; color: ${textMuted}; font-size: 0.8rem; padding: 20px; border: 1px dashed ${inputBorder}; border-radius: 8px; background: ${bgCard};">Chưa có học sinh nào nộp bài.</div>`;
    } else {
      allSubmissionsOfFile.forEach(sub => {
        const isGraded = sub.score !== "";
        const badgeStyle = isGraded 
          ? `background:${isDark ? 'rgba(16, 185, 129, 0.15)' : '#ecfdf5'}; color:${isDark ? '#34d399' : '#047857'}; border:1px solid ${isDark ? 'rgba(16, 185, 129, 0.3)' : '#a7f3d0'};` 
          : `background:${isDark ? 'rgba(249, 115, 22, 0.15)' : '#fff7ed'}; color:${isDark ? '#fb923c' : '#d3613a'}; border:1px solid ${isDark ? 'rgba(249, 115, 22, 0.3)' : '#fed7aa'};`;
        
        const parsedScore = parseScoreWithComponentsJS(sub.score);
        const badgeText = isGraded ? `✓ ${parsedScore.total}đ` : "Chờ chấm";

        const emailParts = sub.email.split('@');
        const username = emailParts[0];
        const domain = emailParts[1] ? '@' + emailParts[1] : '';

        let displayTime = sub.timestamp || "";
        const timeRegex = /^(\d{2}\/\d{2}\/\d{4})\s+(\d{2}):(\d{2})(:\d{2})?$/;
        const match = displayTime.match(timeRegex);
        if (match) {
          displayTime = `${match[2]}:${match[3]} ${match[1]}`;
        }

        html += `
          <div style="padding: 8px 12px; border: 1px solid ${borderCard}; border-radius: 10px; background: ${bgCardSub}; display: flex; align-items: center; gap: 10px; box-shadow:0 1px 2px rgba(0,0,0,0.02); transition: all 0.2s;" onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 6px -1px rgba(0,0,0,0.05)';" onmouseout="this.style.transform='none'; this.style.boxShadow='0 1px 2px rgba(0,0,0,0.02)';">
            
            <!-- User Avatar Circle -->
            <div style="width: 30px; height: 30px; border-radius: 50%; background: ${isDark ? '#1e293b' : '#f1f5f9'}; border: 1px solid ${borderCard}; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; color: ${isDark ? '#38bdf8' : '#0284c7'}; flex-shrink: 0; text-transform: uppercase; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
              ${username.charAt(0)}
            </div>

            <!-- Email & Timestamp details -->
            <div style="overflow: hidden; flex: 1; display: flex; flex-direction: column; gap: 2px;">
              <div style="font-size: 0.82rem; font-weight: 700; color: ${textTitle}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: baseline; gap: 2px;" title="${sub.email}">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${username}</span><span style="font-size: 0.68rem; color: ${textMuted}; font-weight: 500; opacity: 0.8; white-space: nowrap;">${domain}</span>
              </div>
              <div style="font-size: 0.68rem; color: ${textMuted}; font-weight: 500; display: flex; align-items: center; gap: 4px;">
                <svg style="width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.5; opacity: 0.6;" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>${displayTime}</span>
              </div>
            </div>

            <!-- Action column -->
            <div style="display:flex; align-items:center; gap:6px; flex-shrink: 0;">
              <span style="font-size: 0.72rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.2px; ${badgeStyle}">
                ${badgeText}
              </span>
              <button onclick="openHomeworkGradeModal('${sub.email.replace(/'/g, "\\'")}', '${fileTitle.replace(/'/g, "\\'")}', '${sub.timestamp.replace(/'/g, "\\'")}', '${sub.fileUrl.replace(/'/g, "\\'")}', '${sub.score.replace(/'/g, "\\'")}', '${fileId}')" style="background: #2563eb; color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;">
                Chấm
              </button>
            </div>
          </div>
        `;
      });
    }
    html += `</div>`;

  } else {
    // --- STUDENT VIEW ---
    if (!note || note.trim() === "") {
      html += `
        <!-- Part A: No Homework Announcement -->
        <div style="background: ${isDark ? 'rgba(239, 68, 68, 0.05)' : '#fff5f5'}; border: 1px solid ${isDark ? 'rgba(239, 68, 68, 0.15)' : '#fee2e2'}; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
          <div style="font-size: 2.2rem; margin-bottom: 8px;">📭</div>
          <div style="font-size: 0.9rem; font-weight: 800; color: ${isDark ? '#ef4444' : '#b91c1c'}; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">Không có BTVN</div>
          <div style="font-size: 0.8rem; color: ${textMuted}; font-weight: 500; line-height: 1.4;">Tài liệu này không có bài tập về nhà được giao. Bạn không thể nộp bài.</div>
        </div>
      `;
    } else {
      let deadlineBadgeHtml = "";
      let isExpired = false;
      if (deadline) {
        try {
          const dlDate = new Date(deadline);
          const now = new Date();
          isExpired = now > dlDate;
          const formattedDl = dlDate.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
          deadlineBadgeHtml = `
            <div style="margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; ${isExpired ? `background:${isDark ? 'rgba(239,68,68,0.15)' : '#fee2e2'}; color:#ef4444; border:1px solid ${isDark ? 'rgba(239,68,68,0.3)' : '#fecdd3'};` : `background:${isDark ? 'rgba(37,99,235,0.15)' : '#eff6ff'}; color:${isDark ? '#60a5fa' : '#2563eb'}; border:1px solid ${isDark ? 'rgba(37,99,235,0.3)' : '#bfdbfe'};`}">
              ⏰ Hạn nộp: ${formattedDl} ${isExpired ? '(Đã hết hạn)' : ''}
            </div>
          `;
        } catch (e) {
          console.error(e);
        }
      }

      html += `
        <!-- Part A: Assignment Instruction -->
        <div style="background: ${bgGreen}; border-left: 4px solid #10b981; border-radius: 0 12px 12px 0; padding: 14px; text-align: left; margin-bottom: 20px;">
          <div style="font-size: 0.7rem; font-weight: 800; color: ${textGreen}; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;">📋 Yêu Cầu Từ Giáo Viên</div>
          <div style="font-size: 0.85rem; color: ${textGreenSub}; font-weight: 600; line-height: 1.4; white-space: pre-line; margin-bottom: 4px;">${note}</div>
          ${deadlineBadgeHtml}
        </div>
      `;

      // Part B: Submission Form or Status
      if (!submission) {
        // Not submitted yet
        if (isExpired) {
          const hasAnswerKey = answerKey && answerKey.trim() !== "";
          html += `
            <div style="border: 1px solid ${isDark ? 'rgba(239,68,68,0.2)' : '#fecdd3'}; border-radius: 12px; padding: 20px; background: ${isDark ? 'rgba(239,68,68,0.05)' : '#fef2f2'}; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 16px;">
              <div style="font-size: 28px;">⏳</div>
              <div>
                <div style="font-size: 0.85rem; font-weight: 700; color: ${isDark ? '#fca5a5' : '#ef4444'};">Hết Hạn Nộp Bài</div>
                <div style="font-size: 0.75rem; color: ${textMuted}; margin-top: 4px;">Thời gian nộp bài tập đã kết thúc. Bạn không thể nộp bài này nữa.</div>
              </div>
              ${hasAnswerKey ? `
                <button onclick="window.openHomeworkAnswerKeyPopup()" style="margin-top: 8px; background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);" onmouseover="this.style.background='#1d4ed8';" onmouseout="this.style.background='#2563eb';">
                  <span>🔑 Xem Đáp Án Của Giáo Viên</span>
                </button>
              ` : `
                <div style="font-size: 0.75rem; color: ${textMuted}; margin-top: 4px; font-style: italic;">(Giáo viên chưa cập nhật đáp án cho BTVN này)</div>
              `}
            </div>
          `;
        } else {
          html += `
            <div style="border: 2px dashed ${inputBorder}; border-radius: 12px; padding: 20px; background: ${bgCard}; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;">
              <div style="font-size: 32px;">📤</div>
              <div>
                <div style="font-size: 0.85rem; font-weight: 700; color: ${textTitle};">Nộp Bài Tập Về Nhà</div>
                <div style="font-size: 0.75rem; color: ${textMuted}; margin-top: 4px;">Chỉ nhận file PDF bài viết tay hoặc vẽ hình</div>
              </div>
              
              <button onclick="document.getElementById('homeworkPdfFile').click()" style="background: ${bgCardSub}; border: 1px solid ${inputBorder}; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: bold; color: ${textDesc}; cursor: pointer; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);" onmouseover="this.style.borderColor='#10b981'; this.style.color='#10b981';" onmouseout="this.style.borderColor='${inputBorder}'; this.style.color='${textDesc}';">
                Chọn file PDF bài làm
              </button>
              
              <span id="homeworkPdfFileName" style="font-size:0.75rem; color:#10b981; font-weight:bold; word-break:break-all;"></span>
              
              <input type="file" id="homeworkPdfFile" accept="application/pdf" style="display:none;" onchange="updateHomeworkFileName(this)">
              
              <button id="homeworkSubmitBtn" onclick="uploadHomeworkSubmission('${fileId}', '${fileTitle.replace(/'/g, "\\'")}')" style="background:#10b981; color:white; font-weight:bold; font-size:0.85rem; width:100%; padding:10px; border-radius:8px; border:none; cursor:pointer; margin-top:6px; display:none;">
                Nộp bài tập ngay
              </button>
            </div>
          `;
        }
      } else {
        // Already submitted
        const isGraded = submission.score !== "";
        const canSeeAnswer = (answerKey && answerKey.trim() !== "") && (isGraded || isExpired);
        
        const answerKeyHtml = canSeeAnswer

window.unsubmittedHomeworks = [];

window.findFileInLibrary = function(fileId) {
  let file = null;
  let type = '';
  
  if (typeof allCourses !== 'undefined' && allCourses && allCourses.length > 0) {
    file = allCourses.find(c => String(c.fileId).trim() === String(fileId).trim());
    if (file) {
      type = 'course';
      return { file: file, type: type };
    }
  }
  
  if (typeof allBooks !== 'undefined' && allBooks && allBooks.length > 0) {
    file = allBooks.find(b => String(b.fileId).trim() === String(fileId).trim());
    if (file) {
      type = 'book';
      return { file: file, type: type };
    }
  }
  
  if (typeof allExams !== 'undefined' && allExams && allExams.length > 0) {
    file = allExams.find(e => String(e.fileId).trim() === String(fileId).trim());
    if (file) {
      type = 'exam';
      return { file: file, type: type };
    }
  }
  
  return null;
};

window.checkAccessToFile = function(fileId) {
  const role = (window.currentUserRole || currentUserRole || "").toUpperCase().trim();
  if (role === "ADMIN") return true;
  
  const found = window.findFileInLibrary(fileId);
  if (!found) {
    return true; 
  }
  
  const file = found.file;
  const type = found.type;
  const folderName = file.folder || "";
  const folderLower = folderName.toLowerCase();
  
  if (type === "exam") {
    if (folderLower.includes("student")) {
      return role === "STUDENT" || role === "S-STUDENT";
    } else if (folderLower.includes("vip")) {
      return ["VIP", "STUDENT", "S-STUDENT", "O-STUDENT"].includes(role);
    } else {
      return true;
    }
  } else if (type === "book" || type === "course") {
    if (folderLower.includes("vip")) {
      return ["VIP", "STUDENT", "S-STUDENT", "O-STUDENT"].includes(role);
    } else if (folderLower.includes("mem")) {
      return ["MEM", "VIP", "O-STUDENT", "STUDENT", "S-STUDENT"].includes(role);
    } else {
      return true;
    }
  }
  
  return true;
};

window.fetchStudentHomeworkStatus = function() {
  const email = sessionStorage.getItem("userEmail") || "";
  if (!email) return;
  
  const role = (window.currentUserRole || "").toUpperCase().trim();

  if (!window.google || !window.google.script || !window.google.script.run || typeof window.google.script.run.getStudentHomeworkStatus !== "function") {

    if (typeof renderMiniStudyDrawer === 'function') renderMiniStudyDrawer();
    if (typeof renderDailyTasks === 'function') renderDailyTasks();

  google.script.run

      if (res && res.success && res.unsubmitted) {

window.openHomeworkFromFile = function(fileId, fileTitle, type) {
  // Toggle off drawer and backdrop to make space and remove dark overlay
  if (typeof closeMiniStudyDrawer === 'function') {
    closeMiniStudyDrawer();
  } else {
    const drawer = document.getElementById("miniStudyDrawer");
    const backdrop = document.getElementById("miniStudyDrawerBackdrop");
    if (drawer) drawer.classList.remove("active");
    if (backdrop) backdrop.classList.remove("active");
  }
  
  const found = typeof window.findFileInLibrary === 'function' ? window.findFileInLibrary(fileId) : null;
  const fileObj = found ? found.file : null;
  const actualCategory = found ? found.type : (type || 'course');
  const actualType = (fileObj && fileObj.type) ? fileObj.type : 'pdf';
  const folderName = (fileObj && fileObj.folder) ? fileObj.folder : '';

  const isMock = typeof isMockExamFile === 'function' && isMockExamFile(fileId, fileTitle, folderName, actualCategory);

  if (isMock) {
    const p = switchView('mockExams');
    if (p) p.then((success) => {
      if (success !== false && currentView === 'mockExams') {
        if (typeof viewMockExam === 'function' && fileObj) {
          viewMockExam(fileObj);
        } else {
          readCourse(fileId, fileTitle, 'pdf', folderName, true);
        }
      }
    });
  } else if (actualCategory === 'course') {
    const p = switchView('courses');
    if (p) p.then((success) => {
      if (success !== false && currentView === 'courses') {
        readCourse(fileId, fileTitle, actualType, folderName);
      }
    });
  } else if (actualCategory === 'exam') {
    const p = switchView('exams');
    if (p) p.then((success) => {
      if (success !== false && currentView === 'exams') {
        readCourse(fileId, fileTitle, actualType || 'pdf', folderName);
      }
    });
  } else {
    const p = switchView('books');
    if (p) p.then((success) => {
      if (success !== false && currentView === 'books') {
        readCourse(fileId, fileTitle, actualType || 'pdf', folderName);
      }
    });
  }
  
  // Slide open the homework panel right after the file viewer loads
  setTimeout(() => {
    const panel = document.getElementById("homeworkPanel");
    if (panel) {
      panel.classList.add("active");
      const qaPanel = document.getElementById("qaPanel");
      if (qaPanel) qaPanel.classList.remove("active");
      currentHomeworkFileId = fileId;
      currentHomeworkFileTitle = fileTitle || "";
      loadHomeworkData(fileId, fileTitle);
    }
  }, 800);
};

// 6. Save Homework Note Assignment (Teacher / Admin Action)
window.saveHomeworkNote = function(fileId, fileTitle) {
  const noteInput = document.getElementById("adminHomeworkNoteInput");
  const deadlineInput = document.getElementById("adminHomeworkDeadlineInput");
  const numQuestionsInput = document.getElementById("adminHomeworkNumQuestionsInput");
  const quickSetInput = document.getElementById("adminHomeworkQuickSetPoints");
  const saveBtn = document.getElementById("adminSaveHomeworkBtn");
  if (!noteInput) return;
  const content = noteInput.value.trim();
  const deadline = deadlineInput ? deadlineInput.value : "";
  const numQuestions = numQuestionsInput ? parseInt(numQuestionsInput.value) || 0 : 0;
  
  // Package points for each question separately
  let pointsPerQuestion = "";
  const pointsInputs = document.querySelectorAll(".admin-homework-points-input");
  if (numQuestions > 0 && pointsInputs.length > 0) {
    const pointsArr = [];
    pointsInputs.forEach(input => {
      const p = parseFloat(input.value);
      pointsArr.push(isNaN(p) ? 1 : p);
    });
    pointsPerQuestion = pointsArr.join(";");
  } else if (numQuestions > 0) {
    pointsPerQuestion = Array(numQuestions).fill(1).join(";");
  }
  
  noteInput.disabled = true;
  if (deadlineInput) deadlineInput.disabled = true;
  if (numQuestionsInput) numQuestionsInput.disabled = true;
  if (quickSetInput) quickSetInput.disabled = true;
  pointsInputs.forEach(input => input.disabled = true);
  
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.style.opacity = "0.7";
    saveBtn.innerHTML = `⏳ Đang lưu báo bài & hạn nộp...`;
  }
  
  showToast("⏳ Đang kết nối máy chủ để lưu thông báo bài tập...", "info");
  
  google.script.run
    .withSuccessHandler(function(res) {
      noteInput.disabled = false;
      if (deadlineInput) deadlineInput.disabled = false;
      if (numQuestionsInput) numQuestionsInput.disabled = false;
      if (quickSetInput) quickSetInput.disabled = false;
      pointsInputs.forEach(input => input.disabled = false);
      
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.style.opacity = "1";
        saveBtn.innerHTML = `💾 Lưu báo bài & hạn nộp`;
      }
      if (res.success) {
        showToast("✓ Đã lưu thông báo bài tập và hạn nộp thành công!", "success");
        loadHomeworkData(fileId, fileTitle);
        // Refresh homework status on save to sync lists
        if (typeof fetchStudentHomeworkStatus === 'function') {
          fetchStudentHomeworkStatus();
        }
      } else {
        showToast("❌ Lỗi: " + res.message, "danger");
      }
    })
    .withFailureHandler(function(err) {
      noteInput.disabled = false;
      if (deadlineInput) deadlineInput.disabled = false;
      if (numQuestionsInput) numQuestionsInput.disabled = false;
      if (quickSetInput) quickSetInput.disabled = false;
      pointsInputs.forEach(input => input.disabled = false);
      
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.style.opacity = "1";
        saveBtn.innerHTML = `💾 Lưu báo bài & hạn nộp`;
      }
      showToast("❌ Lỗi mạng: " + err.message, "danger");
    })
    .saveHomeworkNote(fileId, fileTitle, content, deadline, numQuestions, pointsPerQuestion);
};

// 7. Student Submit Upload Homework File
window.uploadHomeworkSubmission = function(fileId, fileTitle) {
  const fileInput = document.getElementById("homeworkPdfFile");
  const submitBtn = document.getElementById("homeworkSubmitBtn");
  if (!fileInput || !fileInput.files || !fileInput.files[0]) return;
  
  const file = fileInput.files[0];

  // Maximum raw file size is set to 25 MB.
  const MAX_SIZE_MB = 25;
  const MAX_SIZE_BYTES = MAX_SIZE_MB * 1024 * 1024;
  if (file.size > MAX_SIZE_BYTES) {
    const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
    showCustomAlert(
      "File Quá Lớn", 
      "⚠️ FILE QUÁ LỚN (" + fileSizeMB + " MB)\nDung lượng tối đa được phép nộp là 25 MB.\n\nHướng dẫn nén file:\n1. Truy cập trang web miễn phí ilovepdf.com hoặc smallpdf.com để nén file PDF này nhỏ lại (thường giảm xuống chỉ còn 1-2 MB mà vẫn cực kỳ rõ nét).\n2. Quét lại bài làm ở chất lượng thấp/vừa phải trên app CamScanner thay vì chọn chất lượng HD.", 
      "warning"
    );
    return;
  }

  const reader = new FileReader();
  
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner-inline" style="display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top:2px solid #ffffff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:6px; vertical-align: middle;"></span> Đang nộp bài...`;
  }
  
  showToast("⏳ Đang mã hóa file và tải lên máy chủ...", "info");
  
  reader.onload = function(e) {
    const base64Data = e.target.result.split(",")[1];
    
    google.script.run
      .withSuccessHandler(function(res) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Nộp bài tập ngay";
        }
        if (res.success) {
          showToast("🎉 Nộp bài tập về nhà thành công!", "success");
          loadHomeworkData(fileId, fileTitle);
          if (typeof fetchStudentHomeworkStatus === 'function') {
            fetchStudentHomeworkStatus();
          }
        } else {
          showToast("❌ Lỗi nộp bài: " + res.message, "danger");
        }
      })
      .withFailureHandler(function(err) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Nộp bài tập ngay";
        }
        const errorMsg = err ? (err.message || String(err)) : "Không xác định";
        showToast("❌ Lỗi kết nối nộp bài: " + errorMsg, "danger");
        showCustomAlert("Lỗi Kết Nối", "❌ Lỗi kết nối khi nộp bài: " + errorMsg + "\n\nNếu lỗi này liên tục xảy ra, có thể do file PDF của bạn quá nặng. Bạn hãy nén nhỏ file lại rồi thử nộp lại nhé!", "error");
      })
      .uploadHomeworkSubmission(base64Data, file.name, fileId, fileTitle);
  };
  
  reader.readAsDataURL(file);
};

      "File Quá Lớn",
      "⚠️ FILE QUÁ LỚN (" + fileSizeMB + " MB)\nDung lượng tối đa được phép nộp là 25 MB.\n\nHướng dẫn nén file:\n1. Truy cập trang web miễn phí ilovepdf.com hoặc smallpdf.com để nén file PDF này nhỏ lại (thường giảm xuống chỉ còn 1-2 MB mà vẫn cực kỳ rõ nét).\n2. Quét lại bài làm ở chất lượng thấp/vừa phải trên app CamScanner thay vì chọn chất lượng HD.",
      "warning"
    );
    return;
  }

  const reader = new FileReader();
  
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner-inline" style="display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top:2px solid #ffffff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:6px; vertical-align: middle;"></span> Đang nộp bài...`;
  }
  
  showToast("⏳ Đang tải file mới lên và ghi đè bài cũ...", "info");
  
  reader.onload = function(e) {
    const base64Data = e.target.result.split(",")[1];
    
    google.script.run
      .withSuccessHandler(function(res) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Xác nhận nộp đè bài mới";
        }
        if (res.success) {
          showToast("🎉 Nộp đè bài tập thành công!", "success");
          loadHomeworkData(fileId, fileTitle);
          if (typeof fetchStudentHomeworkStatus === 'function') {
            fetchStudentHomeworkStatus();
          }
        } else {
          showToast("❌ Lỗi nộp bài: " + res.message, "danger");
        }
      })
      .withFailureHandler(function(err) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Xác nhận nộp đè bài mới";
        }
        const errorMsg = err ? (err.message || String(err)) : "Không xác định";
        showToast("❌ Lỗi kết nối nộp bài: " + errorMsg, "danger");
        showCustomAlert("Lỗi Kết Nối", "❌ Lỗi kết nối khi nộp bài: " + errorMsg + "\n\nNếu lỗi này liên tục xảy ra, có thể do file PDF của bạn quá nặng. Bạn hãy nén nhỏ file lại rồi thử nộp lại nhé!", "error");
      })
      .uploadHomeworkSubmission(base64Data, file.name, fileId, fileTitle);
  };
  
  reader.readAsDataURL(file);
};

// Helper to resolve the folder path of a homework submission from the library
window.getSubmissionFolder = function(sub) {
  if (!sub) return "Chưa phân loại";
  
  if (sub.folder && sub.folder.trim() !== "") {
    return sub.folder.trim();
  }
  
  // Try finding in library
  if (sub.fileId && typeof window.findFileInLibrary === "function") {
    const found = window.findFileInLibrary(sub.fileId);
    if (found && found.file && found.file.folder) {
      return found.file.folder.trim();
    }
  }
  
  // Safe fallback if title itself contains folder separators
  if (sub.fileTitle && (sub.fileTitle.includes("/") || sub.fileTitle.includes("\\"))) {
    const parts = sub.fileTitle.split(/[\/\\]/);
    if (parts.length > 1) {
      parts.pop(); // remove file name
      return parts.join(" / ").trim();
    }
  }
  
  return "Chưa phân loại";
};

// 2. Populate Dropdown Options
function populateAdminHomeworkTitlesDropdown(submissions) {
  const dropdown = document.getElementById("adminHomeworkFilterTitle");
  if (!dropdown) return;
  
  const currentVal = dropdown.value;
  const foldersSet = new Set();
  
  submissions.forEach(sub => {
    const fld = window.getSubmissionFolder(sub);
    if (fld) {
      foldersSet.add(fld.trim());
    }
  });
  
  const foldersArray = Array.from(foldersSet).sort();
  dropdown.innerHTML = '<option value="all">-- Tất cả thư mục/chuyên đề --</option>';
  
  foldersArray.forEach(folder => {
    const opt = document.createElement("option");
    opt.value = folder;
    opt.textContent = folder;
    dropdown.appendChild(opt);
  });
  
  if (foldersArray.includes(currentVal)) {
    dropdown.value = currentVal;
  } else {
    dropdown.value = "all";
  }
}

// 3. Filter Homework Submissions
window.filterAdminHomeworkSubmissions = function() {
  clearTimeout(window._filterAdminHomeworkTimeout);
  window._filterAdminHomeworkTimeout = setTimeout(() => {
    const searchEmail = (document.getElementById("adminHomeworkSearchEmail")?.value || "").toLowerCase().trim();
    const filterTitle = document.getElementById("adminHomeworkFilterTitle")?.value || "all";
    const filterStatus = document.getElementById("adminHomeworkFilterStatus")?.value || "all";
    
    const filtered = allAdminHomeworkSubmissions.filter(sub => {
      const emailMatch = !searchEmail || sub.email.toLowerCase().includes(searchEmail);
      
      const folderOfSub = window.getSubmissionFolder(sub);
      const titleMatch = filterTitle === "all" || folderOfSub === filterTitle;
      
      let statusMatch = true;
      if (filterStatus === "pending") {
        statusMatch = sub.score === "";
      } else if (filterStatus === "graded") {
        statusMatch = sub.score !== "";
      }
      
      return emailMatch && titleMatch && statusMatch;
    });
    
    renderAdminHomeworkTable(filtered);
  }, 250);
};

window.openHomeworkGradeModal = function(email, fileTitle, timestamp, fileUrl, score, fileId) {
  // Find remark from cache
  let remark = "";
  if (typeof currentHomeworkPanelSubmissions !== "undefined" && Array.isArray(currentHomeworkPanelSubmissions)) {
    const foundSub = currentHomeworkPanelSubmissions.find(s => 
      s.email === email && 
      s.fileTitle === fileTitle && 
      s.timestamp === timestamp
    );
    if (foundSub) {
      remark = foundSub.remark || "";

// 7. Submit homework grade entry (Backend request)
window.submitHomeworkGradeNow = async function(andNext = false) {
  const email = document.getElementById("homeworkGradeModalEmail").textContent;
  const scoreInput = document.getElementById("homeworkGradeModalScoreInput");
  const remarkInput = document.getElementById("homeworkGradeModalRemarkInput");
  const statusDiv = document.getElementById("homeworkGradeModalStatus");
  const numInput = document.getElementById("homeworkGradeModalNumQuestions");
  const fileTitle = document.getElementById("homeworkGradeModalFileTitle").textContent;
  
  if (!scoreInput || !remarkInput || !statusDiv) return;
  
  const score = scoreInput.value.trim();
  const remark = remarkInput.value.trim();
  
  if (score === "") {
    statusDiv.style.color = "#ef4444";
    statusDiv.textContent = "⚠️ Vui lòng nhập điểm số!";
    return;
  }
  
  const numericScore = parseFloat(score.replace(/,/g, "."));
  if (isNaN(numericScore) || numericScore < 0) {
    statusDiv.style.color = "#ef4444";
    statusDiv.textContent = "⚠️ Điểm số phải là số lớn hơn hoặc bằng 0!";
    return;
  }
  
  // Package homework components if any
  let finalScoreString = score;
  const numQuestions = numInput ? parseInt(numInput.value) || 0 : 0;
  if (numQuestions > 0) {
    const inputs = document.querySelectorAll(".homework-question-score-input");
    const components = [];
    inputs.forEach(input => {
      const val = parseFloat(input.value.replace(/,/g, "."));
      components.push(isNaN(val) ? 0 : val);
    });
    if (components.length > 0) {
      finalScoreString = score + " [" + components.join(";") + "]";
    }
  }

  // 1. Compile PDF base64 if user drew
  let pdfBase64 = null;
  try {
    pdfBase64 = await window.getCompiledPdfBase64FromDrawing('homework');
  } catch(e) {
    console.warn("Homework PDF compile exception:", e);
  }

  // 2. Queue into IndexedDB
  const hwIdentifier = (typeof currentGradingHomeworkFileId !== "undefined" && currentGradingHomeworkFileId) ? currentGradingHomeworkFileId : (window.currentGradingHomeworkFileId || fileTitle);
  const queueItem = {
    id: 'hw_sync_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
    type: 'homework',
    email: email,
    examTitle: hwIdentifier,
    score: finalScoreString,
    remark: remark,
    pdfBase64: pdfBase64,
    fileName: "Homework_" + email + ".pdf",
    timestamp: new Date().toISOString(),
    retries: 0,
    status: 'pending'
  };

  await saveSyncQueueItem(queueItem);

  // 3. INSTANT OPTIMISTIC UPDATE (< 0.1s)
  if (typeof window.currentHomeworkPanelSubmissions !== "undefined" && Array.isArray(window.currentHomeworkPanelSubmissions)) {
    const sub = window.currentHomeworkPanelSubmissions.find(s => s.email === email);
    if (sub) {
      sub.score = finalScoreString;
      sub.remark = remark;
      sub.gradedBy = sessionStorage.getItem("userDisplayName") || "Giáo viên";
    }
  }
  
  if (typeof window.allAdminHomeworkSubmissions !== "undefined" && Array.isArray(window.allAdminHomeworkSubmissions)) {
    // sub.fileTitle matches the student's submission filename, which matches the argument passed to openHomeworkGradeModal
    const adminSub = window.allAdminHomeworkSubmissions.find(s => s.email === email && s.fileTitle === fileTitle);
    if (adminSub) {
      adminSub.score = finalScoreString;
      adminSub.remark = remark;
      adminSub.gradedBy = sessionStorage.getItem("userDisplayName") || "Giáo viên";
    }
  }

  if (typeof window.lastHomeworkRenderArgs !== "undefined" && window.lastHomeworkRenderArgs.length > 0) {
    window.renderHomeworkPanel(...window.lastHomeworkRenderArgs);
  }
  
  if (typeof window.filterAdminHomeworkSubmissions === "function") {
    window.filterAdminHomeworkSubmissions();
  } else if (typeof window.renderAdminHomeworkTable === "function" && typeof window.allAdminHomeworkSubmissions !== "undefined") {
    window.renderAdminHomeworkTable(window.allAdminHomeworkSubmissions);
  }

  showToast(`⚡ Đã lưu kết quả bài tập cho ${email}!`, "success");
  statusDiv.style.color = "#10b981";
  statusDiv.textContent = "⚡ Đã lưu! Đang đồng bộ Drive ngầm...";

  processBackgroundSyncQueue();

  if (andNext) {
    goToNextHomeworkSubmission(email, fileTitle);
  } else {
    setTimeout(() => {
      closeHomeworkGradeModal();
    }, 300);
  }
};

window.parsePointsPerQuestionJS = function(pointsStr, numQuestions) {
  numQuestions = parseInt(numQuestions) || 0;
  if (numQuestions <= 0) return [];
  pointsStr = (pointsStr || "").toString().trim();
  let arr = [];
  if (pointsStr.includes(";")) {
    arr = pointsStr.split(";").map(s => {
      const val = parseFloat(s.trim());
      return isNaN(val) ? 1 : val;
    });
  } else {
    const singleVal = parseFloat(pointsStr);
    const defaultVal = isNaN(singleVal) ? 1 : singleVal;
    arr = Array(numQuestions).fill(defaultVal);
  }
  while (arr.length < numQuestions) {
    arr.push(1);
  }
  return arr.slice(0, numQuestions);
};

window.generateHomeworkQuestionGrades = function(numQuestions, existingScore, maxPoints) {
  const questionsContainer = document.getElementById("homeworkGradeModalQuestionsContainer");
  const detailGradingCard = document.getElementById("homeworkGradeModalDetailGradingCard");
  
  if (!questionsContainer || !detailGradingCard) return;
  
  if (numQuestions <= 0) {
    detailGradingCard.style.display = "none";
    questionsContainer.style.display = "none";
    return;
  }
  
  detailGradingCard.style.display = "flex";
  questionsContainer.style.display = "grid";
  
  const parsed = parseScoreWithComponentsJS(existingScore);
  const maxPointsArr = window.parsePointsPerQuestionJS(maxPoints, numQuestions);
  const isDark = document.body.classList.contains("dark-mode");
  questionsContainer.innerHTML = "";
  
  for (let i = 1; i <= numQuestions; i++) {
    const div = document.createElement("div");
    div.className = "homework-question-grid-card";
    div.style.display = "flex";
    div.style.flexDirection = "column";
    div.style.alignItems = "center";
    div.style.justifyContent = "center";
    div.style.padding = "8px 10px";
    div.style.background = isDark ? "#131c2e" : "white";
    div.style.borderRadius = "10px";
    div.style.border = isDark ? "1px solid #1e293b" : "1px solid #e2e8f0";
    div.style.boxShadow = "0 1px 2px rgba(0,0,0,0.02)";
    div.style.transition = "all 0.15s ease-in-out";
    
    // Check if there is an existing component score for this question index
    let val = 0;
    if (parsed.components && parsed.components[i - 1] !== undefined) {
      val = parsed.components[i - 1];
    }
    const qMaxVal = maxPointsArr[i - 1] !== undefined ? maxPointsArr[i - 1] : 1;
    const formattedVal = val.toString().replace(/\./g, ",");
    
    div.innerHTML = `
      <span style="font-weight: 700; font-size: 0.75rem; color: ${isDark ? '#cbd5e1' : '#475569'}; margin-bottom: 4px; text-align: center;">Câu ${i}</span>
      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: nowrap;">
        <input type="text" class="homework-question-score-input" data-qindex="${i}" value="${formattedVal}" oninput="onHomeworkQuestionScoreInput(this)" style="width: 50px; height: 26px; padding: 2px 4px; border: 1px solid ${isDark ? '#334155' : '#cbd5e1'}; border-radius: 6px; font-size: 0.8rem; text-align: center; font-weight: bold; color: ${isDark ? '#f1f5f9' : '#1e293b'}; outline: none; background: ${isDark ? '#0f172a' : 'white'};" title="Điểm câu ${i} (tối đa ${qMaxVal}đ)" />
        <span style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; white-space: nowrap;">/ ${qMaxVal}đ</span>
      </div>
    `;
    
    // Apply initial colors if val > 0
    if (val > 0) {
      div.style.borderColor = "#3b82f6";
      div.style.background = isDark ? "rgba(59, 130, 246, 0.15)" : "#eff6ff";
    }
    
    questionsContainer.appendChild(div);
  }
  
  calculateTotalScoreFromHomeworkQuestions();
};

window.onHomeworkQuestionScoreInput = function(inputEl) {
  // Replace dot with comma
  inputEl.value = inputEl.value.replace(/\./g, ",");
  // Only allow digits and a single comma
  inputEl.value = inputEl.value.replace(/[^0-9,]/g, "");
  const parts = inputEl.value.split(",");
  if (parts.length > 2) {
    inputEl.value = parts[0] + "," + parts.slice(1).join("");
  }

  const val = parseFloat(inputEl.value.replace(/,/g, ".")) || 0;
  const isDark = document.body.classList.contains("dark-mode");
  
  const parentDiv = inputEl.closest('.homework-question-grid-card');
  if (parentDiv) {
    if (val > 0) {
      parentDiv.style.borderColor = "#3b82f6";
      parentDiv.style.background = isDark ? "rgba(59, 130, 246, 0.15)" : "#eff6ff";
    } else {
      parentDiv.style.borderColor = isDark ? "#1e293b" : "#e2e8f0";
      parentDiv.style.background = isDark ? "#131c2e" : "white";
    }
  }
  calculateTotalScoreFromHomeworkQuestions();
};

window.calculateTotalScoreFromHomeworkQuestions = function() {
  const inputs = document.querySelectorAll(".homework-question-score-input");
  const numInput = document.getElementById("homeworkGradeModalNumQuestions");
  
  if (!numInput || parseInt(numInput.value) <= 0) return;
  
  let total = 0;
  inputs.forEach(input => {
    total += parseFloat(input.value.replace(/,/g, ".")) || 0;
  });
  
  const roundedTotal = parseFloat(total.toFixed(2));
  
  const scoreInput = document.getElementById("homeworkGradeModalScoreInput");
  if (scoreInput) {
    scoreInput.value = roundedTotal.toString().replace(/\./g, ",");
  }
};

window.getActualPoint = function(p, canvas) {
    if (!p) return { x: 0, y: 0 };
    if (p.nx !== undefined && p.ny !== undefined && canvas && canvas.width > 0) {
        return {
            x: p.nx * canvas.width,
            y: p.ny * canvas.height
        };
    }
    return { x: p.x || 0, y: p.y || 0 };
};

window.redrawAllPdfCanvases = function() {
    const container = document.getElementById("strictMockExamInner") || document.getElementById("strictMockExamContainer");
    if (container && window.drawingStrokes && window.drawingStrokes._insertedPages && Array.isArray(window.drawingStrokes._insertedPages)) {
        window.drawingStrokes._insertedPages.forEach(noteMeta => {
            const existing = container.querySelector('[data-note-page-id="' + noteMeta.id + '"]');
            if (!existing && typeof window.createLinedNotePageElement === 'function') {
                const noteElem = window.createLinedNotePageElement(noteMeta, container);
                if (noteElem) {
                    const pdfWrapper = container.querySelector('[data-page-num="' + noteMeta.afterPage + '"]');
                    if (pdfWrapper) {
                        let insertAfter = pdfWrapper;
                        let next = pdfWrapper.nextElementSibling;
                        while (next && next.classList && next.classList.contains('inserted-note-page-wrapper') && parseInt(next.dataset.afterPage, 10) === noteMeta.afterPage) {
                            insertAfter = next;
                            next = next.nextElementSibling;
                        }
                        if (insertAfter.nextSibling) {
                            container.insertBefore(noteElem, insertAfter.nextSibling);
                        } else {
                            container.appendChild(noteElem);
                        }
                    } else {
                        container.appendChild(noteElem);
                    }
                }
            }
        });
    }

    const canvases = document.querySelectorAll('.drawing-layer');
    canvases.forEach(canvas => {
        const pageNum = canvas.dataset.pageNum;
        if (pageNum) {
            redrawCanvas(canvas, pageNum);
        }
    });
};

window.drawNotebookLines = function(canvas, width, height, isDark) {
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = isDark ? '#0f172a' : '#ffffff';
    ctx.fillRect(0, 0, width, height);

    const lineSpacing = 64; // ~32px on display
    const startY = 100;
    ctx.strokeStyle = isDark ? 'rgba(148, 163, 184, 0.25)' : 'rgba(191, 219, 254, 0.85)';
    ctx.lineWidth = 2;

    for (let y = startY; y < height - 30; y += lineSpacing) {
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(width - 30, y);
        ctx.stroke();
    }

    // Lề đỏ bên trái
    ctx.strokeStyle = isDark ? 'rgba(248, 113, 113, 0.45)' : 'rgba(252, 165, 165, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(120, 30);
    ctx.lineTo(120, height - 30);
    ctx.stroke();
};

window.applyWordPaperStyle = function(container, style, isDark) {
    if (!container) return;
    if (style === 'lined') {

    let targetWidth = 800;
    let targetHeight = 1000;
    if (samplePdfWrapper) {
        targetWidth = samplePdfWrapper.clientWidth || parseFloat(samplePdfWrapper.style.width) || 800;
        targetHeight = samplePdfWrapper.clientHeight || parseFloat(samplePdfWrapper.style.height) || 1000;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "inserted-note-page-wrapper";
    wrapper.dataset.notePageId = noteMeta.id;
    wrapper.dataset.afterPage = noteMeta.afterPage;
    wrapper.dataset.noteType = noteType;

window.addLinedNotePage = function(noteType) {
    if (!noteType) noteType = "word";

    const container = document.getElementById("strictMockExamInner") || document.getElementById("strictMockExamContainer");
    if (!container) return;

    const pageInput = document.getElementById("pdfCurrentPageInput");
    let activePageNum = 1;
    if (pageInput && pageInput.value) {
        activePageNum = parseInt(pageInput.value, 10) || 1;
    } else {
        const wrappers = container.querySelectorAll('[data-page-num]');
        const containerTop = container.getBoundingClientRect().top;
        for (let i = 0; i < wrappers.length; i++) {
            const rect = wrappers[i].getBoundingClientRect();
            if (rect.top - containerTop <= container.clientHeight * 0.5) {
                const parsed = parseInt(wrappers[i].dataset.pageNum, 10);
                if (parsed) activePageNum = parsed;
            }
        }
    }

    const noteId = "note_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    const noteMeta = {
        id: noteId,
        afterPage: activePageNum,
        type: noteType || "lined",
        createdAt: Date.now(),
        wordContent: "",
        paperStyle: "plain"
    };

    if (!window.drawingStrokes) window.drawingStrokes = {};
    if (!window.drawingStrokes._insertedPages) window.drawingStrokes._insertedPages = [];
    window.drawingStrokes._insertedPages.push(noteMeta);

    const noteElem = window.createLinedNotePageElement(noteMeta, container);
    if (!noteElem) return;

    const pdfWrapper = container.querySelector('[data-page-num="' + activePageNum + '"]');
    if (pdfWrapper) {
        let insertAfter = pdfWrapper;
        let next = pdfWrapper.nextElementSibling;
        while (next && next.classList && next.classList.contains('inserted-note-page-wrapper') && parseInt(next.dataset.afterPage, 10) === activePageNum) {
            insertAfter = next;
            next = next.nextElementSibling;
        }
        if (insertAfter.nextSibling) {
            container.insertBefore(noteElem, insertAfter.nextSibling);
        } else {
            container.appendChild(noteElem);
        }
    } else {
        container.appendChild(noteElem);
    }

    if (window.currentPdfFileId) {
        window.saveCurrentPdfNotes(window.currentPdfFileId);
    }

    setTimeout(() => {
        noteElem.scrollIntoView({ behavior: "smooth", block: "center" });
        if (typeof showToast === 'function') {
            const labelName = noteType === 'word' ? 'văn bản Word' : 'kẻ dòng';
            showToast(`📓 Đã thêm trang giấy Note ${labelName} dưới trang ${activePageNum}!`, "success");
        }
    }, 100);
};

window.removeLinedNotePage = function(noteId, elem) {
    if (window.drawingStrokes) {
        if (window.drawingStrokes._insertedPages && Array.isArray(window.drawingStrokes._insertedPages)) {
            window.drawingStrokes._insertedPages = window.drawingStrokes._insertedPages.filter(p => p.id !== noteId);
        }
        delete window.drawingStrokes[noteId];
    }

    if (elem && elem.parentNode) {
        elem.parentNode.removeChild(elem);
    }

    if (window.currentPdfFileId) {
        window.saveCurrentPdfNotes(window.currentPdfFileId);
    }

    if (typeof showToast === 'function') {
        showToast("🗑️ Đã xóa trang ghi chú.", "info");
    }
};

window.getPdfEffectiveUserEmail = function() {
    return sessionStorage.getItem("userEmail") || (typeof currentEmail !== 'undefined' ? currentEmail : "") || "guest";
};

window.loadPdfNotesForFile = function(fileId) {
    if (!fileId) return;
    window.currentPdfFileId = fileId;
    const userEmail = window.getPdfEffectiveUserEmail();
    const localKey = "pdf_notes_" + String(fileId).trim() + "_" + String(userEmail).toLowerCase().replace(/[^a-z0-9]/g, "");
    
    let localDataObj = null;
    let localStrokes = null;
    let localUpdatedAt = 0;
    try {
        const cached = getCleanLocalStorage(localKey);
        if (cached) {
            localDataObj = JSON.parse(cached);
            if (localDataObj && typeof localDataObj === 'object') {
                if (localDataObj.strokes && typeof localDataObj.strokes === 'object') {
                    localStrokes = localDataObj.strokes;
                    localUpdatedAt = localDataObj.updatedAt || 0;
                } else {
                    localStrokes = localDataObj;
                    localUpdatedAt = 0;
                }
                window.drawingStrokes = localStrokes;
                window.redrawAllPdfCanvases();
                window.updatePdfSaveStatusIndicator('local');
            }
        }
    } catch(e) {
        console.warn("Lỗi đọc ghi chú từ localStorage:", e);
    }

    if (window.google && window.google.script && window.google.script.run && typeof window.google.script.run.getPdfNotes === 'function') {
        window.google.script.run
            .withSuccessHandler(res => {
                if (res && res.success && res.notesJson) {
                    try {
                        const serverDataObj = JSON.parse(res.notesJson);
                        if (serverDataObj && typeof serverDataObj === 'object') {
                            let serverStrokes = serverDataObj;
                            let serverUpdatedAt = 0;
                            if (serverDataObj.strokes && typeof serverDataObj.strokes === 'object') {
                                serverStrokes = serverDataObj.strokes;
                                serverUpdatedAt = serverDataObj.updatedAt || 0;
                            }

                            const countStrokes = (obj) => Object.values(obj || {}).reduce((acc, arr) => acc + (arr ? arr.length : 0), 0);
                            const serverCount = countStrokes(serverStrokes);
                            const localCount = countStrokes(localStrokes);
                            
                            // If local has timestamp and is newer than server, prefer local and sync to server
                            if (localUpdatedAt > 0 && serverUpdatedAt > 0 && localUpdatedAt > serverUpdatedAt) {
                                window.saveCurrentPdfNotes(fileId, true);
                            } else if (!localStrokes || serverUpdatedAt >= localUpdatedAt || (serverCount >= localCount && localUpdatedAt === 0)) {
                                window.drawingStrokes = serverStrokes;
                                try {
                                    localStorage.setItem(localKey, JSON.stringify({
                                        updatedAt: serverUpdatedAt || Date.now(),
                                        strokes: serverStrokes
                                    }));
                                } catch(e){}
                                window.redrawAllPdfCanvases();
                                window.updatePdfSaveStatusIndicator('cloud');
                            } else if (localCount > serverCount) {
                                // Local has more content, sync to server
                                window.saveCurrentPdfNotes(fileId, true);
                            }
                        }
                    } catch(err) {
                        console.warn("Lỗi parse ghi chú từ server:", err);
                    }
                } else if (localStrokes && Object.keys(localStrokes).length > 0) {
                    // No server data but we have local data, sync to server
                    window.saveCurrentPdfNotes(fileId, true);
                }
            })
            .getPdfNotes(fileId, userEmail);
    }
};

window.saveCurrentPdfNotes = function(fileId, immediate) {
    fileId = fileId || window.currentPdfFileId;
    if (!fileId) return;
    const userEmail = window.getPdfEffectiveUserEmail();
    const localKey = "pdf_notes_" + String(fileId).trim() + "_" + String(userEmail).toLowerCase().replace(/[^a-z0-9]/g, "");
    
    const cleanStrokes = {};
    if (window.drawingStrokes) {
        if (window.drawingStrokes._insertedPages && Array.isArray(window.drawingStrokes._insertedPages)) {
            cleanStrokes._insertedPages = window.drawingStrokes._insertedPages;
        }
        Object.keys(window.drawingStrokes).forEach(page => {
            if (page === '_insertedPages') return;
            if (window.drawingStrokes[page] && window.drawingStrokes[page].length > 0) {
                const optimizedArr = window.drawingStrokes[page].map(stroke => {
                    if (!stroke) return null;
                    if (stroke.type === 'text') {
                        return {
                            type: 'text',
                            text: stroke.text,
                            nx: Math.round((stroke.nx || 0) * 10000) / 10000,
                            ny: Math.round((stroke.ny || 0) * 10000) / 10000,
                            color: stroke.color,
                            fontSize: stroke.fontSize,
                            boxWidth: stroke.boxWidth ? Math.round(stroke.boxWidth) : undefined,
                            boxHeight: stroke.boxHeight ? Math.round(stroke.boxHeight) : undefined,
                            isCustomResized: stroke.isCustomResized ? true : undefined
                        };
                    }
                    if (stroke.points && stroke.points.length > 0) {
                        return {
                            color: stroke.color,
                            lineWidth: stroke.lineWidth,
                            points: stroke.points.map(p => ({
                                nx: Math.round((p.nx !== undefined ? p.nx : (p.x ? p.x / 800 : 0)) * 10000) / 10000,
                                ny: Math.round((p.ny !== undefined ? p.ny : (p.y ? p.y / 1000 : 0)) * 10000) / 10000
                            }))
                        };
                    }
                    return null;
                }).filter(Boolean);
                
                if (optimizedArr.length > 0) {
                    cleanStrokes[page] = optimizedArr;
                }
            }
        });
    }
    
    const now = Date.now();
    const payload = {
        updatedAt: now,
        strokes: cleanStrokes
    };
    const notesJson = JSON.stringify(payload);

    if (window.currentIsStrictMockExam) return;

    // Save to LocalStorage instantly (0ms)
    try {
        localStorage.setItem(localKey, notesJson);
    } catch(e) {
        console.warn("Lỗi lưu ghi chú vào localStorage:", e);
    }

    window.updatePdfSaveStatusIndicator('local');

    if (pdfNotesSaveDebounceTimer) clearTimeout(pdfNotesSaveDebounceTimer);

    const performCloudSave = () => {
        window.updatePdfSaveStatusIndicator('saving');
        if (window.google && window.google.script && window.google.script.run && typeof window.google.script.run.savePdfNotes === 'function') {
            window.google.script.run
                .withSuccessHandler(res => {
                    if (res && res.success) {
                        window.updatePdfSaveStatusIndicator('cloud');
                    }
                })
                .savePdfNotes(fileId, userEmail, notesJson);
        }
    };

    if (immediate) {
        performCloudSave();
    } else {
        pdfNotesSaveDebounceTimer = setTimeout(performCloudSave, 1000);
    }
};

function updateCanvasCursor() {
    const canvases = document.querySelectorAll('.drawing-layer');
    canvases.forEach(c => {
        if (window.drawingMode === 'scroll') {
            c.style.pointerEvents = 'none';
        } else {

window.gradingJumpToPage = function(type, pageNum) {
    const isExam = (type === 'exam');
    const container = document.getElementById(isExam ? 'gradeModalDrawingContainer' : 'homeworkGradeModalDrawingContainer');
    const scrollParent = container ? container.parentElement : null;
    const inputId = isExam ? 'gradeModalPageInput' : 'homeworkGradeModalPageInput';
    const totalId = isExam ? 'gradeModalTotalPages' : 'homeworkGradeModalTotalPages';
    const input = document.getElementById(inputId);
    const totalEl = document.getElementById(totalId);
    
    let page = parseInt(pageNum, 10);
    let maxPages = parseInt(totalEl ? totalEl.textContent : 1, 10) || 1;
    if (isNaN(page) || page < 1) page = 1;
    if (page > maxPages) page = maxPages;
    
    if (input) input.value = page;
    
    if (container && scrollParent) {
        const targetWrapper = container.querySelector(`[data-page-num="${page}"]`);
        if (targetWrapper) {
            const parentRect = scrollParent.getBoundingClientRect();
            const targetRect = targetWrapper.getBoundingClientRect();
            const targetScrollTop = scrollParent.scrollTop + (targetRect.top - parentRect.top) - 52;
            scrollParent.scrollTo({ top: Math.max(0, targetScrollTop), behavior: 'smooth' });
        }
    }
};
