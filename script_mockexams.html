<script>
// ==========================================
// HỆ THỐNG THI THỬ (MOCK EXAMS)
// ==========================================
async function loadMockExams() {
  const myToken = loadToken;

  // Bắt buộc máy tính (PC / Laptop) mới được vào Khảo Thí
  if (isMobileOrTablet()) {
    showToast("⚠️ Khảo Thí chỉ hỗ trợ trên máy tính (PC / Laptop).", "error");
    const container = document.getElementById("mockExamList");
    if (container) {
      container.innerHTML = `
        <div class="tds-central-state" style="padding: 50px 20px; text-align: center;">
          <div class="tds-state-icon" style="font-size: 3.5rem; margin-bottom: 16px;">💻</div>
          <div class="tds-state-title" style="font-weight: 800; color: #ef4444; font-size: 1.2rem; margin-bottom: 8px;">Chỉ Hỗ Trợ Máy Tính (PC / Laptop)</div>
          <div class="tds-state-message" style="font-size: 0.92rem; color: #64748b; max-width: 500px; margin: 0 auto 24px; line-height: 1.6;">
            Hệ thống Khảo Thí chỉ chấp nhận truy cập trên thiết bị máy tính (PC / Laptop) để đảm bảo an toàn và đúng quy chế thi cử. Các thiết bị di động (Điện thoại, Máy tính bảng) không thể truy cập phần này.
          </div>
          <button onclick="switchView('overview')" style="padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.92rem; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);">
            🏠 Trở về Trang Chủ
          </button>
        </div>
      `;
    }
    return "";
  }

  // Bật màn hình giám sát giống khoá học
  if (isBrowserFullscreen() && currentUserRole !== 'ADMIN') {
    showToast("Không được bật Full Screen khi mở đề thi thử.");
    currentView = null;
    return "";
  }
  if (!isMobileOrTablet() && currentUserRole !== 'ADMIN' && !window.screenShareNotRequired && (!window.isScreenShareActive || !window.currentShareHasCamera || !currentPopup || currentPopup.closed)) {
    try {
      if (currentPopup && !currentPopup.closed) {
        currentPopup.close();
      }
      await requestScreenShare(true);
    } catch (err) {
      if (myToken !== loadToken) return "";
      const container = document.getElementById("mockExamList");
      if (container) {
        container.innerHTML = `
          <div class="tds-central-state" style="padding: 30px 16px; text-align: center;">
            <div class="tds-state-icon" style="font-size: 2.5rem; margin-bottom: 10px;">📷</div>
            <div class="tds-state-title" style="font-weight: 700; color: #ef4444; font-size: 1rem; margin-bottom: 6px;">Yêu cầu Màn Hình & Camera</div>
            <div class="tds-state-message" style="font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">
              Đề thi thử yêu cầu bật chia sẻ toàn màn hình kèm Camera giám sát.
            </div>
            <button onclick="loadMockExams()" style="padding: 10px 18px; background: #22c55e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.88rem;">
              🎥 Bật Giám Sát & Vào Đề Thi
            </button>
          </div>
        `;
      }
      return "";
    }
  }

  if (myToken !== loadToken) return;

  const loading = document.getElementById("loadingMockExam");
  if (loading) loading.style.display = "flex";

  google.script.run.withSuccessHandler(function(res){
    if (myToken !== loadToken) return;
    if (currentView !== "mockExams") return;
    if (res.success) {
      allMockExams = res.data;
    } else {
      allMockExams = [];
    }
    
    google.script.run.withSuccessHandler(function(submittedList) {
      if (myToken !== loadToken) return;
      if (currentView !== "mockExams") return;
      userSubmittedExams = submittedList || [];
      if (loading) loading.style.display = "none";
      renderMockExamList(allMockExams);
    }).getUserSubmittedExams();
  }).getMockExams();

  return "";
}

function renderMockExamList(mockExams) {
  const container = document.getElementById("mockExamList");
  container.innerHTML = "";
  if (!mockExams || mockExams.length === 0) {
    container.innerHTML = `
      <div class="tds-central-state" style="padding: 40px 20px; text-align: center; color: #94a3b8;">
        <div class="tds-state-icon" style="font-size: 3rem; margin-bottom: 12px;">✍️</div>
        <div class="tds-state-title" style="font-weight: 600; color: #64748b; font-size: 1.1rem; margin-bottom: 4px;">Chưa có đề thi thử nào</div>
      </div>
    `;
    return;
  }
  
  mockExams.sort((a, b) => a.title.localeCompare(b.title));

  // Determine if we need grouping by class
  const hasClassGrouping = mockExams.some(item => item.className && item.className.trim() !== "");

  if (hasClassGrouping) {
    // Group exams by class name
    const classGroups = {};
    mockExams.forEach(item => {
      const cls = (item.className && item.className.trim() !== "") ? item.className.trim() : "Đề thi chung";
      if (!classGroups[cls]) {
        classGroups[cls] = [];
      }
      classGroups[cls].push(item);
    });

    // Sort class names (putting "Đề thi chung" at the end if it exists)
    const sortedClasses = Object.keys(classGroups).sort((a, b) => {
      if (a === "Đề thi chung") return 1;
      if (b === "Đề thi chung") return -1;
      return a.localeCompare(b);
    });

    const fragment = document.createDocumentFragment();

    sortedClasses.forEach((className) => {
      const examsInClass = classGroups[className];

      // Create collapsible folder for this class
      const section = document.createElement("div");
      section.className = "exam-folder-section";
      section.style.marginBottom = "16px";
      
      const header = document.createElement("div");
      header.className = `exam-folder-header level-0`; // Collapsed by default

      // Count unsubmitted exams in this class
      const unsubmittedCount = examsInClass.filter(item => {
        const userSub = (typeof userSubmittedExams !== 'undefined') ? userSubmittedExams.find(sub => sub.examTitle.trim().toLowerCase() === item.title.trim().toLowerCase()) : null;
        return !userSub;
      }).length;

      const badgeHtml = unsubmittedCount > 0 ? `<span style="background: #10b981; color: white; border-radius: 20px; padding: 2px 8px; font-size: 11px; margin-left: 8px; font-weight: 600;">${unsubmittedCount} bài mới</span>` : '';

      header.innerHTML = `
        <span class="title" style="display: flex; align-items: center; gap: 8px;" title="${className}">
          📁 ${className} ${badgeHtml}
        </span>
        <span class="arrow">▶</span>
      `;

      const content = document.createElement("div");
      content.className = "exam-folder-content";
      content.style.display = "none"; // Closed by default
      content.style.marginTop = "8px";

      header.addEventListener("click", () => {
        const isHidden = content.style.display === "none";
        content.style.display = isHidden ? "block" : "none";
        header.classList.toggle("open", isHidden);
      });

      // Inside each class folder, group exams by submission status
      const classRoot = {
        unsubmitted: [],
        waiting: [],
        graded: []
      };

      examsInClass.forEach(item => {
        const userSub = (typeof userSubmittedExams !== 'undefined') ? userSubmittedExams.find(sub => sub.examTitle.trim().toLowerCase() === item.title.trim().toLowerCase()) : null;
        let groupKey = "unsubmitted";
        if (userSub) {
          groupKey = userSub.score !== "" ? "graded" : "waiting";
        }
        classRoot[groupKey].push(item);
      });

      const statusGroups = [
        { key: "unsubmitted", title: "❌ Chưa nộp" },
        { key: "waiting", title: "⏳ Chờ chấm" },
        { key: "graded", title: "✅ Đã chấm" }
      ];

      statusGroups.forEach(group => {
        const examsInStatus = classRoot[group.key];
        if (examsInStatus.length > 0) {
          const sectionHeader = document.createElement("div");
          sectionHeader.className = "status-group-header";
          sectionHeader.style.marginTop = "12px";
          sectionHeader.innerHTML = group.title;
          content.appendChild(sectionHeader);

          examsInStatus.forEach(item => {
            const examItem = document.createElement("div");
            examItem.className = "exam-item";
            
            const icon = item.type === "pdf" ? "📄" : "📑";

            const now = new Date();
            const start = item.startTime ? new Date(item.startTime) : null;
            const end = item.endTime ? new Date(item.endTime) : null;

            const formatTime = (d) => {
              const pad = n => (n < 10 ? '0' + n : n);
              return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };

            let timeMsg = "";
            let isLocked = false;
            
            if (start && !isNaN(start.getTime()) && now < start) {
              isLocked = true;
              timeMsg = `<span class="exam-time-text locked">⏳ Mở: ${formatTime(start)}</span>`;
            } else if (end && !isNaN(end.getTime()) && now > end) {
              timeMsg = `<span class="exam-time-text closed">🔒 Đóng: ${formatTime(end)}</span>`;
            } else if (end && !isNaN(end.getTime()) && now <= end) {
              timeMsg = `<span class="exam-time-text open">⏰ Hạn: ${formatTime(end)}</span>`;
            }

            examItem.innerHTML = `
              <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
                <span class="exam-title" title="${item.title}" ${isLocked ? 'style="opacity: 0.5;"' : ''}>
                  ${isLocked ? "🔒" : icon} ${item.title}
                </span>
                ${timeMsg}
              </div>
              <button class="exam-button" ${isLocked ? 'disabled style="opacity: 0.5; cursor: not-allowed; flex-shrink: 0;"' : 'style="flex-shrink: 0;"'}>
                ${isLocked ? 'Chưa mở' : 'Làm bài thi'}
              </button>
            `;
            if (!isLocked) {
              examItem.querySelector(".exam-button").onclick = function() {
                viewMockExam(item);
              };
            }

            content.appendChild(examItem);
          });
        }
      });

      section.appendChild(header);
      section.appendChild(content);
      fragment.appendChild(section);
    });

    container.appendChild(fragment);
  } else {
    // Normal non-grouped flow
    const root = {
      unsubmitted: [],
      waiting: [],
      graded: []
    };
    
    mockExams.forEach(item => {
      const userSub = (typeof userSubmittedExams !== 'undefined') ? userSubmittedExams.find(sub => sub.examTitle.trim().toLowerCase() === item.title.trim().toLowerCase()) : null;
      let groupKey = "unsubmitted";
      if (userSub) {
        groupKey = userSub.score !== "" ? "graded" : "waiting";
      }
      root[groupKey].push(item);
    });

    const fragment = document.createDocumentFragment();
    
    const groups = [
      { key: "unsubmitted", title: "❌ Chưa nộp" },
      { key: "waiting", title: "⏳ Chờ chấm" },
      { key: "graded", title: "✅ Đã chấm" }
    ];

    groups.forEach(group => {
      const examsInGroup = root[group.key];
      
      if (examsInGroup.length > 0) {
        const sectionHeader = document.createElement("div");
        sectionHeader.className = "status-group-header";
        sectionHeader.innerHTML = group.title;
        fragment.appendChild(sectionHeader);

        const content = document.createElement("div");
        content.style.padding = "4px 0";

        examsInGroup.forEach(item => {
          const examItem = document.createElement("div");
          examItem.className = "exam-item";
          
          const icon = item.type === "pdf" ? "📄" : "📑";

          const now = new Date();
          const start = item.startTime ? new Date(item.startTime) : null;
          const end = item.endTime ? new Date(item.endTime) : null;

          const formatTime = (d) => {
            const pad = n => (n < 10 ? '0' + n : n);
            return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
          };

          let timeMsg = "";
          let isLocked = false;
          
          if (start && !isNaN(start.getTime()) && now < start) {
            isLocked = true;
            timeMsg = `<span class="exam-time-text locked">⏳ Mở: ${formatTime(start)}</span>`;
          } else if (end && !isNaN(end.getTime()) && now > end) {
            timeMsg = `<span class="exam-time-text closed">🔒 Đóng: ${formatTime(end)}</span>`;
          } else if (end && !isNaN(end.getTime()) && now <= end) {
            timeMsg = `<span class="exam-time-text open">⏰ Hạn: ${formatTime(end)}</span>`;
          }

          examItem.innerHTML = `
            <div style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
              <span class="exam-title" title="${item.title}" ${isLocked ? 'style="opacity: 0.5;"' : ''}>
                ${isLocked ? "🔒" : icon} ${item.title}
              </span>
              ${timeMsg}
            </div>
            <button class="exam-button" ${isLocked ? 'disabled style="opacity: 0.5; cursor: not-allowed; flex-shrink: 0;"' : 'style="flex-shrink: 0;"'}>
              ${isLocked ? 'Chưa mở' : 'Làm bài thi'}
            </button>
          `;
          if (!isLocked) {
            examItem.querySelector(".exam-button").onclick = function() {
              viewMockExam(item);
            };
          }

          content.appendChild(examItem);
        });
        
        fragment.appendChild(content);
      }
    });

    container.appendChild(fragment);
  }
}

function filterMockExams() {
  const input = document.getElementById("searchMockExamInput");
  if (!input) return;
  const kw = input.value.toLowerCase().trim();
  const filtered = allMockExams.filter(e => 
    e.title.toLowerCase().includes(kw) || 
    (e.className && e.className.toLowerCase().includes(kw))
  );
  renderMockExamList(filtered);
}

window.updateSelectedFileName = function(input) {
  const label = document.getElementById("selectedFileName");
  if (label) {
    if (input.files && input.files.length > 0) {
      label.textContent = input.files[0].name;
      label.style.fontWeight = "bold";
      const isDark = document.body.classList.contains("dark-mode");
      label.style.color = isDark ? "#f1f5f9" : "#1e293b";
    } else {
      label.textContent = "Chưa chọn tệp nào";
      label.style.fontWeight = "500";
      const isDark = document.body.classList.contains("dark-mode");
      label.style.color = isDark ? "#94a3b8" : "#64748b";
    }
  }
};

function ensureExamsAndMockExamsLoaded(callback) {
  let examsLoaded = false;
  let mockExamsLoaded = false;

  const checkDone = () => {
    if (examsLoaded && mockExamsLoaded) {
      if (typeof callback === 'function') callback();
    }
  };

  if (typeof allExams !== 'undefined' && Array.isArray(allExams) && allExams.length > 0) {
    examsLoaded = true;
  } else {
    google.script.run.withSuccessHandler(function(exams) {
      if (exams && Array.isArray(exams)) {
        allExams = exams;
      }
      examsLoaded = true;
      checkDone();
    }).withFailureHandler(() => {
      examsLoaded = true;
      checkDone();
    }).getExams();
  }

  if (typeof allMockExams !== 'undefined' && Array.isArray(allMockExams) && allMockExams.length > 0) {
    mockExamsLoaded = true;
  } else {
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success && res.data) {
        allMockExams = res.data;
      }
      mockExamsLoaded = true;
      checkDone();
    }).withFailureHandler(() => {
      mockExamsLoaded = true;
      checkDone();
    }).getMockExams();
  }

  // If both were already loaded, execute callback immediately
  checkDone();
}

function populateScoreModalSelects() {
  const allAvailableScoreTitles = [];
  if (typeof allMockExams !== 'undefined' && Array.isArray(allMockExams)) {
    allMockExams.forEach(item => {
      if (item && item.title && !allAvailableScoreTitles.includes(item.title)) {
        allAvailableScoreTitles.push(item.title);
      }
    });
  }

  ['scoreExamTitle', 'scoreExamTitle1', 'scoreExamTitle2'].forEach(id => {
    const selectEl = document.getElementById(id);
    if (selectEl) {
      const currentVal = selectEl.value;
      const firstOpt = selectEl.options[0];
      selectEl.innerHTML = '';
      if (firstOpt) selectEl.appendChild(firstOpt);
      allAvailableScoreTitles.forEach(title => {
        const option = document.createElement("option");
        option.value = title;
        option.textContent = title;
        selectEl.appendChild(option);
      });
      if (currentVal && allAvailableScoreTitles.includes(currentVal)) {
        selectEl.value = currentVal;
      }
    }
  });
}

function repopulateSuggestedStatsSelect(targetSelectId, basedOnTitle) {
  const selectEl = document.getElementById(targetSelectId);
  if (!selectEl) return;

  const allAvailableStatsTitles = [];
  if (typeof allMockExams !== 'undefined' && Array.isArray(allMockExams)) {
    allMockExams.forEach(item => {
      if (item && item.title && !allAvailableStatsTitles.includes(item.title)) {
        allAvailableStatsTitles.push(item.title);
      }
    });
  }

  const currentVal = selectEl.value;
  const firstOpt = selectEl.options[0];
  selectEl.innerHTML = '';
  if (firstOpt) selectEl.appendChild(firstOpt);

  if (!basedOnTitle) {
    allAvailableStatsTitles.forEach(title => {
      const option = document.createElement("option");
      option.value = title;
      option.textContent = title;
      selectEl.appendChild(option);
    });
    if (currentVal && allAvailableStatsTitles.includes(currentVal)) {
      selectEl.value = currentVal;
    }
    return;
  }

  const cleanStr = (s) => s.toLowerCase()
    .replace(/[-,:\(\)\+]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const targetClean = cleanStr(basedOnTitle);
  const targetWords = targetClean.split(' ').filter(w => w.length >= 2);
  const stopwords = ['đề', 'thi', 'bài', 'lần', 'vòng', 'ngày', 'tập', 'học', 'sinh', 'giỏi'];
  const wordsToMatch = targetWords.filter(w => !stopwords.includes(w));
  const finalWordsToMatch = wordsToMatch.length > 0 ? wordsToMatch : targetWords;

  const numberMatches = basedOnTitle.match(/\d+/g);
  const targetNumbers = numberMatches ? numberMatches.map(Number) : [];

  const scored = [];
  const nonScored = [];

  allAvailableStatsTitles.forEach(title => {
    if (title === basedOnTitle) return;
    
    const titleClean = cleanStr(title);
    
    let matchCount = 0;
    finalWordsToMatch.forEach(w => {
      if (titleClean.includes(w)) {
        matchCount += 1;
      }
    });

    let charMatchScore = 0;
    if (titleClean.includes(targetClean) || targetClean.includes(titleClean)) {
      charMatchScore = 5;
    }

    const titleNumbers = (title.match(/\d+/g) || []).map(Number);
    let numberBonus = 0;
    if (targetNumbers.length > 0 && titleNumbers.length > 0) {
      const hasDiff = titleNumbers.some(n => !targetNumbers.includes(n));
      const hasSame = titleNumbers.some(n => targetNumbers.includes(n));
      if (hasDiff && (hasSame || matchCount > 0)) {
        numberBonus = 3;
      }
    }

    const totalScore = matchCount * 2 + charMatchScore + numberBonus;

    if (totalScore > 0) {
      scored.push({ title, score: totalScore });
    } else {
      nonScored.push(title);
    }
  });

  scored.sort((a, b) => b.score - a.score);

  if (scored.length > 0) {
    const optGroupGợiÝ = document.createElement("optgroup");
    optGroupGợiÝ.label = "💡 GỢI Ý PHÙ HỢP NHẤT";
    scored.forEach(item => {
      const option = document.createElement("option");
      option.value = item.title;
      option.textContent = item.title;
      optGroupGợiÝ.appendChild(option);
    });
    selectEl.appendChild(optGroupGợiÝ);
  }

  const optGroupKhác = document.createElement("optgroup");
  optGroupKhác.label = "📂 TẤT CẢ BÀI THI KHÁC";
  nonScored.forEach(title => {
    const option = document.createElement("option");
    option.value = title;
    option.textContent = title;
    optGroupKhác.appendChild(option);
  });
  selectEl.appendChild(optGroupKhác);

  if (currentVal) {
    selectEl.value = currentVal;
  }
}

window.handleStatsTitle1Change = function() {
  const val1 = document.getElementById("statsExamTitle1")?.value || "";
  repopulateSuggestedStatsSelect("statsExamTitle2", val1);
};

window.handleStatsTitle2Change = function() {
  const val2 = document.getElementById("statsExamTitle2")?.value || "";
  repopulateSuggestedStatsSelect("statsExamTitle1", val2);
};

function openExamSubmitPopup(examTitle) {
  let modal = document.getElementById("examSubmitPopup");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "examSubmitPopup";
    modal.className = "modern-modal-overlay";
    modal.style.display = "none";
    
    modal.innerHTML = `
      <div class="modern-modal-backdrop" onclick="document.getElementById('examSubmitPopup').style.display='none'"></div>

        <!-- Header -->
        <div style="background: linear-gradient(135deg, #f97316 0%, #e6774f 100%); padding: 16px 20px; color: white; display: flex; justify-content: space-between; align-items: center; position: relative;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 1.25rem;">📤</span>
            <div style="text-align: left;">
              <h3 id="submitExamHeaderTitle" style="margin: 0; font-size: 1.05rem; font-weight: 800; color: white; letter-spacing: 0.5px; text-transform: uppercase; line-height: 1.2;">Nộp Bài Thi Thử</h3>
              <p style="margin: 2px 0 0 0; font-size: 0.72rem; opacity: 0.9; font-weight: 500;">Tải lên bản PDF bài giải của bạn</p>
            </div>
          </div>
          <button onclick="document.getElementById('examSubmitPopup').style.display='none'" style="background: rgba(255,255,255,0.15); border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">✕</button>
        </div>

        <!-- Body -->
        <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; max-height: 75vh; overflow-y: auto;">
          <!-- Select Exam Title Group -->
          <div class="input-group" style="text-align: left; margin: 0;">
            <label style="font-weight: 800; font-size: 0.72rem; color: #475569; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px;">📝 Tên bài thi cần nộp</label>
            <select id="submitExamTitle" class="modern-input" style="width: 100%; font-weight: 600; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; outline: none; margin-bottom: 0; cursor: pointer;">
              <option value="">-- Chọn bài thi --</option>
            </select>
          </div>

          <!-- Re-submission alert if any -->
          <div id="submitExamWarning" style="margin: 0; font-size: 0.8rem; font-weight: 600; display: none; line-height: 1.4; padding: 10px 12px; border-radius: 8px; text-align: left;"></div>

          <!-- File upload custom picker -->
          <div class="input-group" style="text-align: left; margin: 0;">
            <label style="font-weight: 800; font-size: 0.72rem; color: #475569; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px;">📎 File PDF bài làm</label>
            <div style="position: relative; display: flex; align-items: center; gap: 8px;">
              <button type="button" id="customFilePickerBtn" onclick="document.getElementById('submitExamPdf').click()" style="padding: 9px 12px; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f1f5f9'">
                📁 Chọn tệp PDF
              </button>
              <span id="selectedFileName" style="font-size: 0.8rem; color: #64748b; font-weight: 500; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 220px; text-align: left;">Chưa chọn tệp nào</span>
              <input type="file" id="submitExamPdf" accept="application/pdf" style="display: none;" onchange="updateSelectedFileName(this)" />
            </div>
          </div>

          <!-- Submit Button -->
          <button id="submitExamBtn" onclick="submitExamNow()" style="width: 100%; background: #e6774f; font-weight: 700; font-size: 0.85rem; padding: 11px; border-radius: 8px; color: white; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2); display: flex; align-items: center; justify-content: center; gap: 6px;" onmouseover="if(this.disabled) return; this.style.background='#db6e42'; this.style.transform='translateY(-1px)';" onmouseout="if(this.disabled) return; this.style.background='#e6774f'; this.style.transform='translateY(0)';">
            🚀 Xác nhận nộp bài
          </button>

          <!-- Status Presentation Panel -->
          <div id="submitExamStatus" style="margin: 0;"></div>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  }
  
  const isDark = document.body.classList.contains("dark-mode");
  const modalBox = modal.querySelector(".modern-modal-box");
  if (modalBox) {
    if (isDark) {
      modalBox.style.background = "#1e293b";
      modalBox.style.borderColor = "#334155";
      modalBox.style.color = "#f1f5f9";
    } else {
      modalBox.style.background = "#ffffff";
      modalBox.style.borderColor = "rgba(234, 88, 12, 0.2)";
      modalBox.style.color = "#1e293b";
    }
  }

  const submitLabels = modal.querySelectorAll(".input-group label");
  submitLabels.forEach(lbl => {
    lbl.style.color = isDark ? "#94a3b8" : "#475569";
  });

  const filePickerBtn = document.getElementById("customFilePickerBtn");
  if (filePickerBtn) {
    filePickerBtn.style.background = isDark ? "#334155" : "#f1f5f9";
    filePickerBtn.style.borderColor = isDark ? "#475569" : "#cbd5e1";
    filePickerBtn.style.color = isDark ? "#f1f5f9" : "#334155";
  }

  const selFileNameSpan = document.getElementById("selectedFileName");
  if (selFileNameSpan) {
    selFileNameSpan.style.color = isDark ? "#94a3b8" : "#64748b";
    selFileNameSpan.textContent = "Chưa chọn tệp nào";
    selFileNameSpan.style.fontWeight = "500";
  }

  function updateWarningMessage(titleVal) {
    const warningDiv = document.getElementById("submitExamWarning");
    if (!warningDiv) return;
    const trimmedTitle = (titleVal || "").trim();
    if (trimmedTitle === "") {
      warningDiv.style.display = "none";
      warningDiv.innerHTML = "";
      warningDiv.style.whiteSpace = "normal";
      warningDiv.style.overflow = "visible";
      warningDiv.style.textOverflow = "clip";
      const btn = document.getElementById("submitExamBtn");
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.cursor = "pointer";
      }
      return;
    }
    
    // Check if locked due to time
    const examItem = (typeof allMockExams !== 'undefined') ? allMockExams.find(e => e.title.trim().toLowerCase() === trimmedTitle.toLowerCase()) : null;
    let isClosed = false;
    let closedMsg = "";
    if (examItem) {
      const now = new Date();
      const end = examItem.endTime ? new Date(examItem.endTime) : null;
      if (end && !isNaN(end.getTime()) && now > end) {
        isClosed = true;
        const pad = (n) => String(n).padStart(2, '0');
        const formatted = `${pad(end.getHours())}:${pad(end.getMinutes())} ${pad(end.getDate())}/${pad(end.getMonth() + 1)}/${end.getFullYear()}`;
        closedMsg = `Bài thi đã đóng lúc ${formatted}.`;
      }
    }

    warningDiv.style.display = "block";
    
    if (isClosed) {
      if (isDark) {
        warningDiv.style.background = "rgba(220, 38, 38, 0.2)";
        warningDiv.style.border = "1px solid rgba(220, 38, 38, 0.4)";
        warningDiv.style.color = "#fca5a5";
      } else {
        warningDiv.style.background = "#fef2f2";
        warningDiv.style.border = "1px solid #fee2e2";
        warningDiv.style.color = "#dc2626";
      }
      warningDiv.style.whiteSpace = "nowrap";
      warningDiv.style.overflow = "hidden";
      warningDiv.style.textOverflow = "ellipsis";
      warningDiv.title = `⚠️ ${closedMsg}`;
      warningDiv.innerHTML = `⚠️ ${closedMsg}`;
      const btn = document.getElementById("submitExamBtn");
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.cursor = "not-allowed";
      }
      return;
    }

    warningDiv.style.whiteSpace = "normal";
    warningDiv.style.overflow = "visible";
    warningDiv.style.textOverflow = "clip";
    warningDiv.removeAttribute("title");

    const submitBtn = document.getElementById("submitExamBtn");
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.style.opacity = "1";
      submitBtn.style.cursor = "pointer";
    }

    const userSub = (typeof userSubmittedExams !== 'undefined') ? userSubmittedExams.find(sub => sub.examTitle.trim().toLowerCase() === trimmedTitle.toLowerCase()) : null;
    if (userSub) {
      if (isDark) {
        warningDiv.style.background = "rgba(124, 45, 18, 0.3)";
        warningDiv.style.border = "1px solid rgba(234, 88, 12, 0.4)";
        warningDiv.style.color = "#ffedd5";
      } else {
        warningDiv.style.background = "#fff7ed";
        warningDiv.style.border = "1px solid #ffedd5";
        warningDiv.style.color = "#d3613a";
      }
      const isGraded = userSub.score !== "";
      const statusText = isGraded ? "✅ Đã chấm" : "⏳ Chờ chấm";
      warningDiv.innerHTML = `⚠️ Trạng thái: <b>${statusText}</b> (Nộp lúc ${userSub.timestamp}).<br>Nộp lại bài giải mới nếu cần thiết.`;
    } else {
      if (isDark) {
        warningDiv.style.background = "rgba(15, 23, 42, 0.4)";
        warningDiv.style.border = "1px solid rgba(148, 163, 184, 0.2)";
        warningDiv.style.color = "#94a3b8";
      } else {
        warningDiv.style.background = "#f8fafc";
        warningDiv.style.border = "1px solid #cbd5e1";
        warningDiv.style.color = "#64748b";
      }
      warningDiv.innerHTML = `ℹ️ Trạng thái: <b>❌ Chưa nộp</b>.<br>Vui lòng chọn file PDF bên dưới để nộp bài.`;
    }
  }

  const titleInput = document.getElementById("submitExamTitle");
  if (titleInput) {
    ensureExamsAndMockExamsLoaded(function() {
      const firstOpt = titleInput.options[0];
      titleInput.innerHTML = '';
      if (firstOpt) titleInput.appendChild(firstOpt);
      allMockExams.forEach(item => {
         const option = document.createElement("option");
         option.value = item.title;
         option.textContent = item.title;
         titleInput.appendChild(option);
      });
      
      titleInput.value = examTitle || "";
      titleInput.disabled = !!examTitle;
      
      if (examTitle) {
        titleInput.style.background = isDark ? "#1e293b" : "#f1f5f9";
        titleInput.style.borderColor = isDark ? "#475569" : "#cbd5e1";
        titleInput.style.color = isDark ? "#94a3b8" : "#475569";
      } else {
        titleInput.style.background = isDark ? "#0f172a" : "#ffffff";
        titleInput.style.borderColor = isDark ? "#334155" : "#cbd5e1";
        titleInput.style.color = isDark ? "#f1f5f9" : "#1e293b";
      }
      
      updateWarningMessage(titleInput.value);
    });
  }

  titleInput.onchange = () => {
    updateWarningMessage(titleInput.value);
  };

  document.getElementById("submitExamPdf").value = "";
  document.getElementById("submitExamStatus").innerHTML = "";
  document.getElementById("submitExamBtn").disabled = false;
  document.getElementById("submitExamBtn").innerHTML = "🚀 Xác nhận nộp bài";

  updateWarningMessage(titleInput.value);

  modal.style.display = "flex";
}

function submitExamNow() {
  if (window.isSubmittingExamNow) return;

  const fileInput = document.getElementById("submitExamPdf");
  const examTitle = document.getElementById("submitExamTitle").value;
  const statusDiv = document.getElementById("submitExamStatus");
  const submitBtn = document.getElementById("submitExamBtn");

  if (!fileInput.files.length) {
    statusDiv.innerHTML = `<span style="color: #ef4444; font-weight: 600; font-size: 0.8rem; display: block; margin-top: 6px;">⚠️ Vui lòng chọn file PDF.</span>`;
    return;
  }

  const file = fileInput.files[0];
  if (file.type !== "application/pdf") {
    statusDiv.innerHTML = `<span style="color: #ef4444; font-weight: 600; font-size: 0.8rem; display: block; margin-top: 6px;">⚠️ Chỉ chấp nhận định dạng PDF.</span>`;
    return;
  }

  // Maximum raw file size is set to 25 MB (26,214,400 bytes).
  const MAX_SIZE_MB = 25;
  const MAX_SIZE_BYTES = MAX_SIZE_MB * 1024 * 1024;
  if (file.size > MAX_SIZE_BYTES) {
    const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
    statusDiv.innerHTML = `
      <div style="border-color: #ef4444; background: rgba(239, 68, 68, 0.04); padding: 12px; border: 1px dashed #fca5a5; border-radius: 12px; margin-top: 10px; color: #ef4444; font-size: 0.8rem; line-height: 1.4; text-align: left;">
        <div style="font-weight: 800; margin-bottom: 6px; color: #ef4444; display: flex; align-items: center; gap: 4px;">⚠️ FILE QUÁ LỚN (${fileSizeMB} MB)</div>
        Giới hạn dung lượng tải lên tối đa là <b>25 MB</b>.<br><br>
        <b>Mẹo khắc phục ngay nếu file quá lớn:</b><br>
        1. Sử dụng trang web nén PDF miễn phí và cực nhanh: <a href="https://www.ilovepdf.com/vi/nen-pdf" target="_blank" style="color: #e6774f; font-weight: bold; text-decoration: underline;">ilovepdf.com/vi/nen-pdf</a> hoặc <a href="https://smallpdf.com/vi/compress-pdf" target="_blank" style="color: #e6774f; font-weight: bold; text-decoration: underline;">smallpdf.com</a> (Nén xong dung lượng file sẽ giảm đáng kể mà vẫn rất rõ nét).<br>
        2. Nếu bạn quét đề thi bằng điện thoại, hãy chọn chế độ <b>"Low Quality"</b> hoặc <b>"Medium Quality"</b> trên app (như CamScanner) thay vì chọn HD/High Quality.
      </div>
    `;
    return;
  }

  window.isSubmittingExamNow = true;
  submitBtn.disabled = true;
  fileInput.disabled = true;

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64Data = e.target.result.split(",")[1];
    
    statusDiv.innerHTML = `
      <div class="exam-loading-container animate-fade-in" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px dashed #cbd5e1; border-radius: 12px; gap: 8px; margin-top: 10px;">
        <div class="exam-loading-spinner" style="width: 28px; height: 28px; border: 3px solid #f3f3f3; border-top: 3px solid #e6774f; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div class="exam-loading-text" style="font-size: 0.8rem; color: #64748b; font-weight: 600;">Đang nộp bài của bạn lên hệ thống bảo mật...</div>
      </div>
    `;
    submitBtn.innerHTML = `Đang nộp bài...`;

    google.script.run
      .withSuccessHandler(res => {
        window.isSubmittingExamNow = false;
        fileInput.disabled = false;
        if (res.success) {
          statusDiv.innerHTML = `
            <div class="exam-loading-container animate-fade-in" style="border-color: #16a34a; background: rgba(22, 163, 74, 0.04); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px dashed #bbf7d0; border-radius: 12px; gap: 8px; margin-top: 10px;">
              <div style="font-size: 1.5rem;">✅</div>
              <div class="exam-loading-text" style="color: #16a34a; font-weight: 700; font-size: 0.8rem; text-align: center;">Nộp bài thi thành công!</div>
            </div>
          `;
          submitBtn.innerHTML = `✅ Đã nộp thành công`;
          
          google.script.run.withSuccessHandler(function(submittedList) {
            userSubmittedExams = submittedList || [];
            if (currentView === "mockExams") {
              renderMockExamList(allMockExams);
            }
            const activeReaderTitle = document.querySelector(".reader-title");
            if (activeReaderTitle) {
              const existingBadge = document.querySelector(".reader-exam-badge");
              if (existingBadge) {
                existingBadge.remove();
              }
              const targetNorm = examTitle.trim().toLowerCase();
              const latestSub = userSubmittedExams.find(sub => sub.examTitle.trim().toLowerCase() === targetNorm);
              if (latestSub) {
                const subBadgeSpan = document.createElement("span");
                subBadgeSpan.className = "reader-exam-badge";
                subBadgeSpan.style.cssText = "font-size: 0.8rem; font-weight: bold; color: #e6774f; background: #ffedd5; padding: 4px 10px; border-radius: 6px; margin-left: 10px; border: 1px solid #fed7aa; display: inline-flex; align-items: center; gap: 4px;";
                subBadgeSpan.innerHTML = `✅ Đã nộp (${latestSub.timestamp})`;
                activeReaderTitle.appendChild(subBadgeSpan);
              }
            }
          }).getUserSubmittedExams();

          setTimeout(() => {
            document.getElementById('examSubmitPopup').style.display = 'none';
          }, 2000);
        } else {
          statusDiv.innerHTML = `
            <div class="exam-loading-container animate-fade-in" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.04); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; border: 1px dashed #fca5a5; border-radius: 12px; gap: 8px; margin-top: 10px;">
              <div style="font-size: 1.5rem;">❌</div>
              <div class="exam-loading-text" style="color: #ef4444; font-weight: 700; font-size: 0.8rem; text-align: center;">Nộp bài thất bại: ${res.message}</div>
            </div>
          `;
          submitBtn.disabled = false;
          submitBtn.innerHTML = `🚀 Xác nhận nộp bài`;
        }
      })
      .withFailureHandler(err => {
        window.isSubmittingExamNow = false;
        fileInput.disabled = false;
        const errorMsg = err ? (err.message || String(err)) : "Không xác định";
        statusDiv.innerHTML = `
          <div class="exam-loading-container animate-fade-in" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.04); text-align: left; padding: 16px; border: 1px dashed #fca5a5; border-radius: 12px; margin-top: 10px;">
            <div style="font-size: 1.5rem; text-align: center; margin-bottom: 6px;">❌</div>
            <div class="exam-loading-text" style="color: #ef4444; font-weight: 700; font-size: 0.8rem; margin-bottom: 6px;">Lỗi kết nối: ${errorMsg}</div>
            <div style="font-size: 0.75rem; color: #475569; line-height: 1.4;">
              Nếu lỗi này liên tục xảy ra, có thể file bài làm của bạn có dung lượng quá lớn hoặc đường truyền không ổn định. Vui lòng nén file nhỏ lại (như dùng <a href="https://www.ilovepdf.com/vi/nen-pdf" target="_blank" style="color: #e6774f; font-weight: bold; text-decoration: underline;">ilovepdf.com</a>) rồi nộp lại nhé!
            </div>
          </div>
        `;
        submitBtn.disabled = false;
        submitBtn.innerHTML = `🚀 Xác nhận nộp bài`;
      })
      .uploadExamSubmission(base64Data, file.name, examTitle);
  };

  reader.onerror = function() {
    window.isSubmittingExamNow = false;
    submitBtn.disabled = false;
    fileInput.disabled = false;
    statusDiv.innerHTML = `<span style="color: #ef4444; font-weight: 600; font-size: 0.8rem; display: block; margin-top: 6px;">⚠️ Không thể đọc file. Vui lòng thử lại.</span>`;
  };

  reader.readAsDataURL(file);
}

window.computeRankAndTotalFromAdminData = function(examTitle, studentEmail, currentScoreStr) {
  const cleanTitle = (examTitle || "").trim().toLowerCase();
  const cleanEmail = (studentEmail || "").toLowerCase().trim();
  const currentNumScore = parseFloat((currentScoreStr || "0").toString().replace(/,/g, ".")) || 0;

  let list = window.adminAllSubmissions || [];
  if (!list || list.length === 0) {
    return { rank: 1, totalCandidates: 1 };
  }

  // Filter matching submissions that have a graded score
  let matchingSubs = list.filter(sub => {
    const t = (sub.examTitle || "").trim().toLowerCase();
    const hasScore = sub.score !== undefined && sub.score !== null && sub.score.toString().trim() !== "";
    if (!hasScore) return false;
    
    if (t === cleanTitle) return true;
    if (cleanTitle.includes(" + ")) {
      const parts = cleanTitle.split(" + ");
      return parts.some(p => p.trim() && t.includes(p.trim().toLowerCase()));
    }
    return false;
  });

  if (matchingSubs.length === 0) {
    return { rank: 1, totalCandidates: 1 };
  }

  // Deduplicate by email (keeping highest total score per student)
  let studentScoresMap = {};
  matchingSubs.forEach(sub => {
    const em = (sub.email || "").toLowerCase().trim();
    if (!em) return;
    const parsed = parseScoreWithComponentsJS(sub.score);
    const val = parseFloat((parsed.total || "0").toString().replace(/,/g, ".")) || 0;
    if (studentScoresMap[em] === undefined || val > studentScoresMap[em]) {
      studentScoresMap[em] = val;
    }
  });

  if (cleanEmail && studentScoresMap[cleanEmail] === undefined) {
    studentScoresMap[cleanEmail] = currentNumScore;
  }

  const scoresArr = Object.values(studentScoresMap);
  scoresArr.sort((a, b) => b - a);

  const targetScore = (cleanEmail && studentScoresMap[cleanEmail] !== undefined) ? studentScoresMap[cleanEmail] : currentNumScore;

  let computedRank = 1;
  for (let i = 0; i < scoresArr.length; i++) {
    if (scoresArr[i] > targetScore) {
      computedRank++;
    }
  }

  return {
    rank: computedRank,
    totalCandidates: scoresArr.length
  };
};

window.calculateAwardFromSpectrum = function(scoreStr, rank, totalCandidates) {
  const r = parseInt(rank, 10) || 0;
  const N = parseInt(totalCandidates, 10) || 0;

  if (N >= 1 && r > 0) {
    if (N === 1) {
      return { label: "Giải Nhất", badge: "🥇", color: "#16a34a", bg: "#f0fdf4", border: "#86efac" };
    }
    if (N === 2) {
      if (r === 1) return { label: "Giải Nhất", badge: "🥇", color: "#16a34a", bg: "#f0fdf4", border: "#86efac" };
      return { label: "Giải Nhì", badge: "🥈", color: "#2563eb", bg: "#eff6ff", border: "#93c5fd" };
    }

    // Standard competitive award quota (theo phổ điểm):
    // Total awarded quota T = ceil(0.60 * N)
    const T = Math.max(1, Math.ceil(0.60 * N));
    // First Prize (Giải Nhất): top ~8% of awarded pool (at least 1)
    const g1 = Math.max(1, Math.round(0.08 * T));
    // Second Prize (Giải Nhì): next ~25% of awarded pool
    const g2 = Math.max(1, Math.round(0.25 * T));
    // Third Prize (Giải Ba): next ~32% of awarded pool
    const g3 = Math.max(1, Math.round(0.32 * T));
    // Consolation Prize (Giải Khuyến Khích): remainder of T
    const gKK = Math.max(0, T - g1 - g2 - g3);

    if (r <= g1) {
      return { label: "Giải Nhất", badge: "🥇", color: "#16a34a", bg: "#f0fdf4", border: "#86efac" };
    }
    if (r <= g1 + g2) {
      return { label: "Giải Nhì", badge: "🥈", color: "#2563eb", bg: "#eff6ff", border: "#93c5fd" };
    }
    if (r <= g1 + g2 + g3) {
      return { label: "Giải Ba", badge: "🥉", color: "#db6e42", bg: "#fffbeb", border: "#fde68a" };
    }
    if (r <= T) {
      return { label: "Giải Khuyến Khích", badge: "🎖️", color: "#7c3aed", bg: "#faf5ff", border: "#ddd6fe" };
    }
    return { label: "Chưa đoạt giải", badge: "📘", color: "#64748b", bg: "#f8fafc", border: "#e2e8f0" };
  }

  return { label: "Chưa đoạt giải", badge: "📘", color: "#64748b", bg: "#f8fafc", border: "#e2e8f0" };
};

window.calculateGradeClassification = function(scoreStr, rank, totalCandidates) {
  return calculateAwardFromSpectrum(scoreStr, rank, totalCandidates);
};

window.parseTwoDayScoreData = function(data) {
  const examTitle = data.examTitle || "Bài thi khảo thí";
  const rawScore = data.score || "0";
  const parsed = parseScoreWithComponentsJS(rawScore);
  const remark = data.remark || "";

  let isPair = !!data.isPair ||
    examTitle.indexOf(" + ") !== -1 ||
    (examTitle.toLowerCase().includes("ngày 1") && examTitle.toLowerCase().includes("ngày 2")) ||
    (remark.includes("Ngày 1:") && remark.includes("Ngày 2:"));

  let title1 = data.title1 || "";
  let title2 = data.title2 || "";

  if (!title1 || !title2) {
    if (examTitle.indexOf(" + ") !== -1) {
      const parts = examTitle.split(" + ");
      title1 = parts[0].trim();
      title2 = parts[1].trim();
    } else {
      title1 = "Bài thi Ngày 1";
      title2 = "Bài thi Ngày 2";
    }
  }

  let score1 = (data.score1 !== undefined && data.score1 !== null) ? data.score1 : null;
  let score2 = (data.score2 !== undefined && data.score2 !== null) ? data.score2 : null;

  let remark1 = data.remark1 || "";
  let remark2 = data.remark2 || "";

  if (remark && (score1 === null || score2 === null || !remark1 || !remark2)) {
    if (remark.includes("Ngày 1:") || remark.includes("Ngày 2:")) {
      const parts = remark.split("|");
      parts.forEach(p => {
        const trimmed = p.trim();
        if (trimmed.includes("Ngày 1:")) {
          const content = trimmed.split("Ngày 1:")[1].trim();
          if (!remark1) remark1 = content;
          if (score1 === null) {
            const m = content.match(/([\d,\.]+)\s*đ/);
            if (m) score1 = m[1];
          }
        } else if (trimmed.includes("Ngày 2:")) {
          const content = trimmed.split("Ngày 2:")[1].trim();
          if (!remark2) remark2 = content;
          if (score2 === null) {
            const m = content.match(/([\d,\.]+)\s*đ/);
            if (m) score2 = m[1];
          }
        }
      });
    }
  }

  let comps1 = data.comps1 || null;
  let comps2 = data.comps2 || null;

  if (!comps1 || !comps2) {
    const allComps = data.parsedComponents || parsed.components || [];
    if (allComps.length > 0) {
      if (data.numQ1 && data.numQ1 > 0) {
        comps1 = allComps.slice(0, data.numQ1);
        comps2 = allComps.slice(data.numQ1);
      } else {
        const half = Math.ceil(allComps.length / 2);
        comps1 = allComps.slice(0, half);
        comps2 = allComps.slice(half);
      }
    } else {
      comps1 = [];
      comps2 = [];
    }
  }

  return {
    isPair,
    title1,
    title2,
    score1,
    score2,
    comps1,
    comps2,
    remark1,
    remark2,
    allComponents: data.parsedComponents || parsed.components || [],
    parsedTotal: parsed.total
  };
};

      <div class="exam-loading-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; border: 1px dashed ${isDark ? '#334155' : '#cbd5e1'}; border-radius: 12px; gap: 12px;">

    google.script.run
      .withSuccessHandler(res => {
        const body = document.getElementById("examStatsBody");

      if (res && res.success) {
        res.averageScore = typeof res.averageScore === 'number' ? parseFloat(res.averageScore.toFixed(2)) : res.averageScore;

          if (typeof res.hsgStats.secondPrizeThreshold === 'number') res.hsgStats.secondPrizeThreshold = parseFloat(res.hsgStats.secondPrizeThreshold.toFixed(2));
          if (typeof res.hsgStats.thirdPrizeThreshold === 'number') res.hsgStats.thirdPrizeThreshold = parseFloat(res.hsgStats.thirdPrizeThreshold.toFixed(2));

      }

      if (!res.success) {
        body.innerHTML = `
          <div class="exam-loading-container" style="border-color: #ef4444; background: ${isDark ? 'rgba(239, 68, 68, 0.05)' : 'rgba(239, 68, 68, 0.02)'}; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; border: 1px dashed #fca5a5; border-radius: 12px; gap: 8px;">

            </div>
            <div style="font-size: 0.72rem; color: ${isDark ? '#94a3b8' : '#64748b'}; margin-top: 4px; text-align: center;">

            </div>
          </div>
        `;
        return;
      }
      
      // Calculate easiest and hardest question
      let easiestQLabel = "Không có";
      let hardestQLabel = "Không có";
      let maxRate = -1;
      let minRate = 999;
      
      if (res.questionStats && res.questionStats.length > 0) {
        res.questionStats.forEach(q => {
          let rate = q.max > 0 ? (q.average / q.max) : 0;
          if (rate > maxRate) {
            maxRate = rate;
            easiestQLabel = `Câu ${q.questionIndex} (Đạt ${Math.round(rate * 100)}% số điểm)`;
          }
          if (rate < minRate) {
            minRate = rate;
            hardestQLabel = `Câu ${q.questionIndex} (Đạt ${Math.round(rate * 100)}% số điểm)`;
          }
        });
      }
      
      // Generate Advice dynamically using estimatedMaxScore and HSG stats
      let adviceText = "";
      const hsg = res.hsgStats || {
        totalContestants: res.gradedSubmissions,
        totalAwards: 0,
        firstPrizeCount: 0,
        secondPrizeCount: 0,
        thirdPrizeCount: 0,
        consolationPrizeCount: 0,
        firstPrizeThreshold: null,
        secondPrizeThreshold: null,
        thirdPrizeThreshold: null,
        consolationPrizeThreshold: null,
        noPrizeCount: res.gradedSubmissions
      };
      
      const totalCont = hsg.totalContestants || 1;
      const awardPct = Math.round((hsg.totalAwards / totalCont) * 100);
      const firstPct = Math.round((hsg.firstPrizeCount / totalCont) * 100);
      const estimatedMaxScore = res.estimatedMaxScore || 10;
      const hasQuestionStats = res.questionStats && res.questionStats.length > 0;
      
      if (res.averageScore >= estimatedMaxScore * 0.75) {

        const activeTab = document.getElementById('examStatsTab_' + tabName);
        if (activeTab) {
          activeTab.style.display = tabName === 'remarks' ? 'flex' : 'flex';
        }
        const tabs = ['overview', 'questions', 'remarks'];
        tabs.forEach(t => {
          const btn = document.getElementById('examStatsTabBtn_' + t);
          if (btn) {
            if (t === tabName) {
              btn.style.color = '#059669';
              btn.style.borderBottom = '2px solid #059669';
            } else {
              btn.style.color = isDark ? '#94a3b8' : '#64748b';
              btn.style.borderBottom = '2px solid transparent';
            }
          }
        });
      };

      // Robust fallback clipboard copy specifically designed for iframe workspaces
      window.copyToClipboardExamRemark = function(presetId) {
        const textElement = document.getElementById('examRemarkText_' + presetId);
        if (!textElement) return;
        const text = textElement.textContent;
        try {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          document.body.appendChild(textarea);
          textarea.select();
          const successful = document.execCommand("copy");
          document.body.removeChild(textarea);
          if (successful) {
            showToast("✓ Đã sao chép nhận xét mẫu!");
          } else {
            throw new Error("Clipboard copy command failed");
          }
        } catch (err) {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => {
              showToast("✓ Đã sao chép nhận xét mẫu!");
            }).catch(() => {
              showToast("❌ Không thể sao chép, vui lòng bôi đen để copy.", "error");
            });
          } else {
            showToast("❌ Không thể sao chép, vui lòng bôi đen để copy.", "error");
          }
        }
      };

      // Initialize Chart.js Bar Chart
      setTimeout(() => {
        const ctx = document.getElementById('examStatsChartCanvas');
        if (ctx && typeof Chart !== 'undefined') {
          if (window.examStatsChartInstance) {
            window.examStatsChartInstance.destroy();
          }
          
          const gridColor = isDark ? "rgba(255, 255, 255, 0.08)" : "rgba(0, 0, 0, 0.04)";
          const textColor = isDark ? "#94a3b8" : "#64748b";
          
          window.examStatsChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: res.binLabels || ['0-1đ', '1-2đ', '2-3đ', '3-4đ', '4-5đ', '5-6đ', '6-7đ', '7-8đ', '8-9đ', '9-10đ'],
              datasets: [{
                label: 'Số học sinh',
                data: res.bins,
                backgroundColor: isDark ? 'rgba(16, 185, 129, 0.85)' : 'rgba(16, 185, 129, 0.75)',
                borderColor: '#10b981',
                borderWidth: 1.5,
                borderRadius: 5,
                barPercentage: 0.82
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: function(context) {
                      return ' ' + context.raw + ' học viên';
                    }
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  ticks: {
                    stepSize: 1,
                    color: textColor,
                    font: { weight: '600', size: 9 }
                  },
                  grid: { color: gridColor }
                },
                x: {
                  ticks: {
                    color: textColor,
                    font: { weight: '600', size: 9 }
                  },
                  grid: { display: false }
                }
              }
            }
          });
        }
      }, 50);
      })
      .withFailureHandler(err => {
        const body = document.getElementById("examStatsBody");
        if (body) {
          body.innerHTML = `
            <div class="exam-loading-container" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.02); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; border: 1px dashed #fca5a5; border-radius: 12px; gap: 8px;">
              <div style="font-size: 1.8rem;">❌</div>
              <div style="color: #ef4444; font-weight: 700; font-size: 0.85rem; text-align: center;">Lỗi tải dữ liệu: ${err.message}</div>
            </div>
          `;
        }
      })
      .getExamStatistics(targetTitle);
  }

  ensureExamsAndMockExamsLoaded(function() {
    populateStatsModalSelects();

    if (examTitle && examTitle.indexOf(" + ") !== -1) {
      window.setStatsLookupMode('pair');
      const parts = examTitle.split(" + ");
      const title1El = document.getElementById("statsExamTitle1");
      const title2El = document.getElementById("statsExamTitle2");
      if (title1El) {
        title1El.value = parts[0].trim();
        repopulateSuggestedStatsSelect("statsExamTitle2", parts[0].trim());
      }
      if (title2El) {
        title2El.value = parts[1].trim();
        repopulateSuggestedStatsSelect("statsExamTitle1", parts[1].trim());
      }
    } else {
      window.setStatsLookupMode('single');
      if (document.getElementById("statsExamTitle")) document.getElementById("statsExamTitle").value = examTitle || "";
    }
    
    if (examTitle) {
      loadExamStatsData(examTitle);
    }
  });
}

  mockExamState.interval = setInterval(() => {
    const now = Date.now();
    const remain = mockExamState.endTime - now;
    if (remain <= 0) {
      clearInterval(mockExamState.interval);
      mockExamState.interval = null;
      mockExamState.timeOver = true;
      
      // 1. Tự thoát khỏi toàn màn hình trình duyệt
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(()=>{});
      }
      
      // 2. Hiện lại các side 2 bên & sidebars (bằng cách xóa class reader-fullscreen và static-watermarks)
      document.body.classList.remove('reader-fullscreen');
      document.body.classList.remove('static-watermarks');
      
      const maximizeBtn = document.querySelector('.maximize-btn');
      if (maximizeBtn) {
        maximizeBtn.innerHTML = '⛶ Toàn màn hình';
      }
      
      // 3. Khôi phục các nút nổi: hộp quà, lịch trình, dấu "+" công cụ
      restoreFloatingControls();
      
      // 4. Bật lại thú cưng ảo nếu trước đó có bật
      if (mockExamState.prevPetOffState === 'false') {
        localStorage.setItem('pet_turned_off', 'false');
        if (typeof initPet === 'function') initPet();
      }
      
      // 5. Ẩn thanh timer UI đi khi hết giờ
      const timerUI = document.getElementById("mockExamTimerUI");
      if (timerUI) {
        timerUI.style.display = "none";
      }
      
      showToast("Đã hết thời gian làm bài!", "warning");
      
      // 6. Tắt camera giám sát nếu có
      if (mockExamState.stream) {
        try {
          mockExamState.stream.getTracks().forEach(t => t.stop());
        } catch(e) {}
        mockExamState.stream = null;
      }
      
      // 7. Kết thúc trạng thái active của chế độ thi nghiêm ngặt để trở về chế độ xem PDF thông thường
      mockExamState.active = false;
      mockExamState.timeOver = false;
      
      const isDark = document.body.classList.contains("dark-mode");
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          title: '<span style="font-size: 1.5rem; font-weight: 800; color: #ef4444; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 8px;">⏰ Hết Giờ Làm Bài!</span>',
          html: `
            <div style="padding: 10px; font-family: system-ui, -apple-system, sans-serif;">
              <div style="background: ${isDark ? 'rgba(239, 68, 68, 0.12)' : 'rgba(239, 68, 68, 0.05)'}; border: 1px dashed ${isDark ? 'rgba(239, 68, 68, 0.35)' : 'rgba(239, 68, 68, 0.2)'}; border-radius: 12px; padding: 16px; margin-bottom: 18px; text-align: left;">
                <p style="margin: 0; font-size: 0.95rem; color: ${isDark ? '#e2e8f0' : '#334155'}; line-height: 1.6; font-weight: 500;">
                  Đã kết thúc thời gian làm bài thi thử nghiêm ngặt của đề: <strong style="color: ${isDark ? '#ffffff' : '#0f172a'}; font-weight: 700;">${mockExamState.title}</strong>.
                </p>
                <p style="margin: 8px 0 0 0; font-size: 0.85rem; color: ${isDark ? '#cbd5e1' : '#64748b'}; line-height: 1.5;">
                  Hệ thống đã khóa đề thi và đóng giám sát camera. Hãy tải lên file PDF bài làm của bạn ngay bên dưới để hoàn tất việc ghi nhận kết quả.
                </p>
              </div>
              <div style="display: flex; justify-content: center; align-items: center; gap: 6px; color: ${isDark ? '#fb923c' : '#e6774f'}; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">
                ⚠️ QUÁ HẠN NỘP BÀI SẼ BỊ TÍNH 0 ĐIỂM
              </div>
            </div>
          `,
          background: isDark ? '#1e293b' : '#ffffff',
          color: isDark ? '#f8fafc' : '#0f172a',
          confirmButtonText: '📤 Nộp Bài Làm Ngay',
          confirmButtonColor: '#10b981',
          allowOutsideClick: false,
          allowEscapeKey: false,
          customClass: {
            popup: isDark 
              ? 'border border-red-500/40 rounded-2xl shadow-2xl bg-slate-800 text-slate-100'
              : 'border border-slate-200 rounded-2xl shadow-2xl',
            confirmButton: 'px-6 py-3 font-bold text-sm uppercase rounded-xl tracking-wider hover:scale-105 active:scale-95 transition-all duration-200'
          }
        }).then(() => {
          openExamSubmitPopup(mockExamState.title);
        });
      } else {
        showTimeOverCustomModal(mockExamState.title);
      }
    } else {
      const m = Math.floor(remain / 60000);
      const s = Math.floor((remain % 60000) / 1000);
      const timerClock = document.getElementById("mockExamTimerClock");
      if (timerClock) {
        timerClock.innerHTML = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (remain < 300000) { // Dưới 5 phút
          timerClock.style.color = "#f87171";

        }
      }
    }
  }, 1000);

function exitMockExamMode(forceExit = false) {
  if (!mockExamState.active) return;
  mockExamState.active = false;
  mockExamState.timeOver = false;
  if (typeof isLoading !== 'undefined') isLoading = false;
  
  clearInterval(mockExamState.interval);
  mockExamState.interval = null; // Reset interval
  
  const timerUI = document.getElementById("mockExamTimerUI");
  if (timerUI) timerUI.style.display = "none";
  
  const loadScreen = document.getElementById("mockExamLoadScreen");
  if (loadScreen) loadScreen.style.display = "none";
  
  document.body.classList.remove('static-watermarks');
  document.body.classList.remove('reader-fullscreen');
  const btn = document.querySelector('.maximize-btn');
  if (btn) {
    btn.innerHTML = '⛶ Toàn màn hình';
  }
  
  if (mockExamState.prevPetOffState === 'false') {
    localStorage.setItem('pet_turned_off', 'false');
    if (typeof initPet === 'function') initPet();
  }
  
  // Khôi phục các nút nổi và công cụ
  restoreFloatingControls();
  
  if (mockExamState.stream) {
    try {
      mockExamState.stream.getTracks().forEach(t => t.stop());
    } catch(e) {}
    mockExamState.stream = null;
  }
  
  if (!forceExit && document.fullscreenElement) {
    document.exitFullscreen().catch(()=>{});
  }
  
  exitReader(); // đóng file để bắt đầu lại nếu muốn
}

document.addEventListener('fullscreenchange', handleNativeFullscreen);
document.addEventListener('webkitfullscreenchange', handleNativeFullscreen);

function handleNativeFullscreen() {
  const isFull = document.fullscreenElement || document.webkitFullscreenElement;
  if (isFull) {
    document.body.classList.add('is-native-fullscreen');
  } else {
    document.body.classList.remove('is-native-fullscreen');
  }

  if (!isFull && typeof mockExamState !== 'undefined' && mockExamState.active && !mockExamState.timeOver) {
    showToast("CẢNH BÁO: Bạn đã rời khỏi chế độ toàn màn hình. Bài thi thử đã bị hủy và phải làm lại từ đầu.", "error");
    exitMockExamMode(true);
  }
}

window.showAdminPasscodePrompt = function() {
  const overlay = document.getElementById('adminPasscodeOverlay');
  const input = document.getElementById('adminPasscodeInput');
  const errorEl = document.getElementById('adminPasscodeError');
  if (overlay) {
    overlay.style.display = 'flex';
  }
  if (input) {
    input.value = '';
    input.focus();
  }
  if (errorEl) {
    errorEl.style.display = 'none';
  }
};

window.submitAdminPasscode = function() {
  const input = document.getElementById('adminPasscodeInput');
  const errorEl = document.getElementById('adminPasscodeError');
  const overlay = document.getElementById('adminPasscodeOverlay');
  const cancelBtn = document.getElementById('adminPasscodeCancelBtn');
  const submitBtn = document.getElementById('adminPasscodeSubmitBtn');
  const btnText = document.getElementById('adminPasscodeBtnText');
  
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  
  // Thiết lập trạng thái loading
  input.disabled = true;
  if (cancelBtn) cancelBtn.disabled = true;
  if (submitBtn) submitBtn.disabled = true;
  if (btnText) {
    btnText.innerHTML = '<span class="passcode-spinner"></span> Đang xác minh...';
  }
  
  google.script.run
    .withSuccessHandler(function(res) {
      input.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      if (submitBtn) submitBtn.disabled = false;
      if (btnText) btnText.innerHTML = 'Xác minh';

      if (res && res.success) {
        window.isAdminSystemAuthorized = true;
        window.adminStatsUnlocked = true;
        if (typeof window.updateAdminStatsUI === 'function') {
          window.updateAdminStatsUI();
        }
        if (overlay) overlay.style.display = 'none';
        if (window.passcodeBypassCallback) {
          window.passcodeBypassCallback();
          window.passcodeBypassCallback = null;
        } else if (window.adminTargetSubTab) {
          switchAdminSubTab(window.adminTargetSubTab);
        }
        if (errorEl) {
          errorEl.style.display = 'none';
        }
        input.value = '';
      } else {
        if (errorEl) {
          errorEl.style.display = 'block';
          errorEl.innerText = "❌ Mật khẩu không chính xác!";
        }
        input.value = '';
        input.focus();
      }
    })
    .withFailureHandler(function(err) {
      input.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
      if (submitBtn) submitBtn.disabled = false;
      if (btnText) btnText.innerHTML = 'Xác minh';

      if (errorEl) {
        errorEl.style.display = 'block';
        errorEl.innerText = "❌ Lỗi xác thực: " + (err.message || err);
      }
      input.value = '';
      input.focus();
    })
    .verifyAdminPasscode(val);
};

    }
  } else if (subTab === 'banners') {
    if (typeof loadAdminBannersList === 'function') {
      loadAdminBannersList();
    }
  }
}

// Global mobile sidebar toggler function
window.toggleAdminSidebar = function() {
  const sidebar = document.querySelector('.admin-sidebar');
  if (sidebar) {
    sidebar.classList.toggle('open');
  }
};

window.switchAdminTab = function(tab) {
  const mapping = {
    'users': 'members',
    'vip': 'members',
    'monitor': 'members',
    'schedule': 'study',
    'qa': 'study',
    'exams': 'study',
    'coinflow': 'system',
    'reset': 'system'
  };
  
  const major = mapping[tab] || 'members';
  
  const majorBtns = {
    'members': document.getElementById('adminMajorTabBtn_members'),
    'study': document.getElementById('adminMajorTabBtn_study'),
    'system': document.getElementById('adminMajorTabBtn_system')
  };
  for (const k in majorBtns) {
    if (majorBtns[k]) {
      if (k === major) {
        majorBtns[k].classList.add('active');
        majorBtns[k].style.borderBottomColor = '#2563eb';
      } else {
        majorBtns[k].classList.remove('active');
        majorBtns[k].style.borderBottomColor = 'transparent';
      }
    }
  }
  
  const groups = {
    'members': document.getElementById('adminSubTabs_members'),
    'study': document.getElementById('adminSubTabs_study'),
    'system': document.getElementById('adminSubTabs_system')
  };
  for (const k in groups) {
    if (groups[k]) {
      groups[k].style.display = (k === major) ? 'flex' : 'none';
    }
  }
  
  switchAdminSubTab(tab);
};

window.switchAdminMajorTab = switchAdminMajorTab;
window.switchAdminSubTab = switchAdminSubTab;

</script>
