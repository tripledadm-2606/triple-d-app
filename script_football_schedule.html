let footballBetStats = {};

function loadFootballMatches() {
  const container = document.getElementById("footballPopupContentArea");
  if(!container) return;
  container.innerHTML = `<div style="text-align:center; padding:50px;"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:12px; color:#64748b; font-weight:500;">Đang tải danh sách các trận đấu quốc tế...</p></div>`;
  
  google.script.run
    .withSuccessHandler((stats) => {
      footballBetStats = stats || {};
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success) {
            footballMatches = res.matches;
            renderFootballMatches();
          } else {
            container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:40px; font-weight:bold;">⚠️ Không có kết nối hoặc API lỗi: ${res ? res.message : "Hãy tải lại trang."}</div>`;
          }
        })
        .withFailureHandler((err) => {
          container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:40px; font-weight:bold;">⚠️ Lỗi kết nối máy chủ: ${err.message}</div>`;
        })
        .getFootballMatches();
    })
    .withFailureHandler((err) => {
      // Fallback
      footballBetStats = {};
      google.script.run.withSuccessHandler((res) => {
        if (res && res.success) {
          footballMatches = res.matches;
          renderFootballMatches();
        }
      }).getFootballMatches();
    })
    .getFootballBetStats();
}

function toggleCorrectScoreGrid(matchId) {
  const grid = document.getElementById("csGridContainer-" + matchId);
  const chevron = document.getElementById("csChevron-" + matchId);
  if (!grid || !chevron) return;
  if (grid.style.display === "none") {
    grid.style.display = "grid";
    chevron.style.transform = "rotate(180deg)";
  } else {
    grid.style.display = "none";
    chevron.style.transform = "rotate(0deg)";
  }
}

function generateFakeBetStats(matchId, realStats) {
  let seed = matchId * 1234.5678;
  function rand(min, max) {
     seed = (seed * 9301 + 49297) % 233280;
     return min + (seed / 233280) * (max - min);
  }
  
  let baseHome = rand(2000, 50000);
  let baseDraw = rand(1000, 15000);
  let baseAway = rand(2000, 45000);
  let fakePlayers = Math.floor(rand(10, 500));
  
  if (realStats && realStats._total > 0) {
      let rHome = realStats.HOME || 0;
      let rDraw = realStats.DRAW || 0;
      let rAway = realStats.AWAY || 0;
      let totalR = rHome + rDraw + rAway;
      
      if (totalR > 0) {
          let pHome = rHome / totalR;
          let pDraw = rDraw / totalR;
          let pAway = rAway / totalR;
          
          let totalFake = baseHome + baseDraw + baseAway;
          baseHome = totalFake * (0.2 + 0.8 * pHome) * rand(0.9, 1.1);
          baseDraw = totalFake * (0.2 + 0.8 * pDraw) * rand(0.9, 1.1);
          baseAway = totalFake * (0.2 + 0.8 * pAway) * rand(0.9, 1.1);
          
          fakePlayers += (realStats._count || 0) * Math.floor(rand(2, 5));
      }
  }
  
  let sum = baseHome + baseDraw + baseAway;
  let pH = Math.round((baseHome / sum) * 100) || 33;
  let pD = Math.round((baseDraw / sum) * 100) || 33;
  let pA = Math.max(0, 100 - pH - pD);
  
  // Tính tỷ lệ odds thay đổi linh hoạt theo xu hướng dự đoán, giới hạn tối đa tự nhiên dưới 4
  let margin = 0.95; // RTP
  
  function getNaturalOdds(p) {
    let raw = margin / (Math.max(1, p) / 100);
    if (raw > 3.65) {
      return rand(3.65, 3.98);
    }
    return Math.max(1.05, raw);
  }

  let oddsH = getNaturalOdds(pH).toFixed(2);
  let oddsD = getNaturalOdds(pD).toFixed(2);
  let oddsA = getNaturalOdds(pA).toFixed(2);

  let totalVol = (sum / 1000).toFixed(1) + "K";
  
  return { pH, pD, pA, totalVol, fakePlayers, oddsH, oddsD, oddsA };
}

    const hdpAwayLabel = isHomeFav ? "Khách (+0.5)" : "Khách (-0.5)";

    let statsObj = footballBetStats[m.id] || null;

  const match = footballMatches.find(m => m.id === matchId);
  if (match && Date.now() >= match.dateMs) {
    showToast("⚠️ Trận đấu đã diễn ra hoặc đang thi đấu. Chức năng dự đoán đã khóa!", "error");
    return;
  }
  activeBetParams = { matchId, desc, betOn, odds };
  
  let label = betOn;
  if (betOn === "HOME") label = "Chủ nhà Thắng (Dự kiến Kết quả - 1)";
  else if (betOn === "DRAW") label = "Hai đội Hòa (Dự kiến Kết quả - X)";
  else if (betOn === "AWAY") label = "Khách Thắng (Dự kiến Kết quả - 2)";
  else if (betOn === "HDP_HOME") {
    const isHomeFav = (matchId % 2 === 0);
    label = isHomeFav ? "Chủ nhà ưu thế 0.5 (Chênh lệch Kỳ vọng)" : "Chủ nhà được cộng ưu thế 0.5 (Chênh lệch Kỳ vọng)";
  }
  else if (betOn === "HDP_AWAY") {
    const isHomeFav = (matchId % 2 === 0);
    label = isHomeFav ? "Khách được cộng ưu thế 0.5 (Chênh lệch Kỳ vọng)" : "Khách ưu thế 0.5 (Chênh lệch Kỳ vọng)";
  }
  else if (betOn === "OU_OVER") label = "Nhiều hơn 2.5 bàn thắng (Trận đấu cởi mở)";
  else if (betOn === "OU_UNDER") label = "Ít hơn 2.5 bàn thắng (Trận đấu chặt chẽ)";
  else if (betOn.startsWith("CS_")) {
    if (betOn === "CS_OTHER") label = "Tỉ số khác (Điền tỷ số dự đoán chính xác)";
    else {
      const parts = betOn.split("_");
      label = `Dự kiến tỉ số chi tiết: ${parts[1]} - ${parts[2]}`;
    }
  }

  const dialog = document.getElementById("footballBetDialog");
  const matchInfo = document.getElementById("footballBetMatchInfo");
  const amountInput = document.getElementById("footballBetAmountInput");
  const calcBox = document.getElementById("footballBetEstRewardBox");
  const errorDiv = document.getElementById("footballBetDialogError");
  
  if (!dialog || !matchInfo || !amountInput) return;
  
  amountInput.value = "";
  if (calcBox) calcBox.style.display = "none";
  if (errorDiv) errorDiv.style.display = "none";

  // Manage custom score entry display & values
  const customScoreGroup = document.getElementById("footballCustomScoreGroup");
  const customHomeInput = document.getElementById("footballCustomHomeScore");
  const customAwayInput = document.getElementById("footballCustomAwayScore");
  if (customScoreGroup) {
    if (betOn === "CS_OTHER") {
      customScoreGroup.style.display = "block";
      if (customHomeInput) {
        customHomeInput.value = "";
        customHomeInput.disabled = false;
      }
      if (customAwayInput) {
        customAwayInput.value = "";
        customAwayInput.disabled = false;
      }
    } else {
      customScoreGroup.style.display = "none";
    }
  }
  
  const teams = desc.split(" vs ");
  const homeTeam = teams[0] || "Đội nhà";
  const awayTeam = teams[1] || "Đội khách";
  const explanationHtml = getFootballPredictionExplanation(betOn, matchId, homeTeam, awayTeam);

  matchInfo.innerHTML = `
    <div style="font-weight:700; font-size:15px; margin-bottom:8px;">${desc}</div>
    <div style="font-size:13px;">Phương án dự đoán: <strong style="color:#2563eb;">${label}</strong></div>
    <div style="font-size:13px; margin-top:4px;">Hệ số điểm thưởng: <strong style="color:#10b981;">x${odds}</strong></div>
    <div style="margin-top:10px; border-top:1px dashed #cbd5e1; padding-top:10px;">
      ${explanationHtml}
    </div>
  `;
  
  dialog.style.display = "flex";
  
  setTimeout(() => amountInput.focus(), 60);
  
  const confirmBtn = document.getElementById("footballBetConfirmBtn");
  if (confirmBtn) {
    confirmBtn.onclick = function() {
      submitFootballBet();
    };
  }
}

function updateFootballEstReward() {
  const amountInput = document.getElementById("footballBetAmountInput");
  const calcBox = document.getElementById("footballBetEstRewardBox");
  const rewardText = document.getElementById("footballEstRewardText");
  const errorDiv = document.getElementById("footballBetDialogError");
  
  if (!amountInput || !calcBox || !rewardText || !activeBetParams) return;
  
  const val = parseInt(amountInput.value);
  if (isNaN(val) || val <= 0) {
    calcBox.style.display = "none";
    if (errorDiv) errorDiv.style.display = "none";
    return;
  }
  
  if (val < 10) {
    if (errorDiv) {
      errorDiv.innerHTML = "Số lượng tham gia tối thiểu là 10 TD Coin.";
      errorDiv.style.display = "block";
    }
    calcBox.style.display = "none";
    return;
  } else if (val > 3000) {
    if (errorDiv) {
      errorDiv.innerHTML = "Số lượng tham gia tối đa là 3,000 TD Coin nhằm giảm lạm phát.";
      errorDiv.style.display = "block";
    }
    calcBox.style.display = "none";
    return;
  } else {
    if (errorDiv) errorDiv.style.display = "none";
  }
  
  const rawWin = Math.floor(val * activeBetParams.odds);
  const fee = Math.floor(rawWin * 0.05);
  const possibleWin = rawWin - fee;
  rewardText.innerText = possibleWin.toLocaleString() + " (đã trừ 5% phí tự động)";
  calcBox.style.display = "block";
}

function submitFootballBet() {
  if (!activeBetParams) return;
  
  const amountInput = document.getElementById("footballBetAmountInput");
  const errorDiv = document.getElementById("footballBetDialogError");
  if (!amountInput) return;
  
  const val = parseInt(amountInput.value);
  if (isNaN(val) || val < 10) {
    if (errorDiv) {
      errorDiv.innerHTML = "Số lượng không hợp lệ. Tối thiểu 10 TD Coin.";
      errorDiv.style.display = "block";
    }
    return;
  }
  if (val > 3000) {
    if (errorDiv) {
      errorDiv.innerHTML = "Chỉ được phép chọn tối đa 3,000 TD Coin nhằm giảm lạm phát.";
      errorDiv.style.display = "block";
    }
    return;
  }
  
  const currentPoints = Number(getCleanLocalStorage('cached_userPoints') || 0);
  if (val > currentPoints) {
    if (errorDiv) {
      errorDiv.innerHTML = `Số dư của bạn không đủ để thực hiện (Có: ${currentPoints.toLocaleString()} Coin).`;
      errorDiv.style.display = "block";
    }
    return;
  }

  // Cache values
  const matchId = activeBetParams.matchId;
  const desc = activeBetParams.desc;
  let betOn = activeBetParams.betOn;
  const odds = activeBetParams.odds;
  
  // If betOn is CS_OTHER, validate and format predicted score
  const customHomeInput = document.getElementById("footballCustomHomeScore");
  const customAwayInput = document.getElementById("footballCustomAwayScore");

  if (betOn === "CS_OTHER") {
    if (!customHomeInput || !customAwayInput) return;
    const homeVal = customHomeInput.value.trim();
    const awayVal = customAwayInput.value.trim();
    if (homeVal === "" || awayVal === "") {
      if (errorDiv) {
        errorDiv.innerHTML = "Vui lòng điền đầy đủ tỷ số dự đoán.";
        errorDiv.style.display = "block";
      }
      return;
    }
    const homeScore = parseInt(homeVal);
    const awayScore = parseInt(awayVal);
    if (isNaN(homeScore) || homeScore < 0 || isNaN(awayScore) || awayScore < 0) {
      if (errorDiv) {
        errorDiv.innerHTML = "Tỷ số nhập vào phải là số không âm.";
        errorDiv.style.display = "block";
      }
      return;
    }
    
    // Check if score is one of standard list: (1-0, 2-0, 2-1, 0-1, 0-2, 1-2, 1-1)
    const isStandard = (
      (homeScore === 1 && awayScore === 0) ||
      (homeScore === 2 && awayScore === 0) ||
      (homeScore === 2 && awayScore === 1) ||
      (homeScore === 0 && awayScore === 1) ||
      (homeScore === 0 && awayScore === 2) ||
      (homeScore === 1 && awayScore === 2) ||
      (homeScore === 1 && awayScore === 1)
    );
    if (isStandard) {
      if (errorDiv) {
        errorDiv.innerHTML = `Tỷ số ${homeScore}-${awayScore} đã có sẵn ở các ô cược tỷ số cụ thể phía trên, vui lòng chọn ô tương ứng!`;
        errorDiv.style.display = "block";
      }
      return;
    }
    
    betOn = "CS_OTHER:" + homeScore + "-" + awayScore;
  }
  
  // Set Loading state on Bet Confirmation Dialog
  const confirmBtn = document.getElementById("footballBetConfirmBtn");
  const cancelBtn = confirmBtn ? confirmBtn.previousElementSibling : null;
  const closeBtn = document.querySelector("#footballBetDialog .modern-modal-close-btn");
  
  if (confirmBtn) {
    confirmBtn.disabled = true;
    confirmBtn.innerHTML = "⏳ Đang gửi...";
  }
  if (amountInput) amountInput.disabled = true;
  if (customHomeInput) customHomeInput.disabled = true;
  if (customAwayInput) customAwayInput.disabled = true;
  if (cancelBtn) cancelBtn.style.pointerEvents = "none";
  if (closeBtn) closeBtn.style.pointerEvents = "none";

  google.script.run
    .withSuccessHandler((res) => {
      hideFootballBetDialog(); // Will reset loading states automatically
      if (res && res.success) {
        showFootballMessageDialog("🏆 Dự đoán thành công!", res.message, "🎉");
        if (res.newPoints !== undefined) {
          const mainPtEl = document.getElementById('userPoint');
          if (mainPtEl) mainPtEl.innerText = res.newPoints.toLocaleString();
          localStorage.setItem('cached_userPoints', res.newPoints);
          updateFootballCoinDisplay();
        }
        loadFootballMatches();
      } else {
        showFootballMessageDialog("⚠️ Dự đoán không thành công", res ? res.message : "Đã có lỗi bất ngờ xảy ra.", "❌");
      }
    })
    .withFailureHandler((err) => {
      hideFootballBetDialog(); // Will reset loading states automatically
      showFootballMessageDialog("❌ Lỗi máy chủ", err.message, "⚠️");
    })
    .placeFootballBet(matchId, desc, betOn, odds, val);
}

function getCustomColors() {
  const defaultColors = {
    topics: {
      "te-bao": "#3b82f6",
      "vi-sinh": "#8b5cf6",
      "sl-thuc-vat": "#10b981",
      "sl-dong-vat": "#f59e0b",

      "tien-hoa": "#6366f1",
      "sinh-thai": "#14b8a6",
      "khac": "#94a3b8"
    },
    ui: {
      headerBgStart: "#10b981",
      headerBgEnd: "#059669",
      headerText: "#ffffff",
      todayBg: "#fef3c7",
      todayText: "#db6e42",
      selectedBorder: "#10b981",
      selectedBg: "#ecfdf5",
      cellBg: "#f8fafc",
      cellText: "#334155",
      gridBorder: "#f1f5f9"
    }
  };

  try {
    const saved = getCleanLocalStorage("hsgqg_calendar_colors");
    if (saved) {
      const parsed = JSON.parse(saved);
      const topics = Object.assign({}, defaultColors.topics, parsed.topics);
      const ui = Object.assign({}, defaultColors.ui, parsed.ui);
      return { topics, ui };
    }
  } catch (e) {
    console.error("Error reading custom colors:", e);
  }
  return defaultColors;
}

function saveStateToHistory(data) {

  }
  planHistory.push(JSON.parse(JSON.stringify(data)));

  updateUndoRedoButtons();

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  } else if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }
  renderCalendar();
}

function renderCalendar() {
  const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
  const calendarMonthYear = document.getElementById("calendarMonthYear");
  if (calendarMonthYear) calendarMonthYear.innerText = `${monthNames[currentMonth]}, ${currentYear}`;

  const grid = document.getElementById("calendarGrid");
  if (!grid) return;
  grid.innerHTML = "";

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

  // Render previous month days
  for (let i = 0; i < firstDay; i++) {
    const d = daysInPrevMonth - firstDay + i + 1;
    const dateStr = formatDate(new Date(currentMonth === 0 ? currentYear - 1 : currentYear, currentMonth === 0 ? 11 : currentMonth - 1, d));
    grid.appendChild(createDayElement(d, true, dateStr));
  }

  // Render current month days
  for (let i = 1; i <= daysInMonth; i++) {
    const dateStr = formatDate(new Date(currentYear, currentMonth, i));
    grid.appendChild(createDayElement(i, false, dateStr));
  }

  // Render next month days to complete grid
  const totalCells = grid.children.length;
  const remaining = 42 - totalCells; // 6 rows of 7
  for (let i = 1; i <= remaining; i++) {
    const dateStr = formatDate(new Date(currentMonth === 11 ? currentYear + 1 : currentYear, currentMonth === 11 ? 0 : currentMonth + 1, i));
    grid.appendChild(createDayElement(i, true, dateStr));
  }
}

function createDayElement(dayNum, isOtherMonth, dateStr) {
  const isToday = dateStr === formatDate(new Date());
  const isSelected = dateStr === selectedDateStr;
  
  const colors = getCustomColors();
  const { ui } = colors;

  const el = document.createElement("div");
  el.className = "calendar-day" + (isOtherMonth ? " other-month" : "") + (isSelected ? " selected" : "") + (isToday ? " today" : "");
  
  // Apply Custom Theme Styles Inline (to override stylesheets dynamically)
  if (!isOtherMonth) {
    el.style.background = ui.cellBg;
    el.style.borderColor = ui.gridBorder;
    
    if (isToday) {
      el.style.background = ui.todayBg;
      el.style.borderColor = ui.todayText;
    }
    
    if (isSelected) {
      el.style.borderColor = ui.selectedBorder;
      el.style.background = ui.selectedBg;
      el.style.boxShadow = `inset 0 0 0 1px ${ui.selectedBorder}`;
    }
  }

  el.onclick = () => {
    selectedDateStr = dateStr;
    // If clicking other month, navigate to it
    const dateObj = new Date(dateStr);
    if (dateObj.getMonth() !== currentMonth) {
      currentMonth = dateObj.getMonth();
      currentYear = dateObj.getFullYear();
    }
    renderCalendar();
    renderDailyTasks();
  };

  if (dayNum === 1) {
    const monthIndex = new Date(dateStr).getMonth();
    const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
    const monthHeader = document.createElement("div");
    monthHeader.className = "month-break-header";
    monthHeader.innerText = monthNames[monthIndex];
    el.appendChild(monthHeader);
  }

  const numEl = document.createElement("div");
  numEl.className = "calendar-day-num";
  numEl.innerText = dayNum;
  
  // Custom number styling
  if (!isOtherMonth) {
    numEl.style.color = ui.cellText;
    if (isToday) {
      numEl.style.color = ui.todayText;
      numEl.style.fontWeight = "700";
    }
  }
  el.appendChild(numEl);

  const indicatorsEl = document.createElement("div");
  indicatorsEl.className = "calendar-day-indicators";
  
  if (studyPlanData[dateStr]) {
    studyPlanData[dateStr].forEach(task => {
      const dot = document.createElement("div");
      dot.className = "indicator-dot " + (task.completed ? "completed" : "pending");
      if (!task.completed) {
        dot.style.background = getTopicColor(task.topic);
      }
      indicatorsEl.appendChild(dot);
    });
  }
  el.appendChild(indicatorsEl);

  if (typeof getClassSchedulesForDate === "function") {
    const classesOnDay = getClassSchedulesForDate(dateStr);
    if (classesOnDay && classesOnDay.length > 0) {
      const classBadgeContainer = document.createElement("div");
      classBadgeContainer.style.display = "flex";
      classBadgeContainer.style.flexDirection = "column";
      classBadgeContainer.style.gap = "2px";
      classBadgeContainer.style.marginTop = "auto";
      classBadgeContainer.style.width = "100%";
      classBadgeContainer.style.overflow = "hidden";
      
      classesOnDay.forEach(cls => {
        const pill = document.createElement("div");
        pill.style.background = cls.color || "#3b82f6";
        pill.style.color = "white";
        pill.style.fontSize = "0.65rem";
        pill.style.padding = "1px 4px";
        pill.style.borderRadius = "4px";
        pill.style.whiteSpace = "nowrap";
        pill.style.overflow = "hidden";
        pill.style.textOverflow = "ellipsis";
        pill.style.fontWeight = "700";
        pill.style.textAlign = "center";
        pill.style.boxShadow = "0 1px 2px rgba(0,0,0,0.1)";
        pill.style.maxWidth = "100%";
        pill.style.boxSizing = "border-box";
        pill.style.whiteSpace = "nowrap";
        pill.style.overflow = "hidden";
        pill.style.textOverflow = "ellipsis";
        pill.innerText = cls.name;
        pill.title = `${cls.code} (${cls.time})`;
        classBadgeContainer.appendChild(pill);
      });
      el.appendChild(classBadgeContainer);
    }
  }

  return el;
}

// Reminder Logic
function checkStudyReminders() {
  const reminderEnabled = getCleanLocalStorage("tds_reminders_enabled") !== "false";
  if (!reminderEnabled) return;

  const todayStr = formatDate(new Date());
  let pendingToday = 0;
  let pendingPast = 0;

  if (typeof studyPlanData !== "object" || !studyPlanData) return;

  Object.keys(studyPlanData).forEach(dateStr => {
    const tasks = studyPlanData[dateStr];
    tasks.forEach(task => {
      if (!task.completed) {
        if (dateStr === todayStr) pendingToday++;
        else if (dateStr < todayStr) pendingPast++;
      }
    });
  });

  const soundEnabled = getCleanLocalStorage("tds_reminder_sound") !== "false";

  if (pendingPast > 0) {
    if (soundEnabled) playReminderSound();
    showToast(`Bạn có ${pendingPast} nhiệm vụ cũ chưa hoàn thành. Hãy sắp xếp thời gian nhé!`, "warning", 8000, {
      text: "Xem lịch trình",
      onclick: "switchView('studyPlan')"
    });
  } else if (pendingToday > 0) {
    if (soundEnabled) playReminderSound();
    showToast(`Hôm nay bạn có ${pendingToday} nhiệm vụ cần hoàn thành. Cố lên nhé!`, "info", 8000, {
      text: "Xem lịch trình",
      onclick: "switchView('studyPlan')"
    });
  }
}

function playReminderSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Play double chime: note 1 then note 2
    const playChime = (freq, startTime, duration) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, startTime);
      
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start(startTime);
      osc.stop(startTime + duration);
    };
    
    const now = audioCtx.currentTime;
    playChime(523.25, now, 0.4);      // C5
    playChime(659.25, now + 0.12, 0.6); // E5
  } catch (e) {
    console.log("Audio Context not allowed or initialized: ", e);
  }
}

  }
}

function setSelectValueWithFallback(selectEl, val) {
  if (!selectEl) return;
  let exists = false;
  for (let i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].value === val) {
      exists = true;
      break;
    }
  }
  if (!exists) {
    const opt = document.createElement("option");
    opt.value = val;
    opt.innerText = val;
    selectEl.appendChild(opt);
  }
  selectEl.value = val;
}

    if (btnTasks) btnTasks.classList.remove("active");
    if (btnRoutine) btnRoutine.classList.add("active");
    if (containerTasks) containerTasks.style.display = "none";
    if (containerRoutine) containerRoutine.style.display = "flex";
    
    toggleRoutineDateInput();
    renderDailyRoutines();
  }
}

function toggleRoutineDateInput() {
  const repeatSelect = document.getElementById("newRoutineRepeat");
  const container = document.getElementById("routineSpecificDateContainer");
  const label = document.getElementById("routineSpecificDateLabel");
  
  if (!repeatSelect || !container || !label) return;
  
  if (repeatSelect.value === "date") {
    container.style.display = "block";
    const dateObj = new Date(selectedDateStr);
    label.innerText = `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${dateObj.getFullYear()}`;
  } else {
    container.style.display = "none";
  }
}

function addDailyRoutine() {
  const startHSelect = document.getElementById("newRoutineStartHour");
  const startMSelect = document.getElementById("newRoutineStartMin");
  const endHSelect = document.getElementById("newRoutineEndHour");
  const endMSelect = document.getElementById("newRoutineEndMin");
  const activityInput = document.getElementById("newRoutineActivity");
  const repeatSelect = document.getElementById("newRoutineRepeat");
  const colorSelect = document.getElementById("newRoutineColor");
  
  if (!startHSelect || !startMSelect || !endHSelect || !endMSelect || !activityInput || !repeatSelect || !colorSelect) return;
  
  const start = `${startHSelect.value}:${startMSelect.value}`;
  const end = `${endHSelect.value}:${endMSelect.value}`;
  const activity = activityInput.value.trim();
  const repeat = repeatSelect.value;
  const color = colorSelect.value;
  
  if (!activity) {
    showToast("Vui lòng nhập tên hoạt động", "warning");
    return;
  }
  
  if (editingRoutineId !== null) {
    const routine = dailyRoutines.find(r => r.id === editingRoutineId);
    if (routine) {
      routine.start = start;
      routine.end = end;
      routine.activity = activity;
      routine.repeat = repeat;
      routine.color = color;
      if (repeat === "date") {
        routine.specificDate = selectedDateStr;
      } else {
        delete routine.specificDate;
      }
    }
    editingRoutineId = null;
    
    const btnSubmit = document.getElementById("btnAddRoutineSubmit");
    const btnCancel = document.getElementById("btnEditRoutineCancel");
    if (btnSubmit) btnSubmit.innerText = "+ Thêm thời gian biểu";
    if (btnCancel) btnCancel.style.display = "none";
    showToast("Đã cập nhật mục thời gian biểu thành công", "success");
  } else {
    const newRoutine = {
      id: "rt_" + Date.now().toString(),
      start: start,
      end: end,
      activity: activity,
      repeat: repeat,
      color: color
    };
    if (repeat === "date") {
      newRoutine.specificDate = selectedDateStr;
    }
    dailyRoutines.push(newRoutine);
    showToast("Đã thêm thời gian biểu mới thành công", "success");
  }
  
  localStorage.setItem("tds_daily_routines", JSON.stringify(dailyRoutines));
  activityInput.value = "";
  
  // Reset select elements
  if (startHSelect) startHSelect.value = "07";
  if (startMSelect) startMSelect.value = "00";
  if (endHSelect) endHSelect.value = "08";
  if (endMSelect) endMSelect.value = "30";
  
  renderDailyRoutines();
  if (typeof renderDashboardStudyPlan === "function") {
    renderDashboardStudyPlan();
  }
}

function startEditRoutine(id) {
  const routine = dailyRoutines.find(r => r.id === id);
  if (!routine) return;
  
  editingRoutineId = id;
  
  const startHSelect = document.getElementById("newRoutineStartHour");
  const startMSelect = document.getElementById("newRoutineStartMin");
  const endHSelect = document.getElementById("newRoutineEndHour");
  const endMSelect = document.getElementById("newRoutineEndMin");
  const activityInput = document.getElementById("newRoutineActivity");
  const repeatSelect = document.getElementById("newRoutineRepeat");
  const colorSelect = document.getElementById("newRoutineColor");
  const btnSubmit = document.getElementById("btnAddRoutineSubmit");
  const btnCancel = document.getElementById("btnEditRoutineCancel");
  
  if (routine.start) {
    const parts = routine.start.split(":");
    if (parts.length === 2) {
      setSelectValueWithFallback(startHSelect, parts[0]);
      setSelectValueWithFallback(startMSelect, parts[1]);
    }
  }
  if (routine.end) {
    const parts = routine.end.split(":");
    if (parts.length === 2) {
      setSelectValueWithFallback(endHSelect, parts[0]);
      setSelectValueWithFallback(endMSelect, parts[1]);
    }
  }
  
  if (activityInput) {
    activityInput.value = routine.activity;
    activityInput.focus();
  }
  if (repeatSelect) {
    repeatSelect.value = routine.repeat;
    toggleRoutineDateInput();
  }
  if (colorSelect) colorSelect.value = routine.color;
  
  if (btnSubmit) btnSubmit.innerText = "Lưu thay đổi";
  if (btnCancel) btnCancel.style.display = "block";
}

function cancelEditRoutine() {
  editingRoutineId = null;
  
  const activityInput = document.getElementById("newRoutineActivity");
  const btnSubmit = document.getElementById("btnAddRoutineSubmit");
  const btnCancel = document.getElementById("btnEditRoutineCancel");
  
  const startHSelect = document.getElementById("newRoutineStartHour");
  const startMSelect = document.getElementById("newRoutineStartMin");
  const endHSelect = document.getElementById("newRoutineEndHour");
  const endMSelect = document.getElementById("newRoutineEndMin");
  
  if (startHSelect) startHSelect.value = "07";
  if (startMSelect) startMSelect.value = "00";
  if (endHSelect) endHSelect.value = "08";
  if (endMSelect) endMSelect.value = "30";
  
  if (activityInput) activityInput.value = "";
  if (btnSubmit) btnSubmit.innerText = "+ Thêm thời gian biểu";
  if (btnCancel) btnCancel.style.display = "none";
}

function deleteDailyRoutine(id) {
  if (editingRoutineId === id) {
    cancelEditRoutine();
  }
  
  dailyRoutines = dailyRoutines.filter(r => r.id !== id);
  localStorage.setItem("tds_daily_routines", JSON.stringify(dailyRoutines));
  showToast("Đã xóa mục thời gian biểu", "info");
  
  renderDailyRoutines();
  if (typeof renderDashboardStudyPlan === "function") {
    renderDashboardStudyPlan();
  }
}

function renderDailyRoutines() {
  const list = document.getElementById("dailyRoutineList");
  if (!list) return;
  list.innerHTML = "";
  
  const titleLabel = document.getElementById("routineDateTitle");
  if (titleLabel) {
    const dateObj = new Date(selectedDateStr);
    titleLabel.innerText = `Thời gian biểu ${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
  }
  
  const selDateObj = new Date(selectedDateStr);
  const dayOfWeek = selDateObj.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
  const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
  
  const activeRoutines = dailyRoutines.filter(r => {
    if (r.repeat === "daily") return true;
    if (r.repeat === "weekdays" && !isWeekend) return true;
    if (r.repeat === "weekends" && isWeekend) return true;
    if (r.repeat === "date" && r.specificDate === selectedDateStr) return true;
    return false;
  });
  
  activeRoutines.sort((a, b) => a.start.localeCompare(b.start));
  
  if (activeRoutines.length === 0) {
    const empty = document.createElement("div");
    empty.style.textAlign = "center";
    empty.style.color = "#94a3b8";
    empty.style.padding = "30px 20px";
    empty.style.fontSize = "0.85rem";
    empty.style.fontStyle = "italic";
    empty.innerHTML = "Chưa có thời gian biểu hôm nay.<br>Hãy thêm hoặc áp dụng mẫu nhanh bên dưới!";
    list.appendChild(empty);
    return;
  }
  
  activeRoutines.forEach(item => {
    const isCompleted = !!routineCompletions[`${selectedDateStr}_${item.id}`];
    const container = document.createElement("div");
    container.className = `routine-item ${isCompleted ? 'completed' : ''}`;
    container.style.borderLeft = `4px solid ${item.color}`;
    
    let repeatLabel = "🔁 Hàng ngày";
    if (item.repeat === "weekdays") repeatLabel = "📅 Thứ 2 - Thứ 6";
    else if (item.repeat === "weekends") repeatLabel = "🏖️ Thứ 7 - Chủ Nhật";
    else if (item.repeat === "date") repeatLabel = "📌 Chỉ hôm nay";
    
    container.innerHTML = `
      <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;">
         <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleRoutineCompletion('${item.id}')" style="width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; accent-color: #10b981;">
         <div style="min-width: 0;">
            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
               <span class="routine-time-badge" style="background: ${item.color}15; color: ${item.color};">🕒 ${item.start} - ${item.end}</span>
            </div>
            <div class="routine-text" style="margin-top: 4px;">${item.activity}</div>
            <div class="routine-repeat-badge">${repeatLabel}</div>
         </div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; flex-shrink: 0;">
         <button class="btn-edit-task" onclick="startEditRoutine('${item.id}')" title="Sửa" style="background: none; border: none; color: #3b82f6; cursor: pointer; opacity: 0.6; padding: 0;">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
         </button>
         <button class="btn-delete-task" onclick="deleteDailyRoutine('${item.id}')" title="Xóa" style="background: none; border: none; color: #ef4444; cursor: pointer; opacity: 0.6; padding: 0; font-size: 14px;">✕</button>
      </div>
    `;
    list.appendChild(container);
  });
}

let editingTaskIndex = null;

function startEditTask(idx) {
  const tasks = studyPlanData[selectedDateStr] || [];
  if (idx < 0 || idx >= tasks.length) return;
  
  editingTaskIndex = idx;
  const task = tasks[idx];
  
  const input = document.getElementById("newTaskInput");
  const topicSel = document.getElementById("newTaskTopic");
  const hiddenUrlInput = document.getElementById("hiddenTaskResourceUrl");
  const pickerBtn = document.getElementById("taskResourcePickerBtn");
  const btnSubmit = document.getElementById("btnAddTaskSubmit");
  const btnCancel = document.getElementById("btnAddTaskCancel");
  
  if (input) {
    input.value = task.text;
    input.style.height = '';
    input.style.height = input.scrollHeight + 'px';
    input.focus();
  }
  if (topicSel) {
    topicSel.value = task.topic || "khac";
  }
  if (hiddenUrlInput) {
    hiddenUrlInput.value = task.link || "";
  }
  
  if (pickerBtn) {
    if (task.link) {
      if (task.link.startsWith('{')) {
        try {
          const fileObj = JSON.parse(task.link);
          pickerBtn.innerHTML = `📚 Đã chọn: ${fileObj.title || 'Tài liệu'}`;
        } catch(e) {
          pickerBtn.innerHTML = "📚 Đã đính kèm tài liệu";
        }
      } else {
        pickerBtn.innerHTML = "📚 Đã đính kèm link";
      }
    } else {
      pickerBtn.innerHTML = "📚 Chọn tài liệu đính kèm";
    }
  }
  
  if (btnSubmit) {
    btnSubmit.innerHTML = "💾 Cập nhật nhiệm vụ";
    btnSubmit.style.background = "#2563eb";
  }
  if (btnCancel) {
    btnCancel.style.display = "block";
  }
  
  const inputArea = document.querySelector(".daily-task-input-area");
  if (inputArea) {
    inputArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function cancelEditTask() {

function addDailyTask() {
  const input = document.getElementById("newTaskInput");
  const topicSel = document.getElementById("newTaskTopic");
  const hiddenUrlInput = document.getElementById("hiddenTaskResourceUrl");
  if (!input || !topicSel) return;
  const text = input.value.trim();
  const linkText = hiddenUrlInput ? hiddenUrlInput.value.trim() : "";
  if (!text) {
    showToast("Vui lòng nhập tên nhiệm vụ", "warning");
    return;
  }

  if (!studyPlanData[selectedDateStr]) {
    studyPlanData[selectedDateStr] = [];
  }

  if (editingTaskIndex !== null) {
    const idx = editingTaskIndex;
    if (studyPlanData[selectedDateStr][idx]) {
      studyPlanData[selectedDateStr][idx].text = text;
      studyPlanData[selectedDateStr][idx].topic = topicSel.value;
      studyPlanData[selectedDateStr][idx].link = linkText;
    }
    editingTaskIndex = null;
    
    const btnSubmit = document.getElementById("btnAddTaskSubmit");
    const btnCancel = document.getElementById("btnAddTaskCancel");
    if (btnSubmit) {
      btnSubmit.innerHTML = "+ Thêm nhiệm vụ";
      btnSubmit.style.background = "#10b981";
    }
    if (btnCancel) {
      btnCancel.style.display = "none";
    }
    showToast("Đã cập nhật nhiệm vụ thành công", "success");
  } else {
    studyPlanData[selectedDateStr].push({
      id: Date.now().toString(),
      text: text,
      topic: topicSel.value,
      completed: false,
      link: linkText
    });
  }

  input.value = "";
  input.style.height = "";
  if (hiddenUrlInput) hiddenUrlInput.value = "";
  const btn = document.getElementById("taskResourcePickerBtn");
  if (btn) btn.innerHTML = "📚 Chọn tài liệu đính kèm";
  
  saveStateToHistory(studyPlanData);
  persistData();
  renderCalendar();
  renderDailyTasks();
  updateOverallProgress();
  if (typeof renderDashboardStudyPlan === "function") {
    renderDashboardStudyPlan();
  }
}

function toggleTaskStatus(dateStr, idx) {
  studyPlanData[dateStr][idx].completed = !studyPlanData[dateStr][idx].completed;
  saveStateToHistory(studyPlanData);
  persistData();
  renderCalendar();
  renderDailyTasks();
  updateOverallProgress();
  if (typeof renderDashboardStudyPlan === "function") {
    renderDashboardStudyPlan();
  }
}

function deleteTask(dateStr, idx) {
  if (editingTaskIndex !== null && dateStr === selectedDateStr) {
    if (editingTaskIndex === idx) {
      cancelEditTask();
    } else if (editingTaskIndex > idx) {
      editingTaskIndex--;
    }
  }
  studyPlanData[dateStr].splice(idx, 1);
  if (studyPlanData[dateStr].length === 0) {
    delete studyPlanData[dateStr];
  }
  saveStateToHistory(studyPlanData);
  persistData();
  renderCalendar();
  renderDailyTasks();
  updateOverallProgress();
  if (typeof renderDashboardStudyPlan === "function") {
    renderDashboardStudyPlan();
  }
}

function searchTaskResources(query) {
  const defaultLists = document.getElementById('taskResourceDefaultLists');
  const searchResults = document.getElementById('taskResourceSearchResults');
  const searchList = document.getElementById('taskResourceSearchList');
  
  query = query.toLowerCase().trim();
  if (!query) {
    defaultLists.style.display = 'block';
    searchResults.style.display = 'none';
    return;
  }
  
  defaultLists.style.display = 'none';
  searchResults.style.display = 'block';
  
  let results = [];
  
  const addIfMatch = (arr, category) => {
    if (arr && Array.isArray(arr)) {
      arr.forEach(item => {
        const title = item.title || "";
        if (title.toLowerCase().includes(query)) {
          results.push({
            fileId: item.fileId,
            title: title,
            folder: item.folder || "Chưa phân loại",
            type: item.type || "pdf",
            category: category
          });
        }
      });
    }
  };
  
  addIfMatch(typeof allBooks !== 'undefined' ? allBooks : [], 'book');
  addIfMatch(typeof allExams !== 'undefined' ? allExams : [], 'exam');
  addIfMatch(typeof allCourses !== 'undefined' ? allCourses : [], 'course');
  addIfMatch(typeof allMockExams !== 'undefined' ? allMockExams : [], 'mockExam');
  
  results = results.slice(0, 20);
  window.currentTaskPickerSearchResults = results;
  
  if (results.length === 0) {
    searchList.innerHTML = '<div class="empty-resource-state">Không tìm thấy kết quả phù hợp.</div>';
    return;
  }
  
  let html = '';
  results.forEach((item, index) => {
    const isMock = typeof isMockExamFile === 'function' && isMockExamFile(item.fileId, item.title, item.folder, item.category);
    let icon = '📚';
    let typeLabel = 'Sách';
    let badgeClass = 'badge-book';
    
    if (item.category === 'course') {
      icon = '🎓';
      typeLabel = 'Khóa học';
      badgeClass = 'badge-course';
    } else if (isMock) {
      icon = '📝';
      typeLabel = 'Thi thử';
      badgeClass = 'badge-mock';
    } else if (item.category === 'exam') {
      icon = '📑';
      typeLabel = 'Đề thi';
      badgeClass = 'badge-exam';
    }
    
    html += `
      <div class="resource-picker-item" onclick="handleTaskResourceSelection(window.currentTaskPickerSearchResults[${index}])">
        <div class="resource-picker-name">
          <span class="resource-icon">${icon}</span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">

function navigateToResource(file) {
    if (!file) return;
    const category = file.category || (file.type === 'exam' ? 'exam' : 'book');
    const isMock = typeof isMockExamFile === 'function' && isMockExamFile(file.fileId, file.title, file.folder, category);
    
    // Ghi nhận file đang kích hoạt để tự động bung folder khi render lại
    window.activeResourceFileId = file.fileId;
    
    if (isMock) {
        switchView('mockExams').then((success) => {
            if (success !== false && currentView === 'mockExams') {
                if (typeof displayMockExams === 'function' && typeof allMockExams !== 'undefined') displayMockExams(allMockExams);
                viewMockExam({ fileId: file.fileId, title: file.title, type: file.type || 'pdf' });
            }
        });
    } else if (category === 'course') {
        switchView('courses').then((success) => {
            if (success !== false && currentView === 'courses') {
                if (typeof displayCourses === 'function' && typeof allCourses !== 'undefined') displayCourses(allCourses);
                readCourse(file.fileId, file.title, file.type, file.folder);
            }
        });
    } else if (category === 'exam') {
        switchView('exams').then((success) => {
            if (success !== false && currentView === 'exams') {
                if (typeof displayExams === 'function' && typeof allExams !== 'undefined') displayExams(allExams);
                requestOpenBook(file.fileId, file.title, true, 'exam', file.folder);
            }
        });
    } else {
        switchView('books').then((success) => {
            if (success !== false && currentView === 'books') {
                if (typeof displayBooks === 'function' && typeof allBooks !== 'undefined') displayBooks(allBooks);
                requestOpenBook(file.fileId, file.title, true, 'book', file.folder);
            }
        });
    }
}

function updateOverallProgress() {
  let totalTasks = 0;
  let completedTasks = 0;

  Object.values(studyPlanData).forEach(dayTasks => {
    dayTasks.forEach(task => {
      if (task.topic !== "khac") {
         totalTasks++;
         if (task.completed) completedTasks++;
      }
    });
  });

  const overall = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
  const progressEl = document.getElementById("overallStudyProgress");
  if (progressEl) progressEl.innerText = overall + "%";
}

let userClassSchedules = [];
let adminSchedulesData = [];

function getClassSchedulesForDate(dateStr) {
  const dateObj = new Date(dateStr);
  if (isNaN(dateObj.getTime())) return [];
  const dayOfWeek = dateObj.getDay(); // 0-6
  
  // Map JS day to Viet day string
  const dayMap = {
    1: ["2", "hai"],
    2: ["3", "ba"],
    3: ["4", "tư", "bốn"],
    4: ["5", "năm"],
    5: ["6", "sáu"],
    6: ["7", "bảy"],
    0: ["8", "cn", "chủ nhật"]
  };
  
  const matchKeys = dayMap[dayOfWeek] || [];
  
  return userClassSchedules.filter(sch => {
    const schDays = (sch.days || "")
      .toString()
      .toLowerCase()
      .replace(/[\.\/;]/g, ",")
      .split(",")
      .map(d => d.trim().replace(/^t/i, ""));
    return schDays.some(sd => matchKeys.includes(sd) || sd === "8" && dayOfWeek === 0 || sd === "cn" && dayOfWeek === 0);
  });
}

          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:red;">❌ Lỗi tải dữ liệu: ${res ? res.message : 'Lỗi không xác định'}</td></tr>`;
        }
      }
    })
    .withFailureHandler(function(err) {
      if (tbody) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:red;">❌ Lỗi kết nối server</td></tr>`;
      }
    })
    .getClassSchedules();
}

function updateClassCodesDatalist() {
  const datalist = document.getElementById("existing_class_codes");
  if (!datalist) return;
  datalist.innerHTML = "";
  
  const uniqueCodes = {};
  adminSchedulesData.forEach(sch => {
    const code = (sch.code || "").toString().trim().toUpperCase();
    if (code) {
      uniqueCodes[code] = sch.name || "";
    }
  });
  
  Object.keys(uniqueCodes).sort().forEach(code => {
    const option = document.createElement("option");
    option.value = code;
    option.text = `${code} (${uniqueCodes[code]})`;
    datalist.appendChild(option);
  });
}

function showAdminScheduleForm(editSched = null, isClone = false, prefillData = null) {
  const form = document.getElementById("adminScheduleFormContainer");
  const title = document.getElementById("adminScheduleFormTitle");
  const codeInput = document.getElementById("sched_code");
  const nameInput = document.getElementById("sched_name");
  const daysInput = document.getElementById("sched_days");
  const timeInput = document.getElementById("sched_time");
  const linkInput = document.getElementById("sched_link");
  const colorInput = document.getElementById("sched_color");
  
  if (!form) return;
  form.style.display = "block";
  form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  
  const isDark = document.body.classList.contains("dark-mode");
  
  if (editSched) {
    if (isClone) {
      editingSchedRowId = null;
      title.innerText = "📋 Nhân Bản Lịch Học Lớp";
      codeInput.value = editSched.code || "";
      codeInput.disabled = false;
      codeInput.style.backgroundColor = isDark ? "#0f172a" : "white";
      codeInput.style.color = isDark ? "#f8fafc" : "#1e293b";
      codeInput.style.borderColor = isDark ? "#334155" : "#cbd5e1";
    } else {
      editingSchedRowId = editSched.rowId || null;
      title.innerText = "📝 Chỉnh Sửa Lịch Học Lớp";
      codeInput.value = editSched.code || "";
      codeInput.disabled = true;
      codeInput.style.backgroundColor = isDark ? "#1e293b" : "#f1f5f9";
      codeInput.style.color = isDark ? "#94a3b8" : "#475569";
      codeInput.style.borderColor = isDark ? "#334155" : "#cbd5e1";
    }
    
    nameInput.value = editSched.name || "";
    
    const daysStr = editSched.days ? editSched.days.toString() : "";
    let initialDays = daysStr.split(",").map(d => d.trim().toLowerCase()).filter(Boolean);
    
    selectedDays = [];
    initialDays.forEach(d => {
      let cleaned = d.replace(/^thứ\s*/i, "").replace(/^t/i, "").trim();
      if (cleaned === "cn" || cleaned === "chủ nhật" || cleaned === "8" || cleaned === "sunday") {
        selectedDays.push("8");
      } else {
        const num = parseInt(cleaned);
        if (num >= 2 && num <= 7) {
          selectedDays.push(num.toString());
        }
      }
    });
    selectedDays = [...new Set(selectedDays)].sort((a, b) => parseInt(a) - parseInt(b));
    daysInput.value = selectedDays.join(",");
    updateSchedDayButtonsUI();
    
    timeInput.value = editSched.time || "";
    linkInput.value = editSched.link || "";
    colorInput.value = editSched.color || "#3b82f6";
  } else if (prefillData) {
    editingSchedRowId = null;
    title.innerText = `📅 Thêm Buổi Học Cho Lớp ${prefillData.code}`;
    codeInput.value = prefillData.code || "";
    codeInput.disabled = true;
    codeInput.style.backgroundColor = isDark ? "#1e293b" : "#f1f5f9";
    codeInput.style.color = isDark ? "#94a3b8" : "#475569";
    codeInput.style.borderColor = isDark ? "#334155" : "#cbd5e1";
    
    nameInput.value = prefillData.name || "";
    
    selectedDays = [];
    daysInput.value = "";
    updateSchedDayButtonsUI();
    
    timeInput.value = "";
    linkInput.value = "";
    colorInput.value = prefillData.color || "#10b981";
  } else {
    editingSchedRowId = null;
    title.innerText = "📅 Thêm Lịch Học Mới";
    codeInput.value = "";
    codeInput.disabled = false;
    codeInput.style.backgroundColor = isDark ? "#0f172a" : "white";
    codeInput.style.color = isDark ? "#f8fafc" : "#1e293b";
    codeInput.style.borderColor = isDark ? "#334155" : "#cbd5e1";
    nameInput.value = "";
    
    selectedDays = [];
    daysInput.value = "";
    updateSchedDayButtonsUI();
    
    timeInput.value = "";
    linkInput.value = "";
    colorInput.value = "#10b981";
  }
}

function hideAdminScheduleForm() {
  const form = document.getElementById("adminScheduleFormContainer");
  if (form) form.style.display = "none";
}

function saveAdminSchedule() {
  const code = document.getElementById("sched_code").value.trim().toUpperCase();
  const name = document.getElementById("sched_name").value.trim();
  const days = document.getElementById("sched_days").value.trim();
  const time = document.getElementById("sched_time").value.trim();
  const link = document.getElementById("sched_link").value.trim();
  const color = document.getElementById("sched_color").value;
  
  if (!code || !name || !days || !time) {
    showToast("Vui lòng nhập đầy đủ các trường bắt buộc (Mã, Tên, Lịch Thứ, Giờ Học)!", "error");
    return;
  }
  
  const schObj = { rowId: editingSchedRowId, code, name, days, time, link, color };
  
  if (typeof google === 'undefined') {
    // Mock save
    const idx = adminSchedulesData.findIndex(s => s.rowId === editingSchedRowId && editingSchedRowId !== null);
    if (idx !== -1) {
      adminSchedulesData[idx] = { ...schObj, rowId: editingSchedRowId };
    } else {
      adminSchedulesData.push({ ...schObj, rowId: Date.now() });
    }
    
    showToast("Đã lưu lịch học thành công (Mock)!", "success");
    hideAdminScheduleForm();
    renderAdminSchedules(adminSchedulesData);
    userClassSchedules = adminSchedulesData;
    renderCalendar();
    renderDailyTasks();
    return;
  }
  
  showToast("Đang lưu...", "info");
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success) {
        showToast(res.message || "Đã lưu lịch học thành công!", "success");
        hideAdminScheduleForm();
        loadAdminSchedules(); // Reload table
        loadUserClassSchedules(); // Refresh student view
      } else {
        showToast("Lỗi: " + (res ? res.message : "Không xác định"), "error");
      }
    })
    .withFailureHandler(function(err) {
      showToast("Lỗi kết nối Server khi lưu!", "error");
    })
    .saveClassSchedule(schObj);
}

function deleteAdminSchedule(code, rowId) {
  showConfirmModal(
    "Xác nhận xóa",
    `Bạn có chắc chắn muốn xóa buổi học này? Hành động này không thể hoàn tác.`,
    () => {
      if (typeof google === 'undefined') {
        adminSchedulesData = adminSchedulesData.filter(s => s.rowId !== rowId);
        showToast("Đã xóa thành công (Mock)!", "success");
        renderAdminSchedules(adminSchedulesData);
        userClassSchedules = adminSchedulesData;
        renderCalendar();
        renderDailyTasks();
        return;
      }
      
      showToast("Đang xóa...", "info");
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            showToast(res.message || "Đã xóa lịch học thành công!", "success");
            loadAdminSchedules();
            loadUserClassSchedules();
          } else {
            showToast("Lỗi: " + (res ? res.message : "Không xác định"), "error");
          }
        })
        .withFailureHandler(function(err) {
          showToast("Lỗi kết nối Server khi xóa!", "error");
        })
        .deleteClassSchedule(code, rowId);
    },
    '🗑️',
    'Xóa ngay'
  );
}

function filterAdminSchedules() {
  const query = document.getElementById("adminScheduleSearch").value.trim().toLowerCase();
  if (!query) {
    renderAdminSchedules(adminSchedulesData);
    return;
  }
  
  const filtered = adminSchedulesData.filter(sch => 
    (sch.code || "").toLowerCase().includes(query) ||
    (sch.name || "").toLowerCase().includes(query) ||
    (sch.days || "").toString().toLowerCase().includes(query) ||
    (sch.time || "").toLowerCase().includes(query)
  );
  renderAdminSchedules(filtered);
}

let isSchedAutocompleteInited = false;
function initScheduleAutocomplete() {
  if (isSchedAutocompleteInited) return;
  const codeInput = document.getElementById("sched_code");
  if (codeInput) {
    codeInput.addEventListener("input", function() {
      if (editingSchedRowId !== null) return; // Only autocomplete when adding new
      const enteredCode = this.value.trim().toUpperCase();
      if (!enteredCode) return;
      
      const matched = adminSchedulesData.find(s => (s.code || "").toString().trim().toUpperCase() === enteredCode);
      if (matched) {
        const nameInput = document.getElementById("sched_name");
        const colorInput = document.getElementById("sched_color");
        if (nameInput) nameInput.value = matched.name || "";
        if (colorInput) colorInput.value = matched.color || "#10b981";
      }
    });
    isSchedAutocompleteInited = true;
  }
}

// Register globally so onclick attributes can resolve them
let selectedDays = [];
let editingSchedRowId = null;

function toggleSchedDay(day) {
  const index = selectedDays.indexOf(day);
  if (index > -1) {
    selectedDays.splice(index, 1);
  } else {
    selectedDays.push(day);
  }
  
  // Sắp xếp các thứ tăng dần từ 2 đến 8 (Chủ Nhật)
  selectedDays.sort((a, b) => parseInt(a) - parseInt(b));
  
  const daysInput = document.getElementById("sched_days");
  if (daysInput) {
    daysInput.value = selectedDays.join(",");
  }
  updateSchedDayButtonsUI();
}

function updateSchedDayButtonsUI() {
  const isDark = document.body.classList.contains("dark-mode");
  const btns = document.querySelectorAll(".sched-day-btn");
  btns.forEach(btn => {
    const day = btn.getAttribute("data-day");
    if (selectedDays.includes(day)) {
      btn.style.background = "#10b981";
      btn.style.color = "white";
      btn.style.borderColor = "#10b981";
      btn.style.boxShadow = "0 2px 4px rgba(16, 185, 129, 0.2)";
    } else {
      btn.style.background = isDark ? "#1e293b" : "white";
      btn.style.color = isDark ? "#cbd5e1" : "#475569";
      btn.style.borderColor = isDark ? "#334155" : "#cbd5e1";
      btn.style.boxShadow = "none";
    }
  });
}

window.toggleSchedDay = toggleSchedDay;
window.updateSchedDayButtonsUI = updateSchedDayButtonsUI;

window.getClassSchedulesForDate = getClassSchedulesForDate;
window.loadUserClassSchedules = loadUserClassSchedules;
window.loadAdminSchedules = loadAdminSchedules;
window.renderAdminSchedules = renderAdminSchedules;
window.showAdminScheduleForm = showAdminScheduleForm;
window.hideAdminScheduleForm = hideAdminScheduleForm;
window.saveAdminSchedule = saveAdminSchedule;
window.deleteAdminSchedule = deleteAdminSchedule;
window.filterAdminSchedules = filterAdminSchedules;

</script>
