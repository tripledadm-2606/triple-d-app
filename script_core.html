<script>

// Các hàm helper làm sạch và lưu trữ an toàn thông tin để loại bỏ hoàn toàn các giá trị "undefined" hoặc "null" dạng chuỗi từ localStorage / sessionStorage
const _memStorageCache = {};
const originalSetItem = Storage.prototype.setItem;
Storage.prototype.setItem = function(key, value) {
  if (this === localStorage) _memStorageCache[key] = value;
  originalSetItem.call(this, key, value);
};
const originalRemoveItem = Storage.prototype.removeItem;
Storage.prototype.removeItem = function(key) {
  if (this === localStorage) _memStorageCache[key] = null;
  originalRemoveItem.call(this, key);
};
const originalClear = Storage.prototype.clear;
Storage.prototype.clear = function() {
  if (this === localStorage) {
    for (let k in _memStorageCache) delete _memStorageCache[k];
  }
  originalClear.call(this);
};

window.addEventListener('storage', (e) => {
  if (e.key) {
    if (e.newValue === null) {
      _memStorageCache[e.key] = null;
    } else {
      _memStorageCache[e.key] = e.newValue;
    }
  } else {
    for (let k in _memStorageCache) delete _memStorageCache[k];
  }
});
function getCleanLocalStorage(key) {
  if (key in _memStorageCache) {
    const cached = _memStorageCache[key];
    if (cached === null || cached === "undefined" || cached === "null") return null;
    return cached;
  }
  const val = localStorage.getItem(key);
  if (val === null || val === undefined || val === "undefined" || val === "null") {
    _memStorageCache[key] = null;
    return null;
  }
  _memStorageCache[key] = val;
  return val;
}
function getCleanSessionStorage(key) {
  const val = sessionStorage.getItem(key);
  if (val === null || val === undefined || val === "undefined" || val === "null") return null;
  return val;
}
function safeSetLocalStorage(key, val) {
  if (val === null || val === undefined || val === "undefined" || val === "null") {
    localStorage.removeItem(key);
    _memStorageCache[key] = null;
  } else {
    localStorage.setItem(key, val);
    _memStorageCache[key] = val;
  }
}
function safeSetSessionStorage(key, val) {
  if (val === null || val === undefined || val === "undefined" || val === "null") {
    sessionStorage.removeItem(key);
  } else {
    sessionStorage.setItem(key, val);
  }
}

// Hàm safeRedirect hỗ trợ điều hướng an toàn và tin cậy tuyệt đối trong Sandbox Iframe (ví dụ: Google Sites)
// Chỉ sử dụng gán trực tiếp window.location.href/replace độc lập, tránh tạo thẻ anchor click lập trình
// vì hệ thống bảo mật của Google Apps Script (Warden) sẽ tự động hijack sự kiện click và ép đổi sang target="_top" gây lỗi Sandbox.
function safeRedirect(url) {
  if (!url) return;
  
  // Thêm tham số cache buster (t=timestamp) để tránh lỗi caching của Google Apps Script / trình duyệt
  const timestamp = new Date().getTime();
  let finalUrl = url;
  if (url.includes('t=')) {
    finalUrl = url.replace(/t=\d+/, 't=' + timestamp);
  } else {
    const separator = url.includes('?') ? '&' : '?';
    finalUrl = url + separator + "t=" + timestamp;
  }

  console.log("safeRedirect (SPA mode) -> " + finalUrl);

  try {
    // Sử dụng window.location.replace() để thay thế URL hiện tại trong lịch sử duyệt web,
    // giúp tránh lỗi lặp vô tận khi nhấn nút "Back" của trình duyệt.
    // Cách này hoạt động hoàn hảo cả khi chạy trực tiếp lẫn khi bị nhúng trong iframe sandboxed (Google Sites)
    // mà không kích hoạt cảnh báo bảo mật về "allow-top-navigation" của trình duyệt.
    window.location.replace(finalUrl);
  } catch (err) {
    console.error("Lỗi điều hướng bằng replace:", err);
    try {
      window.location.href = finalUrl;
    } catch (err2) {
      console.error("Lỗi fallback điều hướng:", err2);
    }
  }
}

function ensureAbsoluteUrl(url) {
  if (!url) return '';
  var trimmed = url.trim();
  if (!/^https?:\/\//i.test(trimmed) && !/^\/\//.test(trimmed)) {
    return 'https://' + trimmed;
  }
  return trimmed;
}

window.expandedFolders = window.expandedFolders || new Set();

function shouldExpandFolderNode(data, activeFileId, type) {
  if (!activeFileId || !data) return false;
  
  let files = [];
  if (type === 'book') files = data.__books || [];
  else if (type === 'exam') files = data.__exams || [];
  else if (type === 'course') files = data.__courses || [];
  else if (type === 'mockExam') files = data.__exams || []; 
  
  if (files.some(f => String(f.fileId) === String(activeFileId))) {
    return true;
  }
  
  if (data.__children) {
    for (const childKey of Object.keys(data.__children)) {
      if (shouldExpandFolderNode(data.__children[childKey], activeFileId, type)) {
        return true;
      }
    }
  }
  return false;
}

// --- BỘ NHỚ TẠM LOCALSTORAGE (CACHE) & BATCH PREFETCH ---
const TDS_CACHE_PREFIX = "tds_cache_v1_";
const TDS_DEFAULT_TTL_MS = 30 * 60 * 1000; // 30 phút

const TDSStorageCache = {
  get: function(key) {
    try {
      const raw = getCleanLocalStorage(TDS_CACHE_PREFIX + key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && parsed.timestamp && (Date.now() - parsed.timestamp < TDS_DEFAULT_TTL_MS)) {
        return parsed.data;
      }
      return null;
    } catch(e) {
      return null;
    }
  },

  getAny: function(key) {
    try {
      const raw = getCleanLocalStorage(TDS_CACHE_PREFIX + key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return parsed ? parsed.data : null;
    } catch(e) {
      return null;
    }
  },

  set: function(key, data) {
    try {
      localStorage.setItem(TDS_CACHE_PREFIX + key, JSON.stringify({
        timestamp: Date.now(),
        data: data
      }));
    } catch(e) {
      console.warn("Lỗi lưu cache localStorage:", e);
    }
  },

  clear: function(key) {
    try {
      if (key) {
        localStorage.removeItem(TDS_CACHE_PREFIX + key);
      } else {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith(TDS_CACHE_PREFIX)) localStorage.removeItem(k);
        });
      }
    } catch(e) {}
  }
};

let isBannersLoaded = false;
let isBatchDataFetching = false;
function preloadBatchData(forceRevalidate = false) {
  if (isBatchDataFetching) return;
  if (!window.google || !google.script || !google.script.run || typeof google.script.run.getInitialBatchData !== "function") return;

  const cachedCourses = TDSStorageCache.get("courses");
  const cachedExams = TDSStorageCache.get("exams");
  const cachedBooks = TDSStorageCache.get("books");

  if (!forceRevalidate && cachedCourses && cachedExams && cachedBooks && isBannersLoaded) {
    return;
  }

  isBatchDataFetching = true;
  google.script.run
    .withSuccessHandler(function(batch) {
      isBatchDataFetching = false;
      if (!batch || !batch.success) return;

      if (batch.courses) {
        TDSStorageCache.set("courses", batch.courses);
        const changed = JSON.stringify(allCourses) !== JSON.stringify(batch.courses);
        allCourses = batch.courses;
        if (changed && typeof currentView !== 'undefined' && currentView === "courses" && typeof renderCourseList === "function") {
          if (window.screenShareNotRequired || window.isScreenShareActive || isMobileOrTablet() || currentUserRole === 'ADMIN') {
            renderCourseList(allCourses);
          }
        }
      }
      if (batch.exams) {
        TDSStorageCache.set("exams", batch.exams);
        const changed = JSON.stringify(allExams) !== JSON.stringify(batch.exams);
        allExams = batch.exams;
        if (changed && typeof currentView !== 'undefined' && currentView === "exams" && typeof renderExamList === "function") {
          renderExamList(allExams);
        }
      }
      if (batch.books) {
        TDSStorageCache.set("books", batch.books);
        const changed = JSON.stringify(allBooks) !== JSON.stringify(batch.books);
        allBooks = batch.books;
        if (changed && typeof currentView !== 'undefined' && currentView === "books" && typeof displayBooks === "function") {
          displayBooks(allBooks);
        }
      }
      if (batch.banners && Array.isArray(batch.banners)) {
        isBannersLoaded = true;
        ads = batch.banners;
        if (ads.length === 0) {
          const adPopup = document.getElementById("adPopup");
          if (adPopup) adPopup.style.display = "none";
        }
        // Đã xóa showAd(0) ở đây để tránh popup quảng cáo bật lên đột ngột khi tải xong ngầm
      }
      if (batch.role) {
        currentUserRole = batch.role;
        if (typeof updateRoleBadge === "function") updateRoleBadge(batch.role);
      }
    })
    .withFailureHandler(function(err) {
      isBatchDataFetching = false;
      console.warn("Lỗi tải gộp batch dữ liệu ban đầu:", err);
    })
    .getInitialBatchData();
}

let allBooks = [];

function loadBooks() {
  const loadingEl = document.getElementById("loading");

  // ⚡ Step 3: Stale-While-Revalidate - Hiển thị ngay từ cache local nếu có
  const cachedBooks = TDSStorageCache.getAny("books");
  if (cachedBooks && Array.isArray(cachedBooks) && cachedBooks.length > 0) {
    allBooks = cachedBooks;
    if (currentView === "books") {
      displayBooks(allBooks);
      if (loadingEl) loadingEl.style.display = "none";
    }
  } else {
    if (loadingEl) loadingEl.style.display = "flex";
  }

  // Tải ngầm bản mới nhất để Revalidate
  google.script.run.withSuccessHandler(function (books) {
    if (books && Array.isArray(books)) {
      TDSStorageCache.set("books", books);
      if (currentView !== "books") return;
      if (JSON.stringify(allBooks) !== JSON.stringify(books)) {
        allBooks = books;
        displayBooks(books);
      }
      if (loadingEl) loadingEl.style.display = "none";
    }
  }).getBooks();
}


function displayBooks(books) {
  const container = document.getElementById('bookPanel');
  if (!container) return;

  // Giữ lại ô tìm kiếm
  const children = Array.from(container.children);
  children.forEach(child => {
    if (!child.classList.contains('panel-header')) {
      container.removeChild(child);
    }
  });
  
  const root = {};

  // Duyệt qua tất cả sách và dựng cây phân cấp
  books.forEach(book => {
    const parts = (book.folder || 'Chưa phân loại').split(" / ");
    let node = root;
    parts.forEach((part, i) => {
      if (!node[part]) node[part] = { __books: [], __children: {} };
      if (i === parts.length - 1) {
        node[part].__books.push(book);
      }
      node = node[part].__children;
    });
  });

  const treeRoot = root;

  const searchInput = document.getElementById('searchInput');
  const isSearching = searchInput && searchInput.value.trim() !== "";

  function createFolderSection(name, data, level = 0, forceExpand = false, parentPath = "") {
    const folderPath = parentPath ? `${parentPath} / ${name}` : name;
    const isNodeActive = forceExpand || (window.expandedFolders && window.expandedFolders.has(folderPath)) || shouldExpandFolderNode(data, window.activeResourceFileId, 'book');
    const section = document.createElement("div");
    section.className = "exam-folder-section";
    
    const header = document.createElement("div");
    header.className = `exam-folder-header level-${level}`;

    header.innerHTML = `
      <span class="title" title="${name}">📁 ${name}</span>
      <span class="arrow">${isNodeActive ? "▼" : "▶"}</span>
    `;

    section.appendChild(header);

    const content = document.createElement("div");
    content.className = "exam-folder-content";
    content.style.display = isNodeActive ? "block" : "none";

    header.addEventListener("click", () => {
      const isHidden = content.style.display === "none";
      content.style.display = isHidden ? "block" : "none";
      header.querySelector(".arrow").textContent = isHidden ? "▼" : "▶";
      if (isHidden) {
        if (window.expandedFolders) window.expandedFolders.add(folderPath);
      } else {
        if (window.expandedFolders) window.expandedFolders.delete(folderPath);
      }
    });

    const grid = document.createElement("div");
    grid.className = "book-grid";

    data.__books
      .sort((a, b) => a.title.localeCompare(b.title))
      .forEach(book => {
        const bookDiv = document.createElement("div");
        bookDiv.className = "book" + (book.isPaid ? " vip" : "");

        bookDiv.innerHTML = `
          <h4 title="${book.title}">${book.title}</h4>
          <button class="read-btn ${book.isPaid ? 'vip' : ''}"
            onclick="requestOpenBook('${book.fileId}', '${book.title}', ${book.isPaid}, 'book', '${book.folder}', this)">
            Đọc
          </button>
        `;

        grid.appendChild(bookDiv);
      });

    content.appendChild(grid);

    Object.keys(data.__children).sort().forEach(child => {
      const childSection = createFolderSection(child, data.__children[child], level + 1, forceExpand, folderPath);
      content.appendChild(childSection);
    });

    section.appendChild(content);

    return section;
  }

  const fragment = document.createDocumentFragment();
  Object.keys(treeRoot).sort().forEach(folder => {
    const data = treeRoot[folder];
    
    // 1. Render all direct books inside this level-0 folder
    if (data.__books && data.__books.length > 0) {
      const grid = document.createElement("div");
      grid.className = "book-grid";

      data.__books
        .sort((a, b) => a.title.localeCompare(b.title))
        .forEach(book => {
          const bookDiv = document.createElement("div");
          bookDiv.className = "book" + (book.isPaid ? " vip" : "");

          bookDiv.innerHTML = `
            <h4 title="${book.title}">${book.title}</h4>
            <button class="read-btn ${book.isPaid ? 'vip' : ''}"
              onclick="requestOpenBook('${book.fileId}', '${book.title}', ${book.isPaid}, 'book', '${book.folder}', this)">
              Đọc
            </button>
          `;

          grid.appendChild(bookDiv);
        });
      fragment.appendChild(grid);
    }

    // 2. Render children of this level-0 folder as folder sections (starting at UI level 0)
    Object.keys(data.__children).sort().forEach(child => {
      const childSection = createFolderSection(child, data.__children[child], 0, isSearching, folder);
      fragment.appendChild(childSection);
    });
  });
  container.appendChild(fragment);
}

let isLoadingBook = false;
let isConnectingFile = false;
window.isGlobalDocumentLoading = false;
window.globalDocLoadingTimeout = null;

window.resetGlobalDocumentLoading = function() {
  if (window.globalDocLoadingTimeout) {
    clearTimeout(window.globalDocLoadingTimeout);
    window.globalDocLoadingTimeout = null;
  }
  if (typeof fetchProgressInterval !== 'undefined' && fetchProgressInterval) {
    clearInterval(fetchProgressInterval);
    fetchProgressInterval = null;
  }
  if (typeof decodeProgressInterval !== 'undefined' && decodeProgressInterval) {
    clearInterval(decodeProgressInterval);
    decodeProgressInterval = null;
  }
  if (typeof window.mockExamTimerInterval !== 'undefined' && window.mockExamTimerInterval) {
    clearInterval(window.mockExamTimerInterval);
    window.mockExamTimerInterval = null;
  }
  window.isGlobalDocumentLoading = false;
  if (typeof isConnectingFile !== 'undefined') isConnectingFile = false;
  if (typeof isLoadingBook !== 'undefined') isLoadingBook = false;
  if (typeof isLoading !== 'undefined') isLoading = false;
  if (typeof window.setAllDocumentAccessButtonsDisabled === 'function') {
    window.setAllDocumentAccessButtonsDisabled(false);
  }
};

window.setGlobalDocumentLoading = function(loading, timeoutMs = 8000) {
  if (window.globalDocLoadingTimeout) {
    clearTimeout(window.globalDocLoadingTimeout);
    window.globalDocLoadingTimeout = null;
  }
  if (loading) {
    window.isGlobalDocumentLoading = true;
    if (typeof window.setAllDocumentAccessButtonsDisabled === 'function') {
      window.setAllDocumentAccessButtonsDisabled(true);
    }
    window.globalDocLoadingTimeout = setTimeout(() => {
      console.warn("Auto-resetting global document loading state due to timeout.");
      window.resetGlobalDocumentLoading();
    }, timeoutMs);
  } else {
    window.resetGlobalDocumentLoading();
  }
};

window.setAllDocumentAccessButtonsDisabled = function(disabled) {
  document.querySelectorAll(".read-btn, .purchased-item-modern, .exam-button, .btn-option-primary, .qa-delete-btn, .purchased-item-btn").forEach(btn => {
    btn.disabled = disabled;
    if (disabled) {
      btn.style.opacity = "0.5";
      btn.style.cursor = "not-allowed";
      btn.style.pointerEvents = "none";
    } else {
      btn.style.opacity = "";
      btn.style.cursor = "";
      btn.style.pointerEvents = "";
    }
  });
};

function readBook(fileId, title, alreadyShared = false) {
  if (isMobileOrTablet()) hideLeftPanel();

  if (snakeGameRunning) {
    snakeGameRunning = false;
    if (typeof interval !== "undefined") clearTimeout(interval);
  }

  currentEmail = sessionStorage.getItem("userEmail") || "";

  const viewer = document.getElementById('bookViewer');
  if (fileId && !openedFileIds.includes(fileId)) {
    openedFileIds.push(fileId);
  }

  if (alreadyShared) {
    renderReaderContent(viewer, fileId, title, false, false, false, false);
    isLoadingBook = false;
    if (typeof window.resetGlobalDocumentLoading === 'function') {
      window.resetGlobalDocumentLoading();
    }
  } else {
    renderReaderLoading(viewer, `📖 Đang cấp quyền và nạp sách "${title}"...`);
    window.setGlobalDocumentLoading(true, 8000);
    google.script.run
      .withSuccessHandler(function (res) {
        if (fileId && !openedFileIds.includes(fileId)) {
          openedFileIds.push(fileId);
        }
        renderReaderContent(viewer, fileId, title, false, false, false, false);
        isLoadingBook = false;
        if (typeof window.resetGlobalDocumentLoading === 'function') {
          window.resetGlobalDocumentLoading();
        }
      })
      .withFailureHandler(function (err) {
        console.error("Lỗi chia sẻ file sách:", err);
        renderReaderContent(viewer, fileId, title, false, false, false, false);
        isLoadingBook = false;
        if (typeof window.resetGlobalDocumentLoading === 'function') {
          window.resetGlobalDocumentLoading();
        }
      })
      .sharePurchasedFile(fileId, currentEmail);
  }
}

}

function renderReaderContent(viewer, fileId, title, isMockExam = false, showHomeworkBtn = false, isStrictMockExam = false, isDirectPdf = false) {
  const isFav = isFavorite(fileId);
  const isDark = document.body.classList.contains("dark-mode");
  
  // Chỉ bật 2 chế độ xem đối với Thư Viện và Tài Liệu (không thuộc Khóa Học/Khảo Thí)
  const isLibraryOrDoc = !showHomeworkBtn && !isMockExam && !isStrictMockExam;
  
  window.currentReaderFileId = fileId;
  window.currentReaderTitle = title;
  window.currentReaderIsMockExam = isMockExam;
  window.currentReaderShowHomeworkBtn = showHomeworkBtn;
  window.currentReaderIsStrictMockExam = isStrictMockExam;
  window.currentReaderIsDirectPdf = isDirectPdf;
  window.currentReaderIsLibraryOrDoc = isLibraryOrDoc;

  if (isStrictMockExam) {
    isDirectPdf = true;
  }
  
  // Toggle logo góc trên bên phải: Ẩn khi dùng tính năng Render PDF, hiện khi dùng cơ chế preview
  const overlayLogo = document.querySelector('.overlay-logo');
  if (overlayLogo) {
    if (isDirectPdf) {
      overlayLogo.style.display = 'none';
    } else {
      overlayLogo.style.display = '';
    }
  }

          <button class="qa-close-btn" onclick="toggleHomeworkPanel()">✕</button>
        </div>
        <div id="homeworkContent" style="padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px;">
          <!-- Homework content/form loaded dynamically -->
          <div style="text-align: center; padding: 30px;"><div class="spinner" style="margin: 0 auto;"></div><div style="margin-top: 10px; color: #64748b; font-size: 0.85rem;">Đang tải thông tin BTVN...</div></div>
        </div>
      </div>
    </div>
  `;

  // 🛑 [INSTANT REVOCATION] Thu hồi quyền Drive ngay sau khi hiển thị preview
  let revoked = false;
  const doRevoke = () => {
    if (revoked) return;
    revoked = true;
    const email = currentEmail || sessionStorage.getItem("userEmail") || "";
    if (fileId && fileId !== "0000000000" && email) {
      console.log("🔒 [Instant Revoke] Gọi thu hồi quyền Drive ngay sau khi hiện preview:", fileId, "user:", email);
      if (window.google && window.google.script && window.google.script.run && typeof window.google.script.run.revokeFileAccess === "function") {
        window.google.script.run
          .withSuccessHandler(function() {
            console.log("✅ [Instant Revoke] Đã thu hồi quyền Drive thành công cho file: " + fileId);
          })
          .withFailureHandler(function(err) {
            console.warn("⚠️ [Instant Revoke Warning] " + (err ? err.message : err));
          })
          .revokeFileAccess(fileId, email);
      }
    }
    if (typeof revokeAccess === 'function') revokeAccess();
  };

  if (!isDirectPdf) {
    document.body.classList.add('video-active');
    initVideoQrOverlay(fileId, title);

    if (typeof showToast === 'function') {
      showToast("Nếu tệp báo thiếu quyền xem, bạn chỉ cần bấm lại nút 'Xem' lần nữa là được nhé.", "info", 6000, {
        text: "Cách Khắc Phục",
        onclick: "openCourseAccessHelpModal()"
      });
    }

    // 🎯 Lắng nghe sự kiện load của iframe: Khi iframe tải xong mới thu hồi quyền lập tức
    const iframe = document.getElementById('readerIframe');
    if (iframe) {
      iframe.addEventListener('load', doRevoke, { once: true });
      // Fallback: nếu mạng chậm hoặc sự kiện load không nổ sau 3 giây thì tự động revoke để đảm bảo bảo mật
      setTimeout(doRevoke, 3000);
    } else {
      doRevoke();
    }

    // 📺 Hiển thị popup hỏi bật toàn màn hình web khi frame video xuất hiện
    showVideoFullscreenPrompt();
  } else {
    document.body.classList.remove('video-active');
    removeVideoQrOverlay();
    dismissVideoFullscreenPrompt();
  }
  
  if (isDirectPdf) {
      if (window.loadStrictMockExamPdf) {
          window.loadStrictMockExamPdf(fileId, isStrictMockExam);
      }
  }
}

  if (document.body.classList.contains('reader-fullscreen')) return;

  wrapper.appendChild(promptDiv);

  // Tự động ẩn nhẹ nhàng sau 10 giây nếu người dùng không tương tác
  if (videoFullscreenPromptTimer) clearTimeout(videoFullscreenPromptTimer);
  videoFullscreenPromptTimer = setTimeout(() => {

  }, 10000);

function dismissVideoFullscreenPrompt() {
  if (videoFullscreenPromptTimer) {
    clearTimeout(videoFullscreenPromptTimer);
    videoFullscreenPromptTimer = null;
  }
  const prompt = document.getElementById('videoFullscreenPrompt');
  if (prompt) {
    prompt.classList.add('hide');
    setTimeout(() => {
      if (prompt && prompt.parentNode) {
        prompt.parentNode.removeChild(prompt);
      }
    }, 300);
  }
}

function acceptVideoFullscreen() {
  dismissVideoFullscreenPrompt();
  
  // Kích hoạt chế độ toàn màn hình của web (ẩn sidebar & left-panel)
  if (!document.body.classList.contains('reader-fullscreen')) {
    document.body.classList.add('reader-fullscreen');
    const btn = document.querySelector('.maximize-btn');
    if (btn) {
      btn.innerHTML = '🤏 Thu nhỏ';
    }
  }
}

function requestOpenBook(fileId, title, isPaid, type = "book", folderName = "", btn) {
  if (typeof window.resetGlobalDocumentLoading === 'function') {
    window.resetGlobalDocumentLoading();
  }
  if (typeof isMockExamFile === 'function' && isMockExamFile(fileId, title, folderName, type)) {
    showToast("⚠️ Đề thi thử bắt buộc phải truy cập qua phòng Khảo thí.");
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = 1;
      btn.style.cursor = "pointer";
    }
    const p = switchView('mockExams');
    if (p) p.then((success) => {
      if (success !== false && currentView === 'mockExams') {
        viewMockExam({ fileId: fileId, title: title, type: type || 'pdf' });
      }
    });
    return;
  }

  // Chặn mở khóa học qua requestOpenBook (Lỗ hổng bypass screen share)
  const isCourse = (typeof allCourses !== 'undefined' && allCourses.some(c => String(c.fileId).trim() === String(fileId).trim())) 
                   || String(folderName).toLowerCase().includes("khóa học") 
                   || type === "video"
                   || type === "course";
                   
  if (isCourse) {
    showToast("⚠️ Khóa học bắt buộc phải truy cập qua mục Khóa Học.");
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = 1;
      btn.style.cursor = "pointer";
    }
    const p = switchView('courses');
    if (p) p.then((success) => {
      if (success !== false && currentView === 'courses') {
        readCourse(fileId, title, "video", folderName);
      }
    });
    return;
  }

  const email = sessionStorage.getItem("userEmail") || "";

  // 1. Kiểm tra giới hạn hàng ngày đối với tài khoản STUDENT
  const limitCheck = checkStudentDailyLimitClient(email, fileId, folderName);
  if (!limitCheck.allowed) {
    showErrorModal(limitCheck.message);
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = 1;
      btn.style.cursor = "pointer";
    }
    return;
  }

  if (btn) {
    btn.disabled = true;
    btn.style.opacity = 0.5;
    btn.style.cursor = "not-allowed";
  }

  if (isFilePurchased(fileId) && email) {
    openPurchasedItemDirectly(email, fileId, title, type, folderName, btn);
    return;
  }

  // 2. S-STUDENT hoặc ADMIN được mở trực tiếp, không hiển thị bất kỳ hộp thoại "hỏi tiền" nào
  const userRole = (currentUserRole || "").toUpperCase().trim();
  if ((userRole === "S-STUDENT" || userRole === "ADMIN") && email) {
    const viewer = document.getElementById("bookViewer");
    if (viewer) {
      viewer.innerHTML = `
        <div class="tds-central-state">
          <div class="tds-spinner-wrapper">
            <div class="spinner"></div>
            <div class="tds-state-message bold">
              📖 Đợi một chút, đang mở ${type === "exam" ? "tài liệu" : "sách"} cho bạn...
            </div>
          </div>
        </div>
      `;
    }
    openItemWithPoints(email, fileId, title, type, folderName, btn);
    return;
  }

  const modal = document.getElementById("confirmAccessModal");
  const message = document.getElementById("confirmAccessMessage");
  const yesBtn = document.getElementById("confirmAccessYes");
  const noBtn = document.getElementById("confirmAccessNo");

  message.textContent = `📘 Bạn có muốn dùng 67 🪙 để thuê (5 ngày) ${type === "exam" ? "tài liệu" : "sách"} "${title}" hay không?`;
  modal.style.display = "flex";

  const newYesBtn = yesBtn.cloneNode(true);
  yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);

  const newNoBtn = noBtn.cloneNode(true);
  noBtn.parentNode.replaceChild(newNoBtn, noBtn);

  newYesBtn.onclick = function () {
    closeConfirmAccess();

    if (typeof window.resetGlobalDocumentLoading === 'function') {
      window.resetGlobalDocumentLoading();
    }
    isConnectingFile = true;
    window.setGlobalDocumentLoading(true, 8000);

    const viewer = document.getElementById("bookViewer");
    viewer.innerHTML = `
      <div class="tds-central-state">
        <div class="tds-spinner-wrapper">
          <div class="spinner"></div>
          <div class="tds-state-message bold">
            📖 Đợi một chút, đang mở ${type === "exam" ? "tài liệu" : "sách"} cho bạn...
          </div>
        </div>
      </div>
    `;

    const email = sessionStorage.getItem("userEmail");
    if (!email) {
      window.resetGlobalDocumentLoading();
      // Nếu không có email, bật lại nút
      if (btn) {
        btn.disabled = false;
        btn.style.opacity = "";
        btn.style.cursor = "";
        btn.style.pointerEvents = "";
      }
      return;
    }

    if (isPaid) {
      google.script.run
        .withSuccessHandler(function (role) {
          const userRole = (role || "").toUpperCase();
          let hasAccess = false;

          if (userRole === "ADMIN") {
            hasAccess = true;
          } else if (type === "exam") {
            const folderLower = folderName.toLowerCase();
            if (folderLower.includes("student")) {
              hasAccess = userRole === "STUDENT" || userRole === "S-STUDENT";
            } else if (folderLower.includes("vip")) {
              hasAccess = ["VIP", "STUDENT", "S-STUDENT", "O-STUDENT"].includes(userRole);
            } else {
              hasAccess = true;
            }
          } else if (type === "book") {
            const folderLower = folderName.toLowerCase();
            if (folderLower.includes("vip")) {
              hasAccess = ["VIP", "STUDENT", "S-STUDENT", "O-STUDENT"].includes(userRole);
            } else if (folderLower.includes("mem")) {
              hasAccess = ["MEM", "VIP", "O-STUDENT", "STUDENT", "S-STUDENT"].includes(userRole);
            } else {
              hasAccess = true;
            }
          }

          if (!hasAccess) {
            window.resetGlobalDocumentLoading();

            let reason = "🔒 Bạn không có quyền truy cập tài liệu này.";

            const isStudent = folderName.toLowerCase().includes("student");
            const isVip = folderName.toLowerCase().includes("vip");
            const isOStudent = folderName.toLowerCase().includes("o-student");

            if (type === "exam") {
              if (isOStudent) {
                reason = `🔒 Đây là tài liệu chỉ dành cho <strong>O-STUDENT</strong>. Vui lòng đăng ký quyền để truy cập.`;
              } else if (isStudent) {
                reason = `🔒 Đây là tài liệu chỉ dành cho <strong>STUDENT</strong>. Vui lòng đăng ký khóa học để truy cập.`;
              } else if (isVip) {
                reason = `🔒 Đây là tài liệu <strong>VIP</strong>. Vui lòng nâng cấp tài khoản VIP để truy cập.`;
              }
            } else {
              if (isOStudent) {
                reason = `🔒 Đây là sách chỉ dành cho <strong>O-STUDENT</strong>. Vui lòng đăng ký quyền để truy cập.`;
              } else if (isVip) {
                reason = `🔒 Đây là sách <strong>VIP</strong>. Vui lòng nâng cấp tài khoản VIP để truy cập.`;
              }
            }

            showVipModal(reason);
            viewer.innerHTML = `
              <div class="tds-central-state">
                <div class="tds-state-icon">🛑</div>
                <div class="tds-state-title">Truy Cập Bị Từ Chối</div>
                <div class="tds-state-message">${reason}</div>
              </div>
            `;

            // Bật lại nút vì không được mở
            if (btn) {
              btn.disabled = false;
              btn.style.opacity = "";
              btn.style.cursor = "";
              btn.style.pointerEvents = "";
            }
            return;
          }

          // Có quyền → mở sách/tài liệu
          openItemWithPoints(email, fileId, title, type, folderName, btn, true);
        })
        .withFailureHandler(function (err) {
          window.resetGlobalDocumentLoading();
          if (btn) {
            btn.disabled = false;
            btn.style.opacity = "";
            btn.style.cursor = "";
            btn.style.pointerEvents = "";
          }
          showErrorModal("Không thể kết nối phân quyền: " + err.message);
        })
        .getUserRole(email);
    } else {
      openItemWithPoints(email, fileId, title, type, folderName, btn, true);
    }
  };

  newNoBtn.onclick = function () {
    closeConfirmAccess();

    // Nếu người dùng từ chối, bật lại nút
    if (btn) {
      btn.disabled = false;
      btn.style.opacity = 1;
      btn.style.cursor = "pointer";
    }
  };
}

function openItemWithPoints(email, fileId, title, type = "book", folderName = "", btn) {
  if (typeof window.resetGlobalDocumentLoading === 'function') {
    window.resetGlobalDocumentLoading();
  }
  isConnectingFile = true;
  window.setGlobalDocumentLoading(true, 8000);

  let optimisticallyDeducted = false;
  let originalPoints = currentUserPoints;
  const userRole = (window.currentUserRole || "").toUpperCase().trim();
  
  if (userRole !== "S-STUDENT" && userRole !== "ADMIN") {
      if (typeof currentUserPoints !== 'undefined' && currentUserPoints >= 67 && typeof updatePointDisplay === 'function') {
          updatePointDisplay(currentUserPoints - 67);
          optimisticallyDeducted = true;
      }
  }

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || res.error) {
        if (optimisticallyDeducted) updatePointDisplay(originalPoints);
        window.resetGlobalDocumentLoading();
        showErrorModal(res ? res.message : `Đã xảy ra lỗi khi giao dịch.`);
        triggerStudentReliefIfEligible();
        const viewer = document.getElementById("bookViewer");
        if (viewer) {
          viewer.innerHTML = `
            <div class="tds-central-state">
              <div class="tds-state-icon">🪙</div>
              <div class="tds-state-title">Thất bại</div>
              <div class="tds-state-message">${res ? res.message : "Không đủ 🪙."}</div>
            </div>
          `;
        }
        if (btn) {
          btn.disabled = false;
          btn.style.opacity = "";
          btn.style.cursor = "";
          btn.style.pointerEvents = "";
        }
        return;
      }

      isConnectingFile = false;
      const pointDisplay = document.getElementById("userPoint");
      updatePointDisplay(res.points);
      
      if (!res.freeAccess) {
         showPointDeductionNotice();
         // Lưu vào danh sách đang thuê (Local Storage)
         addPurchasedFile(fileId, title, type, folderName);
         // Ghi nhận giới hạn hàng ngày nếu là tài khoản STUDENT
         logStudentDailyPurchaseClient(email, fileId, folderName);
      } else {
         // Nếu miễn phí thì thông báo nhỏ theo phân quyền cụ thể
         const userRole = (currentUserRole || "").toUpperCase().trim();
         if (userRole === "S-STUDENT") {
            showToast("✅ Đã mở tài liệu bằng quyền S-STUDENT", "success");
         } else if (userRole === "ADMIN") {
            showToast("✅ Đã mở tài liệu bằng quyền ADMIN", "success");
         } else {
            showToast("✅ Đã mở tài liệu bằng quyền ưu tiên", "success");
         }
      }

      // The server already shared the file directly inside `deductPointsAndLog`.
      // We just render it.

      // Lưu email hiện tại để revoke
      currentEmail = email;

      // Lưu vào danh sách đang mở
      if (!openedFileIds.includes(fileId)) {
        openedFileIds.push(fileId);
      }

      // Lưu vào danh sách gần đây (localStorage)
      addRecentFile({
        fileId: fileId,
        title: title,
        type: type,
        category: type,
        folder: folderName,
        timestamp: new Date().getTime()
      });
      renderRecentFiles();
      
      // Theo dõi tiến độ học tập
      if(typeof trackLearning === 'function') {
        trackLearning(folderName, fileId);
      }
      if (typeof startStudyTimer === 'function') {
        startStudyTimer();
      }

      // Mở sách/tài liệu (đã được chia sẻ trước đó trong deductPointsAndLog)
      if (type === "exam") {
        readExam(fileId, title, true);
      } else {
        readBook(fileId, title, true);
      }
    })
    .withFailureHandler(function (err) {
      if (optimisticallyDeducted) updatePointDisplay(originalPoints);
      window.resetGlobalDocumentLoading();
      showErrorModal("Lỗi kết nối khi trừ điểm: " + err.message);
    })
    .deductPointsAndLog(type, fileId, title);
}

function readExam(fileId, title, alreadyShared = false) {
  if (isMobileOrTablet()) hideLeftPanel();

  currentEmail = sessionStorage.getItem("userEmail") || "";

  const viewer = document.getElementById('bookViewer');
  if (fileId && !openedFileIds.includes(fileId)) {
    openedFileIds.push(fileId);
  }

  if (alreadyShared) {
    renderReaderContent(viewer, fileId, title, false, false, false, false);
    if (typeof window.resetGlobalDocumentLoading === 'function') {
      window.resetGlobalDocumentLoading();
    }
  } else {
    renderReaderLoading(viewer, `📝 Đang cấp quyền và nạp đề thi "${title}"...`);
    window.setGlobalDocumentLoading(true, 8000);
    google.script.run
      .withSuccessHandler(function (res) {
        if (fileId && !openedFileIds.includes(fileId)) {
          openedFileIds.push(fileId);
        }
        renderReaderContent(viewer, fileId, title, false, false, false, false);
        if (typeof window.resetGlobalDocumentLoading === 'function') {
          window.resetGlobalDocumentLoading();
        }
      })
      .withFailureHandler(function (err) {
        console.error("Lỗi chia sẻ file đề thi:", err);
        renderReaderContent(viewer, fileId, title, false, false, false, false);
        if (typeof window.resetGlobalDocumentLoading === 'function') {
          window.resetGlobalDocumentLoading();
        }
      })
      .sharePurchasedFile(fileId, currentEmail);
  }
}

function initVideoQrOverlay(fileId, title) {
  removeVideoQrOverlay();

  const wrapper = document.getElementById('readerContentWrapper');
  if (!wrapper) return;

  const email = sessionStorage.getItem("userEmail") || getCleanLocalStorage("userEmail") || (typeof currentEmail !== 'undefined' ? currentEmail : "") || "user@hoc.edu.vn";
  const myAppUrl = window.location.origin + window.location.pathname;
  const qrPayload = `${myAppUrl}?qr_scan=${encodeURIComponent(email)}`;
  const devInfo = typeof getWatermarkDeviceInfo === 'function' ? getWatermarkDeviceInfo() : 'PC/Browser';

  const overlay = document.createElement('div');
  overlay.id = 'videoSecurityQrOverlay';
  overlay.className = 'video-security-qr-overlay';
  overlay.innerHTML = `
    <div class="video-qr-canvas-box">
      <canvas id="videoQrCanvas"></canvas>
    </div>
    <div class="video-qr-text">SEC: ${email} | ${devInfo}</div>
  `;

  wrapper.appendChild(overlay);

  setTimeout(() => {
    const canvas = document.getElementById('videoQrCanvas');
    if (canvas && typeof QRious !== 'undefined') {
      try {
        new QRious({
          element: canvas,
          value: qrPayload,
          size: 200,
          level: 'M'
        });
      } catch (e) {
        console.error("Lỗi khi tạo QR Code bảo mật video:", e);
      }
    }
  }, 60);
}

function removeVideoQrOverlay() {
  const overlay = document.getElementById('videoSecurityQrOverlay');

    overlay.remove();

}

  if (panel) {

  const btn = document.getElementById('showPanelBtn');

    panel.classList.add('active', 'panel-slide-in');
    setTimeout(() => {
      panel.classList.remove('panel-slide-in');

let allExams = []; // Khai báo ngoài hàm để tái sử dụng

function loadExams() {
  const loading = document.getElementById("loadingExam");

  // ⚡ Step 3: Stale-While-Revalidate - Hiển thị ngay từ cache local nếu có
  const cachedExams = TDSStorageCache.getAny("exams");
  if (cachedExams && Array.isArray(cachedExams) && cachedExams.length > 0) {
    allExams = cachedExams;
    if (currentView === "exams") {
      renderExamList(allExams);
      if (loading) loading.style.display = "none";
    }
  } else {
    if (loading) loading.style.display = "flex";
  }

  // Tải ngầm bản mới nhất để Revalidate
  google.script.run.withSuccessHandler(function (exams) {
    if (exams && Array.isArray(exams)) {
      TDSStorageCache.set("exams", exams);
      if (currentView !== "exams") return;
      if (JSON.stringify(allExams) !== JSON.stringify(exams)) {
        allExams = exams;
        renderExamList(allExams);
      }
      if (loading) loading.style.display = "none";
    }
  }).getExams();
}


function renderExamList(exams) {
  const examList = document.getElementById("examList");
  if (!examList) return;
  examList.innerHTML = "";

  if (!exams || exams.length === 0) {
    examList.innerHTML = "<i>Không tìm thấy tài liệu nào.</i>";
    return;
  }

  const root = {};
  exams.forEach(exam => {
    const parts = (exam.folder || 'Chưa phân loại').split(" / ");
    let node = root;
    parts.forEach((part, i) => {
      if (!node[part]) node[part] = { __exams: [], __children: {} };
      if (i === parts.length - 1) node[part].__exams.push(exam);
      node = node[part].__children;
    });
  });

  const treeRoot = root;

  const searchInput = document.getElementById("searchExamInput");
  const isSearching = searchInput && searchInput.value.trim() !== "";

  function createFolderSection(name, data, level = 0, forceExpand = false, parentPath = "") {
    const folderPath = parentPath ? `${parentPath} / ${name}` : name;
    const isNodeActive = forceExpand || (window.expandedFolders && window.expandedFolders.has(folderPath)) || shouldExpandFolderNode(data, window.activeResourceFileId, 'exam');
    const section = document.createElement("div");
    section.className = "exam-folder-section";
    
    const header = document.createElement("div");
    header.className = `exam-folder-header level-${level}`;

    header.innerHTML = `
      <span class="title" title="${name}">📁 ${name}</span>
      <span class="arrow">${isNodeActive ? "▼" : "▶"}</span>
    `;

    section.appendChild(header);

    const content = document.createElement("div");
    content.className = "exam-folder-content";
    content.style.display = isNodeActive ? "block" : "none";

    header.addEventListener("click", () => {
      const isHidden = content.style.display === "none";
      content.style.display = isHidden ? "block" : "none";
      header.querySelector(".arrow").textContent = isHidden ? "▼" : "▶";
      if (isHidden) {
        if (window.expandedFolders) window.expandedFolders.add(folderPath);
      } else {
        if (window.expandedFolders) window.expandedFolders.delete(folderPath);
      }
    });

    const grid = document.createElement("div");
    grid.className = "book-grid";

    data.__exams.sort((a, b) => a.title.localeCompare(b.title));

    data.__exams.forEach(exam => {
      const bookDiv = document.createElement("div");
      bookDiv.className = "book" + (exam.isPaid ? " vip" : "");

      bookDiv.innerHTML = `
        <h4 title="${exam.title}">${exam.title}</h4>
        <button class="read-btn ${exam.isPaid ? 'vip' : ''}" 
          onclick="requestOpenBook('${exam.fileId}', '${exam.title}', ${exam.isPaid}, 'exam', '${exam.folder}', this)">
          Xem
        </button>
      `;

      grid.appendChild(bookDiv);
    });

    content.appendChild(grid);

    Object.keys(data.__children).sort().forEach(child => {
      const childSection = createFolderSection(child, data.__children[child], level + 1, forceExpand, folderPath);
      content.appendChild(childSection);
    });

    section.appendChild(content);
    return section;
  }

  const fragment = document.createDocumentFragment();
  Object.keys(treeRoot).sort().forEach(folder => {
    const data = treeRoot[folder];
    const hasExams = data.__exams && data.__exams.length > 0;
    const hasChildren = Object.keys(data.__children).length > 0;
    if (!hasExams && !hasChildren) return;

    // 1. Render all direct exams inside this level-0 folder
    if (hasExams) {
      const grid = document.createElement("div");
      grid.className = "book-grid";

      data.__exams.sort((a, b) => a.title.localeCompare(b.title));
      data.__exams.forEach(exam => {
        const bookDiv = document.createElement("div");
        bookDiv.className = "book" + (exam.isPaid ? " vip" : "");

        bookDiv.innerHTML = `
          <h4 title="${exam.title}">${exam.title}</h4>
          <button class="read-btn ${exam.isPaid ? 'vip' : ''}" 
            onclick="requestOpenBook('${exam.fileId}', '${exam.title}', ${exam.isPaid}, 'exam', '${exam.folder}', this)">
            Xem
          </button>
        `;

        grid.appendChild(bookDiv);
      });
      fragment.appendChild(grid);
    }

    // 2. Render children of this level-0 folder as folder sections (starting at UI level 0)
    Object.keys(data.__children).sort().forEach(child => {
      const childSection = createFolderSection(child, data.__children[child], 0, isSearching, folder);
      fragment.appendChild(childSection);
    });
  });
  examList.appendChild(fragment);
}

function filterExams() {
  const keyword = document.getElementById("searchExamInput").value.toLowerCase().trim();
  if (!keyword) {
    renderExamList(allExams);
    return;
  }
  const filtered = allExams.filter(exam =>
    exam.title.toLowerCase().includes(keyword)
  );
  renderExamList(filtered);
}
